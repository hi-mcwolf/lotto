<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>iLotto</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0b1220;--card:#111827;--card2:#0f172a;--line:#1f2937;
  --cyan:#22d3ee;--amber:#f59e0b;--rose:#fb7184;--ok:#34d399;
  --gold:#f6c945;--gold2:#e8a317;--gold-ink:#3a2a04;
  --text:#cbd5e1;--muted:#64748b;--ink:#04232a;--white:#f8fafc;
  --glow:0 10px 28px rgba(232,163,23,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Outfit,system-ui,sans-serif;
  background:
    radial-gradient(900px 420px at 8% -10%, rgba(34,211,238,.16), transparent 55%),
    radial-gradient(700px 380px at 100% 0%, rgba(124,58,237,.2), transparent 50%),
    var(--bg);
  color:var(--text);
  letter-spacing:-.01em;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#proto{
  height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:rgba(8,12,22,.92);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:50;backdrop-filter:blur(16px);
}
#proto .btn,.seg,.seg button,.word{white-space:nowrap}
.seg,.hamb,.iconbtn{flex-shrink:0}
.word{font-weight:800;color:#fff;letter-spacing:.02em;font-size:18px}
.word em{font-style:italic;color:var(--gold);font-weight:800}
.mono,.jack-amt,.otp input{font-family:"JetBrains Mono",ui-monospace,monospace}
.proto-tag{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 8px}
#layout{height:calc(100vh - 54px);display:flex;min-height:0}
#sidenav{
  width:252px;flex:none;overflow:auto;padding:12px 10px 24px;
  background:rgba(15,23,42,.72);border-right:1px solid var(--line);
}
.nav-h{
  width:100%;display:flex;justify-content:space-between;align-items:center;
  background:transparent;border:0;color:var(--muted);font-size:10px;letter-spacing:.14em;
  padding:10px 8px 6px;text-transform:uppercase;
}
.nav-item{
  width:100%;text-align:left;background:transparent;border:0;color:var(--text);
  border-radius:10px;padding:8px 10px;font-size:12px;font-weight:500;margin:1px 0;
}
.nav-item:hover{background:rgba(34,211,238,.06);color:#fff}
.nav-item.on{background:rgba(34,211,238,.12);color:var(--cyan);box-shadow:inset 2px 0 0 var(--cyan)}
#backdrop{display:none;position:fixed;inset:54px 0 0;background:rgba(0,0,0,.45);z-index:55}
#stage{flex:1;min-width:0;min-height:0;height:100%;display:flex;align-items:center;justify-content:center;padding:16px 8px}
#phone{
  width:390px;height:min(844px,100%);display:flex;min-height:0;
  border-radius:32px;border:1px solid #243044;background:#0b1220;
  box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden;
}
#main{flex:1;min-width:0;width:100%;display:flex;flex-direction:column;position:relative;min-height:0}
#statusbar{
  flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;
  background:rgba(11,18,32,.88);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:6;backdrop-filter:blur(16px);
}
#screen{flex:1;overflow:auto;padding:16px 16px 40px}
#main.nochrome #statusbar,#main.nochrome #tabbar{display:none}
#main.flow-auth #statusbar{display:none}
#main.flow-auth #tabbar{display:grid}
#tabbar{
  flex:none;display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(8,12,22,.94);border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
#tabbar button{
  border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;
}
#tabbar button.on{color:var(--cyan)}
#tabbar button svg{width:20px;height:20px}
#tabbar button.play{position:relative}
#tabbar button.play .bubble{
  width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin-top:-22px;
  background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--gold-ink);
  box-shadow:0 10px 28px rgba(232,163,23,.45), inset 0 1px 0 rgba(255,255,255,.55);
}
#tabbar button.play.on .bubble{box-shadow:0 0 0 4px rgba(246,201,69,.28), 0 10px 28px rgba(232,163,23,.5)}
#rail{
  width:300px;flex:none;overflow:auto;padding:14px;border-left:1px solid var(--line);
  background:rgba(8,12,22,.55);
}
.statebox{border-radius:14px;padding:12px;margin-bottom:12px;background:var(--card);border:1px solid var(--line)}
.statebox h4{display:block;margin:0 0 8px;font-size:11px;letter-spacing:.08em;color:#fff}
.statebox p{color:#94a3b8;font-size:11px;line-height:1.55}
#rail:empty{display:none;width:0;padding:0;border:0}
.st-btn{
  display:block;width:100%;text-align:left;margin:4px 0;padding:7px 8px;border-radius:8px;
  border:1px solid var(--line);background:#0b1220;color:var(--text);font-size:11px;
}
.st-btn.on{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 12px rgba(34,211,238,.25)}
#statefab{
  display:none;position:fixed;right:14px;z-index:35;border:0;border-radius:999px;
  padding:10px 14px;background:linear-gradient(135deg,#22d3ee,#0891b2);color:var(--ink);font-weight:800;font-size:12px;
  box-shadow:var(--glow);
}
.iconbtn,.hamb{
  width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card2);
  color:var(--text);display:grid;place-items:center;position:relative;flex:none;
}
.iconbtn:hover,.hamb:hover,.btn:not(.btn-primary):not(.btn-danger):hover{border-color:var(--cyan);color:var(--cyan)}
.hamb{display:none}
.badge{
  position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;
  background:var(--rose);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;
}
.balpill{
  margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:6px 8px 6px 10px;position:relative;
}
.balpill .fig{font-size:10px;line-height:1.35;color:var(--text);text-align:right}
.balpill .fig span{color:var(--muted);margin-right:4px}
.popover{
  position:absolute;right:0;top:calc(100% + 8px);width:240px;background:#0f172a;border:1px solid var(--line);
  border-radius:14px;padding:12px;box-shadow:0 16px 40px rgba(0,0,0,.4);z-index:8;
}
.logo-btn{border:0;background:transparent;padding:0}
.card{
  background:linear-gradient(180deg, rgba(17,24,39,.94), rgba(15,23,42,.94));
  border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;
  box-shadow:0 12px 32px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.04);
}
.card h3,.card h4{margin:0 0 8px;color:#fff}
h3.screen-title{margin:0 0 8px;color:#fff;font-size:18px}
.muted{color:var(--muted);font-size:12px;line-height:1.5}
.tiny{color:var(--muted);font-size:11px;line-height:1.5}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:11px;color:var(--muted);margin:8px 0 6px}
input,select,textarea{
  width:100%;background:#0b1220;border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;font-size:13px;outline:none;
}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.btn{
  border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;
  padding:10px 12px;font-size:12px;font-weight:700;transition:.15s transform,.15s filter,.15s border-color;
}
.btn:hover{transform:translateY(-1px)}
.btn-primary{
  background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--gold-ink);border:0;
  box-shadow:var(--glow);font-weight:800;border-radius:999px;
}
.btn-primary:hover{filter:brightness(1.06);color:var(--gold-ink)}
.btn-ghost{background:transparent;border:1px solid #334155;color:#fff;border-radius:999px;width:100%}
.btn.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-danger{background:linear-gradient(135deg,#fb7184,#e11d48);color:#fff;border:0;font-weight:800}
.btn-danger:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.link{background:none;border:0;color:var(--cyan);font-weight:700;font-size:12px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{
  border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;
  padding:6px 10px;font-size:11px;
}
.chip.on{background:var(--cyan);color:var(--ink);border-color:var(--cyan);font-weight:800}
.tag{display:inline-flex;align-items:center;width:max-content;max-width:100%;font-size:10px;font-weight:700;padding:3px 7px;border-radius:999px;border:1px solid transparent}
.tag-ok{color:var(--ok);background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.35)}
.tag-warn{color:var(--amber);background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.35)}
.tag-rose{color:var(--rose);background:rgba(251,113,132,.12);border-color:rgba(251,113,132,.35)}
.tag-cyan{color:var(--cyan);background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.35)}
.tag-muted{color:var(--muted);background:#0b1220;border-color:var(--line)}
.hero{
  position:relative;overflow:hidden;border-radius:22px;padding:22px 18px;margin-bottom:12px;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;
  background:linear-gradient(160deg,#4c1d95 0%,#312e81 48%,#1e1b4b 100%);
  box-shadow:0 20px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
  min-height:200px;
}
.hero-jack{padding-right:132px}
.hero h2{margin:8px 0 0;font-size:28px;color:#fff}
.jack-amt{
  font-weight:800;font-size:clamp(26px,7vw,34px);line-height:1.1;margin:8px 0;
  color:#f6c945;text-shadow:0 0 18px rgba(246,201,69,.35);
}
.splash{text-align:center;padding:8px 2px 12px}
.brand{margin:8px 0 0;font-size:42px;font-weight:800;letter-spacing:-.03em;color:#fff}
.brand em{font-style:italic;color:var(--gold)}
.splash-sub{color:#94a3b8;margin:6px 0 14px;font-size:13px}
.jack-card{
  position:relative;overflow:hidden;text-align:left;border-radius:22px;padding:16px 14px 14px;margin-bottom:12px;min-height:210px;
  background:linear-gradient(160deg,#4c1d95 0%,#312e81 42%,#1e1b4b 100%);
  box-shadow:0 16px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.16);
}
.pill-gold{display:inline-flex;background:linear-gradient(180deg,#fb923c,#f97316);color:#fff;font-weight:800;font-size:12px;border-radius:999px;padding:4px 10px}
.ball-cluster{position:absolute;right:6px;top:18px;width:168px;height:132px;pointer-events:none}
.lball{
  position:absolute;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  font-weight:800;font-size:13px;color:#fff;border:3px solid rgba(255,255,255,.9);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.15), 0 6px 10px rgba(0,0,0,.25);
}
.lball.c1{left:46px;top:0;background:radial-gradient(circle at 32% 30%, #fff, #93c5fd 36%, #2563eb)}
.lball.c2{left:96px;top:8px;background:radial-gradient(circle at 32% 30%, #fff, #fda4af 36%, #e11d48)}
.lball.c3{left:128px;top:48px;background:radial-gradient(circle at 32% 30%, #fff, #86efac 36%, #16a34a)}
.lball.c4{left:18px;top:62px;background:radial-gradient(circle at 32% 30%, #fff, #fde68a 40%, #d97706);color:#3a2a04}
.lball.c5{left:72px;top:70px;background:radial-gradient(circle at 32% 30%, #fff, #d8b4fe 36%, #7c3aed)}
.coins{position:absolute;left:16px;bottom:16px;display:flex;gap:4px}
.hero .coins{display:none}
.hero .ball-cluster{right:-6px;top:10px;transform:scale(.78);transform-origin:top right}
.coins i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 32% 30%, #fff7d6, #f6c945 42%, #b45309);box-shadow:0 4px 0 #92400e}
.jack-foot{position:absolute;right:12px;bottom:10px;margin:0}
.slider{overflow:hidden;border-radius:18px}
.track{display:flex;transition:transform .45s ease}
.slide{min-width:100%}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.dots button{width:7px;height:7px;border-radius:99px;border:0;background:#334155;padding:0}
.dots button.on{width:18px;background:var(--cyan)}
.games{display:grid;grid-template-columns:1fr;gap:10px}
.game{display:flex;gap:12px;align-items:center;text-align:left;width:100%;color:inherit}
.game:hover{border-color:rgba(34,211,238,.55);transform:translateY(-2px)}
.ball{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;
  background:radial-gradient(circle at 32% 30%, #fff, #93c5fd 36%, #2563eb);
  border:2px solid rgba(255,255,255,.85);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.12), 0 6px 10px rgba(0,0,0,.25);
}
.ball.c2{background:radial-gradient(circle at 32% 30%, #fff, #fda4af 36%, #e11d48)}
.ball.c3{background:radial-gradient(circle at 32% 30%, #fff, #86efac 36%, #16a34a)}
.ball.c4{background:radial-gradient(circle at 32% 30%, #fff, #fde68a 40%, #d97706);color:#3a2a04}
.ball.c5{background:radial-gradient(circle at 32% 30%, #fff, #d8b4fe 36%, #7c3aed)}
.ball.sm{width:32px;height:32px;font-size:12px}
.nums{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.nbtn{
  height:36px;border-radius:10px;border:1px solid var(--line);background:#0b1220;color:var(--text);font-weight:700;
}
.nbtn.on{background:var(--cyan);color:var(--ink);box-shadow:0 0 16px rgba(34,211,238,.35)}
.steps{display:flex;gap:6px;margin:8px 0 12px}
.step{flex:1;height:6px;border-radius:99px;background:#1f2937}
.step.on{background:linear-gradient(90deg,#22d3ee,#67e8f9)}
.otp{display:flex;gap:8px;justify-content:space-between;margin:12px 0}
.otp input{
  width:44px;height:54px;text-align:center;font-size:22px;font-weight:800;padding:0;border-radius:12px;
}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.pos{color:var(--ok)} .neg{color:var(--rose)}
.avatar{
  width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;
  box-shadow:0 0 0 3px rgba(34,211,238,.25);
}
.menu-row{
  width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;text-align:left;
}
.menu-row:hover{color:#fff}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid #1f2937;border-top-color:var(--cyan);animation:spin 1s linear infinite;margin:8px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.sk{height:14px;border-radius:8px;margin:8px 0;background:linear-gradient(90deg,#1f2937,#334155,#1f2937);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:28px 10px}
.empty-orb{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:radial-gradient(circle at 30% 30%, rgba(34,211,238,.7), rgba(15,23,42,.2));box-shadow:var(--glow)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{min-height:72px}
.phase2{margin-top:8px;opacity:.7}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:99px;background:#1f2937;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#f59e0b);border-radius:99px}
.check{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.shot{
  border:1px dashed #334155;border-radius:14px;min-height:96px;display:grid;place-items:center;
  background:repeating-linear-gradient(135deg, rgba(34,211,238,.05) 0 8px, transparent 8px 16px);
  margin-bottom:8px;
}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:80;padding:18px}
#modal.on{display:flex}
.modal-card{
  width:min(460px,100%);background:linear-gradient(180deg,#111827,#0f172a);border:1px solid var(--line);
  border-radius:18px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.45);
}
.modal-card.danger{border-color:rgba(251,113,132,.6)}
#toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);z-index:90;
  background:#0f172a;border:1px solid var(--cyan);color:#fff;padding:10px 14px;border-radius:12px;
  font-size:12px;opacity:0;pointer-events:none;transition:.2s;max-width:min(520px,calc(100% - 24px));
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.seg{display:flex;background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700}
.seg button.on{background:var(--cyan);color:var(--ink)}
.hide{display:none!important}
@media (min-width:820px){
  .games{grid-template-columns:1fr 1fr}
  .nums{grid-template-columns:repeat(10,1fr)}
  .quick{grid-template-columns:repeat(3,1fr)}
}
@media (min-width:1500px){
  .games{grid-template-columns:1fr 1fr 1fr}
}
#phone .games{grid-template-columns:1fr}
#phone .nums{grid-template-columns:repeat(7,1fr)}
#phone .quick{grid-template-columns:1fr}
@media (max-width:900px){
  .hamb{display:grid}
  #sidenav{position:fixed;z-index:60;top:54px;bottom:0;left:0;transform:translateX(-105%);transition:transform .2s}
  #sidenav.open{transform:none}
  #backdrop.show{display:block}
  #rail{position:fixed;z-index:60;top:auto;bottom:0;left:0;right:0;width:auto;max-height:70vh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(110%);transition:transform .2s}
  #rail.open{transform:none}
  #statefab.has{display:inline-flex}
}
@media (max-width:820px){
  .grid2{grid-template-columns:1fr}
  .games{grid-template-columns:1fr}
}
@media (max-width:520px){
  #stage{padding:0}
  #phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
}
@media (max-width:430px){
  #proto{gap:6px;padding:0 8px}
  #proto .btn{font-size:10px;padding:6px 8px}
  .hide-sm{display:none}
  #screen{padding:12px 12px 28px}
  .balpill .fig span{display:none}
  .quick{grid-template-columns:1fr}
  .hero h2{font-size:24px}
  .otp input{width:40px;height:48px}
  .proto-tag{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header id="proto"></header>
<div id="layout">
  <nav id="sidenav"></nav>
  <div id="backdrop" data-act="backdrop"></div>
  <div id="stage">
    <div id="phone">
      <main id="main">
        <header id="statusbar"></header>
        <div id="screen"></div>
        <nav id="tabbar"></nav>
      </main>
    </div>
  </div>
  <aside id="rail"></aside>
</div>
<button id="statefab" type="button" data-act="rail">States</button>
<div id="modal"></div>
<div id="toast" role="status"></div>
<script>
const t = (zh, en) => (S.lang === "en" ? en : zh);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (id) => document.getElementById(id);

function comboCount(g) {

  const n = S.picks.length, k = g.pick;

}

function armTimers() {

      if (left > 0) { btn.textContent = Math.ceil(left / 1000) + "s"; btn.disabled = true; }
      else { btn.textContent = t("重新发送", "Resend"); btn.disabled = false; }
    }
    const lock = $("lockLeft");
    if (lock) {

      lock.textContent = fmtLeft(ms);
      if (ms <= 0) { S.lockUntil = 0; S.wdFails = 0; render(); }
    }
    const sess = $("sessDur");
    if (sess) sess.textContent = fmtSession();
  }, 1000);

  if (act === "jackdot") { S.jackIndex = Number(arg); syncJack(); return; }
  if (act === "anndot") { S.annIndex = Number(arg); syncAnn(); return; }
  if (act === "ann-prev") { S.annIndex = (S.annIndex + ANNS.length - 1) % ANNS.length; syncAnn(); return; }
  if (act === "ann-next") { S.annIndex = (S.annIndex + 1) % ANNS.length; syncAnn(); return; }
  if (act === "ann-open") { S.annIndex = Number(arg); S.modal = "ann"; render(); return; }
  if (act === "home-main") { S.page.home = "main"; render(); return; }
  if (act === "home-lucky") { if (gameBy(S.gameId).kind !== "lotto") S.gameId = "u658"; S.page.home = "lucky"; render(); return; }
  if (act === "home-outlets") { S.page.home = "outlets"; render(); return; }
  if (act === "results-history") { S.page.results = "data"; S.page.resultsMode = "history"; go("results", "product"); return; }
  if (act === "res-mode") { S.page.resultsMode = arg; render(); return; }
  if (act === "pick-game") { S.gameId = arg; S.picks = []; if (!kycOk()) return gateBounce(); go("bet", "product"); return; }
  if (act === "set-game") { S.gameId = arg; S.picks = []; if (S.pickMode === "quick") fillQuick(); render(); return; }
  if (act === "pick-mode") { S.pickMode = arg; if (arg === "quick") fillQuick(); render(); return; }
  if (act === "num") {
    const n = Number(arg); const i = S.picks.indexOf(n);
    if (i >= 0) S.picks.splice(i, 1); else if (S.picks.length < 12) S.picks.push(n);
    S.picks.sort((a, b) => a - b); render(); return;
  }
  if (act === "digit") {
    const g = gameBy(S.gameId);
    if (S.picks.length >= g.digits) S.picks = [];
    S.picks.push(Number(arg)); render(); return;
  }
  if (act === "quickpick") { S.pickMode = "quick"; fillQuick(); render(); return; }
  if (act === "clear-picks") { S.picks = []; render(); return; }
  if (act === "bet-reset") { S.page.bet = "pick"; render(); return; }
  if (act === "submit-bet") {
    if (!kycOk()) return toast(t("审核通过前不能投注", "Play stays locked until verification is approved"));
    const g = gameBy(S.gameId);
    if (!comboCount(g)) return toast(t("请先选满号码", "Finish your numbers first"));
    const picksSnap = S.picks.slice();
    S.page.bet = "processing"; S.betToken += 1; const token = S.betToken; render();
    setTimeout(() => {
      if (token !== S.betToken) return;
      const periods = Math.max(1, Math.min(g.kind === "lotto" ? 12 : 90, Number(S.form.periods) || 1));
      const n = Math.min(6, Math.max(1, comboCount(g)) * periods);
      const base = 12000 + Math.floor(Math.random() * 500);
      S.issued = Array.from({ length: n }, (_, i) => "IL-20261010-" + (base + i));
      const mult = Math.max(1, Number(S.form.mult) || 1);
      const cost = g.price * mult * Math.max(1, comboCount(g)) * periods;
      S.ledgerExtra.unshift({ type: "order", amt: -cost, statusZh: "已登记", statusEn: "Registered", time: "2026-10-10 00:40:00", ref: S.issued[0] });
      if (S.journey) {
        const nums = g.kind === "lotto" ? picksSnap.slice().sort((a, b) => a - b).map((x) => String(x).padStart(2, "0")).join(" ") : picksSnap.join(" ");
        S.flowTicket = { id: S.issued[0], game: g.id, nums, amt: cost, status: "wait", time: "2026-10-10 00:40", issue: "2026-1010-1", code: "", codeUsed: "", prize: 0 };
        S.page.tickets = "wait";
      }
      S.page.bet = "done"; if (S.screen === "bet") render();
    }, 1600);
    return;
  }
  if (act === "lucky-add") {
    const g = gameBy(S.gameId);
    S.picks = hotList(arg).slice(0, g.pick);
    S.pickMode = "manual";
    if (!kycOk()) return gateBounce();
    go("bet", "product"); return;
  }
  if (act === "ticket-tab") { S.page.tickets = arg; render(); return; }
  if (act === "led-tab") { S.page.ledgerTab = arg; if (S.page.ledger !== "data") S.page.ledger = "data"; render(); return; }
  if (act === "deposit") {
    if (!kycOk()) return gateBounce();
    S.page.wallet = "deposit"; S.page.depStep = 1; go("wallet", "product"); return;
  }
  if (act === "withdraw") {
    if (!kycOk()) return gateBounce();
    if (S.lockUntil > Date.now()) { S.page.wallet = "main"; go("wallet", "product"); return; }
    S.page.wallet = "withdraw"; S.page.wdStep = 1; S.otpScope = null; go("wallet", "product"); return;
  }
  if (act === "wallet-main") { S.page.wallet = "main"; render(); return; }
  if (act === "dep-amt") { S.form.depAmt = arg; render(); return; }
  if (act === "dep-next") { if (!(Number(S.form.depAmt) > 0)) return toast(t("请输入充值金额", "Enter a top-up amount")); S.page.depStep = 2; render(); return; }
  if (act === "dep-confirm") {
    const amt = Number(S.form.depAmt) || 0; S.bal.bet += amt; S.page.depStep = 3;
    S.ledgerExtra.unshift({ type: "deposit", amt, statusZh: "成功", statusEn: "Success", time: "2026-10-10 00:45:12", ref: "DP-" + String(Date.now()).slice(-6) });
    render(); return;
  }
  if (act === "dest") { S.dest = arg; render(); return; }
  if (act === "wd-next") {
    const amt = Number(S.form.wdAmt);
    if (!(amt > 0)) return toast(t("请输入提现金额", "Enter an amount"));
    if (amt > S.bal.prize) return toast(t("不能超过奖金余额", "Cannot exceed the prize balance"));
    S.page.wdStep = 2; S.otpScope = null; render(); return;
  }
  if (act === "wd-verify") {
    const code = readOtp();
    if (code.length !== 6) return toast(t("请输入 6 位验证码", "Enter the 6-digit code"));
    if (code === "000000") {
      S.wdFails += 1;
      if (S.wdFails >= 3) { S.lockUntil = Date.now() + 30 * 60 * 1000; S.page.wallet = "main"; toast(t("已锁定 30 分钟", "Locked for 30 minutes")); render(); return; }
      toast(t("验证失败", "Check failed") + " " + S.wdFails + "/3"); S.otpDigits = ""; render(); return;
    }
    S.wdFails = 0; S.page.wdStep = 3; render(); return;
  }
  if (act === "wd-confirm") {
    const amt = Number(S.form.wdAmt) || 0; S.bal.prize = Math.max(0, S.bal.prize - amt); S.page.wdStep = 4;
    S.ledgerExtra.unshift({ type: "withdraw", amt: -amt, statusZh: "成功", statusEn: "Success", time: "2026-10-10 00:48:20", ref: "WD-" + String(Date.now()).slice(-6) });
    render(); return;
  }
  if (act === "pay-ch") { S.payChannel = arg; render(); return; }
  if (act === "pay-reset") { S.page.paybind = "form"; render(); return; }
  if (act === "bind") {
    if (!S.form.acct || !S.form.holder) return toast(t("请填写账户号码和户名", "Enter the account number and name"));
    S.page.paybind = "checking"; render();
    setTimeout(() => {
      if (!S.bound.includes(S.payChannel === "BDO" ? "bdo" : S.payChannel.toLowerCase())) {
        const id = S.payChannel === "GCash" ? "gcash" : S.payChannel === "Maya" ? "maya" : "bdo";
        if (!S.bound.includes(id)) S.bound.push(id);
      }
      S.page.paybind = "bound"; if (S.screen === "paybind") render();
    }, 1100);
    return;
  }
  if (act === "avatar") { S.avatar = (S.avatar + 1) % 4; render(); return; }
  if (act === "send-profile-otp") { S.profileOtpSent = true; S.otpScope = null; toast("OTP_TXN"); render(); return; }
  if (act === "save-profile") {
    if (S.profileOtpSent && readOtp().length !== 6) return toast(t("请先完成 OTP_TXN", "Finish OTP_TXN first"));
    if (S.form.nick) S.nick = S.form.nick; toast(t("资料已保存", "Profile saved")); return;
  }
  if (act === "reality") { S.modal = "reality"; renderModal(); return; }
  if (act === "reality-ok") { S.modal = null; renderModal(); return; }
  if (act === "modal-close") { S.modal = null; renderModal(); return; }
  if (act === "faq") { S.faq = S.faq === Number(arg) ? null : Number(arg); render(); return; }
  if (act === "support") { toast(t("已打开客服会话（原型）", "Support chat opened (prototype)")); return; }
  if (act === "rule") { S.modal = "rule"; S.modalArg = arg; render(); return; }
  if (act === "self") { const [i, v] = arg.split(":"); S.self[Number(i)] = v === "1"; if (S.self.filter((x) => x !== undefined).length >= 4) S.selfDone = true; render(); return; }
  if (act === "self-reset") { S.self = []; S.selfDone = false; render(); return; }
  if (act === "cool") { S.form.cool = arg; render(); return; }
  if (act === "cool-on") { if (!S.form.cool) return toast(t("请选择冷静期档位", "Choose a cool-off length")); S.page.rg = "cooloff"; toast(t("冷静期已开启，到期自动解除", "Cool-off started. It lifts automatically")); render(); return; }
  if (act === "ex-term") { S.excludeTerm = arg; render(); return; }
  if (act === "exclude-open") { S.modal = "exclude"; renderModal(); return; }
  if (act === "exclude-ok") { S.page.rg = S.excludeTerm === "perm" ? "permanent" : "excluded"; S.modal = null; toast(t("自主排除已生效", "Self-exclusion is in effect")); render(); return; }
  if (act === "restore") {
    if (S.page.rg === "permanent") return;
    if (!S.form.restoreId || !S.form.risk) return toast(t("请完成身份核验并勾选「我已了解风险」", "Finish the identity check and tick the risk box"));
    toast(t("已提交，等待 PCSO 人员审批", "Submitted. Waiting for PCSO approval")); return;
  }
  if (act === "save-limits") {
    const keys = ["depD", "depW", "depM", "betD", "betW", "betM", "single"];
    const next = {};
    keys.forEach((k) => { const el = document.querySelector(`[data-field="lim-${k}"]`); next[k] = el ? Number(el.value) : S.limits[k]; });
    if (next.depD < 500 || next.depD > 20000 || next.betD < 500 || next.betD > 20000) return toast(t("每日限额需在 ₱500–20,000", "Daily limits must be within ₱500–20,000"));
    if (keys.some((k) => !(next[k] > 0))) return toast(t("限额需大于 0", "Limits must be above 0"));
    const raised = keys.some((k) => next[k] > S.saved[k]);
    const lowered = keys.some((k) => next[k] < S.saved[k]);
    S.limits = next;
    if (lowered && !raised) S.saved = { ...next };
    toast(raised ? t("调高或撤销将在 24 小时后生效", "A higher limit or a removal takes effect in 24 hours") : t("调低已即时生效", "The lower limit is already in effect"));
    render(); return;
  }
}
function onInput(e) {
  const f = e.target.dataset.field;
  if (e.target.dataset.otp) {
    const v = e.target.value.replace(/\D/g, "").slice(-1);
    e.target.value = v;
    S.otpDigits = [...document.querySelectorAll(".otp-i")].map((i) => i.value).join("");
    const next = e.target.nextElementSibling;
    if (v && next && next.classList && next.classList.contains("otp-i")) next.focus();
    return;
  }
  if (!f) return;
  if (e.target.type === "checkbox") S.form[f] = e.target.checked;
  else S.form[f] = e.target.value;
  if (f === "mult" || f === "periods") { const box = $("settleBox"); if (box) box.innerHTML = settleHtml(); }
}
function onChange(e) {
  if (e.target.dataset.income) { S.income[e.target.dataset.income] = e.target.checked; return; }
  const f = e.target.dataset.field;
  if (!f) return;
  if (e.target.type === "checkbox") S.form[f] = e.target.checked;
  else S.form[f] = e.target.value;
  if (f === "prov") { S.form.city = ""; S.form.brgy = ""; render(); return; }
  if (f === "city") { S.form.brgy = ""; render(); return; }
  if (f === "resGame") { S.resGame = e.target.value; render(); return; }
  if (e.target.dataset.rerender) render();
}
function onPaste(e) {
  const t = e.target.closest(".otp-i");
  if (!t) return;
  const text = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
  if (!text) return;
  e.preventDefault();
  S.otpDigits = text;
  render();
}
document.body.addEventListener("click", (e) => {
  if (e.target.id === "modal") {
    if (S.modal === "reality") return;
    S.modal = null; renderModal(); return;
  }
  onClick(e);
});
document.body.addEventListener("input", onInput);
document.body.addEventListener("change", onChange);
document.body.addEventListener("paste", onPaste);
setTimeout(() => { S.splashReady = true; if (S.screen === "splash") render(); }, 900);
armTimers();
render();

</script>
</body>
</html>
