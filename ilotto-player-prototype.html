<title>iLotto · Player App Prototype</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

html,body{height:100%;background:#050505;color:var(--tx);font-family:-apple-system,"PingFang SC","Microsoft YaHei",Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#stage{height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;gap:36px;background:radial-gradient(900px 500px at 50% 0%,rgba(34,211,238,.10),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(139,92,246,.10),transparent 60%),#050505}

.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#000;z-index:60}

.glow{position:absolute;top:0;left:0;right:0;height:360px;background:radial-gradient(ellipse at 15% 0%,rgba(34,211,238,.30),transparent 60%),radial-gradient(ellipse at 95% 5%,rgba(245,158,11,.20),transparent 55%);pointer-events:none;z-index:0}
#view{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;z-index:1}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 110px;scrollbar-width:none;position:relative}
.scroll::-webkit-scrollbar{display:none}
.scroll.nopad{padding-bottom:30px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 8px;flex:none}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:.3px}
.logo i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--cy),#3b82f6 60%,var(--vi));display:grid;place-items:center;font-style:normal;font-size:15px;box-shadow:0 0 18px rgba(34,211,238,.45)}
.capsule{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.09);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:4px 6px}
.capsule .bal{display:flex;align-items:center;gap:5px;padding:5px 8px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.capsule .ib{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;position:relative}
.capsule .plus{background:var(--cy);color:#04151a}
.dot{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:8px;background:#ff4d6a;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 3px;border:2px solid #1a1a1a}
.sub{display:flex;align-items:center;gap:8px;padding:4px 12px 10px;flex:none}
.sub h2{font-size:20px;font-weight:800;flex:1}
.back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.09);display:grid;place-items:center}
.card{background:var(--card);border-radius:24px;padding:16px;position:relative;overflow:hidden}
.card.c2{background:var(--card2)}
.mt{margin-top:14px}.mt2{margin-top:22px}.mt3{margin-top:8px}
.row{display:flex;align-items:center}.sp{justify-content:space-between}.g8{gap:8px}.g12{gap:12px}.fl1{flex:1}
.mu{color:var(--mu)}.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:700}
h1{font-size:26px;font-weight:800;letter-spacing:.2px}h3{font-size:17px;font-weight:800}
.big{font-size:52px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.05}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:16px;width:100%;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.c{background:linear-gradient(135deg,var(--cy),#3b82f6);color:#03141a;box-shadow:0 8px 28px rgba(34,211,238,.35)}
.btn.o{background:transparent;border:1.5px solid #3a3a3a;color:#fff}
.btn.d{background:#262626;color:#fff}
.btn.r{background:linear-gradient(135deg,#fb7184,#e11d48);color:#fff}
.btn.s{height:38px;font-size:14px;width:auto;padding:0 18px}
.btn[disabled]{opacity:.35;pointer-events:none}
.pillbtn{height:34px;padding:0 14px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.inp{width:100%;height:50px;border-radius:16px;background:#1a1a1a;border:1.5px solid #262626;padding:0 16px;font-size:15px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--cy)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 22px) 22px,calc(100% - 16px) 22px;background-size:6px 6px;background-repeat:no-repeat}
label.lb{display:block;font-size:12px;color:var(--mu);margin:14px 0 6px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.b-gr{background:rgba(52,211,153,.15);color:var(--gr)}.b-am{background:rgba(245,158,11,.15);color:var(--am)}.b-ro{background:rgba(251,113,132,.15);color:var(--ro)}.b-cy{background:rgba(34,211,238,.15);color:var(--cy)}.b-gy{background:#262626;color:#aaa}.b-vi{background:rgba(139,92,246,.18);color:#b9a2ff}
.glowbadge{box-shadow:0 0 12px rgba(245,158,11,.45)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:999px;background:#1c1c1c;color:#bbb;font-weight:600;font-size:13px;display:inline-flex;align-items:center;transition:.2s}
.chip.on{background:#fff;color:#000}
.seg{display:flex;background:#1a1a1a;border-radius:999px;padding:4px}.seg button{flex:1;height:36px;border-radius:999px;font-weight:700;font-size:13px;color:#999;transition:.25s}.seg button.on{background:#fff;color:#000}
.circ{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:#ddd;font-weight:600}
.circ i{width:62px;height:62px;border-radius:50%;background:#1b1b1b;display:grid;place-items:center;border:1px solid #262626;transition:.15s}
.circ:active i{transform:scale(.92);background:#262626}
.tabbar{position:absolute;left:14px;right:14px;bottom:14px;height:64px;border-radius:999px;background:rgba(32,32,36,.78);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.09);box-shadow:0 12px 40px rgba(0,0,0,.6);display:flex;align-items:center;padding:0 6px;z-index:30}
.tabbar button{flex:1;height:52px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:700;color:#9a9a9a;transition:.25s}
.tabbar button.on{background:rgba(255,255,255,.14);color:var(--cy)}
.tabbar button.on svg{filter:drop-shadow(0 0 6px rgba(34,211,238,.7))}
.ball{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#2c2c2c,#171717);border:1px solid #2c2c2c;display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:#cfcfcf;transition:transform .15s,background .2s,box-shadow .2s}
.ball.on{background:radial-gradient(circle at 32% 28%,#7ee8fb,#22d3ee 40%,#2563eb);color:#021018;box-shadow:0 0 0 2px rgba(34,211,238,.35),0 0 18px rgba(34,211,238,.7);transform:scale(1.12)}
.ball.roll{background:radial-gradient(circle at 32% 28%,#fcd34d,#f59e0b);color:#201300;transform:scale(1.08)}
.ball.mini{width:30px;height:30px;font-size:12px}
.ball.hit{background:radial-gradient(circle at 32% 28%,#6ee7b7,#10b981);color:#012;border-color:#34d399;box-shadow:0 0 14px rgba(52,211,153,.6)}
.ball.win{background:radial-gradient(circle at 32% 28%,#fde68a,#f59e0b);color:#201300;box-shadow:0 0 16px rgba(245,158,11,.7)}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}

.board{display:grid;gap:8px;justify-items:center}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.list>div{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid #1f1f1f}.list>div:last-child{border:0}
.list .ico{width:36px;height:36px;display:grid;place-items:center;color:#fff}
.tile{border-radius:26px;padding:18px;min-height:150px;position:relative;overflow:hidden;background:#171717;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.tile .arr{width:42px;height:42px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.tile .il{position:absolute;right:-6px;bottom:-4px;width:112px;height:112px}
.gcard{border-radius:22px;background:#161616;overflow:hidden;text-align:left;transition:transform .18s,box-shadow .2s;position:relative}
.gcard:active{transform:scale(.97)}
.gcard.off{opacity:.38;filter:grayscale(1);pointer-events:none}
.gcard .cv{height:84px;position:relative}
.banners{display:flex;gap:10px;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.bn{flex:none;width:calc(100% - 44px);height:176px;border-radius:26px;padding:18px;position:relative;overflow:hidden;text-align:left}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.dots i{width:6px;height:6px;border-radius:3px;background:#3a3a3a;transition:.3s}.dots i.on{width:18px;background:#fff}
.glowtxt{background:linear-gradient(135deg,#fde68a,#f59e0b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px rgba(245,158,11,.45))}
.grad{background:linear-gradient(135deg,#7ee8fb,#22d3ee 40%,#60a5fa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(6px);z-index:80;display:flex;align-items:flex-end;animation:fade .25s}
.ov.mid{align-items:center;padding:0 22px}
.sheet{width:100%;max-height:86%;overflow-y:auto;background:#161616;border-radius:30px 30px 0 0;padding:22px 20px 28px;animation:up .3s cubic-bezier(.2,.9,.3,1);scrollbar-width:none}
.ov.mid .sheet{border-radius:28px;padding:24px 20px 20px;max-height:80%}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#fff;color:#000;font-weight:700;font-size:13px;padding:10px 18px;border-radius:999px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fade .25s;max-width:340px;text-align:center}
.otp{position:relative;display:flex;gap:9px;justify-content:center}
.otp b{width:46px;height:56px;border-radius:16px;background:#1a1a1a;border:1.5px solid #2a2a2a;display:grid;place-items:center;font-size:24px;font-weight:800}
.otp b.cur{border-color:var(--cy);box-shadow:0 0 14px rgba(34,211,238,.35)}
.otp input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.steps{display:flex;gap:6px}.steps i{flex:1;height:4px;border-radius:2px;background:#2a2a2a;transition:.3s}.steps i.on{background:var(--cy);box-shadow:0 0 8px rgba(34,211,238,.6)}
.spin{width:54px;height:54px;border-radius:50%;border:4px solid #262626;border-top-color:var(--cy);border-right-color:#3b82f6;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,#1b1b1b,#2a2a2a,#1b1b1b);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}
.bar{height:8px;border-radius:4px;background:#232323;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cy),#3b82f6);transition:width .5s}
.qr{width:104px;height:104px;background:#fff;border-radius:14px;padding:8px;display:grid;grid-template-columns:repeat(13,1fr);gap:0}.qr i{background:#000}.qr i.w{background:#fff}
.faq summary{list-style:none;padding:15px 2px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;cursor:pointer;border-bottom:1px solid #1f1f1f}.faq summary::-webkit-details-marker{display:none}.faq p{padding:12px 2px;color:#aaa;font-size:13px;line-height:1.6}
table.tb{width:100%;border-collapse:collapse;font-size:12px}.tb td,.tb th{padding:9px 4px;border-bottom:1px solid #222;text-align:left}.tb th{color:var(--mu);font-weight:600}
.tg{width:48px;height:28px;border-radius:14px;background:#333;position:relative;transition:.25s;flex:none}.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.25s}.tg.on{background:var(--cy)}.tg.on::after{left:23px}
.avatar{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:44px;font-weight:800;border:5px solid #0a0a0a}
.cam{height:230px;border-radius:24px;background:repeating-linear-gradient(135deg,#141414 0 14px,#191919 14px 28px);display:grid;place-items:center;position:relative;overflow:hidden;border:1.5px dashed #3a3a3a}
.cam.ok{border:1.5px solid var(--gr)}
.scanline{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--cy),transparent);box-shadow:0 0 18px var(--cy);animation:scan 1.8s ease-in-out infinite}
@keyframes scan{0%,100%{top:8%}50%{top:90%}}
.ring{width:190px;height:190px;border-radius:50%;border:4px solid var(--cy);display:grid;place-items:center;position:relative;box-shadow:0 0 40px rgba(34,211,238,.35)}
.ring::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed rgba(34,211,238,.5);animation:sp 6s linear infinite}
.flash{animation:fl .4s}@keyframes fl{0%{background:#fff}100%{background:transparent}}
.shake{animation:shk .35s}@keyframes shk{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.float{animation:flt 3.2s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-6px)}}
#panel{width:330px;height:min(868px,calc(100vh - 40px));overflow-y:auto;background:rgba(18,18,20,.86);border:1px solid #262626;border-radius:26px;padding:18px;backdrop-filter:blur(14px);scrollbar-width:thin;flex:none}
#panel h4{font-size:12px;color:#777;letter-spacing:.08em;text-transform:uppercase;margin:16px 0 8px}

#panel .st.now{color:#fff;font-weight:700}#panel .st.now i{border-color:var(--cy);box-shadow:0 0 10px rgba(34,211,238,.6)}
#ptog{position:fixed;top:14px;left:18px;z-index:200;height:36px;padding:0 14px;border-radius:999px;background:rgba(30,30,34,.9);border:1px solid #333;font-size:12px;font-weight:700;color:#bbb}
@media (max-width:1060px){#ptog{display:none}}
#lang{position:fixed;top:14px;right:18px;z-index:200;display:flex;background:rgba(30,30,34,.9);border:1px solid #333;border-radius:999px;padding:3px;backdrop-filter:blur(10px)}

@media (max-width:520px){#phoneWrap,#phone{width:100vw;height:100vh;border:0;border-radius:0}#stage{gap:0}.island{display:none}}
</style>
</head>

/* ---- eKYC ---- */
const DOCS=[['PhilSys National ID','国民身份证 PhilSys'],['Driver’s License','驾驶执照'],['Passport','护照'],['UMID','UMID 统一多用途证']];
const CHECKS=[['证件真伪','Document authenticity'],['人脸比对','Face match'],['活体检测','Liveness'],['证件篡改','Tamper check'],['年龄校验（18+）','Age check (18+)'],['排除名单','Exclusion list'],['一人多号线索','Duplicate-account signal']];
SC.ekyc={auth:true,back:true,html:()=>{const e=S.ek,s=e.step;
 const head=AUTHHEAD(t('实名认证','Identity verification'),t(`第 ${s} 步 / 共 5 步`,`Step ${s} of 5`))+`<div class="steps" style="margin-top:14px">${[1,2,3,4,5].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>`;
 if(s===1)return head+`<div class="mu mt" style="font-size:14px">${t('请选择证件类型','Choose a document type')}</div>`+DOCS.map(d=>`<button class="card mt3 row sp" style="width:100%;text-align:left;border:1.5px solid ${e.doc===d[0]?'var(--cy)':'transparent'}" onclick="S.ek.doc='${d[0].replace(/’/g,"\\'")}';renderKeep()"><div class="row g12">${I('card',22)}<div><div class="b">${t(d[1],d[0])}</div><div class="xs mu">${t('政府签发有效证件','Valid government-issued ID')}</div></div></div>${e.doc===d[0]?I('check',20,'#22d3ee'):''}</button>`).join('')+`<button class="btn c mt2" ${e.doc?'':'disabled'} onclick="S.ek.step=2;render()">${t('下一步','Next')}</button>`;
 if(s===2)return head+`<div class="mu mt" style="font-size:14px">${t('请将证件放入框内，确保四角完整、无反光','Fit the ID inside the frame — all corners visible, no glare')}</div>`+['front','back'].map(k=>`<div class="cam mt ${e[k]?'ok':''}" id="cam_${k}">${e[k]?`<div style="text-align:center;color:var(--gr)">${I('check',46)}<div class="b mt3">${t(k==='front'?'正面已拍摄':'背面已拍摄',k==='front'?'Front captured':'Back captured')}</div></div>`:`<div class="scanline"></div><div class="mu" style="text-align:center">${I('camera',40)}<div class="mt3">${t(k==='front'?'证件正面':'证件背面',k==='front'?'ID front':'ID back')}</div></div>`}</div><button class="btn ${e[k]?'d':'o'} mt3" onclick="A.cap('${k}')">${e[k]?t('重拍','Retake'):t('拍摄','Capture')}</button>`).join('')+`<button class="btn c mt2" ${e.front&&e.back?'':'disabled'} onclick="S.ek.step=3;render()">${t('下一步','Next')}</button>`;
 if(s===3)return head+`<div class="mu mt" style="font-size:14px">${t('活体检测：请按提示完成动作','Liveness: follow the on-screen prompts')}</div><div style="display:grid;place-items:center;margin:30px 0 14px"><div class="ring">${e.live?`<span style="color:var(--gr)">${I('check',70)}</span>`:`<span style="font-size:60px">🙂</span>`}</div></div><div id="lv" class="b" style="text-align:center;font-size:17px;min-height:28px">${e.live?t('活体检测通过','Liveness passed'):t('点击开始','Tap to start')}</div><button class="btn ${e.live?'c':'o'} mt2" onclick="${e.live?'S.ek.step=4;render()':'A.live()'}">${e.live?t('下一步','Next'):t('开始检测','Start')}</button>`;
 if(s===4)return head+`<div class="mu mt" style="font-size:14px">${t('正在进行人脸比对与 7 项自动校验','Running face match and 7 automatic checks')}</div><div class="card mt"><div class="row sp"><span class="b">${t('人脸相似度','Face similarity')}</span><span class="b grad" id="sim">${e.face?'98.6%':'0%'}</span></div><div class="bar mt"><i id="fb" style="width:${e.face?100:0}%"></i></div></div><div class="card mt" id="chk">${CHECKS.map((c,i)=>`<div class="row sp" style="padding:9px 0;border-bottom:1px solid #222;${e.face?'':'opacity:.25'}" id="ck${i}"><span style="font-size:14px">${t(c[0],c[1])}</span><span class="badge ${i===6?'b-gr':'b-gr'}">${e.face?I('check',12)+' '+t('通过','Pass'):'···'}</span></div>`).join('')}</div><button class="btn c mt2" id="nx4" ${e.face?'':'disabled'} onclick="S.ek.step=5;render()">${t('下一步','Next')}</button>`;
 return head+`<div style="text-align:center;margin:20px 0"><div style="width:120px;height:120px;margin:0 auto" class="float">${illo('idcard')}</div><h3 style="margin-top:10px">${t('确认并提交审核','Review & submit')}</h3></div><div class="card"><div class="list">${[[t('姓名','Name'),fullName()],[t('证件','Document'),e.doc||DOCS[0][0]],[t('人脸比对','Face match'),'98.6%'],[t('自动校验','Auto checks'),t('7/7 通过','7/7 passed')]].map(r=>`<div class="sp"><span class="mu sm">${r[0]}</span><span class="b sm">${r[1]}</span></div>`).join('')}</div></div><div class="card c2 mt" style="font-size:13px;line-height:1.6;color:#bbb">${I('clock',14)} ${t('提交后进入人工审核，预计 5 个工作日内完成。审核期间可以登录，但只能查看认证状态。','After submission a manual review begins — expected within 5 business days. You can sign in meanwhile but only view the verification status.')}</div><button class="btn c mt2" onclick="A.ekSubmit()">${t('提交审核','Submit for review')}</button>`},
 mount:()=>{const e=S.ek;if(e.step===4&&!e.face){let p=0;const iv=T(()=>{p=Math.min(100,p+4);const fb=$('#fb');if(fb)fb.style.width=p+'%';const sm=$('#sim');if(sm)sm.textContent=(p*.986).toFixed(1)+'%';if(p>=100)clearInterval(iv)},60,true);
  CHECKS.forEach((c,i)=>T(()=>{const el=$('#ck'+i);if(el){el.style.opacity=1;el.style.transition='.3s';el.lastElementChild.innerHTML=I('check',12)+' '+t('通过','Pass')}},1500+i*380));
  T(()=>{S.ek.face=1;const b=$('#nx4');if(b)b.disabled=false;const sm=$('#sim');if(sm)sm.textContent='98.6%'},1500+7*380+100)}}};
A.cap=k=>{const c=$('#cam_'+k);c&&c.classList.add('flash');setTimeout(()=>{S.ek[k]=true;renderKeep()},350)};
A.live=()=>{const m=[[t('请眨眨眼','Please blink'),'😑'],[t('请缓慢向左转头','Slowly turn left'),'🙂'],[t('请缓慢向右转头','Slowly turn right'),'🙂'],[t('正在比对…','Analyzing…'),'😀']];const el=$('#lv');m.forEach((x,i)=>T(()=>{const e=$('#lv');if(e)e.textContent=x[0];const r=$('.ring span');if(r)r.textContent=x[1]},i*900));T(()=>{S.ek.live=1;renderKeep()},m.length*900)};
A.ekSubmit=()=>{S.kyc='pending';S.j.kyc=1;S.logged=true;tick(5);addNotif('shield','实名材料已提交','KYC submitted','材料已送入审核队列，预计 5 个工作日内完成。','Your documents are in the review queue — expected within 5 business days.');toast(t('注册完成 · 实名审核中','Registration complete · KYC under review'));A.reset('kycStatus')};

 return `<div class="fade">${gated?`<div class="row sp mt3" style="padding-top:6px"><div class="logo"><i>🎯</i>iLotto</div><button class="pillbtn" style="background:#262626;color:#fff" onclick="A.logout()">${I('out',14)} ${t('退出','Log out')}</button></div>`:`<div class="mt3"></div>`}
 <div class="card mt" style="padding:26px 20px;text-align:center"><div style="width:130px;height:130px;margin:0 auto" class="float">${illo(M[0])}</div><div style="margin-top:12px">${badge(M[1],M[2])}</div><h1 style="margin-top:12px;font-size:23px">${t('用户身份认证','Identity verification')}</h1><div class="mu" style="margin-top:8px;font-size:14px;line-height:1.6">${M[3]}</div>
 ${k==='rejected'?`<div class="card c2 mt" style="text-align:left"><div class="xs mu">${t('拒绝原因','Reason')}</div><div class="b" style="margin-top:4px">${t('证件照片模糊，无法识别证件号码','The ID photo is blurry; the number is unreadable')}</div></div>`:''}</div>

 ${k==='none'||k==='rejected'?`<button class="btn c mt2" onclick="S.ek={step:1,doc:'',front:false,back:false,live:0,face:0};A.go('ekyc')">${k==='none'?t('前往认证','Verify now'):t('重新提交','Resubmit')}</button>`:''}
 ${k==='pending'?`<button class="btn o mt2" onclick="toast(t('仍在审核中，请耐心等待','Still under review'))">${t('刷新状态','Refresh status')}</button><div class="card c2 mt" style="font-size:12.5px;color:#aaa;line-height:1.6">${I('help',13)} ${t('演示：点击右侧面板“管理端通过 KYC”模拟审核通过，再次登录即可进入首页。','Demo: use “Admin approves KYC” in the right panel to simulate approval.')}</div>`:''}
 ${k==='approved'?`<button class="btn c mt2" onclick="A.reset('home')">${t('进入首页','Go to Home')}</button>`:''}
 ${!gated?`<button class="btn d mt" onclick="A.back()">${t('返回','Back')}</button>`:''}</div>`}};

 <div class="xs mu" style="margin-top:10px;line-height:1.7">• ${t('奖金超过 ₱300,000，需本人携带有效证件及申领码到 PCSO 总部现场兑付，以支票形式发放。','Prizes over ₱300,000 must be claimed in person at PCSO HQ with valid ID and this code; paid by cheque.')}<br>• ${t('申领码只在登录后的本页展示，不通过短信/邮箱发送。','The code is shown only here after sign-in — never sent by SMS or email.')}<br>• ${t('柜台核验通过后，状态自动变为“中奖已申领”，申领码随之失效。','Once verified at the counter the status becomes “claimed” and the code expires.')}</div><button class="btn o s mt" style="width:100%" onclick="A.regen('${k.id}')">${t('申领码过期？重新生成','Code expired? Regenerate')}</button></div>`}
 if(k.st==='claimed')extra=`<div class="row sp mt3"><span class="xs mu">${k.paid==='auto'?t('已自动入账钱包（奖金余额）','Auto-credited to wallet (prize balance)'):t('柜台已兑付 · 支票','Paid at counter · cheque')}</span><span class="b" style="color:var(--gr)">+${fm0(k.prize)}</span></div>`;
 if(k.st==='void')extra=`<div class="xs mu mt3" style="color:var(--ro)">${t('不开奖日调整导致作废，已自动退款','Voided due to a no-draw day adjustment — refunded automatically')}</div>`;
 return `<div class="card mt fade" id="${k.id}"><div class="row sp"><div class="row g8"><div style="width:42px;height:28px;border-radius:8px;overflow:hidden">${cover(g)}</div><div><div class="b" style="font-size:14px">${gname(g)}</div><div class="xs mu">${t('期','Draw')} ${k.draw}${k.play?' · '+k.play:''}</div></div></div>${badge(bc,bt)}</div>
 <div class="row" style="gap:6px;margin-top:12px;flex-wrap:wrap">${balls(k.nums,'',hit)}</div>${k.dn?`<div class="xs mu" style="margin-top:10px">${t('开奖号码','Draw result')}：<span style="color:#ddd;font-weight:700">${k.dn.join(' · ')}</span>${k.tier?' · '+k.tier:''}</div>`:''}

SC.tickets={html:()=>{const tab=S.tkTab;const L=S.tickets.filter(k=>tab==='all'||k.st===tab);return `<div class="fade"><div class="row sp" style="margin-top:6px"><h1>${t('我的彩票','My Tickets')}</h1>${badge('b-gy',S.tickets.length+' '+t('张','tix'))}</div><div class="chips mt">${TKTABS.map(x=>`<button class="chip ${x===tab?'on':''}" onclick="S.tkTab='${x}';renderKeep()">${tkName(x)}${x!=='all'?` <span style="opacity:.6;margin-left:5px">${S.tickets.filter(k=>k.st===x).length}</span>`:''}</button>`).join('')}</div>

const TXI={deposit:['down','#34d399',t=>t('充值','Deposit')],withdraw:['up','#fb7184',t=>t('提现','Withdraw')],bet:['ticket','#22d3ee',t=>t('下单','Bet')],prize:['trophy','#f59e0b',t=>t('兑奖','Prize')]};
const TXS=(ty,s)=>({deposit:{ok:['b-gr',t('成功','Success')],proc:['b-am',t('处理中','Processing')],fail:['b-ro',t('失败','Failed')]},withdraw:{ok:['b-gr',t('已到账','Paid out')],proc:['b-am',t('处理中','Processing')],rej:['b-ro',t('已拒绝','Rejected')]},bet:{ok:['b-gr',t('登记成功','Registered')],ref:['b-gy',t('已退款','Refunded')]},prize:{auto:['b-gr',t('自动入账','Auto-credited')],cnt:['b-cy',t('柜台已兑付','Paid at counter')]}}[ty][s]);
function txRow(x){const [ic,col,nm]=TXI[x.type];const [bc,bt]=TXS(x.type,x.st);const pos=x.amt>0;return `<div><span class="ico" style="background:${col}22;border-radius:12px;color:${col}">${I(ic,18)}</span><div class="fl1"><div class="b" style="font-size:14px">${nm(t)}<span class="mu" style="font-weight:500"> · ${x.note}</span></div><div class="xs mu">${fts(x.ms)} · ${x.id}</div></div><div style="text-align:right"><div class="b" style="color:${pos?'var(--gr)':'#fff'};font-variant-numeric:tabular-nums">${pos?'+':'−'}${fm0(Math.abs(x.amt))}</div>${badge(bc,bt)}</div></div>`}
const txTabs=()=>`<div class="chips">${['deposit','withdraw','bet','prize'].map(k=>`<button class="chip ${S.txTab===k?'on':''}" onclick="S.txTab='${k}';renderKeep()">${TXI[k][2](t)}</button>`).join('')}</div>`;
const ACN={gcash:['GCash','#2563eb'],maya:['Maya','#10b981'],bank:['Bank','#f59e0b']};
const acctCard=(a,i)=>`<div class="row sp card c2" style="padding:13px 14px;margin-top:8px"><div class="row g12"><span style="width:40px;height:40px;border-radius:12px;background:${ACN[a.k][1]}33;display:grid;place-items:center;color:${ACN[a.k][1]}">${I(a.k==='bank'?'bank':'card',20)}</span><div><div class="b" style="font-size:14px">${a.bank||ACN[a.k][0]} · ••••${a.no.slice(-4)}</div><div class="xs mu">${a.nm}</div></div></div><div class="row g8">${badge(a.ok?'b-gr':'b-am',a.ok?t('已核验','Verified'):t('待核验','Pending'))}<button onclick="A.unbind(${i})" style="color:#777">${I('trash',16)}</button></div></div>`;
SC.wallet={title:()=>t('钱包','Wallet'),html:()=>{const rec=S.tx.filter(x=>x.type===S.txTab).slice(0,5);return `<div class="fade"><div class="card" style="background:linear-gradient(135deg,#1c2b3a,#151515 60%);padding:22px"><div class="row sp"><span class="mu sm">${t('总余额','Total balance')}</span><button class="eyeic" onclick="A.eye()">${I(S.show?'eye':'eyeoff',18)}</button></div><div class="big balv" data-k="total" style="font-size:40px;margin-top:6px">${balTxt('total')}</div>
 <div class="row g12" style="margin-top:18px"><div class="card c2 fl1" style="padding:12px"><div class="xs mu">${t('投注余额','Bet balance')}</div><div class="b balv" data-k="bet" style="margin-top:4px">${balTxt('bet')}</div></div><div class="card c2 fl1" style="padding:12px"><div class="xs mu">${t('奖金余额','Prize balance')} ${badge('b-gr',t('可提现','Withdrawable'))}</div><div class="b balv" data-k="prize" style="margin-top:4px">${balTxt('prize')}</div></div></div>
 <div class="row g12 mt2"><button class="btn c" onclick="A.go('deposit')">${I('down',18)} ${t('充值','Deposit')}</button><button class="btn d" onclick="A.go('withdraw')">${I('up',18)} ${t('提现','Withdraw')}</button></div></div>
 <div class="xs mu" style="margin-top:10px;line-height:1.6">${t('扣款顺序：先扣投注余额，不足部分从奖金余额扣；只有奖金余额可以提现。','Deduction order: bet balance first, then prize balance. Only the prize balance can be withdrawn.')}</div>
 <div class="row sp" style="margin-top:22px"><h3>${t('绑定支付账户','Payment accounts')}</h3><button class="sm b" style="color:var(--cy)" onclick="A.go('bind')">${t('管理','Manage')} ›</button></div>
 ${S.accts.length?S.accts.map(acctCard).join(''):`<div class="card c2 mt" style="text-align:center;padding:22px"><div class="mu sm">${t('还没有绑定支付账户','No payment account yet')}</div><button class="btn c s mt" onclick="A.go('bind')">${t('去绑定','Bind now')}</button></div>`}
 ${S.accts.length?`<button class="card mt row g8" style="width:100%;border:1.5px dashed #333;background:transparent;justify-content:center;padding:14px;color:#aaa" onclick="A.go('bind')">${I('plus',16)} ${t('绑定新账户','Bind new account')}</button>`:''}
 <div class="row sp" style="margin-top:22px"><h3>${t('交易记录','Transactions')}</h3><button class="sm b" style="color:var(--cy)" onclick="A.go('tx')">${t('查看全部','View all')} ›</button></div><div style="margin-top:10px">${txTabs()}</div>
 <div class="card mt" style="padding:4px 14px"><div class="list">${rec.length?rec.map(txRow).join(''):`<div class="mu sm" style="justify-content:center;padding:26px">${t('暂无记录','No records')}</div>`}</div></div></div>`}};
SC.tx={title:()=>t('交易流水','Transactions'),html:()=>{const rec=S.tx.filter(x=>x.type===S.txTab);return `${txTabs()}<div class="card mt" style="padding:4px 14px"><div class="list">${rec.length?rec.map(txRow).join(''):`<div class="mu sm" style="justify-content:center;padding:30px">${t('暂无记录','No records')}</div>`}</div></div><div class="xs mu mt" style="text-align:center">${t('时间为 UTC+8；兑奖大于 ₱300,000 由 PCSO 柜台线下兑付','Times in UTC+8; prizes above ₱300,000 are paid offline at PCSO counters')}</div>`}};

 setTimeout(()=>{const ok=!S.reg||nm.replace(/[\s.]/g,'').toLowerCase()===fullName().replace(/[\s.]/g,'').toLowerCase();if(!ok){renderKeep();return toast(t('户名与实名信息不一致，绑定失败','Holder name does not match your verified name'))}
  S.accts.push({k,no,nm:nm.toUpperCase(),ok:true,bank:k==='bank'?V('b_bank'):''});S.j.bind=1;tick(2);toast(t('绑定成功','Account bound'));renderKeep()},1500)};

 const used=S.tx.filter(x=>x.type==='deposit'&&x.st!=='fail'&&fdt(x.ms)===fdt(S.clock)).reduce((a,x)=>a+x.amt,0);
 return `<div class="card"><div class="mu sm">${t('充值金额','Amount')}</div><div class="row" style="margin-top:6px;align-items:baseline"><span class="b" style="font-size:34px">₱</span><input id="d_amt" type="number" inputmode="numeric" value="${am}" placeholder="0" oninput="S.p.amt=this.value" style="background:none;border:0;outline:0;font-size:44px;font-weight:800;width:100%;font-variant-numeric:tabular-nums"></div><div class="chips mt">${[100,500,1000,2000,5000].map(v=>`<button class="chip ${+am===v?'on':''}" onclick="S.p.amt=${v};renderKeep()">${fm0(v)}</button>`).join('')}</div></div>

 <button class="card mt3 row g8" style="width:100%;border:1.5px dashed #333;background:transparent;justify-content:center;padding:13px;color:#aaa" onclick="A.go('bind')">${I('plus',15)} ${t('绑定新账户','Bind new')}</button>

 <button class="btn c mt2" onclick="A.depGo()">${t('确认充值','Confirm deposit')}</button>`}};

 const used=S.tx.filter(x=>x.type==='deposit'&&x.st!=='fail'&&fdt(x.ms)===fdt(S.clock)).reduce((p,x)=>p+x.amt,0);if(used+am>S.limits.dep.d)return modal(()=>`<div style="text-align:center"><div style="width:90px;height:90px;margin:0 auto">${illo('shield')}</div><h3 style="margin-top:10px">${t('超出每日充值限额','Daily deposit limit exceeded')}</h3><div class="mu sm mt3">${t(`限额 ${fm0(S.limits.dep.d)}，今日已充 ${fm0(used)}`,`Limit ${fm0(S.limits.dep.d)} · deposited ${fm0(used)}`)}</div><button class="btn mt2" onclick="A.close();A.go('playsafe')">PlaySafe</button></div>`,true);
 modal(()=>`<div style="text-align:center;padding:10px 0"><div class="spin"></div><h3 style="margin-top:18px">${t('正在向支付渠道发起扣款…','Contacting your payment provider…')}</h3><div class="skel mt2" style="height:14px"></div></div>`,true,true);
