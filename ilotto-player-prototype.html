<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iLotto · Player App Prototype</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#000;--s1:#0a0a0a;--card:#151515;--card2:#1d1d1d;--line:#262626;--tx:#fff;--mu:#8a8a8a;--cy:#22d3ee;--am:#f59e0b;--ro:#fb7184;--gr:#34d399;--vi:#8b5cf6}
html,body{height:100%;background:#050505;color:var(--tx);font-family:-apple-system,"PingFang SC","Microsoft YaHei",Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#stage{height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;gap:36px;background:radial-gradient(900px 500px at 50% 0%,rgba(34,211,238,.10),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(139,92,246,.10),transparent 60%),#050505}
#phoneWrap{width:414px;height:868px;flex:none;transform-origin:center center}
#phone{width:414px;height:868px;border-radius:62px;background:#000;border:12px solid #1b1b1d;box-shadow:0 0 0 2px #2d2d30,0 50px 120px rgba(0,0,0,.7),0 0 80px rgba(34,211,238,.08);position:relative;overflow:hidden}
#screen{position:absolute;inset:0;background:var(--s1);display:flex;flex-direction:column;overflow:hidden}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#000;z-index:60}
#sb{height:50px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px 34px;font-size:15px;font-weight:600;position:relative;z-index:40}
#sb .ic{display:flex;gap:6px;align-items:center}
.glow{position:absolute;top:0;left:0;right:0;height:360px;background:radial-gradient(ellipse at 15% 0%,rgba(34,211,238,.30),transparent 60%),radial-gradient(ellipse at 95% 5%,rgba(245,158,11,.20),transparent 55%);pointer-events:none;z-index:0}
#view{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;z-index:1}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 110px;scrollbar-width:none;position:relative}
.scroll::-webkit-scrollbar{display:none}
.scroll.nopad{padding-bottom:30px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 8px;flex:none}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:.3px}
.logo .pcso{width:28px;height:28px;border-radius:50%;flex:none;display:block}
.logo i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--cy),#3b82f6 60%,var(--vi));display:grid;place-items:center;font-style:normal;font-size:15px;box-shadow:0 0 18px rgba(34,211,238,.45)}
.capsule{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.09);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:4px 6px}
.capsule .bal{display:flex;align-items:center;gap:5px;padding:5px 8px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.capsule .ib{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;position:relative}
.capsule .plus{background:var(--cy);color:#04151a}
.dot{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:8px;background:#ff4d6a;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 3px;border:2px solid #1a1a1a}
.sub{display:flex;align-items:center;gap:8px;padding:4px 12px 10px;flex:none}
.sub h2{font-size:20px;font-weight:800;flex:1}
.back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.09);display:grid;place-items:center}
.card{background:var(--card);border-radius:24px;padding:16px;position:relative;overflow:hidden}
.card.c2{background:var(--card2)}
.mt{margin-top:14px}.mt2{margin-top:22px}.mt3{margin-top:8px}
.row{display:flex;align-items:center}.sp{justify-content:space-between}.g8{gap:8px}.g12{gap:12px}.fl1{flex:1}
.mu{color:var(--mu)}.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:700}
h1{font-size:26px;font-weight:800;letter-spacing:.2px}h3{font-size:17px;font-weight:800}
.big{font-size:52px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.05}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:16px;width:100%;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.c{background:linear-gradient(135deg,var(--cy),#3b82f6);color:#03141a;box-shadow:0 8px 28px rgba(34,211,238,.35)}
.btn.o{background:transparent;border:1.5px solid #3a3a3a;color:#fff}
.btn.d{background:#262626;color:#fff}
.btn.r{background:linear-gradient(135deg,#fb7184,#e11d48);color:#fff}
.btn.s{height:38px;font-size:14px;width:auto;padding:0 18px}
.btn[disabled]{opacity:.35;pointer-events:none}
.pillbtn{height:34px;padding:0 14px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.inp{width:100%;height:50px;border-radius:16px;background:#1a1a1a;border:1.5px solid #262626;padding:0 16px;font-size:15px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--cy)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 22px) 22px,calc(100% - 16px) 22px;background-size:6px 6px;background-repeat:no-repeat}
label.inp.bad,.inp.bad:focus{border-color:#f43f5e!important;background-color:rgba(244,63,94,.07)}
.wbad{outline:1.5px solid #f43f5e;outline-offset:5px;border-radius:12px}
.ferr{color:#fb7185;font-size:12.5px;margin-top:6px;line-height:1.4;display:flex;gap:5px;align-items:flex-start;animation:ferr .18s ease-out}
.ferr::before{content:"!";flex:none;width:14px;height:14px;border-radius:50%;background:#f43f5e;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;margin-top:1px}
@keyframes ferr{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.lb{display:block;font-size:12px;color:var(--mu);margin:14px 0 6px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.b-gr{background:rgba(52,211,153,.15);color:var(--gr)}.b-am{background:rgba(245,158,11,.15);color:var(--am)}.b-ro{background:rgba(251,113,132,.15);color:var(--ro)}.b-cy{background:rgba(34,211,238,.15);color:var(--cy)}.b-gy{background:#262626;color:#aaa}.b-vi{background:rgba(139,92,246,.18);color:#b9a2ff}
.glowbadge{box-shadow:0 0 12px rgba(245,158,11,.45)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:999px;background:#1c1c1c;color:#bbb;font-weight:600;font-size:13px;display:inline-flex;align-items:center;transition:.2s}
.chip.on{background:#fff;color:#000}
.seg{display:flex;background:#1a1a1a;border-radius:999px;padding:4px}.seg button{flex:1;height:36px;border-radius:999px;font-weight:700;font-size:13px;color:#999;transition:.25s}.seg button.on{background:#fff;color:#000}
.circ{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:#ddd;font-weight:600}
.circ i{width:62px;height:62px;border-radius:50%;background:#1b1b1b;display:grid;place-items:center;border:1px solid #262626;transition:.15s}
.circ:active i{transform:scale(.92);background:#262626}
.tabbar{position:absolute;left:14px;right:14px;bottom:14px;height:64px;border-radius:999px;background:rgba(32,32,36,.78);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.09);box-shadow:0 12px 40px rgba(0,0,0,.6);display:flex;align-items:center;padding:0 6px;z-index:30}
.tabbar button{flex:1;height:52px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:700;color:#9a9a9a;transition:.25s}
.tabbar button.on{background:rgba(255,255,255,.14);color:var(--cy)}
.tabbar button.on svg{filter:drop-shadow(0 0 6px rgba(34,211,238,.7))}
.ball{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#2c2c2c,#171717);border:1px solid #2c2c2c;display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:#cfcfcf;transition:transform .15s,background .2s,box-shadow .2s}
.ball.on{background:radial-gradient(circle at 32% 28%,#7ee8fb,#22d3ee 40%,#2563eb);color:#021018;box-shadow:0 0 0 2px rgba(34,211,238,.35),0 0 18px rgba(34,211,238,.7);transform:scale(1.12)}
.ball.roll{background:radial-gradient(circle at 32% 28%,#fcd34d,#f59e0b);color:#201300;transform:scale(1.08)}
.ball.mini{width:30px;height:30px;font-size:12px}
.ball.hit{background:radial-gradient(circle at 32% 28%,#6ee7b7,#10b981);color:#012;border-color:#34d399;box-shadow:0 0 14px rgba(52,211,153,.6)}
.ball.win{background:radial-gradient(circle at 32% 28%,#fde68a,#f59e0b);color:#201300;box-shadow:0 0 16px rgba(245,158,11,.7)}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(.1) translateY(-30px);opacity:0}100%{transform:scale(1);opacity:1}}
.board{display:grid;gap:8px;justify-items:center}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.list>div{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid #1f1f1f}.list>div:last-child{border:0}
.list .ico{width:36px;height:36px;display:grid;place-items:center;color:#fff}

.gi{display:inline-grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 14px rgba(0,0,0,.35)}
.svc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:22px;background:linear-gradient(100deg,rgba(251,191,36,.16),rgba(251,191,36,.04) 55%,#141414);border:1px solid rgba(251,191,36,.28);margin-top:22px}
.svc .tag{font-size:10px;font-weight:800;letter-spacing:.8px;color:#fbbf24}
.svc .hd{font-weight:700;font-size:14px;margin-top:2px;transition:opacity .25s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svc .nw{width:8px;height:8px;border-radius:50%;background:#fb7185;box-shadow:0 0 0 4px rgba(251,113,133,.2)}
.nearby{position:relative;display:block;width:100%;text-align:left;margin-top:12px;border-radius:22px;overflow:hidden;background:#101c1f;border:1px solid #1d3036;min-height:96px}
.nearby svg.mp{position:absolute;inset:0;width:100%;height:100%}
.nearby .in{position:relative;display:flex;align-items:center;gap:12px;padding:14px;background:linear-gradient(90deg,#101c1f 38%,rgba(16,28,31,.35))}
.nf{display:block;padding:14px;border-radius:22px;background:#141414;border:1px solid #222;margin-bottom:10px}
.nf.pin{background:linear-gradient(120deg,rgba(96,165,250,.16),#141414 60%);border-color:rgba(96,165,250,.35)}
.nf summary{list-style:none;cursor:pointer}.nf summary::-webkit-details-marker{display:none}
.nf .ty{font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:999px}
.nf .body{margin-top:10px;padding-top:10px;border-top:1px dashed #2a2a2a;color:#b5b5b5;font-size:13px;line-height:1.6}
.os{background:#000;border-radius:28px 28px 0 0;margin:-34px -16px 0;padding:14px 16px 20px;position:relative}
.os .grab{width:40px;height:4px;border-radius:2px;background:#333;margin:0 auto 12px}
.ot{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #1d1d1d}.ot:last-child{border:0}
.ot .num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#04130e}
.ot .go{height:32px;padding:0 12px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.tile{border-radius:26px;padding:18px;min-height:150px;position:relative;overflow:hidden;background:#171717;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.tile .arr{width:42px;height:42px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.bgart{position:absolute;inset:0;pointer-events:none;z-index:0}.bgart svg{width:100%;height:100%;display:block}.bgt::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.5) 50%,rgba(0,0,0,0) 88%);pointer-events:none}.bgt>div,.bgt>.arr{position:relative;z-index:2}
.tile .il{position:absolute;right:-6px;bottom:-4px;width:112px;height:112px}
.gcard{border-radius:22px;background:#161616;overflow:hidden;text-align:left;transition:transform .18s,box-shadow .2s;position:relative}
.gcard:active{transform:scale(.97)}
.gcard.off{opacity:.38;filter:grayscale(1);pointer-events:none}
.gcard .cv{height:84px;position:relative}
.banners{display:flex;gap:10px;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.bn{flex:none;width:calc(100% - 44px);height:176px;border-radius:26px;padding:18px;position:relative;overflow:hidden;text-align:left}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.dots i{width:6px;height:6px;border-radius:3px;background:#3a3a3a;transition:.3s}.dots i.on{width:18px;background:#fff}
.glowtxt{background:linear-gradient(135deg,#fde68a,#f59e0b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px rgba(245,158,11,.45))}
.grad{background:linear-gradient(135deg,#7ee8fb,#22d3ee 40%,#60a5fa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(6px);z-index:80;display:flex;align-items:flex-end;animation:fade .25s}
.ov.mid{align-items:center;padding:0 22px}
.sheet{width:100%;max-height:86%;overflow-y:auto;background:#161616;border-radius:30px 30px 0 0;padding:22px 20px 28px;animation:up .3s cubic-bezier(.2,.9,.3,1);scrollbar-width:none}
.ov.mid .sheet{border-radius:28px;padding:24px 20px 20px;max-height:80%}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#fff;color:#000;font-weight:700;font-size:13px;padding:10px 18px;border-radius:999px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fade .25s;max-width:340px;text-align:center}
.otp{position:relative;display:flex;gap:9px;justify-content:center}
.otp b{width:56px;height:62px;border-radius:16px;background:#1a1a1a;border:1.5px solid #2a2a2a;display:grid;place-items:center;font-size:24px;font-weight:800}
.otp b.cur{border-color:var(--cy);box-shadow:0 0 14px rgba(34,211,238,.35)}
.otp input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.steps{display:flex;gap:6px}.steps i{flex:1;height:4px;border-radius:2px;background:#2a2a2a;transition:.3s}.steps i.on{background:var(--cy);box-shadow:0 0 8px rgba(34,211,238,.6)}
.spin{width:54px;height:54px;border-radius:50%;border:4px solid #262626;border-top-color:var(--cy);border-right-color:#3b82f6;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,#1b1b1b,#2a2a2a,#1b1b1b);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}
.bar{height:8px;border-radius:4px;background:#232323;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cy),#3b82f6);transition:width .5s}
.qr{width:104px;height:104px;background:#fff;border-radius:14px;padding:8px;display:grid;grid-template-columns:repeat(13,1fr);gap:0}.qr i{background:#000}.qr i.w{background:#fff}
.faq summary{list-style:none;padding:15px 2px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;cursor:pointer;border-bottom:1px solid #1f1f1f}.faq summary::-webkit-details-marker{display:none}.faq p{padding:12px 2px;color:#aaa;font-size:13px;line-height:1.6}
table.tb{width:100%;border-collapse:collapse;font-size:12px}.tb td,.tb th{padding:9px 4px;border-bottom:1px solid #222;text-align:left}.tb th{color:var(--mu);font-weight:600}
.tg{width:48px;height:28px;border-radius:14px;background:#333;position:relative;transition:.25s;flex:none}.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.25s}.tg.on{background:var(--cy)}.tg.on::after{left:23px}
.avatar{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:44px;font-weight:800;border:5px solid #0a0a0a}
.cam{height:230px;border-radius:24px;background:repeating-linear-gradient(135deg,#141414 0 14px,#191919 14px 28px);display:grid;place-items:center;position:relative;overflow:hidden;border:1.5px dashed #3a3a3a}
.cam.ok{border:1.5px solid var(--gr)}
.scanline{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--cy),transparent);box-shadow:0 0 18px var(--cy);animation:scan 1.8s ease-in-out infinite}
@keyframes scan{0%,100%{top:8%}50%{top:90%}}
.ring{width:190px;height:190px;border-radius:50%;border:4px solid var(--cy);display:grid;place-items:center;position:relative;box-shadow:0 0 40px rgba(34,211,238,.35)}
.ring::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed rgba(34,211,238,.5);animation:sp 6s linear infinite}
.flash{animation:fl .4s}@keyframes fl{0%{background:#fff}100%{background:transparent}}
.shake{animation:shk .35s}@keyframes shk{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.float{animation:flt 3.2s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-6px)}}
#panel{width:330px;height:min(868px,calc(100vh - 40px));overflow-y:auto;background:rgba(18,18,20,.86);border:1px solid #262626;border-radius:26px;padding:18px;backdrop-filter:blur(14px);scrollbar-width:thin;flex:none}
#panel h4{font-size:12px;color:#777;letter-spacing:.08em;text-transform:uppercase;margin:16px 0 8px}
#panel h4:first-child{margin-top:0}
#panel .pb{display:inline-flex;align-items:center;height:30px;padding:0 11px;margin:0 6px 6px 0;border-radius:10px;background:#212125;color:#ddd;font-size:12px;font-weight:600;border:1px solid #2c2c31;transition:.15s}
#panel .pb:hover{border-color:var(--cy);color:#fff}
#panel .pb.hl{background:linear-gradient(135deg,var(--cy),#3b82f6);color:#02121a;border-color:transparent}
#panel .pb.on{background:#fff;color:#000}
#panel .st{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;color:#888}
#panel .st i{width:18px;height:18px;border-radius:50%;border:1.5px solid #444;display:grid;place-items:center;font-style:normal;font-size:11px;flex:none}
#panel .st.done{color:#ddd}#panel .st.done i{background:var(--gr);border-color:var(--gr);color:#012}
#panel .st.now{color:#fff;font-weight:700}#panel .st.now i{border-color:var(--cy);box-shadow:0 0 10px rgba(34,211,238,.6)}
#ptog{position:fixed;top:14px;left:18px;z-index:200;height:36px;padding:0 14px;border-radius:999px;background:rgba(30,30,34,.9);border:1px solid #333;font-size:12px;font-weight:700;color:#bbb}
@media (max-width:1060px){#ptog{display:none}}
  .exban{display:flex;gap:10px;align-items:center;margin:6px 14px 0;padding:10px 12px;border-radius:16px;background:rgba(251,113,132,.12);border:1px solid rgba(251,113,132,.35);cursor:pointer}
.exban.ended,.exban.pending{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.4)}
#lang{position:fixed;top:14px;right:18px;z-index:200;display:flex;background:rgba(30,30,34,.9);border:1px solid #333;border-radius:999px;padding:3px;backdrop-filter:blur(10px)}
#lang button{height:30px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700;color:#999}
#lang{align-items:center}
#lang .specs{color:#e8e8ea;text-decoration:none;font-size:12px;padding:4px 10px;margin-right:2px;border-right:1px solid #444;white-space:nowrap}#lang .specs:hover{color:#fff;text-decoration:underline}.devtag{font-size:10px;font-weight:800;letter-spacing:.8px;color:#f59e0b;padding:0 6px 0 10px}

function fErr(id,msg){const el=document.getElementById(id);if(!el)return null;let anchor,isInp=el.classList.contains('inp');
 if(isInp){el.classList.add('bad');anchor=el.parentElement&&el.parentElement.style.position==='relative'?el.parentElement:el}
 else{anchor=el.closest('label')||document.getElementById(id+'w')||el.parentElement;anchor.classList.add('wbad');anchor.dataset.wb=id}
 const d=document.createElement('div');d.className='ferr';d.dataset.for=id;d.textContent=msg;anchor.insertAdjacentElement('afterend',d);return el}
/* rules: [[id, errorMessageOrEmpty], ...]; empty message = field is fine. Returns true when everything passes. */
let _fchk=0;

/* ===== PH mobile: default +63 when the user omits the country code ===== */
function normPh(raw){const s=String(raw||'').trim();if(!s||s.includes('@'))return s;const d=s.replace(/[\s\-()]/g,'');if(!/^\+?\d+$/.test(d))return s;
 let n=null;if(d.startsWith('+63'))n=d.slice(3);else if(d.startsWith('63')&&d.length===12)n=d.slice(2);else if(d.startsWith('0'))n=d.slice(1);else if(!d.startsWith('+'))n=d;
 if(n===null||!/^9\d{9}$/.test(n))return s;return '+63 '+n.slice(0,3)+' '+n.slice(3,6)+' '+n.slice(6)}

 if(s===2)return head+`<div class="mu mt" style="font-size:14px">${t('请将证件放入框内，确保四角完整、无反光','Fit the ID inside the frame — all corners visible, no glare')}</div>`+['front','back'].map(k=>`<div class="cam mt ${e[k]?'ok':''}" id="cam_${k}">${e[k]?`<div style="text-align:center;color:var(--gr)">${I('check',46)}<div class="b mt3">${t(k==='front'?'正面已拍摄':'背面已拍摄',k==='front'?'Front captured':'Back captured')}</div></div>`:`<div class="scanline"></div><div class="mu" style="text-align:center">${I('camera',40)}<div class="mt3">${t(k==='front'?'证件正面':'证件背面',k==='front'?'ID front':'ID back')}</div></div>`}</div><button class="btn ${e[k]?'d':'o'} mt3" onclick="A.cap('${k}')">${e[k]?t('重拍','Retake'):t('拍摄','Capture')}</button>`).join('')+`<button class="btn c mt2" ${e.front&&e.back?'':'disabled'} onclick="S.ek.step=3;render()">${t('下一步','Next')}</button>`;
 if(s===3)return head+`<div class="mu mt" style="font-size:14px">${t('活体检测：请按提示完成动作','Liveness: follow the on-screen prompts')}</div><div style="display:grid;place-items:center;margin:30px 0 14px"><div class="ring">${e.live?`<span style="color:var(--gr)">${I('check',70)}</span>`:`<span style="font-size:60px">🙂</span>`}</div></div><div id="lv" class="b" style="text-align:center;font-size:17px;min-height:28px">${e.live?t('活体检测通过','Liveness passed'):t('点击开始','Tap to start')}</div><button class="btn ${e.live?'c':'o'} mt2" onclick="${e.live?'S.ek.step=4;render()':'A.live()'}">${e.live?t('下一步','Next'):t('开始检测','Start')}</button>`;
 if(s===4)return head+`<div class="mu mt" style="font-size:14px">${t('正在进行人脸比对与 6 项自动校验','Running face match and 6 automatic checks')}</div><div class="card mt"><div class="row sp"><span class="b">${t('人脸相似度','Face similarity')}</span><span class="b grad" id="sim">${e.face?'98.6%':'0%'}</span></div><div class="bar mt"><i id="fb" style="width:${e.face?100:0}%"></i></div></div><div class="card mt" id="chk">${CHECKS.map((c,i)=>`<div class="row sp" style="padding:9px 0;border-bottom:1px solid #222;${e.face?'':'opacity:.25'}" id="ck${i}"><span style="font-size:14px">${t(c[0],c[1])}</span>${ckBadge(i,e.face)}</div>`).join('')}</div><div id="ckres">${e.face?ckRes():''}</div><button class="btn c mt2" id="nx4" ${e.face?'':'disabled'} onclick="S.ek.step=5;render()">${t('下一步','Next')}</button>`;
 return head+`<div style="text-align:center;margin:20px 0"><div style="width:120px;height:120px;margin:0 auto" class="float">${illo('idcard')}</div><h3 style="margin-top:10px">${t('确认并提交','Review & submit')}</h3></div><div class="card"><div class="list">${[[t('姓名','Name'),fullName()],[t('证件','Document'),e.doc||DOCS[0][0]],[t('人脸比对','Face match'),(S.ekFail?'91.2%':'98.6%')],[t('自动校验','Auto checks'),S.ekFail?t('5/6 通过 · 1 项未通过','5/6 passed · 1 failed'):t('6/6 通过','6/6 passed')]].map(r=>`<div class="sp"><span class="mu sm">${r[0]}</span><span class="b sm">${r[1]}</span></div>`).join('')}</div></div><div class="card c2 mt" style="font-size:13px;line-height:1.6;color:#bbb">${I(S.ekFail?'clock':'shield',14)} ${S.ekFail?t('自动校验未全部通过，将转人工复核，预计 5 个工作日内完成。复核期间可以登录，但只能查看认证状态。','Automatic checks did not all pass, so a manual review follows (up to 5 business days). You can sign in meanwhile but only view the verification status.'):t('自动校验全部通过，提交后系统将自动完成认证，无需人工审核。','All automatic checks passed — verification completes automatically, no manual review.')}</div><button class="btn c mt2" onclick="A.ekSubmit()">${S.ekFail?t('提交人工复核','Submit for manual review'):t('完成并进入首页','Finish & enter Home')}</button>`},
 mount:()=>{const e=S.ek;if(e.step===4&&!e.face){let p=0;const iv=T(()=>{p=Math.min(100,p+4);const fb=$('#fb');if(fb)fb.style.width=p+'%';const sm=$('#sim');if(sm)sm.textContent=(p*.986).toFixed(1)+'%';if(p>=100)clearInterval(iv)},60,true);
  CHECKS.forEach((c,i)=>T(()=>{const el=$('#ck'+i);if(el){el.style.opacity=1;el.style.transition='.3s';el.lastElementChild.outerHTML=ckBadge(i,true)}},1500+i*380));
  T(()=>{S.ek.face=1;const b=$('#nx4');if(b)b.disabled=false;const sm=$('#sim');if(sm)sm.textContent=S.ekFail?'91.2%':'98.6%';const r=$('#ckres');if(r)r.innerHTML=ckRes()},1500+6*380+100)}}};

 <div class="card mt" style="padding:26px 20px;text-align:center"><div style="width:130px;height:130px;margin:0 auto" class="float">${illo(M[0])}</div><div style="margin-top:12px">${badge(M[1],M[2])}</div><h1 style="margin-top:12px;font-size:23px">${t('用户身份认证','Identity verification')}</h1><div class="mu" style="margin-top:8px;font-size:14px;line-height:1.6">${M[3]}</div>

 ${k==='none'||k==='rejected'?`<button class="btn c mt2" onclick="S.ek={step:1,doc:'',front:false,back:false,live:0,face:0};A.go('ekyc')">${k==='none'?t('前往认证','Verify now'):t('重新提交','Resubmit')}</button>`:''}
 ${k==='pending'?`<button class="btn o mt2" onclick="toast(t('仍在审核中，请耐心等待','Still under review'))">${t('刷新状态','Refresh status')}</button><div class="card c2 mt" style="font-size:12.5px;color:#aaa;line-height:1.6">${I('help',13)} ${t('演示：点击右侧面板“管理端通过 KYC”模拟审核通过，再次登录即可进入首页。','Demo: use “Admin approves KYC” in the right panel to simulate approval.')}</div>`:''}
 ${k==='approved'?`<button class="btn c mt2" onclick="A.reset('home')">${t('进入首页','Go to Home')}</button>`:''}
 ${!gated?`<button class="btn d mt" onclick="A.back()">${t('返回','Back')}</button>`:''}</div>`}};
A.logout=()=>{S.logged=false;S.show=false;toast(t('已退出登录','Logged out'));A.reset('login')};

SC.home={html:()=>{const top3=G.filter(g=>g.t==='lotto').sort((a,b)=>b.pool-a.pool).slice(0,3);const cat=S.homeCat;const gl=G.filter(g=>cat==='lotto'?g.t==='lotto':g.t!=='lotto');

 <div style="overflow:hidden;margin:22px -16px 0;padding:0 16px" id="bnv"><div class="banners" id="bn">${top3.map(g=>`<div class="bn" id="bs" style="background:linear-gradient(135deg,${g.c[0]},${g.c[1]})"><div class="xs b" style="opacity:.85;letter-spacing:.1em">${t('头奖','JACKPOT')}</div><div class="b" style="font-size:17px;margin-top:2px">${gname(g)}</div><div class="b" style="font-size:27px;margin-top:6px;letter-spacing:-.5px;text-shadow:0 2px 14px rgba(0,0,0,.35)">${fm0(g.pool)}</div><button class="pillbtn" style="position:absolute;left:18px;bottom:16px" onclick="A.playGame('${g.id}')">${t('立即投注','Play now')}</button><div style="position:absolute;right:-6px;bottom:-8px;width:96px;height:96px;opacity:.95" class="float">${illo('trophy')}</div><div style="position:absolute;right:-30px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14)"></div></div>`).join('')}</div></div>

function tkCard(k){const g=gm(k.g);const [bc,bt]=expiredTk(k)?['b-ro',t('已逾期','Expired')]:stBadge(k.st);const hit=k.dn&&g.t==='lotto'?k.dn:null;
 const win=k.st==='winPending'||(k.st==='claimed');

 if(k.st==='void')extra=`<div class="xs mu mt3" style="color:var(--ro);line-height:1.5">${t('该期因游戏在开奖时间仍为下架而作废，付款已按原扣款构成退回。','This draw was cancelled because the game was unavailable at draw time. Your payment has been refunded to the balances it was paid from.')}</div>`;
 return `<div class="card mt fade tkc" id="${k.id}" style="cursor:pointer" onclick="A.go('tkDetail',{id:'${k.id}'})"><div class="row sp"><div class="row g8"><div style="width:42px;height:28px;border-radius:8px;overflow:hidden">${cover(g)}</div><div><div class="b" style="font-size:14px">${gname(g)}</div><div class="xs mu">${t('期','Draw')} ${k.draw} · ${playTxt(k)}${linesOf(k).length>1?' · '+linesOf(k).length+t(' 注',' lines'):''}</div></div></div>${badge(bc,bt)}</div>
 <div class="row" style="gap:6px;margin-top:12px;flex-wrap:wrap">${balls(k.sel||k.nums,'',hit)}${linesOf(k).length>1&&!k.sel?`<span class="xs mu">+${linesOf(k).length-1} ${t('注','lines')}</span>`:''}</div>${k.dn?`<div class="xs mu" style="margin-top:10px">${t('开奖号码','Draw result')}：<span style="color:#ddd;font-weight:700">${k.dn.join(' · ')}</span>${k.tier?' · '+k.tier:''}</div>`:''}
 <div class="row sp mt3" style="margin-top:12px"><span class="xs mu" style="font-family:ui-monospace,monospace">${k.id}</span><span class="b sm">${fm0(k.amt)}${k.mult>1?' · ×'+k.mult:''} ${I('chev',14)}</span></div>${extra}</div>`}
SC.tickets={html:()=>{const tab=S.tkTab;const L=S.tickets.filter(k=>!archived(k)&&(tab==='all'||k.st===tab));return `<div class="fade"><div class="row sp" style="margin-top:6px"><h1>${t('我的彩票','My Tickets')}</h1>${badge('b-gy',S.tickets.length+' '+t('张','tix'))}</div><div class="chips mt">${TKTABS.map(x=>`<button class="chip ${x===tab?'on':''}" onclick="S.tkTab='${x}';renderKeep()">${tkName(x)}${x!=='all'?` <span style="opacity:.6;margin-left:5px">${S.tickets.filter(k=>k.st===x).length}</span>`:''}</button>`).join('')}</div>
 ${L.length?L.map(tkCard).join(''):`<div class="card mt" style="text-align:center;padding:36px 20px"><div style="width:110px;height:110px;margin:0 auto;opacity:.9">${illo('list')}</div><div class="b mt3">${t('这里还没有彩票','No tickets here yet')}</div><div class="mu sm mt3">${t('去投注页选一组号码试试','Pick some numbers on the Play tab')}</div><button class="btn c mt2" onclick="A.tab('play')">${t('去投注','Play now')}</button></div>`}
 <div class="xs mu" style="text-align:center;margin-top:20px;line-height:1.6">${t('普通彩票保存 30 天，中奖彩票自开奖日起保存 1 年零 1 天','Regular tickets kept 30 days; winning tickets kept 1 year + 1 day from the draw date')}</div></div>`}};

/* ================= TICKET DETAIL ================= */
const rowKV=(a,b)=>`<div class="row sp" style="padding:9px 0;border-bottom:1px solid #1f1f1f;align-items:flex-start;gap:14px"><span class="mu sm" style="flex:none">${a}</span><span class="sm" style="text-align:right;font-weight:600">${b}</span></div>`;
SC.tkDetail={title:()=>t('彩票详情','Ticket details'),back:true,html:()=>{const k=S.tickets.find(x=>x.id===S.p.id);if(!k||archived(k))return `<div class="mu" style="padding:30px;text-align:center">${t('该彩票已超过保存期','This ticket is past its retention period.')}</div>`;
 const g=gm(k.g);const [bc,bt]=expiredTk(k)?['b-ro',t('已逾期','Expired')]:stBadge(k.st);const L=linesOf(k);const R=k.res;const win=R?R.win:k.dn;const hitSet=win&&g.t==='lotto'?win:null;
 const drawTime=fts(Date.parse(g.nx)).slice(11);const open=S.p.all;const show=open?L:L.slice(0,12);
 const lineRows=show.map((l,i)=>{const r=R?R.lines.find(x=>x.line===l):null;const rr=R&&R.lines.find(x=>x.line.join()===l.join());return `<div class="row sp" style="padding:6px 0;border-bottom:1px solid #1c1c1c;gap:8px"><span class="xs mu" style="width:26px">#${i+1}</span><div class="row" style="gap:4px;flex:1;flex-wrap:wrap">${balls(l,'',hitSet)}</div>${rr?`<span class="xs" style="color:var(--gr);white-space:nowrap">${tierLbl(g,rr.tier)}</span>`:R?`<span class="xs mu">—</span>`:''}</div>`}).join('');
 let prize='';
 if(R&&R.gross>0){prize=`<h3 style="margin-top:20px">${t('中奖明细','Prize breakdown')}</h3><div class="card mt" style="padding:6px 16px"><table class="tb"><tr><th>${t('奖级','Tier')}</th><th>${t('注数','Lines')}</th><th style="text-align:right">${t('单注奖金','Per line')}</th><th style="text-align:right">${t('小计','Subtotal')}</th></tr>${R.tiers.map(x=>`<tr><td>${tierLbl(g,x.tier)}</td><td>${x.n}${k.mult>1?' ×'+k.mult:''}</td><td style="text-align:right">${fm2(x.per)}</td><td style="text-align:right" class="b">${fm2(x.amt)}</td></tr>${x.type==='POOL'?`<tr><td colspan="4" class="xs mu" style="padding-top:0">${t(`奖池 ${fm0(x.pool)} ÷（其他中奖注 ${x.oth} + 本票 ${x.n*k.mult}）向下取整到分`,`Pool ${fm0(x.pool)} ÷ (${x.oth} other winning lines + your ${x.n*k.mult}), rounded down to the cent`)}</td></tr>`:''}`).join('')}</table></div>
  <div class="card mt" style="padding:6px 16px">${rowKV(t('税前奖金','Gross prize'),fm2(R.gross))}${rowKV(t('预扣税 20%','Withholding 20%')+(R.tax?'':' · '+t('未超过 ₱10,000，不扣','not above ₱10,000')),R.tax?'−'+fm2(R.tax):fm2(0))}${rowKV(t(k.paid==='counter'||k.st==='winPending'?'预计实付（支票）':'实付（入奖金余额）',k.paid==='counter'||k.st==='winPending'?'Net payout (cheque)':'Net (to prize balance)'),`<span class="grad b">${fm2(R.net)}</span>`)}</div>`}
 else if(!R&&(k.st==='winPending'||k.st==='claimed')&&k.prize){const tax=taxOf(k.prize);prize=`<h3 style="margin-top:20px">${t('中奖信息','Prize')}</h3><div class="card mt" style="padding:6px 16px">${rowKV(t('中奖等级','Prize tier'),k.tier||'—')}${rowKV(t('税前奖金','Gross prize'),fm2(k.prize))}${rowKV(t('预扣税 20%','Withholding 20%'),tax?'−'+fm2(tax):fm2(0))}${rowKV(t('实付','Net'),`<span class="grad b">${fm2(k.prize-tax)}</span>`)}</div>`}
 const claim=expiredTk(k)?`<div class="card c2 mt" style="border:1px solid rgba(244,63,94,.4);background:rgba(244,63,94,.07)"><div class="row g8"><span class="badge b-ro">${t('已逾期','Expired')}</span><span class="xs mu">${t('兑奖截止日 ','Claim deadline ')}${claimExp(k.draw)}</span></div><div class="glowtxt b" style="font-size:22px;letter-spacing:1px;font-family:ui-monospace,monospace;margin-top:8px;text-decoration:line-through;opacity:.4">${k.code}</div><div class="xs mu" style="margin-top:8px;line-height:1.6">${t('已过兑奖截止日，申领码不再有效，奖金按逾期作废处理。','The claim deadline has passed. The claim code is no longer valid and the prize is treated as forfeited.')}</div></div>`:k.st==='winPending'?`<div class="card c2 mt" style="border:1px solid rgba(245,158,11,.35);background:linear-gradient(135deg,rgba(245,158,11,.12),#1d1d1d)"><div class="row sp"><div><div class="xs mu">${t('申领码','Claim code')}</div><div class="glowtxt b" style="font-size:25px;letter-spacing:1px;font-family:ui-monospace,monospace;margin-top:2px">${k.code}</div><div class="xs mu" style="margin-top:4px">${t('有效期至 ','Valid until ')}${claimExp(k.draw)}${t('（兑奖截止日）',' (claim deadline)')}</div></div>${qrHTML(k.code)}</div><div class="xs mu" style="margin-top:10px;line-height:1.6">${t('奖金超过 ₱300,000：本人携带有效证件和申领码到 PCSO 兑奖，以支票线下支付，不进入钱包。','Prize above ₱300,000: claim in person at PCSO with valid ID and this code. Paid by cheque, not to your wallet.')}</div>${regenBox(k)}</div>`:'';
 return `<div class="fade"><div class="card" style="padding:0;overflow:hidden"><div style="height:70px">${cover(g)}</div><div style="padding:14px 16px"><div class="row sp"><div class="b" style="font-size:17px">${gname(g)}</div>${badge(bc,bt)}</div><div class="xs mu" style="margin-top:4px;font-family:ui-monospace,monospace">${k.id}</div></div></div>
 ${claim}
 <h3 style="margin-top:20px">${t('投注信息','Bet details')}</h3><div class="card mt" style="padding:6px 16px">${rowKV(t('游戏','Game'),gname(g))}${rowKV(t('期号 / 开奖日','Draw'),k.draw+' · '+drawTime)}${rowKV(t('玩法','Play type'),playTxt(k))}${rowKV(t('注数','Lines'),L.length)}${rowKV(t('倍数','Multiplier'),'×'+k.mult)}${rowKV(t('单期投注金额','Bet amount'),fm0(k.amt)+`<div class="xs mu" style="font-weight:400">${L.length} × ${fm0(g.p)}${k.mult>1?' × '+k.mult:''}</div>`)}${rowKV(t('下单时间','Placed at'),fts(k.ms))}</div>
 <h3 style="margin-top:20px">${k.sel?t('选号','Selected numbers'):t('投注号码','Your numbers')}</h3><div class="card mt"><div class="row" style="gap:6px;flex-wrap:wrap">${balls(k.sel||L[0],'',hitSet)}</div>${k.sel?`<div class="xs mu" style="margin-top:8px">${t(`展开成 ${L.length} 注`,`Expands to ${L.length} lines`)}</div>`:''}</div>
 ${L.length>1||k.sel?`<h3 style="margin-top:20px">${t('展开的注','Lines')} <span class="xs mu" style="font-weight:500">${L.length}</span></h3><div class="card mt" style="padding:6px 16px;max-height:${open?'420px':'none'};overflow:auto">${lineRows}${L.length>12&&!open?`<button class="btn d s mt" style="width:100%" onclick="S.p.all=true;renderKeep()">${t('显示全部 '+L.length+' 注','Show all '+L.length+' lines')}</button>`:''}</div>`:''}
 ${win?`<h3 style="margin-top:20px">${t('开奖结果','Draw result')}</h3><div class="card mt"><div class="row" style="gap:6px;flex-wrap:wrap">${balls(win,'win')}</div></div>`:`<div class="xs mu mt3" style="text-align:center;margin-top:16px">${t('尚未开奖','Not drawn yet')} · ${t('封盘时间 ','Cut-off ')}${fts(cutoffMs(g)).slice(5)}</div>`}
 ${prize}
 ${k.st==='claimed'?`<div class="card mt" style="padding:6px 16px">${rowKV(t('兑付方式','Paid by'),k.paid==='auto'?t('自动入账钱包（奖金余额）','Auto-credited to wallet (prize balance)'):t('PCSO 支票线下支付，不进钱包','PCSO cheque, offline. Not credited to wallet'))}</div>`:''}
 ${k.st==='void'?`<div class="card mt" style="padding:12px 16px;color:var(--ro)" ><div class="sm">${t('该期不开奖或游戏下架，已作废，投注金额已按原扣款构成退回钱包。','This draw was cancelled or the game was delisted. The bet was voided and refunded to your wallet the way it was paid.')}</div></div>`:''}
 <div class="xs mu" style="text-align:center;margin-top:18px;line-height:1.6">${t('普通彩票保存 30 天，中奖彩票自开奖日起保存 1 年零 1 天','Regular tickets kept 30 days; winning tickets 1 year + 1 day from the draw date')}</div></div>`}};
const REGEN_MAX=3;
const regenOK=k=>fdt(S.clock)<=claimExp(k.draw);
const archived=k=>(k.st==='winPending'&&Date.parse(claimExp(k.draw)+'T00:00:00+08:00')+30*864e5<S.clock)||(k.st==='void'&&S.clock-(k.ms||0)>30*864e5);
const expiredTk=k=>k.st==='winPending'&&!regenOK(k);
A.regen=id=>{const k=S.tickets.find(x=>x.id===id);if(!regenOK(k))return toast(t('已过兑奖截止日，不能重新生成','Claim deadline passed — cannot regenerate'));if((k.regen||0)>=REGEN_MAX)return toast(t('已重新生成 3 次，达到上限','Regenerated 3 times — limit reached'));k.regen=(k.regen||0)+1;k.code=claimCode();toast(t('已重新生成，旧申领码立即作废','New code generated — the old one is void'));renderKeep()};
const regenBox=k=>regenOK(k)?`<button class="btn o s mt" style="width:100%" onclick="event.stopPropagation();A.regen('${k.id}')">${t('申领码遗失或疑似泄露？重新生成','Lost or leaked? Regenerate the code')} · ${REGEN_MAX-(k.regen||0)} ${t('次机会','left')}</button><div class="xs mu" style="margin-top:6px;line-height:1.5">${t('新码有效期仍到原兑奖截止日，旧码立即作废。','The new code keeps the same claim deadline. The old code is void at once.')}</div>`:`<div class="xs" style="margin-top:10px;color:var(--ro)">${t('已过兑奖截止日，奖金按逾期作废处理。','The claim deadline has passed. The prize is forfeited.')}</div>`;

/* ================= WALLET / FUNDS ================= */
const TXI={deposit:['down','#34d399',t=>t('充值','Deposit')],withdraw:['up','#fb7184',t=>t('提现','Withdraw')],bet:['ticket','#22d3ee',t=>t('下单','Bet')],prize:['trophy','#f59e0b',t=>t('兑奖','Prize')],refund:['down','#a78bfa',t=>t('退款','Refund')]};
const TXS=(ty,s)=>({deposit:{ok:['b-gr',t('成功','Success')],proc:['b-am',t('处理中','Processing')],fail:['b-ro',t('失败','Failed')]},withdraw:{ok:['b-gr',t('已到账','Paid out')],proc:['b-am',t('处理中','Processing')],rej:['b-ro',t('已拒绝','Rejected')]},bet:{ok:['b-gr',t('登记成功','Registered')],ref:['b-gy',t('已退款','Refunded')]},prize:{auto:['b-gr',t('自动入账','Auto-credited')],cnt:['b-cy',t('已兑付','Paid')]},refund:{ok:['b-gr',t('已退款','Refunded')]}}[ty][s]);
function txRow(x){const [ic,col,nm]=TXI[x.type];const [bc,bt]=TXS(x.type,x.st);const pos=x.amt>0;return `<div><span class="ico" style="background:${col}22;border-radius:12px;color:${col}">${I(ic,18)}</span><div class="fl1"><div class="b" style="font-size:14px">${nm(t)}<span class="mu" style="font-weight:500"> · ${x.note}</span></div><div class="xs mu">${fts(x.ms)} · ${x.id}</div>${x.type==='refund'?`<div class="xs mu" style="margin-top:3px;line-height:1.5">${t('原票号 ','Ticket ')}${x.tk} · ${x.reason}<br>${t('退回投注余额 ','To bet balance ')}${fm2(x.sb)} · ${t('奖金余额 ','prize balance ')}${fm2(x.sp)}</div>`:''}</div><div style="text-align:right"><div class="b" style="color:${pos?'var(--gr)':'#fff'};font-variant-numeric:tabular-nums">${pos?'+':'−'}${fm0(Math.abs(x.amt))}</div>${badge(bc,bt)}</div></div>`}
const txTabs=()=>`<div class="chips">${['deposit','withdraw','bet','prize','refund'].map(k=>`<button class="chip ${S.txTab===k?'on':''}" onclick="S.txTab='${k}';renderKeep()">${TXI[k][2](t)}</button>`).join('')}</div>`;
const ACN={gcash:['GCash','#2563eb'],maya:['Maya','#10b981'],bank:['Bank','#f59e0b']};
const acctCard=(a,i)=>`<div class="row sp card c2" style="padding:13px 14px;margin-top:8px"><div class="row g12"><span style="width:40px;height:40px;border-radius:12px;background:${ACN[a.k][1]}33;display:grid;place-items:center;color:${ACN[a.k][1]}">${I(a.k==='bank'?'bank':'card',20)}</span><div><div class="b" style="font-size:14px">${a.bank||ACN[a.k][0]} · ••••${a.no.slice(-4)}</div><div class="xs mu">${a.nm}</div></div></div><div class="row g8"><button onclick="A.unbind(${i})" style="color:#777">${I('trash',16)}</button></div></div>`;
SC.wallet={title:()=>t('钱包','Wallet'),html:()=>{const rec=S.tx.filter(x=>x.type===S.txTab).slice(0,5);return `<div class="fade"><div class="card" style="background:linear-gradient(135deg,#1c2b3a,#151515 60%);padding:22px"><div class="row sp"><span class="mu sm">${t('总余额','Total balance')}</span><button class="eyeic" onclick="A.eye()">${I(S.show?'eye':'eyeoff',18)}</button></div><div class="big balv" data-k="total" style="font-size:40px;margin-top:6px">${balTxt('total')}</div>
 <div class="row g12" style="margin-top:18px"><div class="card c2 fl1" style="padding:12px"><div class="xs mu">${t('投注余额','Bet balance')}</div><div class="b balv" data-k="bet" style="margin-top:4px">${balTxt('bet')}</div></div><div class="card c2 fl1" style="padding:12px"><div class="xs mu">${t('奖金余额','Prize balance')} ${badge('b-gr',t('可提现','Withdrawable'))}</div><div class="b balv" data-k="prize" style="margin-top:4px">${balTxt('prize')}</div></div></div>
 <div class="row g12 mt2"><button class="btn c" onclick="A.go('deposit')">${I('down',18)} ${t('充值','Deposit')}</button><button class="btn d" onclick="A.go('withdraw')">${I('up',18)} ${t('提现','Withdraw')}</button></div></div>
 <div class="xs mu" style="margin-top:10px;line-height:1.6">${t('扣款顺序：先扣投注余额，不足部分从奖金余额扣；只有奖金余额可以提现。','Deduction order: bet balance first, then prize balance. Only the prize balance can be withdrawn.')}</div>
 <div class="row sp" style="margin-top:22px"><h3>${t('绑定支付账户','Payment accounts')}</h3><button class="sm b" style="color:var(--cy)" onclick="A.go('bind')">${t('管理','Manage')} ›</button></div>
 ${S.accts.length?S.accts.map(acctCard).join(''):`<div class="card c2 mt" style="text-align:center;padding:22px"><div class="mu sm">${t('还没有绑定支付账户','No payment account yet')}</div><button class="btn c s mt" onclick="A.go('bind')">${t('去绑定','Bind now')}</button></div>`}
 ${S.accts.length?`<button class="card mt row g8" style="width:100%;border:1.5px dashed #333;background:transparent;justify-content:center;padding:14px;color:#aaa" onclick="A.go('bind')">${I('plus',16)} ${t('绑定新账户','Bind new account')}</button>`:''}
 <div class="row sp" style="margin-top:22px"><h3>${t('交易记录','Transactions')}</h3><button class="sm b" style="color:var(--cy)" onclick="A.go('tx')">${t('查看全部','View all')} ›</button></div><div style="margin-top:10px">${txTabs()}</div>
 <div class="card mt" style="padding:4px 14px"><div class="list">${rec.length?rec.map(txRow).join(''):`<div class="mu sm" style="justify-content:center;padding:26px">${t('暂无记录','No records')}</div>`}</div></div></div>`}};

A.unbind=i=>modal(()=>`<h3>${t('解绑支付账户？','Unbind this account?')}</h3><div class="mu sm mt3">${S.accts[i].bank||ACN[S.accts[i].k][0]} ••••${S.accts[i].no.slice(-4)}</div><div class="row g8 mt2"><button class="btn d" onclick="A.close()">${t('取消','Cancel')}</button><button class="btn r" onclick="S.accts.splice(${i},1);A.close();renderKeep()">${t('解绑','Unbind')}</button></div>`,true);

A.bindGo=k=>{const no=V('b_no').trim(),nm=V('b_nm').trim();const dg=no.replace(/\D/g,'');if(!fCheck([['b_no',!no?(k==='bank'?'Enter your account number':'Enter your mobile number'):no.replace(/\D/g,'').length<10?'Enter a valid number (at least 10 digits)':''],['b_nm',nm?'':'Enter the account holder name']]))return;
 if(S.accts.some(x=>x.k===k&&x.no.replace(/\D/g,'')===dg)){fErr('b_no','You have already linked this account.');return}
 if(BOUND_OTHER.includes(dg)){fErr('b_no','This account is already linked to another player. Please use a different one.');return}
 const b=$('#bb');b.disabled=true;b.innerHTML=`<span class="spin" style="width:20px;height:20px;border-width:3px;margin:0"></span> ${t('绑定中…','Binding…')}`;
 setTimeout(()=>{
  S.accts.push({k,no,nm:nm.toUpperCase(),ok:true,bank:k==='bank'?V('b_bank'):''});S.j.bind=1;tick(2);toast(t('绑定成功','Account bound'));renderKeep()},1500)};

SC.deposit={title:()=>t('充值','Deposit'),html:()=>{const P=S.p;const am=P.amt||'';const sel=P.acc==null?0:P.acc;
 const used=S.tx.filter(x=>x.type==='deposit'&&x.st!=='fail'&&fdt(x.ms)===fdt(S.clock)).reduce((a,x)=>a+x.amt,0);
 return `<div class="card"><div class="mu sm">${t('充值金额','Amount')}</div><div class="row" style="margin-top:6px;align-items:baseline"><span class="b" style="font-size:34px">₱</span><input id="d_amt" type="number" inputmode="decimal" step="0.01" value="${am}" placeholder="0" oninput="S.p.amt=AMT2(this)" style="background:none;border:0;outline:0;font-size:44px;font-weight:800;width:100%;font-variant-numeric:tabular-nums"></div><div class="chips mt">${[100,500,1000,2000,5000].map(v=>`<button class="chip ${+am===v?'on':''}" onclick="S.p.amt=${v};renderKeep()">${fm0(v)}</button>`).join('')}</div></div>
 <h3 style="margin-top:22px">${t('支付渠道','Payment channel')}</h3><div class="mt3">${Object.keys(ACN).map(x=>{const on=(S.p.ch||'gcash')===x;return `<button class="card c2 mt3 row sp" style="width:100%;border:1.5px solid ${on?'var(--cy)':'transparent'}" onclick="S.p.ch='${x}';renderKeep()"><div class="row g12"><span style="width:38px;height:38px;border-radius:12px;background:${ACN[x][1]}33;display:grid;place-items:center;color:${ACN[x][1]}">${I(x==='bank'?'bank':'card',19)}</span><div style="text-align:left"><div class="b" style="font-size:14px">${x==='bank'?'Bank card':ACN[x][0]}</div><div class="xs mu">${x==='gcash'?'Redirect to GCash to pay':x==='maya'?'Scan a QR code in Maya':'Pay with a reference code'}</div></div></div>${on?I('check',20,'#22d3ee'):''}</button>`}).join('')}</div>
 <div class="card c2 mt" style="font-size:12.5px;color:#aaa;line-height:1.7">${I('shield',13)} ${t(`受 PlaySafe 限额约束：每日充值限额 ${fm0(S.limits.dep.d)}，今日已充 ${fm0(used)}。`,`Subject to PlaySafe limits: daily deposit limit ${fm0(S.limits.dep.d)}, deposited today ${fm0(used)}.`)}</div>
 <button class="btn c mt2" onclick="A.depGo()">${t('确认充值','Confirm deposit')}</button>`}};
A.depGo=()=>{const am=tr2(+(S.p.amt||0)),ch=S.p.ch||'gcash';if(!fCheck([['d_amt',!am?'Enter an amount':am<100?'Minimum deposit is ₱100':'']]))return;
 if(S.excl)return toast(t('自我排除期内无法充值','Deposits are disabled during self-exclusion'));if(S.cool&&S.cool.until>S.clock)return toast(t('冷静期内无法充值','Deposits are disabled during cool-off'));
 const used=S.tx.filter(x=>x.type==='deposit'&&x.st!=='fail'&&fdt(x.ms)===fdt(S.clock)).reduce((p,x)=>p+x.amt,0);if(used+am>S.limits.dep.d)return modal(()=>`<div style="text-align:center"><div style="width:90px;height:90px;margin:0 auto">${illo('shield')}</div><h3 style="margin-top:10px">${t('超出每日充值限额','Daily deposit limit exceeded')}</h3><div class="mu sm mt3">${t(`限额 ${fm0(S.limits.dep.d)}，今日已充 ${fm0(used)}`,`Limit ${fm0(S.limits.dep.d)} · deposited ${fm0(used)}`)}</div><button class="btn mt2" onclick="A.close();A.go('playsafe')">PlaySafe</button></div>`,true);
 modal(()=>`<div style="text-align:center;padding:10px 0"><div class="spin"></div><h3 style="margin-top:18px">${t('正在向支付渠道发起扣款…','Contacting your payment provider…')}</h3><div class="skel mt2" style="height:14px"></div></div>`,true,true);
 setTimeout(()=>{tick(2);S.bal.bet+=am;addTx('deposit',am,'ok',ACN[ch][0]);S.j.dep=1;addNotif('wallet','充值到账','Deposit received',`${ACN[ch][0]} 充值 ${fm0(am)} 已到账。`,`${ACN[ch][0]} deposit ${fm0(am)} credited.`);
  modal(()=>`<div style="text-align:center"><div style="width:100px;height:100px;margin:0 auto" class="float">${illo('coin')}</div><h3>${t('充值成功','Deposit successful')}</h3><div class="big grad" style="font-size:34px;margin:8px 0">${fm0(am)}</div><div class="mu sm">${t('已计入投注余额','Credited to bet balance')}</div><div class="row g8 mt2"><button class="btn d" onclick="A.close();S.p={};A.back()">${t('完成','Done')}</button><button class="btn c" onclick="A.close();S.p={};A.tab('play')">${t('去投注','Play now')}</button></div></div>`,true,true);renderKeep()},1700)};

SC.withdraw={title:()=>t('提现','Withdraw'),html:()=>{const W=S.wd,left=W.lock-Date.now();
 if(left>0){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);return `<div class="card" style="text-align:center;padding:32px 20px"><div style="width:110px;height:110px;margin:0 auto;opacity:.9">${illo('shield')}</div>${badge('b-ro','🔒 '+t('提现已锁定','Withdrawals locked'))}<div class="big" id="lk" style="font-size:46px;margin:14px 0 6px">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div><div class="mu sm" style="line-height:1.6">${t('连续 3 次 MFA 验证失败，提现功能已自动锁定 30 分钟，到点自动解锁。','Three failed MFA attempts locked withdrawals for 30 minutes. They unlock automatically.')}</div></div>`}
 const st=W.step;const bar=`<div class="steps">${[1,2,3,4].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>`;
 if(st===1){if(!S.accts.length)return `${bar}<div class="card mt" style="text-align:center;padding:30px 20px"><div class="mu sm">${t('需先绑定提现目的地','Bind a destination first')}</div><button class="btn c mt2" onclick="A.go('bind')">${t('去绑定','Bind now')}</button></div>`;
  return `${bar}<div class="card mt"><div class="row sp"><span class="mu sm">${t('可提现（奖金余额）','Withdrawable (prize balance)')}</span><b>${fm2(S.bal.prize)}</b></div><div class="row" style="margin-top:12px;align-items:baseline"><span class="b" style="font-size:30px">₱</span><input id="w_amt" type="number" inputmode="decimal" step="0.01" oninput="AMT2(this)" value="${W.amt||''}" placeholder="0" style="background:none;border:0;outline:0;font-size:40px;font-weight:800;width:100%"></div><button class="sm b" style="color:var(--cy)" onclick="document.getElementById('w_amt').value=${Math.floor(S.bal.prize)}">${t('全部提现','Withdraw all')}</button></div><h3 style="margin-top:20px">${t('到账账户','Destination')}</h3>${S.accts.map((a,i)=>`<button class="card c2 mt3 row sp" style="width:100%;border:1.5px solid ${(W.dest==null?0:W.dest)===i?'var(--cy)':'transparent'}" onclick="S.wd.dest=${i};S.wd.amt=document.getElementById('w_amt').value;renderKeep()"><div class="row g12">${I(a.k==='bank'?'bank':'card',20)}<div style="text-align:left"><div class="b" style="font-size:14px">${a.bank||ACN[a.k][0]} ••••${a.no.slice(-4)}</div><div class="xs mu">${a.nm}</div></div></div>${(W.dest==null?0:W.dest)===i?I('check',19,'#22d3ee'):''}</button>`).join('')}<div class="card c2 mt" style="font-size:12.5px;color:#aaa;line-height:1.6">${I('lock',13)} ${t('每笔提现都需短信 MFA 验证，不受“记住设备”豁免。','Every withdrawal requires SMS MFA — no “remember device” exemption.')}</div><button class="btn c mt2" onclick="A.wd1()">${t('下一步','Next')}</button>`}
 if(st===2)return `${bar}<h3 style="margin-top:20px">${t('短信 MFA 验证','SMS MFA verification')}</h3><div class="mu sm mt3">${t(`提现 ${fm0(W.amt)} 需要验证码`,`Enter the code to withdraw ${fm0(W.amt)}`)}${W.fail?` · <span style="color:var(--ro)">${t(`已失败 ${W.fail}/3 次`,`${W.fail}/3 failed`)}</span>`:''}</div><div style="margin-top:26px">${otp('w_code')}</div><button class="btn c mt2" onclick="A.wd2()">${t('验证','Verify')}</button>`;
 if(st===3){const a=S.accts[W.dest||0];return `${bar}<h3 style="margin-top:20px">${t('确认提现','Confirm withdrawal')}</h3><div class="card mt"><div class="list">${[[t('提现金额','Amount'),fm0(W.amt)],[t('到账账户',"To"),`${a.bank||ACN[a.k][0]} ••••${a.no.slice(-4)}`],[t('预计到账','ETA'),t('5 分钟内','Within 5 minutes')],[t('手续费','Fee'),'₱0']].map(r=>`<div class="sp"><span class="mu sm">${r[0]}</span><b class="sm">${r[1]}</b></div>`).join('')}</div></div><button class="btn c mt2" onclick="A.wd3()">${t('确认提现','Confirm')}</button>`}
 return `${bar}<div class="card mt" style="text-align:center;padding:30px 20px"><div style="width:110px;height:110px;margin:0 auto" class="float">${illo('coin')}</div><h3>${t('提现申请已提交','Withdrawal submitted')}</h3><div class="big grad" style="font-size:34px;margin:8px 0">${fm0(W.amt)}</div><div class="mu sm">${t('处理中，预计 5 分钟内到账','Processing — expected within 5 minutes')}</div></div><button class="btn d mt2" onclick="S.wd.step=1;S.wd.amt=0;A.back()">${t('完成','Done')}</button>`},
 mount:()=>{if(S.wd.step===2)A.otp('w_code');if(S.wd.lock-Date.now()>0)T(()=>{const l=S.wd.lock-Date.now();if(l<=0){renderKeep();return}const e=$('#lk');if(e)e.textContent=String(Math.floor(l/60000)).padStart(2,'0')+':'+String(Math.floor(l%60000/1000)).padStart(2,'0')},1000,true)}};
A.wd1=()=>{const am=tr2(+V('w_amt'));if(!fCheck([['w_amt',!am?'Enter an amount':am<100?'Minimum withdrawal is ₱100':am>S.bal.prize?'Exceeds your prize balance. Only prize balance can be withdrawn.':'']]))return;S.wd.amt=am;if(S.wd.dest==null)S.wd.dest=0;S.wd.step=2;render()};
A.wd2=()=>{if(!fCheck([['w_code',V('w_code').length<4?'Enter the 4-digit code':'']]))return;if(V('w_code')==='1234'){S.wd.fail=0;S.wd.step=3;return render()}
 S.wd.fail++;tick(1);addTx('withdraw',-S.wd.amt,'rej',(S.accts[S.wd.dest||0].bank||ACN[S.accts[S.wd.dest||0].k][0])+' · MFA');
 if(S.wd.fail>=3){S.wd.lock=Date.now()+30*60000;S.wd.fail=0;S.wd.step=1;addNotif('lock','提现已锁定','Withdrawals locked','连续 3 次 MFA 验证失败，提现锁定 30 分钟。','3 failed MFA attempts — withdrawals locked for 30 minutes.');toast(t('连续失败 3 次，提现锁定 30 分钟','3 failures — withdrawals locked for 30 minutes'));return render()}
 const w=$('#w_codew');w&&w.classList.add('shake');toast(t(`验证码错误，还可尝试 ${3-S.wd.fail} 次`,`Wrong code — ${3-S.wd.fail} attempt(s) left`));setTimeout(()=>{S.wd.step=2;render()},400)};
A.wd3=()=>{const am=S.wd.amt;tick(3);S.bal.prize-=am;const a=S.accts[S.wd.dest||0];addTx('withdraw',-am,'proc',a.bank||ACN[a.k][0]);const id=S.tx[0].id;S.j.wd=1;S.wd.step=4;render();
 setTimeout(()=>{const x=S.tx.find(q=>q.id===id);if(x){x.st='ok';addNotif('up','提现已到账','Withdrawal paid',`${fm0(am)} 已到账 ${a.bank||ACN[a.k][0]}。`,`${fm0(am)} sent to ${a.bank||ACN[a.k][0]}.`);if(S.screen==='wallet'||S.screen==='tx')renderKeep()}},4500)};

SC.playsafe={title:'PlaySafe',html:()=>{const ex=S.excl,cl=S.cool;
 const lim=(k,ti)=>`<div class="card mt"><div class="b">${ti}</div><div class="list">${['d','w','m'].map(p=>{const pe=S.pend.find(x=>x.k===k&&x.p===p);return `<div><span class="fl1">${t(LN[p][0],LN[p][1])}${pe?` ${badge('b-am',t('调高待生效 24h','Raise pending 24h'))}`:''}</span><b class="grad">${fm0(S.limits[k][p])}</b><button class="btn d s" style="height:32px;padding:0 14px" onclick="A.limEdit('${k}','${p}')">${t('调整','Edit')}</button></div>`}).join('')}</div></div>`;

 ${ex?`<div class="card mt" style="border:1px solid ${exState()==='active'||exState()==='perm'?'rgba(251,113,132,.4)':'rgba(245,158,11,.4)'}"><div class="row sp"><b>${t('自我排除','Self-exclusion')}</b>${exState()==='pending'?badge('b-am',t('解除申请审批中','Request under review')):exState()==='ended'?badge('b-am',ex.rej?t('申请被驳回','Request declined'):t('可申请解除','You can apply')):badge('b-ro',ex.label)}</div><div class="mu sm mt3" style="line-height:1.6">${exState()==='perm'?t('永久排除，不能自行解除，请联系 PCSO。','Permanent exclusion cannot be lifted here. Please contact PCSO.'):exState()==='active'?t(`排除期至 ${fts(exEnd())}。期间为受限登录：不能投注、充值，可查看余额、提取奖金、使用帮助。营销通知已停止，交易/法定通知照常。`,`Until ${fts(exEnd())} you are in restricted mode: no betting or deposits; you can view balances, withdraw prize funds and use help. Marketing is paused; transactional and legal notices continue.`):exState()==='pending'?t('已提交，等待 PCSO 审批。审批通过前仍为受限登录。','Submitted. Waiting for PCSO approval. You stay in restricted mode until then.'):t('到期不会自动恢复：需重新身份核验、确认了解风险并等待 PCSO 审批通过。','Not lifted automatically: re-verify identity, acknowledge the risk and wait for PCSO approval.')}${ex.rej&&exState()==='ended'?`<div class="xs mt3" style="color:var(--ro)">${t('驳回原因：','Reason: ')}${ex.rej}</div>`:''}</div>${exState()==='ended'?`<button class="btn c s mt" style="width:100%" onclick="A.restore()">${t(ex.rej?'重新申请解除':'申请解除排除',ex.rej?'Apply again':'Apply to lift exclusion')}</button>`:''}</div>`:''}
 ${cl&&cl.until>S.clock?`<div class="card mt" style="border:1px solid rgba(34,211,238,.4)"><div class="row sp"><b>${t('冷静期中','Cool-off active')}</b>${badge('b-cy',t('至','until')+' '+fts(cl.until))}</div><div class="mu sm mt3">${t('期间禁止投注与充值，到期自动解除，无需审批。','Betting and deposits are disabled; it ends automatically — no approval needed.')}</div></div>`:''}
 <h3 style="margin-top:22px">${t('充值限额','Deposit limits')}</h3>${lim('dep',t('每日 / 每周 / 每月','Daily / weekly / monthly'))}<h3 style="margin-top:22px">${t('投注限额','Bet limits')}</h3>${lim('bet',t('每日 / 每周 / 每月','Daily / weekly / monthly'))}
 <div class="card mt row sp"><div><div class="b">${t('单笔投注上限','Single bet cap')}</div><div class="xs mu">${t('调低即时生效；调高或撤销需等待 24 小时。','Lowering is immediate; raising or removing waits 24 hours.')}</div></div><b class="grad">${fm0(S.limits.single)}</b></div>
 <div class="card mt row sp"><div><div class="b">${t('理性娱乐提醒','Reality check')}</div><div class="xs mu">${t('每 10 分钟弹窗提醒（后台参数，玩家不可调）','Every 10 minutes (back-office parameter, not adjustable)')}</div></div>${badge('b-gy','10 min')}</div>
 <h3 style="margin-top:22px">${t('冷静期','Cool-off')}</h3><div class="card mt"><div class="mu sm" style="line-height:1.6">${t('选定后期间禁止投注与充值，到期自动解除，无需审批。','Betting and deposits are disabled for the chosen period; it ends by itself.')}</div><div class="chips mt">${[['24 小时','24 hours',24],['7 天','7 days',168],['30 天','30 days',720]].map(c=>`<button class="chip" onclick="A.cool(${c[2]},'${t(c[0],c[1])}')">${t(c[0],c[1])}</button>`).join('')}</div></div>
 <h3 style="margin-top:22px">${t('自我排除','Self-exclusion')}</h3><div class="card mt"><div class="mu sm" style="line-height:1.6">${t('排除期内为受限登录（不能投注、充值）。到期后在这里申请解除；永久排除没有恢复入口。','Restricted mode during exclusion (no betting or deposits). After it ends, apply to lift it here. Permanent exclusion has no way back.')}</div><div class="chips mt">${[['3 个月','3 months',0],['6 个月','6 months',0],['1 年','1 year',0],['永久','Permanent',1]].map(c=>`<button class="chip" style="${c[2]?'background:rgba(251,113,132,.18);color:var(--ro)':''}" onclick="A.excl('${t(c[0],c[1])}',${c[2]})">${t(c[0],c[1])}</button>`).join('')}</div></div>
 <button class="card mt row sp" style="width:100%" onclick="A.go('pgh')"><div class="row g12"><span style="color:var(--am)">${I('help',22)}</span><div style="text-align:left"><div class="b">${t('问题赌博帮助','Problem gambling help')}</div><div class="xs mu">${t('风险自测 · 求助热线','Self-test · support hotline')}</div></div></div>${I('chev',18)}</button>
 <div class="xs mu mt" style="text-align:center">${t('以上数值为后台参数，以 PCSO 规定为准。','Values are back-office parameters, subject to PCSO rules.')}</div></div>`}};
A.limEdit=(k,p)=>{const cur=S.limits[k][p];modal(()=>`<h3>${t(LN[p][0],LN[p][1])} ${k==='dep'?t('充值','deposit'):t('投注','bet')} ${t('限额','limit')}</h3><div class="mu sm mt3">${t('调低即时生效；调高需 24 小时等待期。','Lowering applies now; raising applies after a 24-hour wait.')}</div><div class="chips mt" style="flex-wrap:wrap;overflow:visible">${LIMV.filter(v=>p==='d'?v<=20000:true).map(v=>`<button class="chip ${v===cur?'on':''}" onclick="A.limSet('${k}','${p}',${v})">${fm0(v)}</button>`).join('')}</div>`)};
const nfCool=()=>addNotif('clock','冷静期开始','Cool-off started','您的冷静期已开始，将于 '+fts(S.cool.until)+' 结束。','Your cool-off has started and ends '+fts(S.cool.until)+'.');
const nfExcl=()=>addNotif('shield','自我排除已生效','Self-exclusion started',S.excl.perm?'您的自我排除已开始，为永久排除。':'您的自我排除已开始，将于 '+fts(exEnd())+' 结束。',S.excl.perm?'Your self-exclusion has started and is permanent.':'Your self-exclusion has started and ends '+fts(exEnd())+'.');
const limName=(k,p)=>LN[p][1].toLowerCase()+' '+(k==='dep'?'deposit':'bet');
const cancelRaise=(k,p)=>{const i=S.pend.findIndex(x=>x.k===k&&x.p===p);if(i<0)return;S.pend.splice(i,1);addNotif('shield','调高申请已取消','Raise request cancelled',`您调高${limName(k,p)}限额的申请已取消。`,`Your request to raise the ${limName(k,p)} limit was cancelled.`)};
A.limSet=(k,p,v)=>{const cur=S.limits[k][p];A.close();cancelRaise(k,p);if(v<=cur){S.limits[k][p]=v;addNotif('shield','限额已调整','Limit updated',`限额已调低为 ${fm0(v)}，即时生效。`,`Your limit is now ${fm0(v)}. Effective immediately.`);toast(t('已调低，即时生效','Lowered — effective now'))}else{S.pend.push({k,p,v});addNotif('clock','限额调高待生效','Limit raise pending',`调高到 ${fm0(v)} 将在 24 小时后生效。`,`Raising to ${fm0(v)} takes effect after 24 hours.`);toast(t('调高将在 24 小时后生效','Raise takes effect in 24 hours'))}renderKeep()};
A.cool=(h,l)=>modal(()=>`<h3>${t('开始冷静期？','Start cool-off?')}</h3><div class="mu sm mt3" style="line-height:1.6">${t(`${l}内将无法投注与充值，期间不可提前结束。`,`You cannot bet or deposit for ${l}; it cannot be ended early.`)}</div><div class="row g8 mt2"><button class="btn d" onclick="A.close()">${t('取消','Cancel')}</button><button class="btn c" onclick="S.cool={until:S.clock+${h}*3600e3};A.close();nfCool();toast(t('冷静期已开始','Cool-off started'));renderKeep()">${t('确认','Confirm')}</button></div>`,true);
const EXD={'3 个月':90,'3 months':90,'6 个月':182,'6 months':182,'1 年':365,'1 year':365};
A.excl=(l,perm)=>modal(()=>`<h3 style="color:var(--ro)">${t('确认自我排除？','Confirm self-exclusion?')}</h3><div class="mu sm mt3" style="line-height:1.7">${t(`周期：${l}。排除期内为受限登录：不能投注、充值，可查看余额、提取奖金、使用帮助。到期不会自动恢复，需在 PlaySafe 提交解除申请，由 PCSO 审批。`,`Period: ${l}. You stay signed in but in restricted mode: no betting or deposits; you can view balances, withdraw prize funds and use help. It does not end by itself: apply to lift it in PlaySafe and wait for PCSO approval.`)}${perm?`<br><b style="color:var(--ro)">${t('永久排除没有恢复入口。','Permanent exclusion cannot be reversed.')}</b>`:''}</div><div class="row g8 mt2"><button class="btn d" onclick="A.close()">${t('取消','Cancel')}</button><button class="btn r" onclick="S.excl={label:'${l}',perm:${perm},expired:false,req:false,rej:'',endTs:0};S.excl.endTs=S.clock+(EXD['${l}']||90)*864e5;A.close();nfExcl();toast(t('自我排除已生效，进入受限模式','Self-exclusion is active — restricted mode'));renderKeep()">${t('确认排除','Exclude me')}</button></div>`,true);

const exEnd=()=>{const e=S.excl;return e&&e.endTs?e.endTs:S.clock};
const exState=()=>{const e=S.excl;if(!e)return '';return e.perm?'perm':!e.expired?'active':e.req?'pending':'ended'};
function exBanner(){const e=S.excl;if(!e)return '';const st=exState();
 const msg={perm:t('永久自我排除：不能投注、充值，可查看余额、提取奖金、使用帮助。','Permanent self-exclusion: no betting or deposits. You can view balances, withdraw prize funds and use help.'),
 active:t(`自我排除中（至 ${fts(exEnd())}）：不能投注、充值，可查看余额、提取奖金、使用帮助。`,`Self-exclusion active (until ${fts(exEnd())}): no betting or deposits. You can view balances, withdraw prize funds and use help.`),
 ended:e.rej?t('解除申请被驳回：'+e.rej,'Request declined: '+e.rej):t('排除期已结束，但不会自动恢复。申请解除后才能继续投注、充值。','The exclusion period has ended but is not lifted automatically. Apply to lift it to bet and deposit again.'),
 pending:t('解除申请审批中：审批通过前仍为受限登录，不能投注、充值。','Request to lift the exclusion is under review. Until it is approved you cannot bet or deposit.')}[st];
 const btn=st==='ended'?`<button class="btn c s" style="height:30px;padding:0 14px;flex:none" onclick="A.restore()">${t(e.rej?'重新申请':'申请解除',e.rej?'Apply again':'Apply to lift')}</button>`:st==='pending'?badge('b-am',t('审批中','In review')):'';
 return `<div class="exban ${st}" onclick="${st==='ended'?'':"A.go('playsafe')"}"><span style="flex:none;color:${st==='pending'||st==='ended'?'var(--am)':'var(--ro)'}">${I('help',18)}</span><div style="flex:1;font-size:12px;line-height:1.45;color:#ddd">${msg}</div>${btn}</div>`}
A.restore=()=>modal(()=>`<h3>${t('申请恢复账号','Request restoration')}</h3><div class="mu sm mt3">${t('① 重新身份核验：输入短信验证码','① Re-verify identity: enter the SMS code')}</div><div style="margin-top:16px">${otp('x_code')}</div><label class="row g8 mt2" style="font-size:13px;color:#bbb;align-items:flex-start"><input type="checkbox" id="x_ag" style="margin-top:3px;accent-color:#22d3ee"> ${t('② 我已了解风险，并愿意在 PlaySafe 工具下继续','② I understand the risks and will continue with PlaySafe tools')}</label><button class="btn c mt2" onclick="if(otpLocked())return;if(V('x_code')!=='1234')return otpWrong();S.otp.fail=0;if(!$('#x_ag').checked)return toast(t('请先勾选确认','Please tick the acknowledgement'));S.excl.req=true;S.excl.rej='';A.close();toast(t('已提交，等待 PCSO 审批','Submitted — awaiting PCSO approval'));render()">${t('提交申请','Submit request')}</button>`,true);
const QS=[['您是否曾下注超出自己真正承担得起损失的金额？','Have you bet more than you could really afford to lose?'],['为了获得同样的刺激感，您是否需要下更大的赌注？','Have you needed to gamble with larger amounts of money to get the same feeling of excitement?'],['输钱之后，您是否隔天再去赌，想把输掉的钱赢回来？','Have you gone back another day to try to win back the money you lost?'],['您是否曾借钱或变卖东西来筹措赌资？','Have you borrowed money or sold anything to get money to gamble?'],['您是否觉得自己可能有赌博问题？','Have you felt that you might have a problem with gambling?'],['赌博是否给您带来健康问题，包括压力或焦虑？','Has gambling caused you any health problems, including stress or anxiety?'],['是否有人批评您的赌博行为，或说您有赌博问题（不论您是否认同）？','Have people criticised your betting or told you that you had a gambling problem?'],['赌博是否给您或家人带来经济困难？','Has your gambling caused any financial problems for you or your household?'],['您是否对自己的赌博方式或赌博带来的后果感到内疚？','Have you felt guilty about the way you gamble or what happens when you gamble?']];
const PGSI=[['从不','Never'],['有时','Sometimes'],['经常','Most of the time'],['几乎总是','Almost always']];

SC.pgh={title:()=>t('问题赌博帮助','Problem gambling help'),html:()=>{const a=S.exTest;const sc=Object.values(a).reduce((x,y)=>x+y,0);const done=Object.keys(a).length===QS.length;const lv=pgsiLv(sc);return `<div class="card"><h3>${t('风险自测（PGSI）','Self-assessment (PGSI)')}</h3><div class="xs mu" style="margin-top:4px;line-height:1.5">${t('回想过去 12 个月。答案只在本机计算，不会保存。','Think about the past 12 months. Answers are scored on this device only and are not saved.')}</div>${QS.map((q,i)=>`<div style="padding:12px 0;border-bottom:1px solid #222"><div style="font-size:13.5px;line-height:1.5">${i+1}. ${t(q[0],q[1])}</div><div class="seg mt3" style="height:34px">${PGSI.map((o,k)=>`<button class="${a[i]===k?'on':''}" style="font-size:11px;padding:0 2px" onclick="S.exTest[${i}]=${k};renderKeep()">${t(o[0],o[1])}</button>`).join('')}</div></div>`).join('')}${done?`<div class="card c2 mt fade" style="border:1px solid var(--${lv[0]})"><div class="b" style="color:var(--${lv[0]})">${lv[1]}</div><div class="mu sm mt3">${t(`总分 ${sc} / 27`,`Score ${sc} / 27`)}</div></div>`:''}</div>
