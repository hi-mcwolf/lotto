<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iLotto · Player App Prototype</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#000;--s1:#0a0a0a;--card:#151515;--card2:#1d1d1d;--line:#262626;--tx:#fff;--mu:#8a8a8a;--cy:#22d3ee;--am:#f59e0b;--ro:#fb7184;--gr:#34d399;--vi:#8b5cf6}
html,body{height:100%;background:#050505;color:var(--tx);font-family:-apple-system,"PingFang SC","Microsoft YaHei",Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#stage{height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;gap:36px;background:radial-gradient(900px 500px at 50% 0%,rgba(34,211,238,.10),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(139,92,246,.10),transparent 60%),#050505}
#phoneWrap{width:414px;height:868px;flex:none;transform-origin:center center}
#phone{width:414px;height:868px;border-radius:62px;background:#000;border:12px solid #1b1b1d;box-shadow:0 0 0 2px #2d2d30,0 50px 120px rgba(0,0,0,.7),0 0 80px rgba(34,211,238,.08);position:relative;overflow:hidden}
#screen{position:absolute;inset:0;background:var(--s1);display:flex;flex-direction:column;overflow:hidden}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#000;z-index:60}
#sb{height:50px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px 34px;font-size:15px;font-weight:600;position:relative;z-index:40}
#sb .ic{display:flex;gap:6px;align-items:center}
.glow{position:absolute;top:0;left:0;right:0;height:360px;background:radial-gradient(ellipse at 15% 0%,rgba(34,211,238,.30),transparent 60%),radial-gradient(ellipse at 95% 5%,rgba(245,158,11,.20),transparent 55%);pointer-events:none;z-index:0}
#view{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;z-index:1}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 110px;scrollbar-width:none;position:relative}
.scroll::-webkit-scrollbar{display:none}
.scroll.nopad{padding-bottom:30px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 8px;flex:none}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:.3px}
.logo .pcso{width:28px;height:28px;border-radius:50%;flex:none;display:block}
.logo i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--cy),#3b82f6 60%,var(--vi));display:grid;place-items:center;font-style:normal;font-size:15px;box-shadow:0 0 18px rgba(34,211,238,.45)}
.capsule{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.09);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:4px 6px}
.capsule .bal{display:flex;align-items:center;gap:5px;padding:5px 8px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.capsule .ib{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;position:relative}
.capsule .plus{background:var(--cy);color:#04151a}
.dot{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:8px;background:#ff4d6a;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 3px;border:2px solid #1a1a1a}
.sub{display:flex;align-items:center;gap:8px;padding:4px 12px 10px;flex:none}
.sub h2{font-size:20px;font-weight:800;flex:1}
.back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.09);display:grid;place-items:center}
.card{background:var(--card);border-radius:24px;padding:16px;position:relative;overflow:hidden}
.card.c2{background:var(--card2)}
.mt{margin-top:14px}.mt2{margin-top:22px}.mt3{margin-top:8px}
.row{display:flex;align-items:center}.sp{justify-content:space-between}.g8{gap:8px}.g12{gap:12px}.fl1{flex:1}
.mu{color:var(--mu)}.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:700}
h1{font-size:26px;font-weight:800;letter-spacing:.2px}h3{font-size:17px;font-weight:800}
.big{font-size:52px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.05}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:16px;width:100%;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.c{background:linear-gradient(135deg,var(--cy),#3b82f6);color:#03141a;box-shadow:0 8px 28px rgba(34,211,238,.35)}
.btn.o{background:transparent;border:1.5px solid #3a3a3a;color:#fff}
.btn.d{background:#262626;color:#fff}
.btn.r{background:linear-gradient(135deg,#fb7184,#e11d48);color:#fff}
.btn.s{height:38px;font-size:14px;width:auto;padding:0 18px}
.btn[disabled]{opacity:.35;pointer-events:none}
.pillbtn{height:34px;padding:0 14px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.inp{width:100%;height:50px;border-radius:16px;background:#1a1a1a;border:1.5px solid #262626;padding:0 16px;font-size:15px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--cy)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 22px) 22px,calc(100% - 16px) 22px;background-size:6px 6px;background-repeat:no-repeat}
label.inp.bad,.inp.bad:focus{border-color:#f43f5e!important;background-color:rgba(244,63,94,.07)}
.wbad{outline:1.5px solid #f43f5e;outline-offset:5px;border-radius:12px}
.ferr{color:#fb7185;font-size:12.5px;margin-top:6px;line-height:1.4;display:flex;gap:5px;align-items:flex-start;animation:ferr .18s ease-out}
.ferr::before{content:"!";flex:none;width:14px;height:14px;border-radius:50%;background:#f43f5e;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;margin-top:1px}
@keyframes ferr{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.lb{display:block;font-size:12px;color:var(--mu);margin:14px 0 6px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.b-gr{background:rgba(52,211,153,.15);color:var(--gr)}.b-am{background:rgba(245,158,11,.15);color:var(--am)}.b-ro{background:rgba(251,113,132,.15);color:var(--ro)}.b-cy{background:rgba(34,211,238,.15);color:var(--cy)}.b-gy{background:#262626;color:#aaa}.b-vi{background:rgba(139,92,246,.18);color:#b9a2ff}
.glowbadge{box-shadow:0 0 12px rgba(245,158,11,.45)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:999px;background:#1c1c1c;color:#bbb;font-weight:600;font-size:13px;display:inline-flex;align-items:center;transition:.2s}
.chip.on{background:#fff;color:#000}
.seg{display:flex;background:#1a1a1a;border-radius:999px;padding:4px}.seg button{flex:1;height:36px;border-radius:999px;font-weight:700;font-size:13px;color:#999;transition:.25s}.seg button.on{background:#fff;color:#000}
.circ{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:#ddd;font-weight:600}
.circ i{width:62px;height:62px;border-radius:50%;background:#1b1b1b;display:grid;place-items:center;border:1px solid #262626;transition:.15s}
.circ:active i{transform:scale(.92);background:#262626}
.tabbar{position:absolute;left:14px;right:14px;bottom:14px;height:64px;border-radius:999px;background:rgba(32,32,36,.78);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.09);box-shadow:0 12px 40px rgba(0,0,0,.6);display:flex;align-items:center;padding:0 6px;z-index:30}
.tabbar button{flex:1;height:52px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:700;color:#9a9a9a;transition:.25s}
.tabbar button.on{background:rgba(255,255,255,.14);color:var(--cy)}
.tabbar button.on svg{filter:drop-shadow(0 0 6px rgba(34,211,238,.7))}
.ball{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#2c2c2c,#171717);border:1px solid #2c2c2c;display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:#cfcfcf;transition:transform .15s,background .2s,box-shadow .2s}
.ball.on{background:radial-gradient(circle at 32% 28%,#7ee8fb,#22d3ee 40%,#2563eb);color:#021018;box-shadow:0 0 0 2px rgba(34,211,238,.35),0 0 18px rgba(34,211,238,.7);transform:scale(1.12)}
.ball.roll{background:radial-gradient(circle at 32% 28%,#fcd34d,#f59e0b);color:#201300;transform:scale(1.08)}
.ball.mini{width:30px;height:30px;font-size:12px}
.ball.hit{background:radial-gradient(circle at 32% 28%,#6ee7b7,#10b981);color:#012;border-color:#34d399;box-shadow:0 0 14px rgba(52,211,153,.6)}
.ball.win{background:radial-gradient(circle at 32% 28%,#fde68a,#f59e0b);color:#201300;box-shadow:0 0 16px rgba(245,158,11,.7)}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(.1) translateY(-30px);opacity:0}100%{transform:scale(1);opacity:1}}
.board{display:grid;gap:8px;justify-items:center}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.list>div{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid #1f1f1f}.list>div:last-child{border:0}
.list .ico{width:36px;height:36px;display:grid;place-items:center;color:#fff}

.gi{display:inline-grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 14px rgba(0,0,0,.35)}
.svc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:22px;background:linear-gradient(100deg,rgba(251,191,36,.16),rgba(251,191,36,.04) 55%,#141414);border:1px solid rgba(251,191,36,.28);margin-top:22px}
.svc .tag{font-size:10px;font-weight:800;letter-spacing:.8px;color:#fbbf24}
.svc .hd{font-weight:700;font-size:14px;margin-top:2px;transition:opacity .25s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svc .nw{width:8px;height:8px;border-radius:50%;background:#fb7185;box-shadow:0 0 0 4px rgba(251,113,133,.2)}
.nearby{position:relative;display:block;width:100%;text-align:left;margin-top:12px;border-radius:22px;overflow:hidden;background:#101c1f;border:1px solid #1d3036;min-height:96px}
.nearby svg.mp{position:absolute;inset:0;width:100%;height:100%}
.nearby .in{position:relative;display:flex;align-items:center;gap:12px;padding:14px;background:linear-gradient(90deg,#101c1f 38%,rgba(16,28,31,.35))}
.nf{display:block;padding:14px;border-radius:22px;background:#141414;border:1px solid #222;margin-bottom:10px}
.nf.pin{background:linear-gradient(120deg,rgba(96,165,250,.16),#141414 60%);border-color:rgba(96,165,250,.35)}
.nf summary{list-style:none;cursor:pointer}.nf summary::-webkit-details-marker{display:none}
.nf .ty{font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:999px}
.nf .body{margin-top:10px;padding-top:10px;border-top:1px dashed #2a2a2a;color:#b5b5b5;font-size:13px;line-height:1.6}
.os{background:#000;border-radius:28px 28px 0 0;margin:-34px -16px 0;padding:14px 16px 20px;position:relative}
.os .grab{width:40px;height:4px;border-radius:2px;background:#333;margin:0 auto 12px}
.ot{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #1d1d1d}.ot:last-child{border:0}
.ot .num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#04130e}
.ot .go{height:32px;padding:0 12px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.tile{border-radius:26px;padding:18px;min-height:150px;position:relative;overflow:hidden;background:#171717;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.tile .arr{width:42px;height:42px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.bgart{position:absolute;inset:0;pointer-events:none;z-index:0}.bgart svg{width:100%;height:100%;display:block}.bgt::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.5) 50%,rgba(0,0,0,0) 88%);pointer-events:none}.bgt>div,.bgt>.arr{position:relative;z-index:2}
.tile .il{position:absolute;right:-6px;bottom:-4px;width:112px;height:112px}
.gcard{border-radius:22px;background:#161616;overflow:hidden;text-align:left;transition:transform .18s,box-shadow .2s;position:relative}
.gcard:active{transform:scale(.97)}
.gcard.off{opacity:.38;filter:grayscale(1);pointer-events:none}
.gcard .cv{height:84px;position:relative}
.banners{display:flex;gap:10px;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.bn{flex:none;width:calc(100% - 44px);height:176px;border-radius:26px;padding:18px;position:relative;overflow:hidden;text-align:left}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.dots i{width:6px;height:6px;border-radius:3px;background:#3a3a3a;transition:.3s}.dots i.on{width:18px;background:#fff}
.glowtxt{background:linear-gradient(135deg,#fde68a,#f59e0b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px rgba(245,158,11,.45))}
.grad{background:linear-gradient(135deg,#7ee8fb,#22d3ee 40%,#60a5fa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(6px);z-index:80;display:flex;align-items:flex-end;animation:fade .25s}
.ov.mid{align-items:center;padding:0 22px}
.sheet{width:100%;max-height:86%;overflow-y:auto;background:#161616;border-radius:30px 30px 0 0;padding:22px 20px 28px;animation:up .3s cubic-bezier(.2,.9,.3,1);scrollbar-width:none}
.ov.mid .sheet{border-radius:28px;padding:24px 20px 20px;max-height:80%}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
/* global footer (6.5.1): always visible on every screen, never covered by the tab bar */
#screen::after{content:"Play Responsibly · Helpline: number to be provided by PCSO\A For 18 years old and above only";white-space:pre;flex:none;text-align:center;font-size:9.5px;line-height:1.45;color:#8a8a8a;padding:5px 8px 12px;background:var(--s1);border-top:1px solid #1c1c1c;position:relative;z-index:30}
#screen:has(.gfoot)::after{display:none}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#fff;color:#000;font-weight:700;font-size:13px;padding:10px 18px;border-radius:999px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fade .25s;max-width:340px;text-align:center}
.otp{position:relative;display:flex;gap:9px;justify-content:center}
.otp b{width:56px;height:62px;border-radius:16px;background:#1a1a1a;border:1.5px solid #2a2a2a;display:grid;place-items:center;font-size:24px;font-weight:800}
.otp b.cur{border-color:var(--cy);box-shadow:0 0 14px rgba(34,211,238,.35)}
.otp input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.steps{display:flex;gap:6px}.steps i{flex:1;height:4px;border-radius:2px;background:#2a2a2a;transition:.3s}.steps i.on{background:var(--cy);box-shadow:0 0 8px rgba(34,211,238,.6)}
.spin{width:54px;height:54px;border-radius:50%;border:4px solid #262626;border-top-color:var(--cy);border-right-color:#3b82f6;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,#1b1b1b,#2a2a2a,#1b1b1b);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}
.bar{height:8px;border-radius:4px;background:#232323;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cy),#3b82f6);transition:width .5s}
.qr{width:104px;height:104px;background:#fff;border-radius:14px;padding:8px;display:grid;grid-template-columns:repeat(13,1fr);gap:0}.qr i{background:#000}.qr i.w{background:#fff}
.faq summary{list-style:none;padding:15px 2px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;cursor:pointer;border-bottom:1px solid #1f1f1f}.faq summary::-webkit-details-marker{display:none}.faq p{padding:12px 2px;color:#aaa;font-size:13px;line-height:1.6}
table.tb{width:100%;border-collapse:collapse;font-size:12px}.tb td,.tb th{padding:9px 4px;border-bottom:1px solid #222;text-align:left}.tb th{color:var(--mu);font-weight:600}
.tg{width:48px;height:28px;border-radius:14px;background:#333;position:relative;transition:.25s;flex:none}.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.25s}.tg.on{background:var(--cy)}.tg.on::after{left:23px}
.avatar{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:44px;font-weight:800;border:5px solid #0a0a0a}
.cam{height:230px;border-radius:24px;background:repeating-linear-gradient(135deg,#141414 0 14px,#191919 14px 28px);display:grid;place-items:center;position:relative;overflow:hidden;border:1.5px dashed #3a3a3a}
.cam.ok{border:1.5px solid var(--gr)}
.scanline{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--cy),transparent);box-shadow:0 0 18px var(--cy);animation:scan 1.8s ease-in-out infinite}
@keyframes scan{0%,100%{top:8%}50%{top:90%}}
.ring{width:190px;height:190px;border-radius:50%;border:4px solid var(--cy);display:grid;place-items:center;position:relative;box-shadow:0 0 40px rgba(34,211,238,.35)}
.ring::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed rgba(34,211,238,.5);animation:sp 6s linear infinite}
.flash{animation:fl .4s}@keyframes fl{0%{background:#fff}100%{background:transparent}}
.shake{animation:shk .35s}@keyframes shk{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.float{animation:flt 3.2s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-6px)}}
#panel{width:330px;height:min(868px,calc(100vh - 40px));overflow-y:auto;background:rgba(18,18,20,.86);border:1px solid #262626;border-radius:26px;padding:18px;backdrop-filter:blur(14px);scrollbar-width:thin;flex:none}
#panel h4{font-size:12px;color:#777;letter-spacing:.08em;text-transform:uppercase;margin:16px 0 8px}
#panel h4:first-child{margin-top:0}
#panel .pb{display:inline-flex;align-items:center;height:30px;padding:0 11px;margin:0 6px 6px 0;border-radius:10px;background:#212125;color:#ddd;font-size:12px;font-weight:600;border:1px solid #2c2c31;transition:.15s}
#panel .pb:hover{border-color:var(--cy);color:#fff}
#panel .pb.hl{background:linear-gradient(135deg,var(--cy),#3b82f6);color:#02121a;border-color:transparent}

#panel .st{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;color:#888}

#panel .st.done{color:#ddd}#panel .st.done i{background:var(--gr);border-color:var(--gr);color:#012}
#panel .st.now{color:#fff;font-weight:700}#panel .st.now i{border-color:var(--cy);box-shadow:0 0 10px rgba(34,211,238,.6)}
#ptog{position:fixed;top:14px;left:18px;z-index:200;height:36px;padding:0 14px;border-radius:999px;background:rgba(30,30,34,.9);border:1px solid #333;font-size:12px;font-weight:700;color:#bbb}
@media (max-width:1060px){#ptog{display:none}}
  .exban{display:flex;gap:10px;align-items:center;margin:6px 14px 0;padding:10px 12px;border-radius:16px;background:rgba(251,113,132,.12);border:1px solid rgba(251,113,132,.35);cursor:pointer}
.exban.ended,.exban.pending{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.4)}
#lang{position:fixed;top:14px;right:18px;z-index:200;display:flex;background:rgba(30,30,34,.9);border:1px solid #333;border-radius:999px;padding:3px;backdrop-filter:blur(10px)}

function combos(arr,k){const out=[],cur=[];(function go(s){if(cur.length===k){out.push([...cur]);return}for(let i=s;i<arr.length;i++){cur.push(arr[i]);go(i+1);cur.pop()}})(0);return out}
function expandLines(g,pc,sel,qp){
 if(g.t!=='lotto')return[[...sel]];
 const s=[...sel].sort((a,b)=>a-b);
 if(pc==='STD')return[s];
 if(pc==='QP')return qp.map(l=>[...l]);
 if(pc==='R5'){const o=[];for(let x=1;x<=g.n;x++)if(!s.includes(x))o.push([...s,x].sort((a,b)=>a-b));return o}
 return combos(s,6)}
function lineCnt(g,pc,qpN){if(g.t!=='lotto')return 1;if(pc==='STD')return 1;if(pc==='QP')return qpN;if(pc==='R5')return g.n-5;return CNK(+pc.slice(1),6)}
function rambKind(g,line){if(g.id==='swer'){const u=new Set(line).size;return u===3?'R6':u===2?'R3':'NO'}if(g.id==='ez2')return line[0]===line[1]?'NO':'R';return 'NO'}
/* judge one line against the winning numbers -> {tier,hit,prize(fixed)} or null */
function judgeLine(g,pc,line,win){
 if(g.t==='lotto'){const hit=line.filter(x=>win.includes(x));const tr=HITT[hit.length];return tr?{tier:tr,hit}:null}
 if(g.id==='ez2'){if(pc==='STRAIGHT')return(line[0]===win[0]&&line[1]===win[1])?{tier:'STRAIGHT',prize:4000}:null;
  return(line[0]!==line[1]&&[...line].sort((a,b)=>a-b).join()===[...win].sort((a,b)=>a-b).join())?{tier:'RAMBO',prize:2000}:null}
 if(g.id==='swer'){if(pc==='STRAIGHT')return line.join()===win.join()?{tier:'STRAIGHT',prize:4500}:null;
  const k=rambKind(g,line);if(k==='NO')return null;return[...line].sort().join()===[...win].sort().join()?{tier:k,prize:k==='R6'?750:1500}:null}
 let m=0;for(let i=1;i<=g.d&&line[g.d-i]===win[g.d-i];i++)m++;const pz=TAILP[g.id][m];return pz?{tier:'T'+m,prize:pz,m}:null}
/* settle a ticket: expand, judge every line, split pools (demo: other winners are assumed) */
function settleTicket(k,win){const g=gm(k.g);const lines=linesOf(k);const R=RULE[g.id];const out=[];const cnt={};
 lines.forEach(l=>{const j=judgeLine(g,k.pt,l,win);if(j){out.push({line:l,...j});cnt[j.tier]=(cnt[j.tier]||0)+1}});
 const tiers=[];let gross=0;
 if(g.t==='lotto'){
  if(cnt.JP){const shares=cnt.JP*k.mult;const per=Math.floor(Math.max(g.pool,R.jp)/shares*100)/100;const amt=Math.floor(per*shares*100)/100;tiers.push({tier:'JP',n:cnt.JP,per,amt,type:'JACKPOT'});gross+=amt}
  R.T.forEach(([lv,ty,am])=>{const n=cnt[lv];if(!n)return;if(ty==='FIXED'){const amt=am*n*k.mult;tiers.push({tier:lv,n,per:am,amt,type:ty});gross+=amt}
   else{const shares=n*k.mult,oth=R.oth[lv]||0;const per=Math.floor(am/(oth+shares)*100)/100;const amt=Math.round(per*shares*100)/100;tiers.push({tier:lv,n,per,amt,type:ty,oth,pool:am});gross+=amt}})}
 else{Object.keys(cnt).forEach(tr=>{const per=out.find(x=>x.tier===tr).prize;const amt=per*cnt[tr]*k.mult;tiers.push({tier:tr,n:cnt[tr],per,amt,type:'FIXED'});gross+=amt})}
 gross=Math.round(gross*100)/100;const tax=taxOf(gross);
 return{win,lines:out,tiers,gross,tax,net:Math.round((gross-tax)*100)/100}}

/* craft winning numbers for the demo: level 0 none, 1..4 = low..top */
function craftWin(k,level){const g=gm(k.g);const lines=linesOf(k);const base=k.sel||lines[0];
 const rest=(excl,lo,hi,n)=>{const s=new Set();while(s.size<n){const x=rnd(lo,hi);if(!excl.includes(x))s.add(x)}return[...s]};
 if(g.t==='lotto'){const used=new Set(lines.flat());
  if(level===0){for(let tryN=0;tryN<400;tryN++){const w=[];const s=new Set();while(s.size<6)s.add(rnd(1,g.n));const ww=[...s];if(lines.every(l=>l.filter(x=>ww.includes(x)).length<3))return ww.sort((a,b)=>a-b)}return rest([...used],1,g.n,6).sort((a,b)=>a-b)}
  const hits=level+2;const pool=[...base].sort(()=>Math.random()-.5);
  if(k.pt==='R5'&&hits===6){const ex=rest(base,1,g.n,1);return[...base,...ex].sort((a,b)=>a-b)}
  const take=Math.min(hits,pool.length);const others=rest(base,1,g.n,6-take);return[...pool.slice(0,take),...others].sort((a,b)=>a-b)}
 const line=lines[0];
 if(level===0){let w;do{w=g.t==='ez2'?[rnd(1,31),rnd(1,31)]:Array.from({length:g.d},()=>rnd(0,9))}while(judgeLine(g,k.pt||'STRAIGHT',line,w));return w}
 if(g.t==='ez2')return k.pt==='RAMBO'?[line[1],line[0]]:[...line];
 if(g.id==='swer')return k.pt==='RAMBO'?[...line].reverse():[...line];
 const m=g.id==='d4'?[2,3,4,4][level-1]:[2,4,5,6][level-1];const w=Array.from({length:g.d},()=>rnd(0,9));for(let i=1;i<=g.d;i++){if(i<=m)w[g.d-i]=line[g.d-i];else if(i===m+1){let x;do{x=rnd(0,9)}while(x===line[g.d-i]);w[g.d-i]=x}}return w}

function fClearAll(){document.querySelectorAll('.ferr').forEach(e=>e.remove());document.querySelectorAll('.bad').forEach(e=>e.classList.remove('bad'));document.querySelectorAll('.wbad').forEach(e=>e.classList.remove('wbad'))}
function fClear(id){document.querySelectorAll(`.ferr[data-for="${id}"]`).forEach(e=>e.remove());const el=document.getElementById(id);el&&el.classList.remove('bad');document.querySelectorAll(`[data-wb="${id}"]`).forEach(x=>x.classList.remove('wbad'))}
function fErr(id,msg){const el=document.getElementById(id);if(!el)return null;let anchor,isInp=el.classList.contains('inp');
 if(isInp){el.classList.add('bad');anchor=el.parentElement&&el.parentElement.style.position==='relative'?el.parentElement:el}
 else{anchor=el.closest('label')||document.getElementById(id+'w')||el.parentElement;anchor.classList.add('wbad');anchor.dataset.wb=id}
 const d=document.createElement('div');d.className='ferr';d.dataset.for=id;d.textContent=msg;anchor.insertAdjacentElement('afterend',d);return el}
/* rules: [[id, errorMessageOrEmpty], ...]; empty message = field is fine. Returns true when everything passes. */
let _fchk=0;
function fCheck(rules){fClearAll();_fchk=1;setTimeout(()=>_fchk=0,300);let first=null;rules.forEach(([id,m])=>{if(m){const e=fErr(id,m);if(e&&!first)first=e}});
 if(first){const f=first.closest('label')||first;f.scrollIntoView({block:'center',behavior:'smooth'});return false}return true}
document.addEventListener('input',e=>{e.target.id&&fClear(e.target.id)});
document.addEventListener('change',e=>{if(!_fchk&&e.target.id)fClear(e.target.id)});

/* ===== PH mobile: default +63 when the user omits the country code ===== */
function normPh(raw){const s=String(raw||'').trim();if(!s||s.includes('@'))return s;const d=s.replace(/[\s\-()]/g,'');if(!/^\+?\d+$/.test(d))return s;
 let n=null;if(d.startsWith('+63'))n=d.slice(3);else if(d.startsWith('63')&&d.length===12)n=d.slice(2);else if(d.startsWith('0'))n=d.slice(1);else if(!d.startsWith('+'))n=d;
 if(n===null||!/^9\d{9}$/.test(n))return s;return '+63 '+n.slice(0,3)+' '+n.slice(3,6)+' '+n.slice(6)}
document.addEventListener('change',e=>{if(['r_phone','l_acc','f_acc'].includes(e.target.id)){const v=normPh(e.target.value);if(v!==e.target.value)e.target.value=v}});

 if(s===4)return head+`<div class="mu mt" style="font-size:14px">${t('正在进行人脸比对与 6 项自动校验','Running face match and 6 automatic checks')}</div><div class="card mt"><div class="row sp"><span class="b">${t('人脸相似度','Face similarity')}</span><span class="b grad" id="sim">${e.face?'98.6%':'0%'}</span></div><div class="bar mt"><i id="fb" style="width:${e.face?100:0}%"></i></div></div><div class="card mt" id="chk">${CHECKS.map((c,i)=>`<div class="row sp" style="padding:9px 0;border-bottom:1px solid #222;${e.face?'':'opacity:.25'}" id="ck${i}"><span style="font-size:14px">${t(c[0],c[1])}</span>${ckBadge(i,e.face)}</div>`).join('')}</div><div id="ckres">${e.face?ckRes():''}</div><button class="btn c mt2" id="nx4" ${e.face?'':'disabled'} onclick="S.ek.step=5;render()">${t('下一步','Next')}</button>`;

const hs=str=>{let h=7;for(const c of String(str))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const todayStr=()=>fdt(nowEff());
const sessAt=(g,i)=>Date.parse(todayStr()+'T'+g.sess[i]+':00+08:00');

function latestDraw(g){const L=S.draws[g.id]||[];if(!L.length)return null;
 if(g.sess.length>1){let last=-1;g.sess.forEach((x,i)=>{if(sessAt(g,i)<=nowEff())last=i});
  if(last>=0&&!L.some(d=>d.date===todayStr()&&d.time===g.sess[last])){const r=mul(hs(g.id+todayStr()+last));const nums=g.t==='ez2'?[1+Math.floor(r()*31),1+Math.floor(r()*31)]:Array.from({length:g.d},()=>Math.floor(r()*10));
   L.unshift({no:dno(g,todayStr(),g.sess[last]),date:todayStr(),time:g.sess[last],nums,jp:0,winners:Math.floor(r()*50)})}}
 return L[0]}
const rb=n=>`<span style="width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#2c2c2c,#171717);border:1px solid #333;display:inline-grid;place-items:center;font-size:9.5px;font-weight:700;color:#e5e5e5;flex:none">${n}</span>`;
function resultRow(g){const d=latestDraw(g);return `<div style="margin-top:8px;padding-top:8px;border-top:1px solid #222"><div class="xs mu" style="font-size:10px">${t('最近一期','Latest result')}</div>${d?`<div class="xs" style="margin-top:2px;font-weight:600;font-size:10.5px;line-height:1.35">${d.no} · ${d.date.slice(5)}${d.time?' '+d.time:''}</div><div style="display:flex;gap:3px;margin-top:4px;flex-wrap:nowrap">${d.nums.map(rb).join('')}</div>`:`<div class="xs mu" style="margin-top:3px">No result yet</div>`}</div>`}
function sessState(g){let cur=-1;const out=g.sess.map((x,i)=>sessAt(g,i)<=nowEff()?'done':'pend');cur=out.indexOf('pend');if(cur>=0)out[cur]='cur';return out}
function sessRow(g){if(g.sess.length<2)return '';const st=sessState(g),lab={done:[t('已开','Drawn'),'#6b7280'],cur:[t('当前','Current'),'var(--cy)'],pend:[t('待开','Upcoming'),'#a3a3a3']};

function gcard(g){const off=isOff(g);const nd=isND(g,fdt(Date.parse(g.nx)));
 return `<button class="gcard ${off?'off':''}" onclick="A.playGame('${g.id}')"><div class="cv">${cover(g)}${off?`<span class="badge b-gy" style="position:absolute;top:8px;right:8px">${t('暂停销售','Paused')}</span>`:''}</div><div style="padding:11px 12px 13px;text-align:left"><div class="b" style="font-size:14px">${gname(g)}</div><div class="row sp" style="margin-top:6px"><span class="grad b" style="font-size:15px">${fm0(g.p)}</span><span class="xs mu">${t('/注','/bet')}</span></div>${g.t==='lotto'?`<div class="xs" style="margin-top:6px;color:var(--am);font-weight:700">${t('奖池','Jackpot')} ${fm0(g.pool/1e6*1e6).replace(/,000,000$/,'M')}</div>`:`<div class="xs mu" style="margin-top:6px">${t('每天开奖','Daily draws')}</div>`}${nd?`<div class="xs" style="margin-top:3px;color:var(--am);font-weight:600;line-height:1.4">No draw on this date<div class="mu" style="font-weight:500">${t('下次开奖 ','Next draw ')}${effDate(g).slice(5)}</div></div>`:g.sess.length>1?'':`<div class="xs mu" style="margin-top:3px">${I('clock',11)} ${fts(sessMs(g,0)).slice(5)}</div>`}${sessRow(g)}${resultRow(g)}</div></button>`}

 return `<div class="chips">${G.filter(x=>x.t==='lotto').map(x=>`<button class="chip ${x.id===gid?'on':''}" onclick="S.p={g:'${x.id}'};renderKeep()">6/${x.n}</button>`).join('')}</div>

 <div class="card mt"><div class="row sp"><h3>${t('低频号码','Cold numbers')}</h3>${badge('b-cy','❄ Bottom 6')}</div>${cold.map(h=>`<div class="row g12" style="margin-top:10px"><span class="ball mini">${h.n}</span><div class="bar fl1"><i style="width:${h.c/mx*100}%;background:linear-gradient(90deg,#64748b,#94a3b8)"></i></div><span class="b sm" style="min-width:42px;text-align:right">${h.c}%</span></div>`).join('')}<button class="btn o mt" onclick="A.luckyAdd('${gid}','cold')">${t('把低频号码加入投注','Add cold numbers to bet')}</button></div><div class="xs mu mt" style="line-height:1.6">${t('历史数据仅供参考，每期开奖结果相互独立。','Historical data is for reference only; each draw is independent.')}</div>`},

/* ================= PLAY ================= */
const PL=()=>S.play;
const posG=g=>g.t!=='lotto';
const curPlay=g=>playsOf(g)[Math.min(PL().pt||0,playsOf(g).length-1)];
function plInit(){const g=gm(PL().game),P=PL();if(!P.qpN)P.qpN=3;if(!P.qp)P.qp=[];
 if(posG(g)&&P.picks.length!==needOf(g,curPlay(g)))P.picks=Array(needOf(g,curPlay(g))).fill(null);
 if(!posG(g)&&P.picks.some(x=>x===null))P.picks=[];
 if(!posG(g)){const L=lockedSet(g);if(P.picks.some(x=>L.has(x))){P.picks=P.picks.filter(x=>!L.has(x));setTimeout(()=>toast('This number is no longer available for this draw'),50)}}}
function plNeed(g){return needOf(g,curPlay(g))}
function plLines(g){const P=PL(),p=curPlay(g);return lineCnt(g,p.c,P.qpN||1)}
function plDone(g){const P=PL(),p=curPlay(g);if(g.t==='lotto'&&p.c==='QP')return P.qp.length===P.qpN&&!P.rolling;const a=P.picks;if(posG(g)){if(!(a.length===needOf(g,p)&&a.every(x=>x!==null)))return false;if(p.c==='RAMBO'&&rambKind(g,a)==='NO')return false;return true}return a.length===p.need}
function boardHTML(g,pop){const P=PL();
 if(g.t==='dig')return Array.from({length:g.d},(_,pos)=>`<div class="row g8" style="margin-top:8px"><span class="xs mu" style="width:34px">${t('第','#')}${pos+1}${t('位','')}</span><div class="row" style="gap:5px;flex:1;justify-content:space-between">${Array.from({length:10},(_,d)=>`<button class="ball mini ${P.picks[pos]===d?'on':''}" data-b="${pos}-${d}" onclick="A.dg(${pos},${d})">${d}</button>`).join('')}</div></div>`).join('');
 if(g.t==='ez2')return [0,1].map(pos=>`<div style="margin-top:${pos?14:0}px"><div class="xs mu">${t('第 '+(pos+1)+' 个号码（1–31）','Number '+(pos+1)+' (1–31)')}</div><div class="board" style="grid-template-columns:repeat(8,1fr);gap:6px;margin-top:6px">${Array.from({length:31},(_,i)=>`<button class="ball mini ${P.picks[pos]===i+1?'on':''}" data-b="${pos}-${i+1}" onclick="A.dg(${pos},${i+1})">${i+1}</button>`).join('')}</div></div>`).join('');
 if(curPlay(g).c==='QP')return `<div class="xs mu" style="text-align:center;padding:10px 0">${t('机选玩法由系统随机出号，不用手动选号。','Quick Pick numbers are drawn by the system. No manual picking.')}</div>`;
 const LS=lockedSet(g);return `<div class="board" style="grid-template-columns:repeat(8,1fr);gap:7px">${Array.from({length:g.n},(_,i)=>{const n=i+1;const lk=LS.has(n);return `<button class="ball mini ${P.picks.includes(n)?'on':''} ${lk?'lk':''}" data-b="${n}" ${lk?'title="This number is no longer available for this draw" style="opacity:.3;filter:grayscale(1);text-decoration:line-through;cursor:not-allowed"':''} onclick="A.tog(${n})">${n}</button>`}).join('')}</div>`}
function trayHTML(g,pop){const P=PL();const p=curPlay(g);
 if(g.t==='lotto'&&p.c==='QP')return P.qp.length?P.qp.map(l=>`<div class="row" style="gap:5px;width:100%">${balls(l)}</div>`).join(''):`<span class="xs mu">${t('点击“机选”生成号码','Tap Quick Pick to draw numbers')}</span>`;
 const n=plNeed(g);const arr=posG(g)?P.picks:[...P.picks].sort((a,b)=>a-b);return Array.from({length:n},(_,i)=>{const v=arr[i];return v==null?`<span class="ball" style="background:transparent;border:1.5px dashed #333"></span>`:`<span class="ball on ${pop===i?'pop':''}" style="transform:none">${v}</span>`}).join('')}
function drawBoard(pop){const g=gm(PL().game);const b=$('#board'),tr=$('#tray');if(b)b.innerHTML=boardHTML(g);if(tr)tr.innerHTML=trayHTML(g,pop);sumUp()}
function sumUp(){const g=gm(PL().game),P=PL();const e=$('#sum');if(e)e.innerHTML=sumHTML(g);const dl=$('#dl');if(dl)dl.innerHTML=drawsHTML(g);const b=$('#bet');if(b)b.disabled=!plDone(g)||P.rolling||cdLeft(g)<=0}
function playStrip(g){const d=latestDraw(g);return `<div style="padding:10px 16px 12px;border-top:1px solid #1f1f1f"><div class="row sp"><span class="xs mu">${t('最近开奖','Latest draw')}</span><a class="xs" style="color:var(--cy);cursor:pointer;font-weight:700" onclick="A.viewHist('${g.id}')">View history ›</a></div>${d?`<div class="xs" style="margin-top:4px;font-weight:600">${d.no} · ${d.date}${d.time?' '+d.time:' 21:00'}</div><div style="display:flex;gap:5px;margin-top:6px;flex-wrap:wrap">${d.nums.map(rb).join('')}</div>`:`<div class="xs mu" style="margin-top:4px">No result yet</div>`}</div>`}
A.viewHist=id=>{S.res.game=id;A.tab('result')};
const opensAt=(g,d,tm)=>Date.parse(d+'T'+(tm||g.sess[0])+':00+08:00')-48*3600e3;
const opensTxt=(g,d,tm)=>{const o=opensAt(g,d,tm);return o>nowEff()?'Opens at '+fts(o).slice(5):''};
function drawInit(g){const P=PL();if(!P.dsel||!P.dsel.length){const u=upDraws(g,1);if(u.length){P.dsel=[u[0].k];P.draws=1}}return new Set(P.dsel||[])}
function drawChips(g){const sel=drawInit(g);const u=upDraws(g,Math.max(6,g.sess.length*2));
 const chip=x=>{const on=sel.has(x.k);return `<button class="chip ${on?'on':''}" onclick="A.dtog('${x.k}')" style="flex:none">${x.d.slice(5)} · ${x.tm}${opensTxt(g,x.d,x.tm)?` <span class="xs" style="opacity:.7">· ${opensTxt(g,x.d,x.tm)}</span>`:''}</button>`};
 const extra=[...sel].filter(k=>!u.some(x=>x.k===k)).sort().map(k=>`<button class="chip on" onclick="A.dtog('${k}')" style="flex:none">${k.slice(5).replace('|',' · ')}</button>`).join('');
 return `<div style="padding:0 16px 8px"><div class="row sp" style="margin-bottom:6px"><span class="xs mu">${t('选择期次','Select draws')} · ${t(`已选 ${sel.size} 期`,`${sel.size} selected`)}</span><button class="xs b" style="color:var(--cy)" onclick="A.allDraws()">${t('全部期次','All draws')} ›</button></div><div class="chips" style="overflow-x:auto;flex-wrap:nowrap">${u.map(chip).join('')}${extra}</div></div>`}

function barcode(id){/* Code-128-style bars: start B, one 11-module symbol per char, check, stop */
 const sym=c=>{const r=mul(hs('c128'+c));let w=[1,1,1,1,1,1],rest=5;while(rest>0){w[Math.floor(r()*6)]++;rest--}return w};
 const seq=[[2,1,1,2,1,4],...[...id].map(sym),sym('chk'+id),[2,3,3,1,1,1,2]];let x=10,b='';
 seq.forEach(w=>w.forEach((v,i)=>{if(i%2===0)b+=`<rect x="${x}" y="0" width="${v}" height="46" fill="#000"/>`;x+=v}));x+=10;
 return `<div class="bc128" data-code="${id}" style="background:#fff;border-radius:8px;padding:8px 8px 4px"><svg viewBox="0 0 ${x} 46" width="100%" height="46" preserveAspectRatio="none">${b}</svg><div style="color:#000;font-size:9.5px;text-align:center;font-family:ui-monospace,monospace;margin-top:2px">${id}</div></div>`}
A.startClaim=id=>{const k=S.tickets.find(x=>x.id===id);if(!k||k.st!=='winPending')return;if(!regenOK(k))return toast(t('已过兑奖截止日，不能发起申领','Claim deadline passed — cannot start a claim'));if(k.cs)return;k.cs=1;k.regen=0;k.code=S.firstCode?claimCode():'K7M2X9QD';S.firstCode=1;S.j.claim=S.j.claim||0;toast(t('申领码已生成','Claim code generated'));renderKeep()};
const regenOK=k=>fdt(S.clock)<=claimExp(k.draw);
const archived=k=>(k.st==='winPending'&&Date.parse(claimExp(k.draw)+'T00:00:00+08:00')+30*864e5<S.clock)||(k.st==='void'&&S.clock-(k.ms||0)>30*864e5);
const expiredTk=k=>k.st==='winPending'&&!regenOK(k);
A.regen=id=>{const k=S.tickets.find(x=>x.id===id);if(!regenOK(k))return toast(t('已过兑奖截止日，不能重新生成','Claim deadline passed — cannot regenerate'));if((k.regen||0)>=REGEN_MAX)return toast(t('已重新生成 3 次，达到上限','Regenerated 3 times — limit reached'));k.regen=(k.regen||0)+1;k.code=claimCode();toast(t('已重新生成，旧申领码立即作废','New code generated — the old one is void'));renderKeep()};
const regenBox=k=>!k.cs?'':regenOK(k)?`<button class="btn o s mt" style="width:100%" onclick="event.stopPropagation();A.regen('${k.id}')">${t('申领码遗失或疑似泄露？重新生成','Lost or leaked? Regenerate the code')} · ${REGEN_MAX-(k.regen||0)} ${t('次机会','left')}</button><div class="xs mu" style="margin-top:6px;line-height:1.5">${t('新码有效期仍到原兑奖截止日，旧码立即作废。','The new code keeps the same claim deadline. The old code is void at once.')}</div>`:`<div class="xs" style="margin-top:10px;color:var(--ro)">${t('已过兑奖截止日，奖金按逾期作废处理。','The claim deadline has passed. The prize is forfeited.')}</div>`;

SC.playsafe={title:'PlaySafe',html:()=>{const ex=S.excl,cl=S.cool;
 const lim=(k,ti)=>`<div class="card mt"><div class="b">${ti}</div><div class="list">${['d','w','m'].map(p=>{const pe=S.pend.find(x=>x.k===k&&x.p===p);return `<div><span class="fl1">${t(LN[p][0],LN[p][1])}${pe?` ${badge('b-am',t('调高待生效 24h','Raise pending 24h'))}`:''}</span><b class="grad">${fm0(S.limits[k][p])}</b><button class="btn d s" style="height:32px;padding:0 14px" onclick="A.limEdit('${k}','${p}')">${t('调整','Edit')}</button></div>`}).join('')}</div></div>`;
 return `<div class="fade"><div class="card" style="display:flex;gap:14px;align-items:center"><div style="width:84px;height:84px;flex:none">${illo('shield')}</div><div style="font-size:13.5px;line-height:1.6;color:#bbb">${t('理性购彩，量力而为。在这里管理限额、冷静期与自我排除。','Play responsibly. Manage limits, cool-off and self-exclusion here.')}</div></div>
 <div class="card mt"><div class="b">${t('三步管好购彩','Three steps to stay in control')}</div><div class="list">${[['1','Set daily / weekly / monthly limits','Set limits','ps_lim'],['2','Need a rest? Start a cool-off','Start cool-off','ps_cool'],['3','Stopping for the long term? Self-exclude','Self-exclude','ps_excl']].map(x=>`<div><i style="flex:none;width:26px;height:26px;border-radius:50%;background:#262626;display:grid;place-items:center;font-size:13px;font-style:normal;font-weight:800;color:var(--cy)">${x[0]}</i><span class="fl1" style="font-size:13px">${x[1]}</span><button class="btn d s" style="height:32px;padding:0 12px;font-size:12.5px" onclick="A.psGo('${x[3]}')">${x[2]}</button></div>`).join('')}</div></div>
 ${ex?`<div class="card mt" style="border:1px solid ${exState()==='active'||exState()==='perm'?'rgba(251,113,132,.4)':'rgba(245,158,11,.4)'}"><div class="row sp"><b>${t('自我排除','Self-exclusion')}</b>${exState()==='pending'?badge('b-am',t('解除申请审批中','Request under review')):exState()==='ended'?badge('b-am',ex.rej?t('申请被驳回','Request declined'):t('可申请解除','You can apply')):badge('b-ro',ex.label)}</div><div class="mu sm mt3" style="line-height:1.6">${exState()==='perm'?t('永久排除，不能自行解除，请联系 PCSO。','Permanent exclusion cannot be lifted here. Please contact PCSO.'):exState()==='active'?t(`排除期至 ${fts(exEnd())}。期间为受限登录：不能投注、充值，可查看余额、提取奖金、使用帮助。营销通知已停止，交易/法定通知照常。`,`Until ${fts(exEnd())} you are in restricted mode: no betting or deposits; you can view balances, withdraw prize funds and use help. Marketing is paused; transactional and legal notices continue.`):exState()==='pending'?t('已提交，等待 PCSO 审批。审批通过前仍为受限登录。','Submitted. Waiting for PCSO approval. You stay in restricted mode until then.'):t('到期不会自动恢复：需重新身份核验、确认了解风险并等待 PCSO 审批通过。','Not lifted automatically: re-verify identity, acknowledge the risk and wait for PCSO approval.')}${ex.rej&&exState()==='ended'?`<div class="xs mt3" style="color:var(--ro)">${t('驳回原因：','Reason: ')}${ex.rej}</div>`:''}</div>${exState()==='ended'?`<button class="btn c s mt" style="width:100%" onclick="A.restore()">${t(ex.rej?'重新申请解除':'申请解除排除',ex.rej?'Apply again':'Apply to lift exclusion')}</button>`:''}</div>`:''}
 ${cl&&cl.until>S.clock?`<div class="card mt" style="border:1px solid rgba(34,211,238,.4)"><div class="row sp"><b>${t('冷静期中','Cool-off active')}</b>${badge('b-cy',t('至','until')+' '+fts(cl.until))}</div><div class="mu sm mt3">${t('期间禁止投注与充值，到期自动解除，无需审批。','Betting and deposits are disabled; it ends automatically — no approval needed.')}</div></div>`:''}
 <h3 id="ps_lim" style="margin-top:22px">${t('充值限额','Deposit limits')}</h3>${lim('dep',t('每日 / 每周 / 每月','Daily / weekly / monthly'))}<h3 style="margin-top:22px">${t('投注限额','Bet limits')}</h3>${lim('bet',t('每日 / 每周 / 每月','Daily / weekly / monthly'))}
 <div class="card mt row sp"><div><div class="b">${t('单笔投注上限','Single bet cap')}</div><div class="xs mu">${t('不能高于每日投注限额；每日限额调到它以下时会同步下调。调低即时生效；调高或撤销需等待 24 小时。','Cannot exceed the daily bet limit; lowering the daily limit below it lowers this too. Lowering is immediate; raising or removing waits 24 hours.')}</div></div><b class="grad">${fm0(S.limits.single)}</b></div>
 <div class="card mt" id="ps_rc"><div class="row sp"><div class="b">${t('现实检查提醒间隔','Reality check interval')}</div>${badge('b-gy',rcInt()+' min')}</div><div class="xs mu mt3" style="line-height:1.6">${t(`每隔设定的时间弹出一次提醒（本次时长、投注额、输赢、余额）。不得短于 ${rcMin()} 分钟（管理端下限）。`,`A pop-up shows how long you have played, what you bet and your balance. It cannot be shorter than ${rcMin()} minutes (set by PCSO).`)}</div><div class="row g8 mt3"><input class="inp" id="rc_int" type="number" inputmode="numeric" min="1" value="${rcInt()}" style="height:42px"><button class="btn c s" onclick="A.rcSave()">${t('保存','Save')}</button></div></div>
 <h3 id="ps_cool" style="margin-top:22px">${t('冷静期','Cool-off')}</h3><div class="card mt"><div class="mu sm" style="line-height:1.6">${t('选定后期间禁止投注与充值，到期自动解除，无需审批。','Betting and deposits are disabled for the chosen period; it ends by itself.')}</div><div class="chips mt">${[['24 小时','24 hours',24],['7 天','7 days',168],['30 天','30 days',720]].map(c=>`<button class="chip" onclick="A.cool(${c[2]},'${t(c[0],c[1])}')">${t(c[0],c[1])}</button>`).join('')}</div></div>
 <h3 id="ps_excl" style="margin-top:22px">${t('自我排除','Self-exclusion')}</h3><div class="card mt"><div class="mu sm" style="line-height:1.6">${t('排除期内为受限登录（不能投注、充值）。到期后在这里申请解除；永久排除没有恢复入口。','Restricted mode during exclusion (no betting or deposits). After it ends, apply to lift it here. Permanent exclusion has no way back.')}</div><div class="chips mt">${[['3 个月','3 months',0],['6 个月','6 months',0],['1 年','1 year',0],['永久','Permanent',1]].map(c=>`<button class="chip" style="${c[2]?'background:rgba(251,113,132,.18);color:var(--ro)':''}" onclick="A.excl('${t(c[0],c[1])}',${c[2]})">${t(c[0],c[1])}</button>`).join('')}</div></div>
 <button class="card mt row sp" style="width:100%" onclick="A.go('risk')"><div class="row g12"><span style="color:var(--ro)">${I('help',22)}</span><div style="text-align:left"><div class="b">${t('风险与警示信号','Risk and warning signs')}</div><div class="xs mu">${t('了解需要留意的购彩行为','Know what to look out for')}</div></div></div>${I('chev',18)}</button>
 <button class="card mt row sp" style="width:100%" onclick="A.go('pgh')"><div class="row g12"><span style="color:var(--am)">${I('help',22)}</span><div style="text-align:left"><div class="b">Play Smart Help</div><div class="xs mu">${t('购彩习惯自测 · 求助热线','Play Check · support hotline')}</div></div></div>${I('chev',18)}</button>
 <div class="xs mu mt" style="text-align:center">${t('以上数值为管理端参数，以 PCSO 规定为准。','Values are back-office parameters, subject to PCSO rules.')}</div></div>`}};
A.limEdit=(k,p)=>{const cur=S.limits[k][p];modal(()=>`<h3>${t(LN[p][0],LN[p][1])} ${k==='dep'?t('充值','deposit'):t('投注','bet')} ${t('限额','limit')}</h3><div class="mu sm mt3">${t('调低即时生效；调高需 24 小时等待期。','Lowering applies now; raising applies after a 24-hour wait.')}</div><div class="chips mt" style="flex-wrap:wrap;overflow:visible">${LIMV.filter(v=>p==='d'?v<=20000:true).map(v=>`<button class="chip ${v===cur?'on':''}" onclick="A.limSet('${k}','${p}',${v})">${fm0(v)}</button>`).join('')}</div>`)};
const nfCool=()=>addNotif('clock','冷静期开始','Cool-off started','您的冷静期已开始，将于 '+fts(S.cool.until)+' 结束。','Your cool-off has started and ends '+fts(S.cool.until)+'.');
const nfExcl=()=>addNotif('shield','自我排除已生效','Self-exclusion started',S.excl.perm?'您的自我排除已开始，为永久排除。':'您的自我排除已开始，将于 '+fts(exEnd())+' 结束。',S.excl.perm?'Your self-exclusion has started and is permanent.':'Your self-exclusion has started and ends '+fts(exEnd())+'.');
const limName=(k,p)=>LN[p][1].toLowerCase()+' '+(k==='dep'?'deposit':'bet');
const cancelRaise=(k,p)=>{const i=S.pend.findIndex(x=>x.k===k&&x.p===p);if(i<0)return;S.pend.splice(i,1);addNotif('shield','调高申请已取消','Raise request cancelled',`您调高${limName(k,p)}限额的申请已取消。`,`Your request to raise the ${limName(k,p)} limit was cancelled.`)};
A.limSet=(k,p,v)=>{const cur=S.limits[k][p];A.close();cancelRaise(k,p);if(v<=cur){S.limits[k][p]=v;addNotif('shield','限额已调整','Limit updated',`限额已调低为 ${fm0(v)}，即时生效。`,`Your limit is now ${fm0(v)}. Effective immediately.`);if(k==='bet'&&p==='d'&&S.limits.single>v){S.limits.single=v;addNotif('shield','单笔上限已同步下调','Single-bet cap lowered',`单笔投注上限不能高于每日限额，已同步下调为 ${fm0(v)}。`,`The single-bet cap cannot exceed the daily limit, so it was lowered to ${fm0(v)} as well.`);toast(t(`已调低，单笔上限同步下调为 ${fm0(v)}`,`Lowered — single-bet cap also set to ${fm0(v)}`))}else toast(t('已调低，即时生效','Lowered — effective now'))}else{S.pend.push({k,p,v});addNotif('clock','限额调高待生效','Limit raise pending',`调高到 ${fm0(v)} 将在 24 小时后生效。`,`Raising to ${fm0(v)} takes effect after 24 hours.`);toast(t('调高将在 24 小时后生效','Raise takes effect in 24 hours'))}renderKeep()};
A.cool=(h,l)=>modal(()=>`<h3>${t('开始冷静期？','Start cool-off?')}</h3><div class="mu sm mt3" style="line-height:1.6">${t(`${l}内将无法投注与充值，期间不可提前结束。`,`You cannot bet or deposit for ${l}; it cannot be ended early.`)}</div><div class="row g8 mt2"><button class="btn d" onclick="A.close()">${t('取消','Cancel')}</button><button class="btn c" onclick="S.cool={until:S.clock+${h}*3600e3};A.close();nfCool();toast(t('冷静期已开始','Cool-off started'));renderKeep()">${t('确认','Confirm')}</button></div>`,true);
const EXD={'3 个月':90,'3 months':90,'6 个月':182,'6 months':182,'1 年':365,'1 year':365};
A.excl=(l,perm)=>modal(()=>`<h3 style="color:var(--ro)">${t('确认自我排除？','Confirm self-exclusion?')}</h3><div class="mu sm mt3" style="line-height:1.7">${t(`周期：${l}。排除期内为受限登录：不能投注、充值，可查看余额、提取奖金、使用帮助。到期不会自动恢复，需在 PlaySafe 提交解除申请，由 PCSO 审批。`,`Period: ${l}. You stay signed in but in restricted mode: no betting or deposits; you can view balances, withdraw prize funds and use help. It does not end by itself: apply to lift it in PlaySafe and wait for PCSO approval.`)}${perm?`<br><b style="color:var(--ro)">${t('永久排除没有恢复入口。','Permanent exclusion cannot be reversed.')}</b>`:''}</div><div class="row g8 mt2"><button class="btn d" onclick="A.close()">${t('取消','Cancel')}</button><button class="btn r" onclick="S.excl={label:'${l}',perm:${perm},expired:false,req:false,rej:'',endTs:0};S.excl.endTs=S.clock+(EXD['${l}']||90)*864e5;A.close();nfExcl();toast(t('自我排除已生效，进入受限模式','Self-exclusion is active — restricted mode'));renderKeep()">${t('确认排除','Exclude me')}</button></div>`,true);

const exEnd=()=>{const e=S.excl;return e&&e.endTs?e.endTs:S.clock};
const exState=()=>{const e=S.excl;if(!e)return '';return e.perm?'perm':!e.expired?'active':e.req?'pending':'ended'};
function exBanner(){const e=S.excl;if(!e)return '';const st=exState();
 const msg={perm:t('永久自我排除：不能投注、充值，可查看余额、提取奖金、使用帮助。','Permanent self-exclusion: no betting or deposits. You can view balances, withdraw prize funds and use help.'),
 active:t(`自我排除中（至 ${fts(exEnd())}）：不能投注、充值，可查看余额、提取奖金、使用帮助。`,`Self-exclusion active (until ${fts(exEnd())}): no betting or deposits. You can view balances, withdraw prize funds and use help.`),
 ended:e.rej?t('解除申请被驳回：'+e.rej,'Request declined: '+e.rej):t('排除期已结束，但不会自动恢复。申请解除后才能继续投注、充值。','The exclusion period has ended but is not lifted automatically. Apply to lift it to bet and deposit again.'),
 pending:t('解除申请审批中：审批通过前仍为受限登录，不能投注、充值。','Request to lift the exclusion is under review. Until it is approved you cannot bet or deposit.')}[st];
 const btn=st==='ended'?`<button class="btn c s" style="height:30px;padding:0 14px;flex:none" onclick="A.restore()">${t(e.rej?'重新申请':'申请解除',e.rej?'Apply again':'Apply to lift')}</button>`:st==='pending'?badge('b-am',t('审批中','In review')):'';
 return `<div class="exban ${st}" onclick="${st==='ended'?'':"A.go('playsafe')"}"><span style="flex:none;color:${st==='pending'||st==='ended'?'var(--am)':'var(--ro)'}">${I('help',18)}</span><div style="flex:1;font-size:12px;line-height:1.45;color:#ddd">${msg}</div>${btn}</div>`}
A.restore=()=>modal(()=>`<h3>${t('申请恢复账号','Request restoration')}</h3><div class="mu sm mt3">${t('① 重新身份核验：输入短信验证码','① Re-verify identity: enter the SMS code')}</div><div style="margin-top:16px">${otp('x_code')}</div><label class="row g8 mt2" style="font-size:13px;color:#bbb;align-items:flex-start"><input type="checkbox" id="x_ag" style="margin-top:3px;accent-color:#22d3ee"> ${t('② 我已了解风险，并愿意在 PlaySafe 工具下继续','② I understand the risks and will continue with PlaySafe tools')}</label><button class="btn c mt2" onclick="if(otpLocked())return;if(V('x_code')!=='1234')return otpWrong();S.otp.fail=0;if(!$('#x_ag').checked)return toast(t('请先勾选确认','Please tick the acknowledgement'));S.excl.req=true;S.excl.rej='';A.close();toast(t('已提交，等待 PCSO 审批','Submitted — awaiting PCSO approval'));render()">${t('提交申请','Submit request')}</button>`,true);
const QS=[['您是否曾购彩超出自己真正承担得起的金额？','Have you spent more on lottery than you could really afford?'],['为了获得同样的刺激感，您是否需要加大购彩金额？','Have you needed to spend larger amounts to get the same excitement?'],['购彩花掉钱之后，您是否隔天再买，想把花掉的钱赢回来？','Have you gone back another day to try to win back the money you spent?'],['您是否曾借钱或变卖东西来筹措购彩资金？','Have you borrowed money or sold anything to fund your lottery play?'],['您是否觉得自己的购彩习惯可能需要留意？','Have you felt that your play habits might need attention?'],['购彩是否给您带来健康问题，包括压力或焦虑？','Has playing caused you any health problems, including stress or anxiety?'],['是否有人批评您的购彩行为，或说您的购彩习惯需要留意（不论您是否认同）？','Have people criticised your play or said your habits need attention?'],['购彩是否给您或家人带来经济困难？','Has your play caused financial problems for you or your household?'],['您是否对自己的购彩方式或购彩带来的后果感到内疚？','Have you felt guilty about the way you play or what happens when you play?']];
const PGSI=[['从不','Never'],['有时','Sometimes'],['经常','Most of the time'],['几乎总是','Almost always']];
const pgsiLv=s=>s>=8?['ro',t('你的购彩习惯可能需要留意，建议联系帮助热线','Your play habits may need attention. We suggest contacting the help hotline.')]:s>=3?['am',t('你的购彩习惯可能需要留意，可前往 PlaySafe 设置限额','Your play habits may need attention. Set limits in PlaySafe.')]:s>=1?['cy',t('低度留意：请继续保持理性购彩','A little attention is worthwhile — keep playing responsibly.')]:['gr',t('你的购彩习惯看起来没有问题','Your play habits look fine.')];
const HOTLINE='Helpline number: to be provided by PCSO';
SC.pgh={title:()=>'Play Smart Help',html:()=>{const a=S.exTest;const sc=Object.values(a).reduce((x,y)=>x+y,0);const done=Object.keys(a).length===QS.length;const lv=pgsiLv(sc);return `<div class="card"><h3>Play Check</h3><div class="xs mu" style="margin-top:4px;line-height:1.5">${t('回想过去 12 个月。答案只在本机计算，不会保存。','Think about the past 12 months. Answers are scored on this device only and are not saved.')}</div>${QS.map((q,i)=>`<div style="padding:12px 0;border-bottom:1px solid #222"><div style="font-size:13.5px;line-height:1.5">${i+1}. ${t(q[0],q[1])}</div><div class="seg mt3" style="height:34px">${PGSI.map((o,k)=>`<button class="${a[i]===k?'on':''}" style="font-size:11px;padding:0 2px" onclick="S.exTest[${i}]=${k};renderKeep()">${t(o[0],o[1])}</button>`).join('')}</div></div>`).join('')}${done?`<div class="card c2 mt fade" style="border:1px solid var(--${lv[0]})"><div class="b" style="color:var(--${lv[0]})">${lv[1]}</div><div class="mu sm mt3">${t(`总分 ${sc} / 27`,`Score ${sc} / 27`)}</div>${sc>=8?`<div class="b mt3" style="font-size:13px">${I('phone',14)} ${HOTLINE}</div>`:''}${sc>=3&&sc<8?`<button class="btn c s mt3" onclick="A.psGo('ps_lim',1)">Set limits</button>`:''}</div>`:''}</div>
 <button class="card mt row sp" style="width:100%" onclick="A.go('risk')"><div class="row g12"><span style="color:var(--ro)">${I('help',22)}</span><div style="text-align:left"><div class="b">${t('风险与警示信号','Risk and warning signs')}</div><div class="xs mu">${t('了解需要留意的购彩行为','Know what to look out for')}</div></div></div>${I('chev',18)}</button>
 <div class="card mt"><h3>${t('求助渠道','Get support')}</h3><div class="list"><div><span class="ico">${I('phone',22)}</span><div class="fl1"><div class="b" style="font-size:14px">${t('PCSO 客服热线','PCSO support hotline')}</div><div class="xs mu">${HOTLINE}</div></div></div><div><span class="ico">${I('mega',22)}</span><div class="fl1"><div class="b" style="font-size:14px">${t('转介机构清单','Referral organisations')}</div><div class="xs mu">Organisation 1 — name and contact to be provided by PCSO</div><div class="xs mu">Organisation 2 — name and contact to be provided by PCSO</div></div></div></div><button class="btn c mt" onclick="A.go('playsafe')">${t('前往 PlaySafe','Go to PlaySafe')}</button></div>`}};
SC.help={title:()=>t('帮助','Help'),html:()=>{const F=[['如何购买彩票？','How do I buy a ticket?','在 Play 页选择游戏与号码（可手动或机选），设置倍数和期数后确认即可。','Pick a game and numbers on Play (manual or quick pick), set multiplier and draws, then confirm.'],['奖金如何领取？','How are prizes paid?','₱300,000 及以下自动入账到钱包奖金余额；超过则需本人到 PCSO 总部，在“我的彩票”点击 Start claim 生成申领码后兑付，以支票发放。','Prizes up to ₱300,000 are credited to your prize balance automatically. Larger prizes are claimed in person at PCSO HQ: tap Start claim on the ticket to generate your claim code; paid by cheque.'],['为什么提现要验证码？','Why does withdrawal need a code?','每笔提现都需短信 MFA；连续失败 3 次将锁定提现 30 分钟。','Every withdrawal needs SMS MFA; 3 failures lock withdrawals for 30 minutes.'],['实名认证要多久？','How long does KYC take?','最长 5 个工作日。审核期间可登录，但仅能查看认证状态。','Up to 5 business days. You can sign in meanwhile but only see the status.'],['彩票会保存多久？','How long are tickets kept?','普通彩票和已作废彩票 30 天；中奖彩票自开奖日起 1 年零 1 天，过兑奖截止日未领的再保留 30 天并显示已逾期。','Regular and voided tickets 30 days; winning tickets 1 year + 1 day from the draw date; an unclaimed prize ticket stays 30 more days as Expired after the claim deadline.']];

次\"勾选多个期次（跨场次、跨天）；最低充值 ₱20；现实检查弹窗、理性购彩常驻文案，全文措辞统一；③ 票与申领：复式（System 7–12）和 5 号轮转每个组合各出一张独立电子票；申领码改由玩家在\"我的彩票\"点 Start claim 发起生成；④ 游戏管理：游戏固定 9 个（去掉\"新增游戏\"）；每个游戏卡片只有一个\"编辑游戏\"入口，分\"基本信息\"\"销售与开奖\"\"玩法与奖级\"\"版本历史\"四个分区，所有改动走双人审核（单价、奖池储备百分比、玩法与奖级——运营专员提交、财务复核批准；其余销售与开奖设置、基本信息、上架——运营专员提交、运营复核批准；下架即时生效；提交人与批准人须为两人）；编辑游戏页右侧新增预览区，随分区显示未提交草稿的玩家端示意（封面卡 / 投注页顶部 / 投注页，版本历史无预览），审批页并排显示修改前 / 修改后预览；游戏规则（选号个数与范围、玩法参数、奖级结构、判奖方式）不再由开发内置，全部在管理端可配置并版本化，每次批准生成新的\"规则版本\"，变更申请选\"起始生效期次\"（只影响未开售期次），期次生成时绑定规则版本并记下当时的销售参数，玩家端展示该期规则版本；判奖引擎的基本算法和玩法算法类型仍内置，全新算法需开发实现；新增\"投注限额\"页签（号码级上限：锁定、限额、实时投注金额，仅乐透类；游戏级默认号码限额）；封盘提前时间和开售间隔按游戏的每个开奖场次配置；新增\"无开奖日\"页签（在\"期次与开奖\"菜单下，与\"期次列表\"并列；节日和固定星期不开奖，走变更申请，自动跳过、作废并退款）；\"版本历史\"分区按规则版本记录变更（系统自动生成，只读）；⑤ 期次与开奖：开奖号码可从开奖机抓取，运营专员人工复核后提交，失败可改手工录入；期次表增\"首次录入时间\"\"实际发布时间\"和操作留痕表；开奖流程重做：先只录开奖号码（运营专员）并由财务复核独立再录，一致后系统统计线上各奖级中奖注数（仅 PCSO 查看，不发布），PCSO 线下算奖（线下中奖注数不进系统），再由运营专员录入奖池金额和奖池平分类奖级单注奖金、财务复核独立再录一遍，经合理性检查后授权发布；期次状态机由九态改十态，在\"待复核\"后增\"待录入奖金\"；⑥ 管理端其他：角色由 5 个增至 6 个，新增\"运营复核\"（PCSO，只批准、不提交，可见仪表盘、游戏管理、期次与开奖只读），权限矩阵相应增一行；关键参数变更、玩家永久删除须第二位授权人员批准；一个员工账号只能持有一个角色，不能管理自己的账号；用户管理（新增、编辑、启用、禁用）；审计日志分六类，导出 CSV、JSON、XML；全局参数税率改为税率表（多行：条件+税率），期次创建时记下整张表；玩家详情增\"累计统计\"\"登录记录\"\"操作记录\"页签，搜索支持多条件；交易流水新增\"票据\"页签，支持扫码查询；公告增展示位置、平台、起止日期、图片、跳转链接，正文可插入图片，增\"图片库\"页签；⑦ 报表：新增\"交易监控\"页签（含下钻到投注单：分页、导出、权限）；销售报表与开奖销售合并为\"销售\"页签（按时间 / 按期次两个视图），交易当量只在交易监控；新增头奖报告、没收/逾期未领奖金报告、最终税报告；玩家报表（原\"注册玩家名单\"）为数量汇总（总数、新增、分布）+ 导出名单；销售和派奖增\"按地区\"维度，日期快捷项；奖金与派彩报表改日期范围 + 游戏 + 期次筛选，新增按期次列表（应派/实派/差异）、按付款日对账小块、代扣税按税率档拆分；头奖、没收/逾期、最终税报告、交易监控加游戏/期次筛选，头奖注数只显示线上；销售按期次增退款与净销售 ⑧ 报表按标书第 3 章补齐：销售增季/半年/年粒度（预扣税/VAT/PCSO 应收列待口径，本期不做）；销售和派奖按地区逐级拆分到市；业绩页增分红计算、奖池按游戏明细、损益占位；奖金页增中奖人数；玩家报表增人口统计（性别不采集）；新增每日对账页签；附录 A 增第 152–155 项；⑨ 批次 6 评论决议：期号改为 `游戏编码-年月日-场次`（如 L649-20261012-1）；彩票带条形码（内容为票号）；单次购买最多 1,000 张票；注销增加余额大于 0、有未开奖票两项阻止条件，注销后同号暂不能重新注册；自助停用和管理端停用均可用于已限制投注账号，恢复回停用前状态；期次延期不走变更申请，恢复按新封盘时间回已封盘或销售中；无开奖日命中已生成未开售期次一律转已作废（有票退款、不删除期次）；预购期次按已批准日程自动补足到下限，不再逐次审批；封盘提前时间修改影响所有未开售期次，开售间隔修改只影响之后生成的期次；已生成未开售期次可被预购；奖池平分按注；一次多期购买为一张投注单；排除期间只停营销通知（冷静期不停
