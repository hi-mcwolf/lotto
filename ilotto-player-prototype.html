4","t":["显示后无操作最长 30 秒自动重新掩码","Auto re-mask after inactivity of at most 30 seconds"]},{"c":"1.4.45","t":["每次新登录默认掩码，不记忆；Web 与 App 一致","Masked at every new login, never persisted; same on web and app"]},{"c":"1.4.46","t":["掩码不影响投注、充值、提现","Masking never blocks betting, top-up or withdrawal"]}],"tor_note":null},{"k":"b4","n":["Identity verification 卡片","Identity verification card"],"sel":"div.card","find":null,"fn":[["全宽卡片显示认证状态徽标 Not verified / Under review / Verified / Rejected，和按状态变化的按钮 Verify / View progress / View / Resubmit，点击进入实名状态页。","Full-width card with a status badge Not verified / Under review / Verified / Rejected and a button that changes with it (Verify / View progress / View / Resubmit), opening the KYC status page."],["只有 Verified 才能投注、充值、提现；审核中预计 5 天（自然日）内完成，被拒绝可重新提交。","Only Verified can bet, deposit or withdraw; manual review is expected within 5 days (calendar days) and a rejected player may resubmit."]],"prd":[{"s":"6.5.2","n":"模块说明：用户身份认证卡；列表字段说明：实名状态"},{"s":"6.2.3","n":"实名状态四态"}],"tor":[{"c":"1.2.1","t":["只有通过核验的注册玩家才能使用系统","Only vetted registered players can access the betting system"]},{"c":"2.3.3","t":["新注册玩家先经端到端身份核验","End-to-end identity verification for newly registered players"]}],"tor_note":null},{"k":"b5","n":["Wallet 卡","Wallet tile"],"sel":"button.tile.bgt:nth-child(1)","find":null,"fn":[["卡片副标题显示总余额，默认掩码（₱***,***.**），与顶部栏胶囊同步；点击进入钱包页。","The subtitle shows the total balance, masked by default (₱***,***.**) and in sync with the top-bar pill; tapping opens Wallet."]],"prd":[{"s":"6.5.2","n":"模块说明：钱包卡 / 交易记录卡；姓名与余额掩码规则"}],"tor":[{"c":"1.4.42","t":["姓名和钱包余额默认掩码显示（如 ₱***,***.**）","Name and wallet balance masked by default (e.g. ₱***,***.**)"]},{"c":"1.4.2","t":["玩家看板展示钱包信息","Player dashboard displays player wallet information"]}],"tor_note":null},{"k":"b6","n":["Records 卡","Records tile"],"sel":"button.tile.bgt:nth-child(2)","find":null,"fn":[["卡片列出 Deposit · Withdraw · Bet · Prize 类别，点击进入交易流水页。","The tile lists Deposit · Withdraw · Bet · Prize and opens the Transactions page."]],"prd":[{"s":"6.5.2","n":"模块说明：钱包卡 / 交易记录卡"}],"tor":[{"c":"1.4.17","t":["玩家看板展示投注、中奖历史、充值和派彩","Dashboard shows betting and winning history, deposits and payouts"]}],"tor_note":null},{"k":"b7","n":["PlaySafe / Help / Account security 列表","PlaySafe / Help / Account security list"],"sel":"div.list","find":null,"fn":[["三行入口：PlaySafe（带 Play Responsibly 徽标，进限额与排除）、Help（含 Play Smart Help）、Account security（改密码、登录设备、临时停用、永久注销）。","Three rows: PlaySafe (with a Play Responsibly badge, limits and exclusion), Help (including Play Smart Help) and Account security (password, sign-in devices, temporary deactivation, permanent closure)."],["临时停用和永久注销不在账户页，合并在账号安全页底部的 Account management 分组。","Temporary deactivation and permanent closure are not on this page; they sit in the Account management group at the bottom of Account security."]],"prd":[{"s":"6.5.2","n":"模块说明：PlaySafe / 帮助 / 账号安全；账户管理；账户停用与注销"}],"tor":[{"c":"21.2.1","t":["全站展示负理性购彩信息","PlaySafe messages displayed throughout the platform"]},{"c":"1.4.32","t":["玩家可自行临时停用账户，重新认证后恢复","Player can temporarily deactivate the account and reactivate after re-authentication"]}],"tor_note":null},{"k":"b8","n":["Log out 按钮","Log out button"],"sel":null,"find":"Log out","fn":[["点击退出登录，提示 Logged out 并回到登录页；下次登录姓名和余额重新回到掩码状态。","Signs out with the toast Logged out and returns to Sign in; name and balance are masked again at the next sign-in."]],"prd":[{"s":"6.5.2","n":"姓名与余额掩码规则 ④：每次新登录一律默认掩码"}],"tor":[{"c":"1.4.45","t":["每次新登录默认掩码，不沿用上次显示选择","Masked by default at every new login, previous reveal choice not retained"]}],"tor_note":null}],"page_rules":[{"n":["整页规则：页脚与两端一致","Page-wide: footer and channel parity"],"fn":[["页脚常驻 Play Responsibly 和 For 18 years old and above only，不可关闭、不被弹窗以外的组件遮挡；H5 与 App 两端行为一致。","The footer always shows Play Responsibly and For 18 years old and above only, cannot be closed or hidden by anything except a dialog, and behaves the same on H5 and App."]],"prd":[{"s":"6.5.1","n":"全局页面规则（所有玩家界面）"}],"tor":[{"c":"21.2.1","t":["全站常驻展示“Play Responsibly”和“For 18 years old and above only”","Show “Play Responsibly” and “For 18 years old and above only” on every screen"]},{"c":"1.1.11","t":["App 与 Web 功能对等","Functional parity between web and mobile app"]},{"c":"1.1.12","t":["两渠道体验与数据一致","Consistent experience and data across both channels"]}]}],"vd":["V1.1：PlaySafe 徽标改为 Play Responsibly；停用 / 注销入口移入账号安全。","V1.1: PlaySafe badge reads Play Responsibly; deactivate / close moved into Account security."],"nw":false},"p_profile":{"id":"p_profile","ti":["资料修改","Edit profile"],"g":["我的账户","Account"],"prd":"6.5.3","pos":{"what":["玩家修改自己可改的资料：昵称、头像（颜色或上传图片）、个人中心背景，以及手机号、邮箱（需验证码）；姓名、出生日期、证件信息不能在这里改。","Players edit what they may change: nickname, avatar (colour or an uploaded image), profile background, and the mobile number and email (with a code); name, date of birth and ID details cannot be changed here."],"why":["昵称、头像等展示信息可以自由改，但联系方式是登录验证码和通知的接收地址，改它必须先证明新号码 / 新邮箱属于本人，否则被盗账号可以直接把验证码引向攻击者。","Display details are freely editable, but the contact details receive sign-in codes and notices, so a change must first prove the new number or email belongs to the player, otherwise a hijacked session could redirect codes to an attacker."],"who":["已登录且实名通过的玩家本人；管理端没有代改入口。改手机号的验证码发到新手机号（OTP_CHANGE_CONTACT），改邮箱发到新邮箱（EMAIL_OTP）。","The signed-in verified player only; Admin cannot edit it on the player's behalf. A mobile change sends the code to the new number (OTP_CHANGE_CONTACT), an email change to the new address (EMAIL_OTP)."]},"blocks":[{"k":"b1","n":["头像预览与颜色选择","Avatar preview and colour picker"],"sel":"div.card","find":null,"fn":[["大头像预览，下方五个颜色圆点选择头像底色，点选即时预览；点颜色会清掉已上传的图片。","A large avatar preview with five colour dots below it; a tap previews the colour immediately and clears any uploaded image."],["Upload photo 按钮选择本地图片（JPG 或 PNG，≤ 5 MB）；类型不符提示 \"Only JPG or PNG images are allowed.\"，超过 5 MB 提示 \"The image must be 5 MB or smaller.\"；通过后立即预览，账户页头像同步显示该图片（原型仅在本次会话内显示，未真实上传）。","The Upload photo button picks a local image (JPG or PNG, up to 5 MB); a wrong type shows \"Only JPG or PNG images are allowed.\" and over 5 MB shows \"The image must be 5 MB or smaller.\"; a valid file previews at once and the Account page avatar shows it too (session-only in the prototype, nothing is actually uploaded)."]],"prd":[{"s":"6.5.3","n":"表单字段：头像"}],"tor":[{"c":"1.4.3","t":["玩家看板提供资料修改功能","Player dashboard provides profile update features"]}],"tor_note":null},{"k":"b2","n":["Nickname 昵称","Nickname"],"sel":"#pf_n","find":null,"fn":[["文本框，1–20 字符，可自由修改，保存后账户页和各处显示的昵称一起更新；不影响实名信息。","Text field of 1–20 characters, freely editable; after saving the nickname is updated on the Account page and everywhere else; it does not touch the verified identity."]],"prd":[{"s":"6.5.3","n":"表单字段：昵称"}],"tor":[{"c":"1.4.3","t":["玩家看板提供资料修改功能","Player dashboard provides profile update features"]}],"tor_note":null},{"k":"b3","n":["Profile background 背景选择","Profile background picker"],"sel":"div.scroll:nth-child(3) > div:nth-child(5)","find":null,"fn":[["六张缩略图点选背景（默认为品牌色斜条纹），选中有白框；保存后账户页顶部头图即时更换。","Six thumbnails to pick from (default is the brand-colour stripes) with a white frame on the chosen one; after saving the cover on the Account page changes at once."]],"prd":[{"s":"6.5.3","n":"补充字段：个人中心背景"},{"s":"6.5.2","n":"模块说明：个性背景头图"}],"tor":[{"c":"1.4.3","t":["玩家看板提供资料修改功能","Player dashboard provides profile update features"]}],"tor_note":null},{"k":"b4","n":["手机号 / 邮箱（改动需验证码）","Mobile / Email (OTP required to change)"],"sel":null,"find":"Mobile (OTP required to change)","fn":[["手机号（如 +639•••）和邮箱只读显示，旁边 Change 按钮；点击弹出 Verify identity：Changing your mobile number needs an SMS code (OTP_TXN)，验证码通过后才允许输入新号码。","Mobile (e.g. +639•••) and email are shown read-only with a Change button; tapping opens Verify identity: Changing your mobile number needs an SMS code (OTP_TXN) before a new value can be entered."],["新手机号收到 OTP_CHANGE_CONTACT 验证码，新邮箱收到 EMAIL_OTP；新号码 / 新邮箱验证通过才生效，旧值在此之前一直有效。","The new number gets an OTP_CHANGE_CONTACT code and the new email an EMAIL_OTP code; the change applies only after the new value is verified and the old one stays valid until then."],["“修改联系方式”场景单独计数：每天最多 10 条验证码，错 5 次锁 1 小时，不影响登录和提现。","The “change contact” scenario is counted on its own: at most 10 codes per day and 5 wrong entries lock it for 1 hour, without affecting sign-in or withdrawals."]],"prd":[{"s":"6.5.3","n":"表单字段：手机号、邮箱；功能说明"},{"s":"6.1.4","n":"交互说明：验证码按场景分别计数"}],"tor":[{"c":"1.2.14","t":["更换手机号或邮箱须先通过同样的验证才生效","A changed mobile number or email must pass the same verification before it is accepted"]}],"tor_note":null},{"k":"b5","n":["不可修改字段说明","Locked-fields note"],"sel":null,"find":"Name, date of birth and ID details cannot be changed here.","fn":[["固定一句 Name, date of birth and ID details cannot be changed here.：姓名、出生日期、证件信息不可改，如需更正走实名重新提交；性别本期不采集、不显示。","Fixed line Name, date of birth and ID details cannot be changed here.: such corrections go through KYC resubmission; gender is not collected or shown in this phase."]],"prd":[{"s":"6.5.3","n":"功能说明：实名字段不可在此修改；性别本期不采集"}],"tor":[],"tor_note":["标书未要求（本方案补充）","Not required by the tender (added by this design)"]},{"k":"b6","n":["Save 按钮","Save button"],"sel":"button.btn.c","find":null,"fn":[["保存昵称、头像颜色和背景，提示 Saved 并返回账户页；联系方式的修改不靠 Save，在各自 Change 流程里验证后生效。","Saves nickname, avatar colour and background, shows Saved and returns to Account; contact changes do not use Save, they apply after their own Change verification."]],"prd":[{"s":"6.5.3","n":"表单字段"}],"tor":[{"c":"1.4.3","t":["玩家看板提供资料修改功能","Player dashboard provides profile update features"]}],"tor_note":null}],"page_rules":[],"vd":null,"nw":false},"p_security":{"id":"p_security","ti":["账号安全","Account security"],"g":["我的账户","Account"],"prd":"6.1.7","pos":{"what":["修改密码、查看登录设备历史，并在底部“账户管理”里自助临时停用或永久注销账户。","Change password, review the sign-in device history and, under Account management at the bottom, self-service temporary deactivation or permanent closure of the account."],"why":["让玩家自己掌控账号安全和去留：停用可逆、注销不可逆且有阻断条件，防止带着未结资金或未决事项就把账号关掉；所有停用/注销写审计，满足标书对停用与删除的可追溯要求。","Lets players control account security and exit: deactivation is reversible, closure is irreversible and guarded by blockers so no account disappears with money or open items; every request is audited as the tender requires."],"who":["已登录玩家（正常、已限制投注、自我排除中均可进入）；未登录者进不来；停用后的账号只能走登录页重新认证。","Signed-in players (Normal, Bet-restricted and Self-excluded can all open it); not reachable when signed out; a deactivated account can only come back through sign-in re-authentication."]},"blocks":[{"k":"b1","n":["修改密码","Change password"],"sel":"#sc > div.card:nth-child(1)","find":null,"fn":[["三个输入框 Current password / New password / Confirm，每个带眼睛图标可显示明文；点 Update password 提交。","Three inputs Current password / New password / Confirm, each with an eye icon to reveal the text; Update password submits."],["逐项校验：未填当前密码提示 “Enter your current password”；新密码须 8–20 位含字母和数字，否则 “Use 8–20 characters with letters and digits”；新密码与旧密码相同提示 “New password must differ from the current one”；两次不一致提示 “Passwords do not match”。","Per-field checks: empty current password -> “Enter your current password”; new password must be 8–20 characters with letters and digits, else “Use 8–20 characters with letters and digits”; same as current -> “New password must differ from the current one”; mismatch -> “Passwords do not match”."],["通过后提示 “Password updated” 并返回上一页；日志不记录密码内容。","On success the toast “Password updated” shows and the page returns; the password itself is never written to logs."],["当前密码输错同样计入登录失败次数（与登录、停用、注销共用同一计数，5 次锁定 15 分钟，提示 “Your account is temporarily locked after too many failed sign-in attempts. Please try again later.”）；达到上限时账号被锁定，全部会话下线（回到登录页）、信任设备失效，并写审计（只有修改密码、自助停用、自助注销三个已登录入口这样做；登录入口达到上限只锁定 15 分钟并写审计，不踢已登录会话、不清信任设备，原型登录不校验密码，不演示）；锁定期内无法登录，也无法再提交修改密码。累计规则不变。","A wrong current password counts toward the same login-failure counter (shared with sign-in, deactivate and close; 5 failures lock for 15 minutes with “Your account is temporarily locked after too many failed sign-in attempts. Please try again later.”). When the limit is reached the account is locked, all sessions are signed out (back to Sign in), trusted devices are invalidated and an audit entry is written (only the three signed-in entries — change password, self-deactivate, self-close — do this; the sign-in entry only locks for 15 minutes and writes an audit entry, without signing out sessions or clearing trusted devices, and the prototype does not check the password at sign-in so that case is not demoed); while locked, sign-in and further password changes are refused. Accumulation rules are unchanged."]],"prd":[{"s":"6.1.7","n":"功能说明：修改密码"},{"s":"6.1.3","n":"登录：密码规则同登录/注册"},{"s":"6.1.7","n":"MQ135：可信设备 ID 仅显示末 4 位；修改密码原密码输错计入登录失败并锁定（附录 A 第 210 项）"}],"tor":[],"tor_note":["标书未要求（本方案补充）；标书 1.1.14 的登录密码规则在登录页落实","Not required by the tender (added by this design); the login password rule of 1.1.14 is covered on the login page"]},{"k":"b2","n":["登录设备历史","Sign-in history"],"sel":"#sc > div.card:nth-child(3)","find":null,"fn":[["列出最近登录的终端：终端（App / H5）、App 版本、设备型号、地点、时间，当前设备带绿色 This device 标签。","Lists recent sign-ins: channel (App / H5), App version, device model, place and time; the current device carries a green This device badge."],["脚注 “History only — ‘trust this device’ is not available in phase 1.”：只做历史展示，不提供“信任此设备”开关，也不能在此踢出设备。","Footnote “History only — ‘trust this device’ is not available in phase 1.”: display only, no trust-this-device switch and no sign-out of other devices here."],["每条登录记录显示：Terminal（H5 / App）、Device（设备型号）、App version、Login method（Password + SMS / Password + biometric；H5 恒为 Password + SMS）。当前会话登录后新增一条在最上方（S.signins）。","Each sign-in row shows Terminal (H5 / App), Device model, App version and Login method (Password + SMS / Password + biometric; H5 is always Password + SMS). A new row for the current session is added on top after signing in (S.signins)."],["App 端另有 Trusted devices 列表：每台设备只显示设备 ID 末 4 位，其余用 * 代替（如 ***************B4D2），其余字段为信任时间与最近使用时间。","On the App, the Trusted devices list shows only the last 4 characters of each device ID with the rest replaced by * (e.g. ***************B4D2), plus trusted time and last-used time."]],"prd":[{"s":"6.1.7","n":"登录设备历史列表（终端、设备型号、App 版本、时间）；不提供“信任此设备”开关"},{"s":"6.5.2","n":"规则 ①：停用/注销审计记录终端、App 版本与设备型号"},{"s":"6.1.7","n":"MQ135：可信设备 ID 仅显示末 4 位；修改密码原密码输错计入登录失败并锁定（附录 A 第 210 项）"}],"tor":[],"tor_note":["标书未要求（本方案补充）；标书 1.1.15 的“设备认证”作为 MFA 因子本期不做（见 6.1.7：不提供信任此设备）","Not required by the tender (added by this design); the device-authentication MFA factor of 1.1.15 is not built in this phase (6.1.7: no trust-this-device)"]},{"k":"b3","n":["账户管理","Account management"],"sel":"#sc > div.card:nth-child(6)","find":null,"fn":[["两个入口：Temporarily deactivate account（临时停用）和 Close account permanently（永久注销）；页脚说明停用可通过再次登录恢复，注销不可恢复。","Two entries: Temporarily deactivate account and Close account permanently; the note below says deactivation is undone by signing in again, closing is not."],["已限制投注、自我排除中的玩家同样可以自助停用；停用和注销请求都写审计（终端 H5/App、App 版本、设备型号、时间、玩家），并通过短信 + 站内信 + push 通知玩家。","Bet-restricted and self-excluded players can also self-suspend; both requests are written to the audit log (channel H5/App, App version, device model, time, player) and the player is notified by SMS + in-app message + push."],["永久注销只对「正常」和「已限制投注」的账号开放；「已停用（玩家自助）」和「已临时停用（管理端）」的账号够不到此入口（行置灰；自助停用的账号显示 “Sign in to restore your account first.”，先登录恢复后再注销）。自助注销仍要过阻止条件（未决申领、待处理提现、未结争议、余额、未开奖票）。","Permanent closure is open only to Normal and Bet-restricted accounts; self-deactivated and admin-deactivated accounts cannot reach it (the row is greyed; a self-deactivated account sees “Sign in to restore your account first.” and must restore before closing). Self-service closure still passes the blockers (pending claim, pending withdrawal, pending deposit, open dispute, balance, undrawn tickets); a pending deposit is blocked with “Cannot delete: the account has a pending prize claim, withdrawal, deposit or dispute.”."]],"prd":[{"s":"6.5.2","n":"账户停用与注销（表格）与规则 ①②"},{"s":"6.1.7","n":"登录与安全：账户管理入口在本页"}],"tor":[{"c":"1.4.32","t":["可临时停用账户，重新认证后可随时恢复","Player can temporarily deactivate and reactivate at any time after re-authentication"]},{"c":"1.4.33","t":["可永久注销，注销前须告知后果，不可逆","Permanent deactivation with prior notice of consequences, irreversible"]},{"c":"1.4.35","t":["停用与注销请求（渠道、时间、玩家）写入审计","Deactivation/deletion requests (channel, timestamp, player) logged in audit trail"]}],"tor_note":null},{"k":"b4","n":["“Temporarily deactivate account?”弹窗","Temporarily deactivate account? dialog"],"sel":"#ovl .sheet","find":null,"fn":[["说明停用期间无法使用账号；再次登录须重新认证（密码 + 短信验证码）才能恢复，恢复后回到停用前的状态（已限制投注的仍是限制投注）。停用期间忘记密码照常发码，重置密码后仍须用新密码 + 短信验证码登录才恢复，重置本身不恢复账号。","Explains the account cannot be used while deactivated; signing in again requires re-authentication (password + SMS code), after which the previous state returns (a bet-restricted account stays restricted). Forgot password still sends a code to a deactivated account, but after the reset the player must still sign in with the new password and an SMS code; the reset alone does not restore it."],["按钮 Cancel 关闭；须输入登录密码（错误提示 “Incorrect password.”，连续错 5 次锁 15 分钟，与登录共用计数）；Deactivate 确认后账号变为“已停用（玩家自助）”，立即退出登录并回到登录页，站内信标题 Account suspended。","Cancel closes; the login password must be entered (a wrong one shows “Incorrect password.”; 5 wrong in a row lock for 15 minutes, counted together with sign-in); Deactivate sets the account to “deactivated (self-service)”, signs the player out at once and returns to the login page; the in-app message is titled Account suspended."]],"prd":[{"s":"6.5.2","n":"账户停用与注销：临时停用账户一行（重新认证后恢复到停用前状态）"},{"s":"6.1.5","n":"找回密码规则：自助停用账号重置后仍须密码 + 短信验证码登录才恢复"}],"tor":[{"c":"1.4.32","t":["可临时停用账户，重新认证后可随时恢复","Temporary deactivation, reactivation at any time subject to re-authentication"]},{"c":"1.4.35","t":["停用请求写入审计","Deactivation request logged in the audit trail"]}],"tor_note":null,"state":"[...document.querySelectorAll('#view .list > div')].find(x=>x.textContent.includes('Temporarily')).click()"},{"k":"b5","n":["“Cannot close account”弹窗","Cannot close account dialog"],"sel":"#ovl .sheet","find":null,"fn":[["有任一阻止项就不能注销：未决申领（pending prize claim）、待处理提现（pending withdrawal）、处理中充值（pending deposit）、钱包余额大于 0（wallet balance）、有未开奖的票（tickets waiting for a draw）、未结争议（dispute）；逐项列出原因和怎么办。","Any blocker prevents closure: pending prize claim, pending withdrawal, pending deposit, wallet balance above zero, tickets waiting for a draw, open dispute; each is listed with the reason and what to do."],["余额阻止文案 “Cannot delete: the account has a wallet balance. Withdraw it first.”，未开奖票文案 “Cannot delete: the account has tickets waiting for a draw.”；点 OK 关闭，账号不变。“争议”本期没有对应功能，该项暂不会命中。","Balance blocker reads “Cannot delete: the account has a wallet balance. Withdraw it first.”, undrawn tickets “Cannot delete: the account has tickets waiting for a draw.”; OK closes and nothing changes. Disputes have no feature this phase, so that item never hits yet."]],"prd":[{"s":"6.5.2","n":"账户停用与注销：永久注销账户一行的阻断条件；规则 ③ 争议、积分本期无功能"}],"tor":[{"c":"1.4.34","t":["有未决申领、待处理提现、未结争议时禁止注销并告知具体原因","Block deletion with an unresolved claim, pending withdrawal or open dispute and tell the player why"]}],"tor_note":null,"state":"[...document.querySelectorAll('#view .list > div')].find(x=>x.textContent.includes('Close account')).click()"},{"k":"b6","n":["“Close account permanently?”弹窗","Close account permanently? dialog"],"sel":"#ovl .sheet","find":null,"fn":[["无阻止项时才出现：先列后果（账号永久关闭、不可恢复、不可逆；请先提现全部奖金余额；交易与审计日志依法保留）。","Shown only when nothing blocks: lists the consequences first (account closed permanently, cannot be restored or undone; withdraw prize balance first; transaction and audit logs are kept as required by law)."],["须输入登录密码（错误提示 “Incorrect password.”，计数同停用弹窗）；须勾选 “I understand this cannot be undone” 才能点 Close account，否则提示 “Please tick the acknowledgement”；确认后状态变为“已注销”，退出登录，写审计，发送 Account deleted 站内信和短信。","the login password must be entered (wrong: “Incorrect password.”, same counting as the deactivate dialog); “I understand this cannot be undone” must be ticked before Close account, otherwise “Please tick the acknowledgement”; on confirm the account becomes “deleted”, the player is signed out, an audit entry is written and an Account deleted message and SMS are sent."]],"prd":[{"s":"6.5.2","n":"账户停用与注销：永久注销账户一行（后果说明、二次确认、不可逆）与规则 ①②"}],"tor":[{"c":"1.4.33","t":["注销前告知后果（含积分作废），不可逆","Consequences notified before deletion (incl. unredeemed loyalty points), irreversible"]},{"c":"1.4.35","t":["注销请求写入审计","Deletion request logged in the audit trail"]}],"tor_note":null,"state":"A.closeBlockers=()=>[];[...document.querySelectorAll('#view .list > div')].find(x=>x.textContent.includes('Close account')).click()"},{"k":"b7","n":["信任的设备卡片（仅 App）","Trusted devices card (App only)"],"sel":"#trusted-card","find":"Last used","fn":[["仅 App 形态出现「Trusted devices」卡片，逐行显示设备名、Trusted 信任时间、Last used 最近使用时间，当前设备带 “This device” 标签；每行 Remove 按钮（.td-remove）打开确认弹窗 “Remove this device?”（Cancel / Remove），移除后该设备下次登录恢复密码 + 短信。无设备时显示 “No trusted devices.”。H5 整块不出现。","Only the App terminal shows the “Trusted devices” card: each row has device name, Trusted (trusted-at) time and Last used time, with a “This device” tag on the current one; a Remove button (.td-remove) opens the “Remove this device?” confirm (Cancel / Remove), and that device goes back to password + SMS on its next sign-in. The empty state reads “No trusted devices.”. H5 omits the whole block."],["卡片下方小字说明：修改或重置密码、更换手机号、玩家自助停用、管理端停用账号或重置密码都会移除全部信任设备（#trust-note）；发生后会追加 “All trusted devices were removed (原因) at 时间”，原因如 password changed / password reset / mobile number changed / account self-deactivated / account deactivated by admin / password reset by admin。卡片没有有效期、数量上限文字（本期不设）。状态键 S.trusted、S.trustNote。","The note under the card (#trust-note) says changing or resetting the password, changing the mobile number, self-deactivation, or an admin deactivating the account or resetting the password removes all trusted devices; after it happens it adds “All trusted devices were removed (reason) at time”, with a reason such as password changed / password reset / mobile number changed / account self-deactivated / account deactivated by admin / password reset by admin. The card carries no expiry or device-limit text (none in this phase). State keys: S.trusted, S.trustNote."]],"prd":[{"s":"6.1.7","n":"可信设备管理：列表、逐个移除、全部失效"}],"tor":[{"c":"1.1.15","t":["可信设备登录用设备原生生物识别代替 OTP","Trusted-device logins use native biometrics in lieu of OTP"]}],"tor_note":null,"state":"A.term('app');S.trusted=[{id:'t1',name:'iPhone 15',at:'2026-10-17 09:00',last:'2026-10-17 09:30',cur:true},{id:'t2',name:'Pixel 8',at:'2026-10-05 20:14',last:'2026-10-08 21:40',cur:false}];A.reset('security')"},{"k":"b8","n":["移除信任设备确认弹窗","Remove trusted device confirm"],"sel":"#trust-rm","find":"Remove this device?","fn":[["点 Remove 后弹出确认：“Remove this device?”，说明该设备下次需密码 + 短信；Cancel 保留，Remove（#trust_rm_ok）确认并写审计。","Tapping Remove opens “Remove this device?” explaining it will need password + SMS next time; Cancel keeps it, Remove (#trust_rm_ok) confirms and writes an audit entry."]],"prd":[{"s":"6.1.7","n":"移除后该设备恢复密码 + 短信验证码"}],"tor":[{"c":"1.1.15","t":["可信设备登录用设备原生生物识别代替 OTP","Trusted-device logins use native biometrics in lieu of OTP"]}],"tor_note":null,"state":"A.term('app');S.trusted=[{id:'t1',name:'iPhone 15',at:'2026-10-17 09:00',last:'2026-10-17 09:30',cur:true},{id:'t2',name:'Pixel 8',at:'2026-10-05 20:14',last:'2026-10-08 21:40',cur:false}];A.reset('security');A.trustRm('t2')"}],"page_rules":[{"n":["App 专属：可信设备与生物识别","App only: trusted device and biometrics"],"fn":[["可信设备（仅 App）：玩家在 App 上选择“信任此设备”后，该设备后续登录仍先输入密码，之后用设备原生生物识别（Face ID / 指纹）代替短信验证码这一步；只对这一台设备生效，列表可在“登录与安全”查看、移除。改密码、找回密码重置、换绑手机号、玩家自助停用、管理端停用或重置密码都会使全部信任设备失效，之后一律密码 + 短信验证码登录，可重新信任。本期信任设备不设有效期、不限数量，靠手动移除和上述自动失效控制。","Trusted device (App only): after the player chooses “Trust this device” in the App, later sign-ins on that device still ask for the password first, then use native biometrics (Face ID / fingerprint) in place of the SMS code step only; it applies to that one device only and the list can be viewed and removed under Login & security. Changing or resetting the password, changing the mobile number, self-deactivation, and an admin deactivating the account or resetting the password all invalidate every trusted device; the next sign-in is password + SMS and the device can be trusted again. This phase has no expiry and no device limit; control is by manual removal and the automatic invalidation above."],["提现 MFA（仅 App）：App 上用设备原生生物识别作为提现二次验证；H5 仍用短信验证码。","Withdrawal MFA (App only): on the App the withdrawal second step uses the device’s native biometrics; H5 keeps the SMS code."],["回退：手机本地生物识别比对失败、取消或设备不支持时只回退到短信验证码（登录时仍已输入密码），不计失败次数、不落“已拒绝”流水、不推进锁定。只有服务端能校验到的失败才计数：设备签名校验不通过、短信验证码错误——提现连续 3 次锁 30 分钟并各落一笔“已拒绝”，登录按错误验证码计入登录场景次数；管理端登录不用生物识别，仍为密码 + 4 位短信 OTP。","Fallback: if the local biometric check fails, is cancelled or is unsupported, it only falls back to the SMS code (the password was already entered at sign-in), with no failure count, no Rejected transaction and no lock progress. Only failures the server can verify count: an invalid device signature or a wrong SMS code — in withdrawal 3 in a row lock withdrawals for 30 minutes and each records a Rejected transaction; in sign-in they count like a wrong code in the sign-in scenario. Admin sign-in does not use biometrics and stays password plus 4-digit SMS OTP."],["App 专属，演示原型用「Terminal」开关模拟：右侧演示面板 Terminal 选 App（iPhone 15 · iLotto App 1.0.3）即进入 App 形态，登录页、提现验证和“账号安全”才出现可信设备与生物识别；默认 H5 形态下这些入口全部不出现。生物识别由页面内模拟的原生弹窗代替（Authenticate / Cancel），面板「Biometric: local check fails」开关模拟本地比对失败（不计数），「Biometric: device signature invalid」开关模拟服务端签名校验失败（计数）。","App only. The demo simulates it with the Terminal switch: in the demo panel pick App (iPhone 15 · iLotto App 1.0.3) and the sign-in, withdrawal verification and Account security screens show trusted-device and biometric features; the default H5 terminal shows none of them. Native biometrics are replaced by an in-page simulated sheet (Authenticate / Cancel), and the panel toggle “Biometric: local check fails” simulates a local failure (not counted) and “Biometric: device signature invalid” simulates a server-side signature failure (counted)."]],"prd":[{"s":"6.1.3","n":"登录：App 可信设备与生物识别，H5 不支持"},{"s":"6.1.4","n":"第二因子：可信设备以生物识别代替短信验证码，失败回退短信"},{"s":"6.4.3","n":"提现 MFA：App 生物识别，H5 短信"},{"s":"6.8.3","n":"登录记录与玩家档案：终端 H5/App、设备型号，可信设备列表只读"}],"tor":[{"c":"1.1.15","t":["可信设备须成功登记原生生物识别，之后该设备登录以生物识别代替 OTP；设备端生物识别被关闭则信任自动撤销","A device is tagged Trusted only after native biometric enrolment; later logins use biometrics in lieu of OTP; trust is revoked if device biometrics are disabled"]},{"c":"1.4.29","t":["有生物识别能力的移动设备上，每笔提现的 MFA 用设备原生生物识别，短信或邮件 OTP 仅作回退","On biometric-capable mobile devices, withdrawal MFA uses native biometrics, with SMS/email OTP only as fallback"]},{"c":"1.1.42","t":["自动化风险分超阈值时要求证明有真人，可信设备上为生物识别验证","When the automation risk score exceeds the threshold, proof of a person is required; on a Trusted Device it is biometric verification"]},{"c":"1.3.9","t":["登记或更换电子钱包 / 银行账户前必须完成 MFA，即使在已认证会话或有可信设备","Enrolling or changing an e-wallet or bank account requires MFA, even in an authenticated session or on a Trusted Device"]},{"c":"1.4.25","t":["每笔提现确认前必须完成 MFA，即使已认证会话或有可信设备","Every withdrawal requires MFA right before confirmation, even in an authenticated session or on a Trusted Device"]},{"c":"8.7.8","t":["安全剧本可撤销玩家的可信设备状态","Security playbooks can revoke a player’s Trusted Device status"]},{"c":"8.7.9.1","t":["安全告警上下文含已登记设备 ID 与可信设备状态","Security alert context includes registered device IDs and Trusted Device status"]}]}],"vd":["V1.1：新增账户管理；恢复回停用前状态；钱包余额和未开奖票阻止注销。","V1.1: new Account management; restore returns to the previous state; a wallet balance or tickets awaiting a draw block deletion."],"nw":false},"p_notif":{"id":"p_notif","ti":["通知","Notifications"],"g":["我的账户","Account"],"prd":"6.5.4","pos":{"what":["铃铛进入的通知中心：Messages 页签列出站内信（开奖、中奖、退款、账号状态、限额变化、Reality check 记录等），Notices 页签列出管理端公告；同时承载 Reality check 弹窗的说明。","The bell's notification centre: the Messages tab lists in-app messages (draws, prizes, refunds, account state, limit changes, Reality check records), the Notices tab lists admin announcements; it also covers the Reality check pop-up."],"why":["把与玩家有关的事件集中到登录后的页内，既不泄露中奖信息到短信邮件，又让玩家回溯所有重要提醒；现实检查是 PCSO 理性购彩要求，没有它玩家无从被提醒游戏时长和花费。","Keeps player-relevant events inside the signed-in dashboard so winning information never leaks via SMS or email while every important reminder stays traceable; the Reality check meets PCSO's play-responsibly rules and, without it, players are never reminded of time and spend."],"who":["已登录玩家（正常、已限制投注、自我排除中；自我排除期间不再收到营销类消息）；未登录者看不到。Reality check 对所有在线玩家都弹出，不可关闭。","Signed-in players (Normal, Bet-restricted, Self-excluded; no marketing messages while self-excluded); hidden when signed out. The Reality check appears for every online player and cannot be turned off."]},"blocks":[{"k":"b1","n":["铃铛与未读角标","Bell with unread counter"],"sel":".topbar .capsule button.ib:has(span.dot)","find":null,"fn":[["顶部栏右上角的铃铛是通知入口；红点数字是未读站内信条数，读完一条减一，“Mark all read”后消失。","The bell at top right opens this page; the red number is the count of unread messages, one less per message read and gone after Mark all read."],["角标只显示数量、不含内容；H5 登录后立即显示同样的页内计数，App 另可在桌面图标上显示角标，玩家拒绝系统权限时以页内计数兜底。","The badge shows a count only, never content; H5 shows the same in-page counter right after login, and the App can also badge its home-screen icon, falling back to the in-page counter if the player denies the OS permission."]],"prd":[{"s":"6.5.4","n":"列表字段说明：已读状态——未读在顶部状态栏铃铛展示角标"},{"s":"4.2","n":"流程 2：登录与控制面板准入（通知计数在控制面板内）"}],"tor":[{"c":"1.4.37","t":["App 图标上显示未读通知数量角标（只显示数量不含内容）","Numeric badge count (count only, no content) on the app icon for unread notifications"]},{"c":"1.4.38","t":["App 申请角标权限，被拒绝时以登录后控制面板内的计数器兜底","Badge permission requested; in-app counter is the fallback if denied"]},{"c":"1.4.40","t":["Web 端登录后立即显示等价的页内通知计数","Web app shows an equivalent in-Dashboard notification counter on login"]}],"tor_note":null},{"k":"b2","n":["Messages / Notices 页签","Messages / Notices tabs"],"sel":"#sc > div.seg","find":null,"fn":[["两个页签：Messages（站内信，默认）和 Notices（公告，管理端发布，与首页公告卡片同一份数据）；切换只换列表，不离开本页。","Two tabs: Messages (in-app messages, default) and Notices (published by the admin side, same data as the home announcement card); switching only swaps the list."]],"prd":[{"s":"6.5.4","n":"页面结构：站内信与公告两个页签"}],"tor":[],"tor_note":["标书未要求（本方案补充）；公告的发布在管理端“系统 › 公告”","Not required by the tender (added by this design); notices are published in the admin Announcements page"]},{"k":"b3","n":["全部已读","Mark all read"],"sel":".sub > button.sm.b","find":null,"fn":[["位于页眉右侧，一键把全部站内信标为已读；只作用于 Messages，在 Notices 页签下按钮隐藏。","In the header on the right; marks every message read in one tap; it applies to Messages only and is hidden on the Notices tab."]],"prd":[{"s":"6.5.4","n":"页面结构：点开标记已读，可“全部已读”"}],"tor":[],"tor_note":["标书未要求（本方案补充）","Not required by the tender (added by this design)"]},{"k":"b4","n":["站内信列表","Messages list"],"sel":"#sc > div.card","find":null,"fn":[["每条显示图标、标题、正文摘要和时间，未读带小红点，点一下标为已读；最新在前。按四类筛选：All / Transaction / Account / Operations / PlaySafe（开奖提醒、系统维护归 Operations；中奖、退款、充值/提现归 Transaction；实名、账号状态、限额、冷静期、自我排除归 Account；Reality check 归 PlaySafe）；收件箱另有一条示例：账号状态 “Your account was password reset. Reason: by our team.”。","Each row shows icon, title, body and time, an unread dot, and a tap marks it read; newest first. Types include draw reminder, prize, refund received, deposit/withdrawal result, identity result, limit change, raise request cancelled, cool-off and self-exclusion start/end, maintenance and Reality check."],["账号状态用三个独立标题：Account suspended / Account reactivated / Account deleted；正文不含申领码、证件号、银行卡号。","Account state changes use three separate titles: Account suspended / Account reactivated / Account deleted; bodies never contain claim codes, ID numbers or card numbers."],["中奖结果、输赢、奖金和入账确认只在登录后的页内显示，不通过短信或邮件带出具体信息；自我排除期间停发营销类消息，交易类和法定类照常。","Win results, win/loss, prize amounts and credit confirmations are visible only inside the signed-in dashboard, never in SMS or email; marketing messages stop during self-exclusion while transactional and statutory ones continue."]],"prd":[{"s":"6.5.4","n":"列表字段说明（通知类型、标题、内容、已读状态、发生时间）；功能说明：自我排除期间停发营销类通知"},{"s":"6.2.4","n":"自我排除期间停发营销类通知（冷静期不停）"}],"tor":[{"c":"2.3.11","t":["对开奖结果、奖金入账、账号状态变化、实名结果、限额提醒等关键事件自动通知玩家","Automated notifications for draw results, prize credits, account status changes, KYC outcomes and limit alerts"]},{"c":"1.4.36","t":["中奖信息、输赢、奖金、入账确认只能在登录后的控制面板内查看","Win information, win/loss, prize amounts and credit confirmations viewable only in the authenticated dashboard"]},{"c":"1.4.18","t":["控制面板对投注、中奖、未中奖等提供实时提醒","Real-time dashboard alerts for bets, wins and losses"]},{"c":"21.4.2","t":["自我排除生效后立即停发营销、促销类通信","Marketing and promotional communications suspended on activation of self-exclusion"]}],"tor_note":null},{"k":"b5","n":["公告列表","Notices list"],"sel":"#sc > div.faq.card","find":null,"fn":[["Notices 页签下是可折叠列表：标题 + 发布日期，点一行展开正文；最新在前，与首页公告卡片同一份数据。","On the Notices tab a collapsible list: title + publish date, tap a row to expand the body; newest first, same data as the home announcement card."],["页脚小字 “Notices are published from Admin › System › Announcements” 说明来源.","The small footer “Notices are published from Admin › System › Announcements” names the source."]],"prd":[{"s":"6.5.4","n":"页面结构：公告页签——可折叠列表，最新在前，与首页公告卡片同一份数据"}],"tor":[],"tor_note":["标书未要求（本方案补充）","Not required by the tender (added by this design)"],"state":"[...document.querySelectorAll('#sc .seg button')][1].click()"},{"k":"b6","n":["Reality check 弹窗","Reality check pop-up"],"sel":"#ovl .sheet","find":null,"fn":[["登录后连续游戏达到提醒间隔（默认 10 分钟，玩家可调但不得短于管理端下限）就弹出；显示 Time since sign-in、Total bet this session、This session win/loss (after tax)、Wallet balance，以及日/周/月已投注额对比各自限额；汇总均从本次登录算起。","Pops up once continuous play reaches the interval (default 10 minutes, adjustable by the player but never below the admin floor); shows Time since sign-in, Total bet this session, This session win/loss (after tax), Wallet balance and the daily/weekly/monthly bet totals against their limits, all counted since sign-in."],["输赢 = 已开奖票奖金 − 已开奖票投注额，未开奖的票只计入投注总额；弹窗不可关闭，必须在 Take a break 与 Continue playing 之间二选一。","Win/loss = after-tax prizes of drawn tickets (including prizes pending claim, after tax) minus the stakes of those tickets, undrawn tickets count only in total bet; the pop-up cannot be dismissed, the player must choose Take a break or Continue playing."],["Continue playing 关闭弹窗并重新计时；Take a break 记录选择后引导到 PlaySafe 冷静期。每次弹出和选择都写审计，并在站内信留一条 Reality check 记录；该提醒不可在任何设置里永久关闭，也不经短信/邮件发送。","Continue playing closes the pop-up and restarts the timer; Take a break logs the choice and guides to the PlaySafe cool-off. Every display and choice is audited and leaves a Reality check message; it cannot be switched off permanently and is never sent by SMS or email."]],"prd":[{"s":"6.5.4","n":"现实检查（Reality Check）弹窗表：触发条件、弹窗内容、按钮、响应、展示范围、审计"},{"s":"6.2.4","n":"现实检查提醒间隔设置：不得短于管理端下限"},{"s":"6.9.1","n":"管理端配置现实检查间隔下限与默认值"}],"tor":[{"c":"21.5.1","t":["连续游戏时长或累计投注笔数达到阈值时自动触发，并按配置间隔重复","Triggered at a prescribed session duration or bet count and recurring; intervals configurable in the back office"]},{"c":"21.5.2","t":["显示本次游戏时长、投注总额、输赢汇总和钱包余额","Shows session time, total wagered, win/loss summary and wallet balance"]},{"c":"21.5.3","t":["只在登录后的控制面板显示，不经短信/邮件","Shown only in the authenticated dashboard, never via SMS or email"]},{"c":"21.5.4","t":["须玩家确认后才继续，并记录继续或停止","Player must acknowledge; continue/stop is recorded"]},{"c":"21.5.5","t":["不可被玩家永久关闭，每个间隔重复出现","Cannot be permanently disabled; recurs at each interval"]},{"c":"21.5.6","t":["每次显示及玩家响应（时间、时长、投注额）写入日志","Every display and response logged with timestamp, duration and wager"]},{"c":"21.3.4","t":["周期性屏幕提醒，显示本次时长和限额期内累计消费，间隔可由玩家配置","Periodic reminders of session duration and spending, interval configurable by the player"]}],"tor_note":null,"state":"A.reality()"}],"page_rules":[],"vd":["V1.1：新增“公告”页签，公告入口从首页移到铃铛；新增 Reality check 弹窗及记录。","V1.1: new Notices tab with the notice entry moved from home to the bell; new Reality check pop-up and record."],"nw":false},"p_playsafe":{"id":"p_playsafe","ti":["PlaySafe（限额与排除）","PlaySafe"],"g":["理性购彩","PlaySafe"],"prd":"6.2.4","pos":{"what":["玩家自己管理理性购彩的唯一页面：设置日/周/月充值和投注限额、单笔上限、现实检查间隔，开启冷静期，或启用自我排除；并链接到风险说明与 Play Smart Help。","The single page where players manage responsible play: daily/weekly/monthly deposit and bet limits, the single-bet cap, the Reality check interval, cool-off and self-exclusion, with links to risk information and Play Smart Help."],"why":["PCSO 要求玩家无需人工介入就能自己设限、休息或排除，并且“调低即时、调高延后”以防冲动反悔；没有这页，玩家无法自控，平台也达不到理性购彩合规要求。","PCSO requires players to set limits, take a break or exclude themselves without anyone's help, with “lower now, raise later” to stop impulsive reversal; without this page players cannot self-control and the platform fails the play-responsibly rules."],"who":["已登录并通过实名的玩家（正常、已限制投注）可全部操作；自我排除中、冷静期内仍可进入查看状态与限额，但排除不可撤销；未登录、未认证、审核中玩家到不了。管理端“理性购彩”配置各项默认值与下限。","Signed-in verified players (Normal, Bet-restricted) can use everything; during self-exclusion or cool-off the page still opens to show status and limits but exclusion cannot be undone; signed-out, unverified and under-review players cannot reach it. The admin PlaySafe page sets defaults and floors."]},"blocks":[{"k":"b1","n":["顶部说明卡：Play responsibly","Intro card: Play responsibly"],"sel":"div.fade > div.card:nth-child(1)","find":null,"fn":[["盾牌插图 + 一句话 “Play responsibly. Manage limits, cool-off and self-exclusion here.”，说明本页集中管理限额、冷静期与自我排除。","Shield illustration plus “Play responsibly. Manage limits, cool-off and self-exclusion here.”: this one page manages limits, cool-off and self-exclusion."],["PlaySafe 在首页、玩法页、投注确认页、钱包、我的彩票、账户页和每页顶部栏都有快捷入口，一键进入本页；所有玩家状态都能进入。","PlaySafe has a shortcut on Home, Play, bet confirmation, Wallet, My tickets, Account and in the top bar of every page, one tap to this page; every player state can open it."]],"prd":[{"s":"6.2.4","n":"入口与分步说明：① 快捷入口——所有玩家页面都提供 PlaySafe 快捷入口"}],"tor":[{"c":"21.2.2","t":["所有面向玩家的界面都能便捷、常驻地进入自我排除和理性博彩资源","Easy, persistent access to self-exclusion and play-responsibly resources from all player-facing interfaces"]}],"tor_note":null},{"k":"b2","n":["三步管好购彩","Three steps to stay in control"],"sel":"div.fade > div.card:nth-child(2)","find":null,"fn":[["三行步骤卡：① Set daily / weekly / monthly limits，② Need a rest? Start a cool-off，③ Stopping for the long term? Self-exclude；每行右侧按钮（Set limits / Start cool-off / Self-exclude）点一下滚动到下方对应区块。","Three step rows: ① Set daily / weekly / monthly limits, ② Need a rest? Start a cool-off, ③ Stopping for the long term? Self-exclude; the button on each row (Set limits / Start cool-off / Self-exclude) scrolls to the matching section below."]],"prd":[{"s":"6.2.4","n":"入口与分步说明：② 分步说明 + 直接按钮"}],"tor":[{"c":"21.2.9","t":["理性购彩专区提供分步说明，并可直接激活各项控制","Step-by-step instructions in the PlaySafe section, with direct activation of each control"]}],"tor_note":null},{"k":"b3","n":["充值限额","Deposit limits"],"sel":"div.fade > div.card:nth-child(4)","find":null,"fn":[["Daily / Weekly / Monthly 三行，各显示当前限额，点 Edit 弹出档位选择；日限额最高 ₱20,000，周、月限额档位更高，默认值与值域以 PCSO 配置为准（页脚 “Values are back-office parameters, subject to PCSO rules.”）。","Daily / Weekly / Monthly rows each show the current limit and Edit opens a value picker; the daily maximum is ₱20,000, weekly and monthly offer higher steps; defaults and ranges follow PCSO configuration (footer “Values are back-office parameters, subject to PCSO rules.”)."],["调低即时生效；调高要等 24 小时，期间该行显示 Raise pending 24h，等待内再调低、再次调高或到期校验不通过会取消并通知 Raise request cancelled。","Lowering is immediate; raising waits 24 hours and the row shows Raise pending 24h; lowering, re-raising or failing the check at expiry cancels it with a Raise request cancelled message."],["统计周期为自然周期（UTC+8）：日 00:00、周一 00:00、每月 1 日 00:00 起算；充值在下单时占用限额，失败后扣回；超限由充值页拦截。","Periods are calendar periods (UTC+8): daily from 00:00, weekly from Monday 00:00, monthly from the 1st; a deposit takes its limit at order time and gives it back if it fails; overruns are blocked on the Deposit page."]],"prd":[{"s":"6.2.4","n":"表单字段（限额配置）：每日/每周/每月充值限额；限额统计规则"}],"tor":[{"c":"21.3.1","t":["玩家可设日/周/月充值限额，超限的充值自动拦截","Player-set daily/weekly/monthly deposit limit, over-limit top-ups blocked automatically"]},{"c":"21.3.6","t":["调低限额立即生效，调高须延后（≥24 小时）才生效","Reductions take effect immediately; increases deferred (at least 24 hours)"]},{"c":"21.1.3","t":["可配置的理性博彩限额（日/周/月）；会话时长限额本期不做","Configurable responsible-play limits (daily/weekly/monthly); session-duration limits are not built this phase"]}],"tor_note":null},{"k":"b4","n":["投注限额","Bet limits"],"sel":"div.fade > div.card:nth-child(6)","find":null,"fn":[["Daily / Weekly / Monthly 投注限额，日、周、月三项独立设置、同时生效；Edit、24 小时调高等待、Raise pending 24h 标签与充值限额相同。","Daily / Weekly / Monthly bet limits, set independently and applied together; Edit, the 24-hour raise wait and the Raise pending 24h badge work as for deposit limits."],["投注累计按出票成功的投注单金额计，作废退款不回减当期累计；超限的下单在 Play 页被拦截。","The bet total counts successfully issued bets and a void refund does not reduce the period total; orders over the limit are blocked on the Play page."]],"prd":[{"s":"6.2.4","n":"表单字段（限额配置）：每日/每周/每月投注限额；限额统计规则"}],"tor":[{"c":"21.3.2","t":["日/周/月投注限额独立可配、可并行，超限投注自动拦截","Independent daily/weekly/monthly spending limits applied concurrently, over-limit bets blocked"]},{"c":"21.3.6","t":["调低即时、调高延后生效","Reduction immediate, increase deferred"]}],"tor_note":null},{"k":"b5","n":["单笔投注上限","Single bet cap"],"sel":"div.fade > div.card:nth-child(7)","find":null,"fn":[["显示单笔投注上限（默认 ₱2,000，不得低于 ₱25）；不能高于每日投注限额，每日限额调到它以下时同步下调并发 Single-bet cap lowered 通知。","Shows the single-bet cap (default ₱2,000, not below ₱25); it cannot exceed the daily bet limit and is lowered with it, with a Single-bet cap lowered message."],["说明文字：调低即时生效，调高需等待 24 小时；七项限额不能清空（没有不设限 / Clear 入口，必须在范围内填值）。","The note says lowering is immediate while raising waits 24 hours; the seven limits cannot be cleared (there is no no-limit / Clear option, a value within the range is required)."]],"prd":[{"s":"6.2.4","n":"表单字段：单笔投注上限（≥₱25 且 ≤ 每日投注限额）"}],"tor":[{"c":"21.3.2","t":["投注限额可配置，超限投注自动拦截","Configurable spending limits with automatic blocking"]}],"tor_note":null},{"k":"b6","n":["现实检查提醒间隔","Reality check interval"],"sel":"#ps_rc","find":null,"fn":[["右上角灰色标签显示当前间隔（默认 10 min）；输入分钟数点 Save。","The grey badge at top right shows the current interval (default 10 min); enter minutes and tap Save."],["低于管理端下限时提示 “The reminder interval cannot be shorter than N minutes.”，不保存；超过 1,440 分钟提示 “The interval cannot be longer than 1440 minutes.”；成功提示 “Saved — reminder every N minutes”。提醒弹窗内容见通知页。","Below the admin floor it shows “The reminder interval cannot be shorter than N minutes.” and does not save; above 1440 it shows “The interval cannot be longer than 1440 minutes.”; success shows “Saved — reminder every N minutes”. The pop-up itself is described on the Notifications page."],["现实检查弹窗按「连续游戏时长」或「累计投注笔数」触发，哪个先到就弹（时长默认取上面的间隔，笔数默认留空（不按笔数触发），设置后均从本次登录算起）；弹出后两个计数都重置（时长重新计时、笔数清零），点 Continue playing 同样重置。","The reality check pop-up fires on continuous play time or cumulative bet count, whichever comes first (time follows the interval above; the bet count is blank by default (no count trigger); once set, both counted from this sign-in). Once it fires both counters reset (time restarts, count goes to zero); tapping Continue playing resets them the same way."]],"prd":[{"s":"6.2.4","n":"现实检查提醒间隔设置：不得短于管理端设定的下限（默认 10 分钟）"},{"s":"6.9.1","n":"管理端配置现实检查间隔下限"}],"tor":[{"c":"21.3.4","t":["周期性提醒的间隔由玩家配置，不低于 PCSO 要求的最小频率","Reminder interval configurable by the player, not below PCSO's minimum frequency"]},{"c":"21.5.1","t":["现实检查间隔由 PCSO 在管理端配置","Reality Check interval configurable by PCSO in the back office"]}],"tor_note":null},{"k":"b7","n":["冷静期","Cool-off"],"sel":"div.fade > div.card:nth-child(10)","find":null,"fn":[["三个时长按钮 24 hours / 7 days / 30 days；点后弹 “Start cool-off?” 确认，提示期间不能投注和充值、不可提前结束。","Three duration buttons 24 hours / 7 days / 30 days; tapping opens “Start cool-off?” stating no betting or deposits for the period and no early end."],["确认后提示 “Cool-off started”，到期自动解除、无需审批；冷静期内仍可看余额、提现奖金、登录，营销通知不停。","On confirm “Cool-off started” shows; it ends by itself without approval; during it balances, prize withdrawal and sign-in still work and marketing notices continue."],["冷静期不可缩短；任何缩短或取消须延后生效的规则本期未做，页面不提供取消入口。","A cool-off cannot be shortened; the deferred shorten/cancel rule is not built this phase and the page offers no cancel entry."]],"prd":[{"s":"6.2.4","n":"表单字段：冷静期（24 小时/7 天/30 天，到期自动解除不需要审批）"}],"tor":[{"c":"21.3.5","t":["玩家选冷静期时长，期间禁投注和充值，不可缩短，到期自动恢复","Player-chosen cooling-off; no bets or top-ups; cannot be shortened; auto-restored at expiry"]},{"c":"21.3.6","t":["缩短或取消冷静期须延后生效（本期未做）","Shortening or cancelling a cooling-off must be deferred (not built this phase)"]}],"tor_note":null},{"k":"b8","n":["冷静期中卡片","Cool-off active card"],"sel":null,"find":"Cool-off active","fn":[["冷静期生效后出现在页面顶部：标题 Cool-off active + 青色标签 until <结束时间>，说明期间禁止投注与充值、到期自动解除。","Once a cool-off is on, a card at the top shows the title Cool-off active with a cyan until <end time> badge, stating betting and deposits are disabled and it ends automatically."]],"prd":[{"s":"6.2.4","n":"表单字段：冷静期；受限状态说明"}],"tor":[{"c":"21.3.5","t":["冷静期内禁止投注和充值，到期自动恢复","Bets and top-ups restricted during cooling-off, auto-restored at expiry"]}],"tor_note":null,"state":"S.cool={until:S.clock+24*3600e3};renderKeep()"},{"k":"b9","n":["自我排除","Self-exclusion"],"sel":"div.fade > div.card:nth-child(12)","find":null,"fn":[["四个周期 3 months / 6 months / 1 year / Permanent（P eck · support hotline”，进入 Play Smart Help（购彩习惯自测、求助热线、转介机构）。","A full-width row, subtitle “Play Check · support hotline”, opening Play Smart Help (Play Check, hotline, referral organisations)."]],"prd":[{"s":"6.2.5","n":"页面构成：⑤“前往 PlaySafe”与购彩习惯自测入口互相链接"}],"tor":[{"c":"21.6.1","t":["维持到 PCSO 认可的治疗机构、热线和咨询方的转介渠道","Referral pathways to PCSO-approved treatment centres, hotlines or counsellors"]},{"c":"21.6.2","t":["在网站和 App 上提供求助热线、治疗机构联系信息","Helpline and treatment-provider contact information on websites and applications"]}],"tor_note":null},{"k":"b12","n":["限额选择弹窗","Limit edit dialog"],"sel":"#ovl .sheet","find":null,"fn":[["点任一 Edit 后弹出，标题如 “Daily deposit limit”，一行提示 “Lowering applies now; raising applies after a 24-hour wait.”，下面是档位按钮（₱500 起，日限额最高 ₱20,000），当前值高亮。","Opens from any Edit with a title such as “Daily deposit limit”, the hint “Lowering applies now; raising applies after a 24-hour wait.” and value buttons (from ₱500, daily up to ₱20,000) with the current one highlighted."],["选低于当前值：提示 “Lowered — effective now”；选高于当前值：提示 “Raise takes effect in 24 hours”，并发 Limit raise pending 通知。","A value below the current one shows “Lowered — effective now”; above it shows “Raise takes effect in 24 hours” with a Limit raise pending message."]],"prd":[{"s":"6.2.4","n":"表单字段（限额配置）：调低即时生效，调高需24小时等待"}],"tor":[{"c":"21.3.6","t":["调低即时生效，调高延后至少 24 小时","Reductions immediate, increases deferred at least 24 hours"]},{"c":"21.3.7","t":["限额的修改、延后、到期全部写入审计日志","Modifications, deferments and expiries of limits logged in the audit trail"]}],"tor_note":null,"state":"A.limEdit('dep','d')"},{"k":"b13","n":["“Start cool-off?”确认弹窗","Start cool-off? dialog"],"sel":"#ovl .sheet","find":null,"fn":[["文字 “You cannot bet or deposit for <时长>; it cannot be ended early.”，按钮 Cancel / Confirm；Confirm 后冷静期立即开始并发 Cool-off started 站内信。","Text “You cannot bet or deposit for <duration>; it cannot be ended early.”, buttons Cancel / Confirm; Confirm starts the cool-off at once and sends a Cool-off started message."]],"prd":[{"s":"6.2.4","n":"表单字段：冷静期（选定后禁止投注充值）"}],"tor":[{"c":"21.3.5","t":["冷静期一经启动不可提前结束","A cooling-off, once activated, cannot be reversed or shortened"]}],"tor_note":null,"state":"A.cool(24,'24 hours')"},{"k":"b14","n":["“Confirm self-exclusion?”确认弹窗","Confirm self-exclusion? dialog"],"sel":"#ovl .sheet","find":null,"fn":[["列明所选周期和限制：保持登录但为受限模式，不能投注、充值，可看余额、提现奖金、用帮助；不会自动恢复，需在 PlaySafe 申请并等 PCSO 审批；选永久时再加红字 “Permanent exclusion cannot be reversed.”","States the chosen period and limits: stay signed in in restricted mode, no betting or deposits, balances, prize withdrawal and help remain; it does not end by itself, apply in PlaySafe and wait for PCSO approval; for Permanent an extra red line “Permanent exclusion cannot be reversed.”"],["按钮 Cancel / Exclude me；确认后写审计并发 Self-exclusion started 站内信。","Buttons Cancel / Exclude me; confirming writes an audit entry and sends a Self-exclusion started message."]],"prd":[{"s":"6.2.4","n":"操作按钮：发起自主排除（立即排除，二次确认弹窗，不可逆需二次确认）"}],"tor":[{"c":"21.4.1","t":["排除一经激活不可撤销；允许仅查看余额、提取奖金和访问理性购彩资源","Exclusion irreversible once active; access limited to viewing balances, withdrawing winnings and play-responsibly resources"]},{"c":"21.4.3","t":["自我排除记录（身份、日期、周期）进入审计","Self-exclusion records (identity, date, period) kept in the audit trail"]}],"tor_note":null,"state":"A.excl('6 months',0)"}],"page_rules":[],"vd":["V1.1：新增 Reality check interval（可设提醒间隔，不得低于管理端下限）和 Risk and warning signs 入口。","V1.1: adds Reality check interval (reminder minutes, not below the admin floor) and a Risk and warning signs entry."],"nw":false},"p_excl":{"id":"p_excl","ti":["自我排除中（受限登录）","Self-exclusion (restricted)"],"g":["理性购彩","PlaySafe"],"prd":"6.2.4","pos":{"what":["自我排除生效期间玩家保持登录但进入受限模式：每页顶部显示提示条，投注、充值被拦截，余额、彩票、交易流水、提现奖金和帮助仍可用。","While self-exclusion is on the player stays signed in but in restricted mode: a banner tops every page, betting and deposits are blocked, and balances, tickets, transactions, prize withdrawal and help still work."],"why":["让主动排除自己的玩家无法再花钱，又不至于被锁在自己的奖金之外；受限提示和拦截弹窗同时防止误操作。对应 PCSO 自我排除要求，没有它排除只是个标记，起不到约束作用。","Stops a self-excluded player from spending while not locking them out of their own prize money; the banner and blocking dialogs prevent accidental actions. It implements PCSO's self-exclusion rule; without it exclusion would be a mere flag."],"who":["玩家状态“自我排除中”（定期排除期内或永久排除）；其他玩家看不到该提示条。管理端不能手动缩短排除，只处理到期后的解除申请。","Players in the Self-excluded state (fixed term running, or permanent); other players never see the banner. The admin side cannot shorten an exclusion, it only handles lift requests after expiry."]},"blocks":[{"k":"b1","n":["受限提示条","Self-exclusion restriction banner"],"sel":"div.exban","find":null,"fn":[["自我排除生效期间，首页、钱包、投注等每个页面顶部都有红色提示条：“Self-exclusion active (until <到期日>): no betting or deposits. You can view balances, withdraw prize funds and use help.”；永久排除时写 “Permanent self-exclusion …”。","While self-exclusion is on, every page (Home, Wallet, Play …) carries a red banner at the top: “Self-exclusion active (until <end date>): no betting or deposits. You can view balances, withdraw prize funds and use help.”; for permanent exclusion it reads “Permanent self-exclusion …”."],["排除期内点横幅进入 PlaySafe 查看状态；到期后横幅改为 “…ended but is not lifted automatically” 并带 Apply to lift 按钮，见 Exclusion ended 页。","During the period tapping the banner opens PlaySafe to see the status; after expiry it changes to “…ended but is not lifted automatically” with an Apply to lift button, see the Exclusion ended page."]],"prd":[{"s":"6.2.4","n":"受限登录（自我排除期内）：各页顶部提示条与状态表"}],"tor":[{"c":"21.4.1","t":["自我排除期间不得投注、充值，仅可查看余额、提取奖金、访问理性购彩资源（本方案为受限登录，不终止会话，与标书“终止会话、禁止登录”表述有差异，见追溯矩阵“冲突”）","No bets or top-ups during exclusion; access limited to balances, withdrawing winnings and play-responsibly resources (this design uses restricted sign-in rather than terminating the session, flagged as a conflict in the trace matrix)"]},{"c":"21.1.2","t":["自我排除须在各电子渠道同步生效","Self-exclusion must apply across all e-channels"]}],"tor_no ion cannot be lifted here. Please contact PCSO.” with no lift entry; a separate higher-authority PCSO procedure is required and the admin side does not provide it this phase."]],"prd":[{"s":"6.2.4","n":"受限登录（自我排除期内）表：定期排除期内、永久排除两行"},{"s":"6.2.4","n":"表单字段：自主排除周期；功能说明：自我排除期间停发营销类通知"}],"tor":[{"c":"21.4.2","t":["自我排除生效后立即停发营销、促销通信","Marketing and promotional communications suspended immediately on activation"]},{"c":"21.4.5","t":["永久排除不得恢复，除非走 PCSO 更高授权的专门流程","No reinstatement of a permanent exclusion except via a separate PCSO procedure with higher authorization"]}],"tor_note":null,"state":"A.go('playsafe')"}],"page_rules":[{"n":["整页规则：受限期间能做什么","Page-wide: what still works while restricted"],"fn":[["可：查看余额、彩票、交易流水、提现奖金余额（仍须 MFA）、使用帮助和 PlaySafe；不可：投注、充值。","Allowed: balances, tickets, transactions, prize-balance withdrawal (MFA still required), help and PlaySafe; blocked: betting and deposits."],["定期排除到期不会自动恢复，须申请解除并经 PCSO 审批；审批通过后受限立即解除，无需重新登录。","A fixed-term exclusion does not lift itself; the player must apply and PCSO must approve; on approval the restriction ends at once without re-login."]],"prd":[{"s":"6.2.4","n":"受限登录（自我排除期内）：规则段"},{"s":"6.9.2","n":"自我排除恢复审批"}],"tor":[{"c":"21.4.4","t":["定期排除到期不自动恢复，需重新核验身份、风险确认并经 PCSO 审批","Fixed-term exclusion not auto-reinstated; identity re-check, risk acknowledgement and PCSO approval required"]}]}],"vd":null,"nw":false},"p_excl_ended":{"id":"p_excl_ended","ti":["自我排除到期 · 申请解除","Exclusion ended · apply to lift"],"g":["理性购彩","PlaySafe"],"prd":"6.2.4","pos":{"what":["定期排除到期后，玩家在 PlaySafe 或提示条上申请解除：重新验证身份、确认了解风险，提交后等 PCSO 在管理端审批；页面同时展示审批中、被驳回等状态。","After a fixed-term exclusion ends, the player applies to lift it from PlaySafe or the banner: re-verify identity, acknowledge the risks, submit and wait for PCSO to approve in the admin side; the page also shows pending and declined states."],"why":["到期后自动恢复会让冲动的玩家立刻回到投注；要求主动申请、核验身份并经人工审批，是 PCSO 对排除后恢复的要求。没有这一步，排除形同虚设。","Auto-restoring at expiry would drop an impulsive player strai her-authority PCSO procedure"]}],"tor_note":null},{"k":"b2","n":["Apply to lift exclusion 按钮","Apply to lift exclusion"],"sel":"div.fade > div.card:nth-child(3) > button.btn","find":null,"fn":[["仅在定期排除已到期、且没有审批中的申请时出现；点后弹出 Request restoration 弹窗。被驳回后文案变 Apply again；审批中与永久排除不显示。","Appears only when a fixed-term exclusion has ended and no request is pending; opens the Request restoration dialog. After a decline the label becomes Apply again; hidden while a request is pending and for permanent exclusion."]],"prd":[{"s":"6.2.4","n":"操作按钮：申请解除排除（仅定期排除到期且没有审批中的申请时可见；永久排除不显示）"}],"tor":[{"c":"21.4.4","t":["玩家通过提交恢复申请重新启用账户","Player must submit a reinstatement request"]}],"tor_note":null},{"k":"b3","n":["Request restoration 弹窗","Request restoration dialog"],"sel":"#ovl .sheet","find":null,"fn":[["① Re-verify identity：输入短信验证码（演示码 1234）；验证码错误按场次计数，连续错误会锁定。","① Re-verify identity: enter the SMS code (demo code 1234); wrong codes are counted per scenario and repeated failures lock it."],["② 勾选 “I understand the risks and will continue with PlaySafe tools”；未勾选点 Submit request 提示 “Please tick the acknowledgement”。","② Tick “I understand the risks and will continue with PlaySafe tools”; submitting unticked shows “Please tick the acknowledgement”."],["成功提示 “Submitted — awaiting PCSO approval”，状态卡变 Request under review；申请进入管理端“理性购彩 › 自我排除恢复审批”，批准后立即恢复投注与充值、无需重新登录（提示 “Approved. Betting is available again.”）。","On success “Submitted — awaiting PCSO approval” shows and the card becomes Request under review; the request goes to the admin PlaySafe › Self-exclusion restoration approval, and on approval betting and deposits return at once without re-login (“Approved. Betting is available again.”)."]],"prd":[{"s":"6.2.4","n":"操作按钮：申请解除排除（跳转身份核验+风险确认流程，提交后进入审批）"},{"s":"6.9.2","n":"自我排除恢复审批：管理端审批通过/驳回"}],"tor":[{"c":"21.4.4","t":["恢复申请须含身份重新认证、风险确认，并经 PCSO 人员在管理端审批","Reinstatement requires identity re-authentication, risk acknowledgement and approval by PCSO personnel through the back office"] 盘后的投注一律拒绝","Bets after the cut-off are rejected"]}],"tor_note":null}],"page_rules":[],"vd":["V1.1：新增 Server time (UTC+8)；EZ2 / Swertres 按场次各自封盘；封盘提前时间改按场次配置。","V1.1: adds Server time (UTC+8); EZ2 / Swertres close per session; the cut-off lead is configured per session."],"nw":false}};const SPEC_LOG=["① 范围与终端：热门号码投注上限改为本期实现号码级上限（仅乐透类）；终端支持 H5 和 App（iOS、Android）；② 玩家端：首页和 Play 页展示最近一期开奖结果；公告集中在首页公告卡片（与网点卡同样式，去掉顶部公告条），铃铛进入的通知页分\"站内信\"\"公告\"两个页签；临时停用、永久注销合并进\"账号安全\"；数字类每天多期次，投注页在倒计时上方\"选择期次\"勾选多个期次（跨场次、跨天）；最低充值 ₱20；现实检查弹窗、理性购彩常驻文案，全文措辞统一；③ 票与申领：复式（System 7–12）和 5 号轮转每个组合各出一张独立电子票；申领码改由玩家在\"我的彩票\"点 Start claim 发起生成；④ 游戏管理：游戏固定 9 个（去掉\"新增游戏\"）；每个游戏卡片只有一个\"编辑游戏\"入口，分\"基本信息\"\"销售与开奖\"\"玩法与奖级\"\"版本历史\"四个分区，所有改动走双人审核（单价、奖池储备百分比、玩法与奖级——运营专员提交、财务复核批准；其余销售与开奖设置、基本信息、上架——运营专员提交、运营复核批准；下架即时生效；提交人与批准人须为两人）；编辑游戏页右侧新增预览区，随分区显示未提交草稿的玩家端示意（封面卡 / 投注页顶部 / 投注页，版本历史无预览），审批页并排显示修改前 / 修改后预览；游戏规则（选号个数与范围、玩法参数、奖级结构、判奖方式）不再由开发内置，全部在管理端可配置并版本化，每次批准生成新的\"规则版本\"，变更申请选\"起始生效期次\"（只影响未开售期次），期次生成时绑定规则版本并记下当时的销售参数，玩家端展示该期规则版本；判奖引擎的基本算法和玩法算法类型仍内置，全新算法需开发实现；新增\"投注限额\"页签（号码级上限：锁定、限额、实时投注金额，仅乐透类；游戏级默认号码限额）；封盘提前时间和开售间隔按游戏的每个开奖场次配置；新增\"无开奖日\"页签（在\"期次与开奖\"菜单下，与\"期次列表\"并列；节日和固定星期不开奖，走变更申请，自动跳过、作废并退款）；\"版本历史\"分区按规则版本记录变更（系统自动生成，只读）；⑤ 期次与开奖：开奖号码只由运营专员手工录入；期次表增\"首次录入时间\"\"实际发布时间\"和操作留痕表；开奖流程重做：先只录开奖号码（运营专员）并由财务复核独立再录，一致后系统统计线上各奖级中奖注数（仅 PCSO 查看，不发布），PCSO 线下算奖（线下中奖注数不进系统），再由运营专员录入奖池金额和奖池平分类奖级单注奖金、财务复核独立再录一遍，经合理性检查后授权发布；期次状态机由九态改十态，在\"待复核\"后增\"待录入奖金\"；⑥ 管理端其他：角色由 5 个增至 6 个，新增\"运营复核\"（PCSO，只批准、不提交，可见仪表盘、游戏管理、期次与开奖只读），权限矩阵相应增一行；关键参数变更、玩家永久删除须第二位授权人员批准；一个员工账号只能持有一个角色，不能管理自己的账号；用户管理（新增、编辑、启用、禁用）；审计日志分六类，导出 CSV、JSON、XML；全局参数税率改为税率表（多行：条件+税率），期次创建时记下整张表；玩家详情增\"累计统计\"\"登录记录\"\"操作记录\"页签，搜索支持多条件；交易流水新增\"票据\"页签，支持扫码查询；公告增展示位置、平台、起止日期、图片、跳转链接，正文可插入图片，增\"图片库\"页签；⑦ 报表：新增\"交易监控\"页签（含下钻到投注单：分页、导出、权限）；销售报表与开奖销售合并为\"销售\"页签（按时间 / 按期次两个视图），交易当量只在交易监控；新增头奖报告、没收/逾期未领奖金报告、最终税报告；玩家报表（原\"注册玩家名单\"）为数量汇总（总数、新增、分布）+ 导出名单；销售和派奖增\"按地区\"维度，日期快捷项；奖金与派彩报表改日期范围 + 游戏 + 期次筛选，新增按期次列表（应派/实派/差异）、按付款日对账小块、代扣税按税率档拆分；头奖、没收/逾期、最终税报告、交易监控加游戏/期次筛选，头奖注数只显示线上；销售按期次增退款与净销售 ⑧ 报表按标书第 3 章补齐：销售增季/半年/年粒度（预扣税/VAT/PCSO 应收列待口径，本期不做）；销售和派奖按地区逐级拆分到市；业绩页增分红计算、奖池按游戏明细、损益占位；奖金页增中奖人数；玩家报表增人口统计（性别不采集）；新增每日对账页签；附录 A 增第 152–155 项；⑨ 批次 6 评论决议：期号改为 `游戏编码-年月日-场次`（如 L649-20261012-1）；彩票带条形码（内容为票号）；单次购买最多 1,000 张票；注销增加余额大于 0、有未开奖票两项阻止条件，注销后同号暂不能重新注册；自助停用和管理端停用均可用于已限制投注账号，恢复回停用前状态；期次延期不走变更申请，恢复按新封盘时间回已封盘或销售中；无开奖日命中已生成未开售期次一律转已作废（有票退款、不删除期次）；预购期次按已批准日程自动补足到下限，不再逐次审批；封盘提前时间修改影响所有未开售期次，开售间隔修改只影响之后生成的期次；已生成未开售期次可被预购；奖池平分按注；一次多期购买为一张投注单；排除期间只停营销通知（冷静期不停）；公告只分普通公告与登录后弹窗两类"];
