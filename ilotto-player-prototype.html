<html lang="en">
<head>

<title>iLotto · Player App Prototype</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050505;color:var(--tx);font-family:-apple-system,"PingFang SC","Microsoft YaHei",Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#stage{height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;gap:36px;background:radial-gradient(900px 500px at 50% 0%,rgba(34,211,238,.10),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(139,92,246,.10),transparent 60%),#050505}

#phone{width:414px;height:868px;border-radius:62px;background:#000;border:12px solid #1b1b1d;box-shadow:0 0 0 2px #2d2d30,0 50px 120px rgba(0,0,0,.7),0 0 80px rgba(34,211,238,.08);position:relative;overflow:hidden}
#screen{position:absolute;inset:0;background:var(--s1);display:flex;flex-direction:column;overflow:hidden}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#000;z-index:60}
#sb{height:50px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px 34px;font-size:15px;font-weight:600;position:relative;z-index:40}
#sb .ic{display:flex;gap:6px;align-items:center}
.glow{position:absolute;top:0;left:0;right:0;height:360px;background:radial-gradient(ellipse at 15% 0%,rgba(34,211,238,.30),transparent 60%),radial-gradient(ellipse at 95% 5%,rgba(245,158,11,.20),transparent 55%);pointer-events:none;z-index:0}
#view{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;z-index:1}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 110px;scrollbar-width:none;position:relative}
.scroll::-webkit-scrollbar{display:none}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 8px;flex:none}

.logo i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--cy),#3b82f6 60%,var(--vi));display:grid;place-items:center;font-style:normal;font-size:15px;box-shadow:0 0 18px rgba(34,211,238,.45)}
.capsule{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.09);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:4px 6px}

.sub{display:flex;align-items:center;gap:8px;padding:4px 12px 10px;flex:none}
.sub h2{font-size:20px;font-weight:800;flex:1}
.back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.09);display:grid;place-items:center}
.card{background:var(--card);border-radius:24px;padding:16px;position:relative;overflow:hidden}

.mt{margin-top:14px}.mt2{margin-top:22px}.mt3{margin-top:8px}
.row{display:flex;align-items:center}.sp{justify-content:space-between}.g8{gap:8px}.g12{gap:12px}.fl1{flex:1}
.mu{color:var(--mu)}.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:700}
h1{font-size:26px;font-weight:800;letter-spacing:.2px}h3{font-size:17px;font-weight:800}
.big{font-size:52px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.05}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:16px;width:100%;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}

.btn.d{background:#262626;color:#fff}

.btn.s{height:38px;font-size:14px;width:auto;padding:0 18px}
.btn[disabled]{opacity:.35;pointer-events:none}
.pillbtn{height:34px;padding:0 14px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.inp{width:100%;height:50px;border-radius:16px;background:#1a1a1a;border:1.5px solid #262626;padding:0 16px;font-size:15px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--cy)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 22px) 22px,calc(100% - 16px) 22px;background-size:6px 6px;background-repeat:no-repeat}
label.inp.bad,.inp.bad:focus{border-color:#f43f5e!important;background-color:rgba(244,63,94,.07)}
.wbad{outline:1.5px solid #f43f5e;outline-offset:5px;border-radius:12px}
.ferr{color:#fb7185;font-size:12.5px;margin-top:6px;line-height:1.4;display:flex;gap:5px;align-items:flex-start;animation:ferr .18s ease-out}
.ferr::before{content:"!";flex:none;width:14px;height:14px;border-radius:50%;background:#f43f5e;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;margin-top:1px}
@keyframes ferr{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.lb{display:block;font-size:12px;color:var(--mu);margin:14px 0 6px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.b-gr{background:rgba(52,211,153,.15);color:var(--gr)}.b-am{background:rgba(245,158,11,.15);color:var(--am)}.b-ro{background:rgba(251,113,132,.15);color:var(--ro)}.b-cy{background:rgba(34,211,238,.15);color:var(--cy)}.b-gy{background:#262626;color:#aaa}.b-vi{background:rgba(139,92,246,.18);color:#b9a2ff}
.glowbadge{box-shadow:0 0 12px rgba(245,158,11,.45)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:999px;background:#1c1c1c;color:#bbb;font-weight:600;font-size:13px;display:inline-flex;align-items:center;transition:.2s}
.chip.on{background:#fff;color:#000}
.seg{display:flex;background:#1a1a1a;border-radius:999px;padding:4px}.seg button{flex:1;height:36px;border-radius:999px;font-weight:700;font-size:13px;color:#999;transition:.25s}.seg button.on{background:#fff;color:#000}
.circ{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:#ddd;font-weight:600}
.circ i{width:62px;height:62px;border-radius:50%;background:#1b1b1b;display:grid;place-items:center;border:1px solid #262626;transition:.15s}
.circ:active i{transform:scale(.92);background:#262626}
.tabbar{position:absolute;left:14px;right:14px;bottom:14px;height:64px;border-radius:999px;background:rgba(32,32,36,.78);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.09);box-shadow:0 12px 40px rgba(0,0,0,.6);display:flex;align-items:center;padding:0 6px;z-index:30}
.tabbar button{flex:1;height:52px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:700;color:#9a9a9a;transition:.25s}
.tabbar button.on{background:rgba(255,255,255,.14);color:var(--cy)}
.tabbar button.on svg{filter:drop-shadow(0 0 6px rgba(34,211,238,.7))}
.ball{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#2c2c2c,#171717);border:1px solid #2c2c2c;display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:#cfcfcf;transition:transform .15s,background .2s,box-shadow .2s}
.ball.on{background:radial-gradient(circle at 32% 28%,#7ee8fb,#22d3ee 40%,#2563eb);color:#021018;box-shadow:0 0 0 2px rgba(34,211,238,.35),0 0 18px rgba(34,211,238,.7);transform:scale(1.12)}
.ball.roll{background:radial-gradient(circle at 32% 28%,#fcd34d,#f59e0b);color:#201300;transform:scale(1.08)}
.ball.mini{width:30px;height:30px;font-size:12px}
.ball.hit{background:radial-gradient(circle at 32% 28%,#6ee7b7,#10b981);color:#012;border-color:#34d399;box-shadow:0 0 14px rgba(52,211,153,.6)}
.ball.win{background:radial-gradient(circle at 32% 28%,#fde68a,#f59e0b);color:#201300;box-shadow:0 0 16px rgba(245,158,11,.7)}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(.1) translateY(-30px);opacity:0}100%{transform:scale(1);opacity:1}}
.board{display:grid;gap:8px;justify-items:center}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.list>div{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid #1f1f1f}.list>div:last-child{border:0}
.list .ico{width:36px;height:36px;display:grid;place-items:center;color:#fff}

.gi{display:inline-grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 14px rgba(0,0,0,.35)}
.svc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:22px;background:linear-gradient(100deg,rgba(251,191,36,.16),rgba(251,191,36,.04) 55%,#141414);border:1px solid rgba(251,191,36,.28);margin-top:22px}
.svc .tag{font-size:10px;font-weight:800;letter-spacing:.8px;color:#fbbf24}
.svc .hd{font-weight:700;font-size:14px;margin-top:2px;transition:opacity .25s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svc .nw{width:8px;height:8px;border-radius:50%;background:#fb7185;box-shadow:0 0 0 4px rgba(251,113,133,.2)}
.nearby{position:relative;display:block;width:100%;text-align:left;margin-top:12px;border-radius:22px;overflow:hidden;background:#101c1f;border:1px solid #1d3036;min-height:96px}
.nearby svg.mp{position:absolute;inset:0;width:100%;height:100%}
.nearby .in{position:relative;display:flex;align-items:center;gap:12px;padding:14px;background:linear-gradient(90deg,#101c1f 38%,rgba(16,28,31,.35))}
.nf{display:block;padding:14px;border-radius:22px;background:#141414;border:1px solid #222;margin-bottom:10px}
.nf.pin{background:linear-gradient(120deg,rgba(96,165,250,.16),#141414 60%);border-color:rgba(96,165,250,.35)}
.nf summary{list-style:none;cursor:pointer}.nf summary::-webkit-details-marker{display:none}
.nf .ty{font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:999px}
.nf .body{margin-top:10px;padding-top:10px;border-top:1px dashed #2a2a2a;color:#b5b5b5;font-size:13px;line-height:1.6}
.os{background:#000;border-radius:28px 28px 0 0;margin:-34px -16px 0;padding:14px 16px 20px;position:relative}
.os .grab{width:40px;height:4px;border-radius:2px;background:#333;margin:0 auto 12px}
.ot{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #1d1d1d}.ot:last-child{border:0}
.ot .num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#04130e}
.ot .go{height:32px;padding:0 12px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.tile{border-radius:26px;padding:18px;min-height:150px;position:relative;overflow:hidden;background:#171717;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.tile .arr{width:42px;height:42px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.bgart{position:absolute;inset:0;pointer-events:none;z-index:0}.bgart svg{width:100%;height:100%;display:block}.bgt::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.5) 50%,rgba(0,0,0,0) 88%);pointer-events:none}.bgt>div,.bgt>.arr{position:relative;z-index:2}
.tile .il{position:absolute;right:-6px;bottom:-4px;width:112px;height:112px}
.gcard{border-radius:22px;background:#161616;overflow:hidden;text-align:left;transition:transform .18s,box-shadow .2s;position:relative}
.gcard:active{transform:scale(.97)}
.gcard.off{opacity:.38;filter:grayscale(1);pointer-events:none}
.gcard .cv{height:84px;position:relative}
.banners{display:flex;gap:10px;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.bn{flex:none;width:calc(100% - 44px);height:176px;border-radius:26px;padding:18px;position:relative;overflow:hidden;text-align:left}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.dots i{width:6px;height:6px;border-radius:3px;background:#3a3a3a;transition:.3s}.dots i.on{width:18px;background:#fff}
.glowtxt{background:linear-gradient(135deg,#fde68a,#f59e0b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px rgba(245,158,11,.45))}
.grad{background:linear-gradient(135deg,#7ee8fb,#22d3ee 40%,#60a5fa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(6px);z-index:80;display:flex;align-items:flex-end;animation:fade .25s}
.ov.mid{align-items:center;padding:0 22px}
.sheet{width:100%;max-height:86%;overflow-y:auto;background:#161616;border-radius:30px 30px 0 0;padding:22px 20px 28px;animation:up .3s cubic-bezier(.2,.9,.3,1);scrollbar-width:none}
.ov.mid .sheet{border-radius:28px;padding:24px 20px 20px;max-height:80%}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
/* global footer (6.5.1): always visible on every screen, never covered by the tab bar */
#screen::after{content:"Play Responsibly · Helpline: number to be provided by PCSO\A For 18 years old and above only";white-space:pre;flex:none;text-align:center;font-size:9.5px;line-height:1.45;color:#8a8a8a;padding:5px 8px 12px;background:var(--s1);border-top:1px solid #1c1c1c;position:relative;z-index:30}
#screen:has(.gfoot)::after{display:none}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#fff;color:#000;font-weight:700;font-size:13px;padding:10px 18px;border-radius:999px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fade .25s;max-width:340px;text-align:center}
.otp{position:relative;display:flex;gap:9px;justify-content:center}
.otp b{width:56px;height:62px;border-radius:16px;background:#1a1a1a;border:1.5px solid #2a2a2a;display:grid;place-items:center;font-size:24px;font-weight:800}
.otp b.cur{border-color:var(--cy);box-shadow:0 0 14px rgba(34,211,238,.35)}
.otp input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.steps{display:flex;gap:6px}.steps i{flex:1;height:4px;border-radius:2px;background:#2a2a2a;transition:.3s}.steps i.on{background:var(--cy);box-shadow:0 0 8px rgba(34,211,238,.6)}
.spin{width:54px;height:54px;border-radius:50%;border:4px solid #262626;border-top-color:var(--cy);border-right-color:#3b82f6;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,#1b1b1b,#2a2a2a,#1b1b1b);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}
.bar{height:8px;border-radius:4px;background:#232323;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cy),#3b82f6);transition:width .5s}
.qr{width:104px;height:104px;background:#fff;border-radius:14px;padding:8px;display:grid;grid-template-columns:repeat(13,1fr);gap:0}.qr i{background:#000}.qr i.w{background:#fff}
.faq summary{list-style:none;padding:15px 2px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;cursor:pointer;border-bottom:1px solid #1f1f1f}.faq summary::-webkit-details-marker{display:none}.faq p{padding:12px 2px;color:#aaa;font-size:13px;line-height:1.6}
table.tb{width:100%;border-collapse:collapse;font-size:12px}.tb td,.tb th{padding:9px 4px;border-bottom:1px solid #222;text-align:left}.tb th{color:var(--mu);font-weight:600}
.tg{width:48px;height:28px;border-radius:14px;background:#333;position:relative;transition:.25s;flex:none}.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.25s}.tg.on{background:var(--cy)}.tg.on::after{left:23px}
.avatar{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:44px;font-weight:800;border:5px solid #0a0a0a}
.cam{height:230px;border-radius:24px;background:repeating-linear-gradient(135deg,#141414 0 14px,#191919 14px 28px);display:grid;place-items:center;position:relative;overflow:hidden;border:1.5px dashed #3a3a3a}
.cam.ok{border:1.5px solid var(--gr)}
.scanline{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--cy),transparent);box-shadow:0 0 18px var(--cy);animation:scan 1.8s ease-in-out infinite}

.ring{width:190px;height:190px;border-radius:50%;border:4px solid var(--cy);display:grid;place-items:center;position:relative;box-shadow:0 0 40px rgba(34,211,238,.35)}
.ring::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed rgba(34,211,238,.5);animation:sp 6s linear infinite}
.flash{animation:fl .4s}@keyframes fl{0%{background:#fff}100%{background:transparent}}
.shake{animation:shk .35s}@keyframes shk{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.float{animation:flt 3.2s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-6px)}}
#panel{width:330px;height:min(868px,calc(100vh - 40px));overflow-y:auto;background:rgba(18,18,20,.86);border:1px solid #262626;border-radius:26px;padding:18px;backdrop-filter:blur(14px);scrollbar-width:thin;flex:none}

function combos(arr,k){const out=[],cur=[];(function go(s){if(cur.length===k){out.push([...cur]);return}for(let i=s;i<arr.length;i++){cur.push(arr[i]);go(i+1);cur.pop()}})(0);return out}
function expandLines(g,pc,sel,qp){
 if(g.t!=='lotto')return[[...sel]];

 if(pc==='STD')return[s];

/* judge one line against the winning numbers -> {tier,hit,prize(fixed)} or null */
function judgeLine(g,pc,line,win){
 if(g.t==='lotto'){const hit=line.filter(x=>win.includes(x));const tr=HITT[hit.length];return tr?{tier:tr,hit}:null}
 if(g.id==='ez2'){if(pc==='STRAIGHT')return(line[0]===win[0]&&line[1]===win[1])?{tier:'STRAIGHT',prize:4000}:null;
  return(line[0]!==line[1]&&[...line].sort((a,b)=>a-b).join()===[...win].sort((a,b)=>a-b).join())?{tier:'RAMBO',prize:2000}:null}
 if(g.id==='dchr'&&pc==='RAMBO'){return rambKind(g,line)==='R'&&[...line].sort().join()===[...win].sort().join()?{tier:'RAMBO',prize:2000}:null}
 if(g.id==='swer'){if(pc==='STRAIGHT')return line.join()===win.join()?{tier:'STRAIGHT',prize:4500}:null;
  const k=rambKind(g,line);if(k==='NO')return null;return[...line].sort().join()===[...win].sort().join()?{tier:k,prize:k==='R6'?750:1500}:null}
 let m=0;for(let i=1;i<=g.d&&line[g.d-i]===win[g.d-i];i++)m++;const pz=TAILP[g.id][m];return pz?{tier:'T'+m,prize:pz,m}:null}
/* settle a ticket: expand, judge every line, split pools (demo: other winners are assumed) */
function settleTicket(k,win){const g=gm(k.g);const lines=linesOf(k);const R=RULE[g.id];const out=[];const cnt={};
 lines.forEach(l=>{const j=judgeLine(g,k.pt,l,win);if(j){out.push({line:l,...j});cnt[j.tier]=(cnt[j.tier]||0)+1}});
 const tiers=[];let gross=0;
 if(g.t==='lotto'){
  if(cnt.JP){const shares=cnt.JP*k.mult;const per=Math.floor(Math.max(g.pool,R.jp)/shares*100)/100;const amt=Math.floor(per*shares*100)/100;tiers.push({tier:'JP',n:cnt.JP,per,amt,type:'JACKPOT'});gross+=amt}
  R.T.forEach(([lv,ty,am])=>{const n=cnt[lv];if(!n)return;if(ty==='FIXED'){const amt=am*n*k.mult;tiers.push({tier:lv,n,per:am,amt,type:ty});gross+=amt}
   else{const shares=n*k.mult,oth=R.oth[lv]||0;const per=Math.floor(am/(oth+shares)*100)/100;const amt=Math.round(per*shares*100)/100;tiers.push({tier:lv,n,per,amt,type:ty,oth,pool:am});gross+=amt}})}
 else{Object.keys(cnt).forEach(tr=>{const per=out.find(x=>x.tier===tr).prize;const amt=per*cnt[tr]*k.mult;tiers.push({tier:tr,n:cnt[tr],per,amt,type:'FIXED'});gross+=amt})}
 gross=Math.round(gross*100)/100;const tax=taxOf(gross);
 return{win,lines:out,tiers,gross,tax,net:Math.round((gross-tax)*100)/100}}

/* craft winning numbers for the demo: level 0 none, 1..4 = low..top */
function craftWin(k,level){const g=gm(k.g);const lines=linesOf(k);const base=k.sel||lines[0];
 const rest=(excl,lo,hi,n)=>{const s=new Set();while(s.size<n){const x=rnd(lo,hi);if(!excl.includes(x))s.add(x)}return[...s]};
 if(g.t==='lotto'){const used=new Set(lines.flat());
  if(level===0){for(let tryN=0;tryN<400;tryN++){const w=[];const s=new Set();while(s.size<6)s.add(rnd(1,g.n));const ww=[...s];if(lines.every(l=>l.filter(x=>ww.includes(x)).length<3))return ww.sort((a,b)=>a-b)}return rest([...used],1,g.n,6).sort((a,b)=>a-b)}
  const hits=level+2;const pool=[...base].sort(()=>Math.random()-.5);
  if(k.pt==='R5'&&hits===6){const ex=rest(base,1,g.n,1);return[...base,...ex].sort((a,b)=>a-b)}
  const take=Math.min(hits,pool.length);const others=rest(base,1,g.n,6-take);return[...pool.slice(0,take),...others].sort((a,b)=>a-b)}
 const line=lines[0];
 if(level===0){let w;do{w=g.t==='ez2'?[rnd(1,31),rnd(1,31)]:Array.from({length:g.d},()=>rc(g))}while(judgeLine(g,k.pt||'STRAIGHT',line,w));return w}
 if(g.t==='ez2')return k.pt==='RAMBO'?[line[1],line[0]]:[...line];
 if(g.id==='swer')return k.pt==='RAMBO'?[...line].reverse():[...line];

SC.ekyc={auth:true,back:true,html:()=>{const e=S.ek,s=e.step;

 if(s===3)return head+`<div class="mu mt" style="font-size:14px">${t('活体检测：请按提示完成动作','Liveness: follow the on-screen prompts')}</div><div style="display:grid;place-items:center;margin:30px 0 14px"><div class="ring">${e.live?`<span style="color:var(--gr)">${I('check',70)}</span>`:`<span style="font-size:60px">🙂</span>`}</div></div><div id="lv" class="b" style="text-align:center;font-size:17px;min-height:28px">${e.live?t('活体检测通过','Liveness passed'):t('点击开始','Tap to start')}</div>${e.live?`<div class="cam mt ${e.hand?'ok':''}" id="cam_hand">${e.hand?`<div style="text-align:center;color:var(--gr)">${I('check',46)}<div class="b mt3">${t('手持证件自拍已拍摄','Handheld selfie captured')}</div></div>`:`<div class="scanline"></div><div class="mu" style="text-align:center">${I('camera',40)}<div class="mt3">${t('手持证件自拍','Hold your ID next to your face')}</div></div>`}</div><div class="xs mu mt3" id="handnote" style="line-height:1.55">${t('只能用相机现场拍摄，不提供相册入口；请让面部与证件信息同框、清晰可读。','Take the photo with the camera only — there is no photo library option. Keep your face and the ID details in the same frame, clearly readable.')}</div><button class="btn ${e.hand?'d':'o'} mt3" id="handcap" onclick="A.cap('hand')">${e.hand?t('重拍','Retake'):t('拍摄','Capture')}</button>`:''}<button class="btn ${e.live?'c':'o'} mt2" id="step3next" ${e.live&&!e.hand?'disabled':''} onclick="${e.live?'S.ek.step=4;render()':'A.live()'}">${e.live?t('下一步','Next'):t('开始检测','Start')}</button>`;
 if(s===4)return head+`<div class="mu mt" style="font-size:14px">${t('正在进行人脸比对与 8 项自动校验','Running face match and 8 automatic checks')}</div><div class="card mt"><div class="row sp"><span class="b">${t('人脸相似度','Face similarity')}</span><span class="b grad" id="sim">${e.face?'98.6%':'0%'}</span></div><div class="bar mt"><i id="fb" style="width:${e.face?100:0}%"></i></div></div><div class="card mt" id="chk">${CHECKS.map((c,i)=>`<div class="row sp" style="padding:9px 0;border-bottom:1px solid var(--line);${e.face?'':'opacity:.25'}" id="ck${i}"><span style="font-size:14px">${t(c[0],c[1])}${i===7&&!S.ekFail&&expPass()?`<div class="xs mu" id="expnote">${EXP_NOTE}</div>`:''}</span>${ckBadge(i,e.face)}</div>`).join('')}</div><div id="ckres">${e.face?ckRes():''}</div><button class="btn c mt2" id="nx4" ${e.face?'':'disabled'} onclick="S.ek.step=5;render()">${t('下一步','Next')}</button>`;
 return head+`<div style="text-align:center;margin:20px 0"><div style="width:120px;height:120px;margin:0 auto" class="float">${illo('idcard')}</div><h3 style="margin-top:10px">${t('确认并提交','Review & submit')}</h3></div><div class="card"><div class="list">${[[t('姓名','Name'),fullName()],[t('证件','Document'),e.doc||DOCS[0][0]],[t('手持证件自拍','Handheld ID selfie'),e.hand?t('已拍摄','Captured'):'—'],[t('人脸比对','Face match'),(S.ekFail===true?'91.2%':'98.6%')],[t('自动校验','Auto checks'),S.ekFail==='unk'?t('7/8 通过 · 1 项无法判断','7/8 passed · 1 could not be determined'):S.ekFail?t('7/8 通过 · 1 项未通过','7/8 passed · 1 failed'):t('8/8 通过','8/8 passed')]].map(r=>`<div class="sp"><span class="mu sm">${r[0]}</span><span class="b sm">${r[1]}</span></div>`).join('')}</div></div><div class="card c2 mt" style="font-size:13px;line-height:1.6;color:var(--mu)">${I(S.ekFail?'clock':'shield',14)} ${S.ekFail?t('自动校验未全部通过，将转人工复核，预计 5 天（自然日）内完成。复核期间可以登录，但只能查看认证状态。','Automatic checks did not all pass, so a manual review follows (expected within 5 days). You can sign in meanwhile but only view the verification status.'):t('自动校验全部通过，提交后系统将自动完成认证，无需人工审核。','All automatic checks passed — verification completes automatically, no manual review.')}</div><button class="btn c mt2" onclick="A.ekSubmit()">${S.ekFail?t('提交人工复核','Submit for manual review'):t('完成并进入首页','Finish & enter Home')}</button>`},
 mount:()=>{const e=S.ek;if(e.step===4&&!e.face){let p=0;const iv=T(()=>{p=Math.min(100,p+4);const fb=$('#fb');if(fb)fb.style.width=p+'%';const sm=$('#sim');if(sm)sm.textContent=(p*.986).toFixed(1)+'%';if(p>=100)clearInterval(iv)},60,true);
  CHECKS.forEach((c,i)=>T(()=>{const el=$('#ck'+i);if(el){el.style.opacity=1;el.style.transition='.3s';el.lastElementChild.outerHTML=ckBadge(i,true)}},1500+i*380));
  T(()=>{S.ek.face=1;const b=$('#nx4');if(b)b.disabled=false;const sm=$('#sim');if(sm)sm.textContent=S.ekFail?'91.2%':'98.6%';const r=$('#ckres');if(r)r.innerHTML=ckRes()},1500+6*380+100)}}};
A.cap=k=>{const c=$('#cam_'+k);c&&c.classList.add('flash');setTimeout(()=>{S.ek[k]=true;renderKeep()},350)};
A.live=()=>{const m=[[t('请眨眨眼','Please blink'),'😑'],[t('请缓慢向左转头','Slowly turn left'),'🙂'],[t('请缓慢向右转头','Slowly turn right'),'🙂']].sort(()=>Math.random()-.5).concat([[t('正在比对…','Analyzing…'),'😀']]); /* actions are chosen at random by the verification provider's SDK; no action pool is shown */const el=$('#lv');m.forEach((x,i)=>T(()=>{const e=$('#lv');if(e)e.textContent=x[0];const r=$('.ring span');if(r)r.textContent=x[1]},i*900));T(()=>{S.ek.live=1;renderKeep()},m.length*900)};

 <div class="card mt" style="padding:26px 20px;text-align:center"><div style="width:130px;height:130px;margin:0 auto" class="float">${illo(M[0])}</div><div style="margin-top:12px">${badge(M[1],M[2])}</div><h1 style="margin-top:12px;font-size:23px">${t('用户身份认证','Identity verification')}</h1><div class="mu" style="margin-top:8px;font-size:14px;line-height:1.6">${M[3]}</div>
 ${k==='rejected'?`<div class="card c2 mt" style="text-align:left"><div class="xs mu">${t('拒绝原因','Reason')}</div><div class="b" style="margin-top:4px">${t('证件照片模糊，无法识别证件号码','The ID photo is blurry; the number is unreadable')}</div></div>`:''}</div>
 <div class="card mt"><div class="b" style="margin-bottom:6px">${t('审核进度','Progress')}</div>${steps.map((x,i)=>`<div class="row g12" style="padding:9px 0;opacity:${x[1]?1:.4}"><span style="width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:${x[1]?'var(--gr)':'#d9e1f1'};color:#fff">${x[1]?I('check',13):''}</span><span style="font-size:14px">${x[0]}</span></div>`).join('')}</div>
 ${k==='none'||k==='rejected'?`<button class="btn c mt2" onclick="S.ek={step:1,doc:'',front:false,back:false,live:0,face:0};A.go('ekyc')">${k==='none'?t('前往认证','Verify now'):t('重新提交','Resubmit')}</button>`:''}
 ${k==='pending'?`<button class="btn o mt2" onclick="toast(t('仍在审核中，请耐心等待','Still under review'))">${t('刷新状态','Refresh status')}</button><div class="card c2 mt" style="font-size:12.5px;color:var(--mu);line-height:1.6">${I('help',13)} ${t('演示：点击右侧面板“管理端通过 KYC”模拟审核通过，再次登录即可进入首页。','Demo: use “Admin approves KYC” in the right panel to simulate approval.')}</div>`:''}
 ${k==='approved'?`<button class="btn c mt2" onclick="A.reset('home')">${t('进入首页','Go to Home')}</button>`:''}
 ${!gated?`<button class="btn d mt" onclick="A.back()">${t('返回','Back')}</button>`:''}</div>`}};
A.reactivate=()=>{const ps=S.prevState;if(ps){S.excl=ps.excl;S.cool=ps.cool}S.prevState=null;S.selfDeact=false;S.logged=true;S.audit=S.audit||[];S.audit.push({ev:'self-reactivate',at:S.clock});addNotif('shield','账号已重新启用','Account reactivated','您的账号已重新启用，可以再次登录。','Your account has been reactivated. You can sign in again.');S.smsLog=S.smsLog||[];S.smsLog.push({at:S.clock,tpl:'NOTICE_ACCOUNT_STATUS',action:'reactivated',reason:'at your request',text:'iLotto: your account was reactivated. Reason: at your request.'});A.close();tick(2);A.reset(S.kyc==='approved'?'home':'kycStatus');toast(t('账号已恢复','Account reactivated'));if(isApp()&&!(S.trusted||[]).some(d=>d.cur))A.trustAsk()};

  A.close();S.bioCtx=null;if(otpWrong('login'))return;S.bioCtx='login';return A.bioFallback()}

 if(posG(g)&&P.picks.length!==needOf(g,curPlay(g)))P.picks=Array(needOf(g,curPlay(g))).fill(null);
 if(!posG(g)&&P.picks.some(x=>x===null))P.picks=[];
 if(!posG(g)){const L=lockedSet(g);if(P.picks.some(x=>L.has(x))){P.picks=P.picks.filter(x=>!L.has(x));setTimeout(()=>toast('This number is no longer available for this draw'),50)}}}

 k.st='void';k.vr=k.vr&&k.vr!=='game'?k.vr:'game';const legacy=k.pd==null,pb=legacy?k.amt:(k.pb||0),pp=legacy?0:(k.pp||0),pd=r2(pb+pp);

 ${cl&&cl.until>S.clock?`<div class="card mt" style="border:1px solid rgba(34,211,238,.4)"><div class="row sp"><b>${t('冷静期中','Cool-off active')}</b>${badge('b-cy',t('至','until')+' '+fts(cl.until))}</div><div class="mu sm mt3">${t('期间禁止投注与充值，到期自动解除，无需审批。','Betting and deposits are disabled; it ends automatically — no approval needed.')}</div></div>`:''}
 <h3 id="ps_lim" style="margin-top:22px">${t('充值限额','Deposit limits')}</h3>${lim('dep',t('每日 / 每周 / 每月','Daily / weekly / monthly'))}<h3 style="margin-top:22px">${t('投注限额','Bet limits')}</h3>${lim('bet',t('每日 / 每周 / 每月','Daily / weekly / monthly'))}

 <h3 id="ps_cool" style="margin-top:22px">${t('冷静期','Cool-off')}</h3><div class="card mt"><div class="mu sm" style="line-height:1.6">${t('选定后期间禁止投注与充值，到期自动解除，无需审批。','Betting and deposits are disabled for the chosen period; it ends by itself.')}</div><div class="chips mt">${[['24 小时','24 hours',24],['7 天','7 days',168],['30 天','30 days',720]].map(c=>`<button class="chip" onclick="A.cool(${c[2]},'${t(c[0],c[1])}')">${t(c[0],c[1])}</button>`).join('')}</div></div>

 <button class="card mt row sp" style="width:100%" onclick="A.go('risk')"><div class="row g12"><span style="color:var(--ro)">${I('help',22)}</span><div style="text-align:left"><div class="b">${t('风险与警示信号','Risk and warning signs')}</div><div class="xs mu">${t('了解需要留意的购彩行为','Know what to look out for')}</div></div></div>${I('chev',18)}</button>
 <button class="card mt row sp" style="width:100%" onclick="A.go('pgh')"><div class="row g12"><span style="color:var(--am)">${I('help',22)}</span><div style="text-align:left"><div class="b">Play Smart Help</div><div class="xs mu">${t('购彩习惯自测 · 求助热线','Play Check · support hotline')}</div></div></div>${I('chev',18)}</button>
 <div class="xs mu mt" style="text-align:center">${t('以上数值为管理端参数，以 PCSO 规定为准。','Values are back-office parameters, subject to PCSO rules.')}</div></div>`}};

const cancelRaise=(k,p)=>{const i=S.pend.findIndex(x=>x.k===k&&x.p===p);if(i<0)return;S.pend.splice(i,1);addNotif('shield','调高申请已取消','Raise request cancelled',`您调高${limName(k,p)}限额的申请已取消。`,`Your request to raise the ${limName(k,p)} limit was cancelled.`)};
A.limSet=(k,p,v)=>{const cur=S.limits[k][p];A.close();cancelRaise(k,p);if(v<=cur){S.limits[k][p]=v;addNotif('shield','限额已调整','Limit updated',`限额已调低为 ${fm0(v)}，即时生效。`,`Your limit is now ${fm0(v)}. Effective immediately.`);if(k==='bet'&&p==='d'&&S.limits.single>v){S.limits.single=v;addNotif('shield','单笔上限已同步下调','Single-bet cap lowered',`单笔投注上限不能高于每日限额，已同步下调为 ${fm0(v)}。`,`The single-bet cap cannot exceed the daily limit, so it was lowered to ${fm0(v)} as well.`);toast(t(`已调低，单笔上限同步下调为 ${fm0(v)}`,`Lowered — single-bet cap also set to ${fm0(v)}`))}else toast(t('已调低，即时生效','Lowered — effective now'))}else{S.pend.push({k,p,v});addNotif('clock','限额调高待生效','Limit raise pending',`调高到 ${fm0(v)} 将在 24 小时后生效。`,`Raising to ${fm0(v)} takes effect after 24 hours.`);toast(t('调高将在 24 小时后生效','Raise takes effect in 24 hours'))}renderKeep()};

function spec2Init(cfg){
  let on=true;try{const v=localStorage.getItem(cfg.key);on=v===null?true:v==='1'}catch(_){}
  const st={els:{},bd:{},hov:null,raf:0,mo:null};
  let ov=document.getElementById('sp2-ov');
  if(!ov){ov=document.createElement('div');ov.id='sp2-ov';ov.innerHTML='<div class="sp2-hl"></div>';document.body.appendChild(ov)}
  if(!document.getElementById('sp2-css')){const s=document.createElement('style');s.id='sp2-css';s.textContent=SPEC2_CSS;document.head.appendChild(s)}
  const hl=ov.firstChild;
  const data=()=>{try{const d=cfg.data();return d&&d.blocks?d:null}catch(_){return null}};
  const active=()=>on&&cfg.isOpen()&&!!data();
  const roots=()=>cfg.roots().filter(Boolean);
  const vis=el=>{if(!el||!el.isConnected)return false;const r=el.getBoundingClientRect();if(r.width<2||r.height<2)return false;const cs=getComputedStyle(el);return cs.visibility!=='hidden'&&cs.display!=='none'};
  const inPane=el=>!!(el.closest&&el.closest('.sp2,#sp2-ov,#spec-drawer,#panel'));
  function byText(txt){
    const q=String(txt).toLowerCase().replace(/\s+/g,' ').trim();if(!q)return null;let part=null;
    for(const rt of roots()){
      const w=document.createTreeWalker(rt,NodeFilter.SHOW_TEXT);let n;
      while(n=w.nextNode()){
        const p=n.parentElement;if(!p||/^(SCRIPT|STYLE|NOSCRIPT)$/.test(p.tagName)||inPane(p))continue;
        const v=n.nodeValue.toLowerCase();if(v.indexOf(q)<0)continue;
        const own=Array.from(p.childNodes).filter(c=>c.nodeType===3).map(c=>c.nodeValue).join('').toLowerCase().replace(/\s+/g,' ').trim();
        if(!vis(p))continue;
        if(own===q)return p;
        if(!part&&own.indexOf(q)>=0)part=p;
      }
    }
    return part;
  }
  function locate(b){
    if(b.sel){for(const rt of roots()){let el=null;try{el=rt.querySelector(b.sel)}catch(_){}if(el&&vis(el)&&!inPane(el))return el}}
    if(b.find)return byText(b.find);
    return null;
  }
  const clipOf=el=>{let c={l:0,t:0,r:innerWidth,b:innerHeight};
    for(let a=el.parentElement;a&&a!==document.body&&a!==document.documentElement;a=a.parentElement){
      const cs=getComputedStyle(a);if(cs.overflowX==='visible'&&cs.overflowY==='visible')continue;
      const r=a.getBoundingClientRect();c={l:Math.max(c.l,r.left),t:Math.max(c.t,r.top),r:Math.min(c.r,r.right),b:Math.min(c.b,r.bottom)}}
    return c};
  function place(){

    const used={};
    for(const k in st.bd){
      const el=st.els[k],bd=st.bd[k];if(!el||!el.isConnected){bd.style.display='none';continue}
      const r=el.getBoundingClientRect(),c=clipOf(el);
      if(r.width<2||r.height<2||r.bottom<c.t+4||r.top>c.b-4||r.right<c.l+4||r.left>c.r-4){bd.style.display='none';continue}
      let x=Math.max(r.left-7,c.l+2),y=Math.max(r.top-9,c.t+2);
      while(used[Math.round(x/4)+'|'+Math.round(y/4)])x+=20;used[Math.round(x/4)+'|'+Math.round(y/4)]=1;
      bd.style.display='block';bd.style.left=x+'px';bd.style.top=y+'px';
    }
    if(st.hov){const el=st.els[st.hov];
      if(el&&el.isConnected){const r=el.getBoundingClientRect(),c=clipOf(el);
        const l=Math.max(r.left,c.l),tp=Math.max(r.top,c.t),rr=Math.min(r.right,c.r),bb=Math.min(r.bottom,c.b);
        if(rr-l>2&&bb-tp>2){hl.style.cssText='display:block;left:'+(l-3)+'px;top:'+(tp-3)+'px;width:'+(rr-l+6)+'px;height:'+(bb-tp+6)+'px';return}}
      hl.style.display='none'}
    else hl.style.display='none';
  }
  const sched=()=>{if(!st.raf)st.raf=requestAnimationFrame(place)};
  function clear(){st.hov=null;hl.style.display='none';for(const k in st.bd)st.bd[k].remove();st.bd={};st.els={};
    document.querySelectorAll('.sp2-card.on').forEach(c=>c.classList.remove('on'))}
  function refresh(){
    if(!active()){clear();return}
    const d=data();st.els={};
    const keep={};
    d.blocks.forEach((b,i)=>{const el=locate(b);if(!el)return;st.els[b.k]=el;keep[b.k]=1;
      let bd=st.bd[b.k];if(!bd){bd=document.createElement('div');bd.className='sp2-bd';bd.textContent=i+1;ov.appendChild(bd);st.bd[b.k]=bd}
      bd.classList.toggle('on',st.hov===b.k)});
    for(const k in st.bd)if(!keep[k]){st.bd[k].remove();delete st.bd[k]}
    sched();
  }
  function show(k){
    if(!active())return;
    if(!st.els[k]){refresh()}
    const el=st.els[k];if(!el)return;
    st.hov=k;for(const j in st.bd)st.bd[j].classList.toggle('on',j===k);
    const r=el.getBoundingClientRect(),c=clipOf(el);
    if(r.bottom<c.t+8||r.top>c.b-8||r.right<c.l||r.left>c.r){try{el.scrollIntoView({block:'center',inline:'nearest',behavior:'smooth'})}catch(_){}}

  }
  function hide(){st.hov=null;hl.style.display='none';for(const j in st.bd)st.bd[j].classList.remove('on')}
  const cardOf=n=>n&&n.closest?n.closest('.sp2-card[data-bk]'):null;
  function focusCard(k,smooth){

  }
  document.addEventListener('mouseover',e=>{const c=cardOf(e.target);if(c&&active())show(c.dataset.bk)},true);
  document.addEventListener('mouseout',e=>{const c=cardOf(e.target);if(c&&!(e.relatedTarget&&c.contains(e.relatedTarget)))hide()},true);
  document.addEventListener('focusin',e=>{const c=cardOf(e.target);if(c&&active())show(c.dataset.bk)},true);
  document.addEventListener('focusout',e=>{const c=cardOf(e.target);if(c)hide()},true);
  document.addEventListener('click',e=>{
    const tg=e.target;if(!tg||!tg.closest)return;
    const sw=tg.closest('[data-sp2-tog]');
    if(sw){on=!on;try{localStorage.setItem(cfg.key,on?'1':'0')}catch(_){}clear();cfg.rerender();return}
    if(!active()||inPane(tg))return;
    if(!roots().some(r=>r.contains(tg)))return;
    const top=cfg.topLayer&&cfg.topLayer();if(top&&!top.contains(tg))return;
    let best=null,ba=1e18;
    for(const k in st.els){const el=st.els[k];if(!el.isConnected||!el.contains(tg))continue;const r=el.getBoundingClientRect(),a=r.width*r.height;if(a<ba){ba=a;best=k}}
    if(!best)return;
    st.fk=best;st.ft=Date.now();focusCard(best,true);
  },true);
  addEventListener('scroll',sched,true);addEventListener('resize',sched);
  let deb=0;
  st.mo=new MutationObserver(ms=>{
    if(!active())return;
    if(ms.every(m=>{const n=m.target.nodeType===1?m.target:m.target.parentElement;return !n||inPane(n)}))return;
    clearTimeout(deb);deb=setTimeout(refresh,160)});
  st.mo.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style','hidden']});
  window.SPEC2={on:()=>on,sync:()=>{hide();refresh();if(st.fk&&Date.now()-st.ft<700&&active())focusCard(st.fk,false)},refresh,_st:st,active,locate,roots};

const SPEC_D={"p_splash":{"id":"p_splash","ti":["启动页","Splash"],"g":["账号与认证","Account & auth"],"prd":"6.1.2","pos":{"what":["品牌启动页：显示 iLotto / PCSO 监管标识，加载完成后判断登录态，把玩家送进登录页（已登录则进首页，实名未通过则进实名状态页）。","Brand splash showing the iLotto and Regulated-by-PCSO identity; once loaded it checks the sign-in state and sends the player to Sign in (or Home / the KYC status page if already signed in)."],"why":["在进入任何业务页前先亮明受监管身份和「仅限 18 岁以上」，并给应用一个统一的启动和登录态判断入口；H5 和独立 App 都从这里开始，保证两端体验一致。","Shows the regulated status and the 18+ notice before any business screen, and gives H5 and the standalone App one common entry that checks the sign-in state, so both channels start the same way."],"who":["所有访客（未登录、已登录均会经过）。本页无任何操作权限差异，也不展示余额等个人数据。","Every visitor (signed-out or signed-in pass through it). No role differences; no personal data such as balance is shown."]},"blocks":[{"k":"b1","n":["顶部标签（Phase 1 · H5 / App，UTC+8）","Top tags (Phase 1 · H5 / App, UTC+8)"],"sel":".row","find":"Phase 1 · H5 / App","fn":[["左侧标签标明本期终端为 H5 + 独立 App（iOS、Android），右侧标签标明全站统一使用 UTC+8 菲律宾时区。","The left tag states that this phase ships H5 plus the standalone App (iOS, Android); the right tag states that the whole product runs on UTC+8 Philippine time."],["两个终端的账号与认证规则一致，App 是独立应用。","Account and authentication rules are identical on both channels; the App is a standalone application."]],"prd":[{"s":"6.1.1","n":"概述：H5 与独立 App 两种终端，规则一致"}],"tor":[{"c":"1.1.1","t":["提供 Web 与移动渠道","Provide web-based and mobile channels"]},{"c":"1.1.7","t":["提供 iOS、Android 移动应用","Provide a mobile application for iOS and Android"]},{"c":"1.1.11","t":["各渠道功能对等","Functional parity across all access channels"]}],"tor_note":null},{"k":"b2","n":["品牌标识（iLotto / Regulated by PCSO）","Brand identity (iLotto, Regulated by PCSO)"],"sel":".fade > div:nth-child(2)","find":"Regulated by PCSO","fn":[["居中显示 PCSO 标志、iLotto 字标、「Official PCSO online lottery」和绿色「Regulated by PCSO」徽章。","Centred PCSO logo, the iLotto wordmark, \"Official PCSO online lottery\ the biometric sheet in place of the SMS step; H5 shows no biometric or trusted-device entry. There is no SMS-code login."],"why":["控制面板只对通过认证的玩家开放，登录是第一道关；不区分「账号错」还是「密码错」，避免被用来探测账号；同时记录终端与设备信息，供安全审计使用。","The dashboard must be reachable only after authentication; the page never says whether the account or the password was wrong, so it cannot be used to probe accounts, and it records channel and device for audit."],"who":["未登录的玩家。已自我排除的账号可正常登录并进入受限模式；已注销或被管理端停用的账号会收到相应弹窗；自助停用的账号验证后可选择恢复。","Signed-out players. Self-excluded accounts can sign in and enter restricted mode; closed or admin-deactivated accounts get a dialog; a self-deactivated account may restore itself after verification."]},"blocks":[{"k":"b1","n":["页头（Welcome back）","Header (Welcome back)"],"sel":".fade","find":"Welcome back","fn":[["iLotto 字标、标题 Welcome back 和说明「Sign in with phone/email + password. An SMS code is required after.」，提前告知后面还有短信验证。","iLotto wordmark, the Welcome back title and \"Sign in with phone/email + password. An SMS code is required after.\", telling the player up front that an SMS code follows."]],"prd":[{"s":"6.1.3","n":"页面流程：输入账号密码 → 校验 → 跳第二因子"}],"tor":[{"c":"1.1.14","t":["账号密码登录并叠加多因素认证","Account and password login combined with MFA"]}],"tor_note":null},{"k":"b2","n":["Phone or email 输入框","Phone or email field"],"sel":"#l_acc","find":"Phone or email","fn":[["手机号或邮箱都可作账号；手机号未带 +63 时离开输入框自动补 +63 并显示为 +63 917 123 4567 格式（去掉开头的 0）；输入邮箱不处理。","Phone or email is the account; a phone number without +63 is auto-prefixed on blur and shown as +63 917 123 4567 (leading 0 dropped); an email is left untouched."],["为空时红框 + 提示 \"Enter your phone number or email\"，不发验证码。","Empty shows a red border and \"Enter your phone number or email\"; no code is sent."]],"prd":[{"s":"6.1.3","n":"表单字段：账号"},{"s":"6.1.6","n":"表单校验规则：通用校验与手机号默认区号"}],"tor":[{"c":"1.2.9","t":["手机号或邮箱作为账号用户名","Registered mobile number or email is the account username"]}],"tor_note":null},{"k":"b3","n":["Password 输入框","Password field"],"sel":"#l_pwd","find":"Password","fn":[["密码框带眼睛按钮切换明文，默认不回显；长度 8–20 位。","Password box with an eye button to show or hide; hidden by default; 8–20 characters."],["为空提示 \"Enter your password\"；账号或密码不对时统一提示 \"账号或密码错误\" 的同义文案，不区分是账号错还是密码错。","Empty shows \"Enter your password\"; a wrong account or password gets one generic message that does not say which was wrong."]],"prd":[{"s":"6.1.3","n":"表单字段：密码；交互说明"}],"tor":[{"c":"1.1.14","t":["账号密码登录并叠加多因素认证","Account and password login combined with MFA"]},{"c":"15.3.2","t":["认证集中统一，敏感功能强认证","Centralised, standardised authentication controls"]}],"tor_note":null},{"k":"b4","n":["Forgot password? 链接","Forgot password? link"],"sel":"div.row.sp","find":"Forgot password?","fn":[["进入找回密码三步流程（账号 → 验证码 → 新密码）；自助停用账号也走同一流程，页面看不出账号状态。旁边的灰字「Demo: any registered account + any password」只在原型出现。","Opens the three-step reset (account, code, new password); a self-deactivated account uses the same flow and the page does not reveal the state. The grey \"Demo: any registered account + any password\" text exists in the prototype only."]],"prd":[{"s":"6.1.5","n":"页面流程：输入账号 → 短信 OTP → 设置新密码"}],"tor":[{"c":"1.1.17","t":["提供重置 / 忘记密码功能","Provide a reset / forgot password feature"]}],"tor_note":null},{"k":"b5","n":["Sign in 按钮","Sign in button"],"sel":"button.btn","find":"Sign in","fn":[["一次性校验两栏；通过后进入 SMS verification，不直接进首页。","Validates both fields at once; on success it opens SMS verification, never Home directly."],["未注册账号提示 Not registered — register first；已注销账号弹窗 \"This account has been closed\"；管理端停用账号弹窗 \"Your account is temporarily deactivated\"（点 OK 关闭）。","An unregistered account gets \"Not registered — register first\"; a closed account gets the dialog \"This account has been closed\"; an admin-deactivated account gets \"Your account is temporarily deactivated\" (OK closes it)."],["自助停用的账号密码通过后同样进入短信验证码；验证码通过后弹 \"Welcome back\"，点 Reactivate account 恢复到停用前的状态（正常 / 已限制投注），点 Not now 则保持停用。忘记密码重置后也须这样登录才恢复，重置本身不恢复。恢复后站内信为 “Your account has been reactivated. You can sign in again.”，并发 NOTICE_ACCOUNT_STATUS 短信（原型记在 S.smsLog）：“iLotto: your account was reactivated. Reason: at your request.”","A self-deactivated account also goes on to the SMS code after the password; once the code passes, the \"Welcome back\" dialog offers Reactivate account (restores the pre-deactivation state, Normal or Bet-restricted) or Not now (stays deactivated). After a forgot-password reset the player must sign in this way too; the reset alone does not restore the account. After restoring, the inbox reads “Your account has been reactivated. You can sign in again.” and a NOTICE_ACCOUNT_STATUS SMS is sent (logged in S.smsLog in the prototype): “iLotto: your account was reactivated. Reason: at your request.”"],["每次登录成功都记录终端（H5 / App）、设备型号，App 另记版本；App 登录后登记本设备 push token。","Every successful sign-in records the channel (H5 / App) and device model, plus the App version on the App; the App then registers this device's push token."]],"prd":[{"s":"6.1.3","n":"表单字段与交互说明：终端与设备识别；排除拦截"},{"s":"6.2.3","n":"交互说明：登录后按实名状态分流"},{"s":"6.1.5","n":"找回密码规则：自助停用账号重置后仍须密码 + 短信验证码登录才恢复"}],"tor":[{"c":"1.2.1","t":["仅通过审核的注册玩家可访问系统","Only vetted registered players can access the system"]},{"c":"1.4.1","t":["控制面板仅登录成功后可访问","Dashboard accessible only after successful login"]}],"tor_note":null},{"k":"b6","n":["Register 入口","No account? Register"],"sel":"div.row:nth-child(8)","find":"No account?","fn":[["「No account? Register」进入注册页；注册、登录用同一套账号规则。","\"No account? Register\" opens Create account; registration and sign-in share the same account rules."]],"prd":[{"s":"6.1.6","n":"页面流程：填写表单 → 验证联系方式 → eKYC"}],"tor":[{"c":"1.2.3","t":["提供玩家注册链接和表单","Provide a player registration link and form"]}],"tor_note":null},{"k":"b7","n":["安全提示卡","Security note card"],"sel":"div.card","find":"SMS verification on every login","fn":[["H5 提示「SMS verification on every login. Biometrics and trusted devices are available on the App only.」：H5 每次登录都要短信验证码；App 形态下改为「Always enter your password first. On a trusted device Face ID then replaces only the SMS code; any other device needs the SMS code.」；不提供短信验证码登录。","H5 states \"SMS verification on every login. Biometrics and trusted devices are available on the App only.\"; the App terminal instead says \"Always enter your password first. On a trusted device Face ID then replaces only the SMS code; any other device needs the SMS code.\"; there is no SMS-code login."]],"prd":[{"s":"6.1.3","n":"登录：App 可信设备与生物识别，H5 不支持"},{"s":"6.1.4","n":"第二因子：短信 OTP；App 可信设备以生物识别代替"}],"tor":[{"c":"1.1.14","t":["账号密码登录并叠加多因素认证","Account and password login combined with MFA"]},{"c":"10.4","t":["所有认证流程叠加多因素认证","Every authentication flow augmented by MFA"]}],"tor_note":null},{"k":"b8","n":["生物识别弹窗（App 可信设备）","Biometric sheet (App trusted device)"],"sel":"#bio-sheet","find":"Use Face ID to continue","fn":[["App 且本设备已信任时，必须先输入并通过密码校验（密码为空或错误不会弹出），之后弹出模拟原生弹窗「Use Face ID to continue」，按钮 Authenticate / Cancel（元素 #bio_ok / #bio_cancel，状态 S.bioCtx='login'）。","On the App, when this device is trusted, the password must be entered and accepted first (an empty password never opens it), and then it opens a simulated native sheet “Use Face ID to continue” with Authenticate / Cancel (#bio_ok / #bio_cancel, state S.bioCtx='login')."],["Authenticate 成功：代替短信这一步直接登录（密码已输入），登录记录方式记为 Password + biometric。本地比对失败（演示面板打开 “Biometric: local check fails”）：提示 \"Biometric check failed on this device. Use the SMS code instead.\"，只回退到短信验证码页，不计错误次数；Cancel 同样直接回退短信。服务端签名校验失败（面板 “Biometric: device signature invalid”）：提示 \"Device signature could not be verified.\"，按一次错误验证码计入登录场景错误次数（累计 5 次锁 1 小时），再回退短信。","Authenticate success replaces the SMS step and signs in (the password was already entered); the sign-in record method is Password + biometric. Local check failure (demo toggle “Biometric: local check fails”): shows \"Biometric check failed on this device. Use the SMS code instead.\" and only falls back to the SMS code page with no error count; Cancel falls back the same way. Server-side signature failure (toggle “Biometric: device signature invalid”): shows \"Device signature could not be verified.\", counts as one wrong code in the sign-in error counter (5 lock for 1 hour), then falls back to SMS."]],"prd":[{"s":"6.1.3","n":"交互说明：可信设备用生物识别，失败回退短信"}],"tor":[{"c":"1.1.15","t":["可信设备登录用设备原生生物识别代替 OTP","Trusted-device logins use native biometrics in lieu of OTP"]}],"tor_note":null,"state":"A.term('app');S.trusted=[{id:'t1',name:'iPhone 15',at:'2026-10-17 09:00',last:'2026-10-17 09:30',cur:true},{id:'t2',name:'Pixel 8',at:'2026-10-05 20:14',last:'2026-10-08 21:40',cur:false}];S.logged=false;A.reset('login');A.bioStart('login')"},{"k":"b9","n":["“信任此设备”弹窗（App）","“Trust this device?” sheet (App)"],"sel":"#trust-sheet","find":"Trust this device?","fn":[["App 上密码 + 短信验证成功后（本设备尚未信任）弹出「Trust this device?」，按钮 Trust（#trust_yes）/ Not now（#trust_no）。Trust 后在 S.trusted 记录设备名、信任时间、最近使用并写审计；Not now 不记录，下次仍走短信。","On the App, after password + SMS succeeds on a not-yet-trusted device, a “Trust this device?” sheet appears with Trust (#trust_yes) / Not now (#trust_no). Trust stores device name, trusted-at and last-used in S.trusted and writes an audit entry; Not now stores nothing and the next sign-in still uses SMS. The sheet is offered again after any sign-in that used password + SMS on an untrusted device, including the first one after a self-deactivation recovery (shown after Reactivate) or a password reset."],["H5 不出现此弹窗。","H5 never shows this sheet."]],"prd":[{"s":"6.1.3","n":"交互说明：信任此设备（Trust this device）"}],"tor":[{"c":"1.1.15","t":["可信设备登录用设备原生生物识别代替 OTP","Trusted-device logins use native biometrics in lieu of OTP"]}],"tor_note":null,"state":"A.term('app');S.trusted=[];S.logged=true;A.trustAsk()"}],"vd":null,"nw":false,"page_rules":[{"n":["App 专属：可信设备与生物识别","App only: trusted device and biometrics"],"fn":[["可信设备（仅 App）：玩家在 App 上选择“信任此设备”后，该设备后续登录仍先输入密码，之后用设备原生生物识别（Face ID / 指纹）代替短信验证码这一步；只对这一台设备生效，列表可在“登录与安全”查看、移除。改密码、找回密码重置、换绑手机号、玩家自助停用、管理端停用或重置密码都会使全部信任设备失效，之后一律密码 + 短信验证码登录，可重新信任。本期信任设备不设有效期、不限数量，靠手动移除和上述自动失效控制。","Trusted device (App only): after the player chooses “Trust this device” in the App, later sign-ins on that device still ask for the password first, then use native biometrics (Face ID / fingerprint) in place of the SMS code step only; it applies to that one device only and the list can be viewed and removed under Login & security. Changing or resetting the password, changing the mobile number, self-deactivation, and an admin deactivating the account or resetting the password all invalidate every trusted device; the next sign-in is password + SMS and the device can be trusted again. This phase has no expiry and no device limit; control is by manual removal and the automatic invalidation above."],["提现 MFA（仅 App）：App 上用设备原生生物识别作为提现二次验证；H5 仍用短信验证码。","Withdrawal MFA (App only): on the App the withdrawal second step uses the device’s native biometrics; H5 keeps the SMS code."],["回退：手机本地生物识别比对失败、取消或设备不支持时只回退到短信验证码（登录时仍已输入密码），不计失败次数、不落“已拒绝”流水、不推进锁定。只有服务端能校验到的失败才计数：设备签名校验不通过、短信验证码错误——提现连续 3 次锁 30 分钟并各落一笔“已拒绝”，登录按错误验证码计入登录场景次数；管理端登录不用生物识别，仍为密码 + 4 位短信 OTP。","Fallback: if the local biometric check fails, is cancelled or is unsupported, it only falls back to the SMS code (the password was already entered at sign-in), with no failure count, no Rejected transaction and no lock progress. Only failures the server can verify count: an invalid device signature or a wrong SMS code — in withdrawal 3 in a row lock withdrawals for 30 minutes and each records a Rejected transaction; in sign-in they count like a wrong code in the sign-in scenario. Admin sign-in does not use biometrics and stays password plus 4-digit SMS OTP."],["App 专属，演示原型用「Terminal」开关模拟：右侧演示面板 Terminal 选 App（iPhone 15 · iLotto App 1.0.3）即进入 App 形态，登录页、提现验证和“账号安全”才出现可信设备与生物识别；默认 H5 形态下这些入口全部不出现。生物识别由页面内模拟的原生弹窗代替（Authenticate / Cancel），面板「Biometric: local check fails」开关模拟本地比对失败（不计数），「Biometric: device signature invalid」开关模拟服务端签名校验失败（计数）。","App only. The demo simulates it with the Terminal switch: in the demo panel pick App (iPhone 15 · iLotto App 1.0.3) and the sign-in, withdrawal verification and Account security screens show trusted-device and biometric features; the default H5 terminal shows none of them. Native biometrics are replaced by an in-page simulated sheet (Authenticate / Cancel), and the panel toggle “Biometric: local check fails” simulates a local failure (not counted) and “Biometric: device signature invalid” simulates a server-side signature failure (counted)."]],"prd":[{"s":"6.1.3","n":"登录：App 可信设备与生物识别，H5 不支持"},{"s":"6.1.4","n":"第二因子：可信设备以生物识别代替短信验证码，失败回退短信"},{"s":"6.4.3","n":"提现 MFA：App 生物识别，H5 短信"},{"s":"6.8.3","n":"登录记录与玩家档案：终端 H5/App、设备型号，可信设备列表只读"}],"tor":[{"c":"1.1.15","t":["可信设备须成功登记原生生物识别，之后该设备登录以生物识别代替 OTP；设备端生物识别被关闭则信任自动撤销","A device is tagged Trusted only after native biometric enrolment; later logins use biometrics in lieu of OTP; trust is revoked if device biometrics are disabled"]},{"c":"1.4.29","t":["有生物识别能力的移动设备上，每笔提现的 MFA 用设备原生生物识别，短信或邮件 OTP 仅作回退","On biometric-capable mobile devices, withdrawal MFA uses native biometrics, with SMS/email OTP only as fallback"]},{"c":"1.1.42","t":["自动化风险分超阈值时要求证明有真人，可信设备上为生物识别验证","When the automation risk score exceeds the threshold, proof of a person is required; on a Trusted Device it is biometric verification"]},{"c":"1.3.9","t":["登记或更换电子钱包 / 银行账户前必须完成 MFA，即使在已认证会话或有可信设备","Enrolling or changing an e-wallet or bank account requires MFA, even in an authenticated session or on a Trusted Device"]},{"c":"1.4.25","t":["每笔提现确认前必须完成 MFA，即使已认证会话或有可信设备","Every withdrawal requires MFA right before confirmation, even in an authenticated session or on a Trusted Device"]},{"c":"8.7.8","t":["安全剧本可撤销玩家的可信设备状态","Security playbooks can revoke a player’s Trusted Device status"]},{"c":"8.7.9.1","t":["安全告警上下文含已登记设备 ID 与可信设备状态","Security alert context includes registered device IDs and Trusted Device status"]}]}]},"p_otp2fa":{"id":"p_otp2fa","ti":["登录第二因子（短信验证）","SMS verification (2FA)"],"g":["账号与认证","Account & auth"],"prd":"6.1.4","pos":{"what":["密码通过后向登记手机发送 4 位短信验证码，验证成功才算登录，并按实名状态分流：已通过进首页，否则进实名状态页。","After the password step a 4-digit SMS code goes to the registered mobile; only a correct code completes sign-in, then routing by KYC status: verified to Home, otherwise to the KYC status page."],"why":["标书要求所有认证流程叠加多因素认证；验证码有效期、发送与错误次数都设上限，防止被刷短信或暴力猜码，且各场景分别计数，互不拖累。","The tender requires MFA on every authentication flow; code validity, send and error counts are capped against SMS abuse and brute force, counted per scenario so one lock does not spill into another."],"who":["已通过密码验证、尚未完成登录的玩家。本场景锁定只影响「登录」，不影响找回密码等其他场景。","Players who passed the password step but have not finished signing in. A lock affects Sign-in only, not password reset or other scenarios."]},"blocks":[{"k":"b1","n":["页头（SMS verification）","Header (SMS verification)"],"sel":".fade","find":"SMS verification","fn":[["标题 SMS verification，下方显示打码后的手机号（如 Code sent to +6391***347）；左上返回键回到登录页。","Title SMS verification with the masked number below (e.g. Code sent to +6391***347); the back button returns to Sign in."],["进入页面即自动发送「登录」场景验证码。","Opening the page sends a sign-in scenario code automatically."]],"prd":[{"s":"6.1.4","n":"第二因子：固定短信 OTP 一种方式"}],"tor":[{"c":"1.1.14","t":["账号密码登录并叠加多因素认证","Account and password login combined with MFA"]},{"c":"10.4","t":["所有认证流程叠加多因素认证","Every authentication flow augmented by MFA"]}],"tor_note":null},{"k":"b2","n":["4 位验证码输入框","4-digit code boxes"],"sel":"#o_codew","find":"Demo code: 1234","fn":[["4 位数字，5 分钟内有效；少于 4 位提示 \"Enter the 4-digit code\"；错误提示 \"Incorrect code. N attempts left.\" 且输入框抖动。","4 digits, valid for 5 minutes; fewer than 4 shows \"Enter the 4-digit code\"; a wrong code shows \"Incorrect code. N attempts left.\" and the boxes shake."],["本场景累计错 5 次弹窗「sign-in locked for 1 hour」，点 Got it 回登录页；锁定期内提示 \"Too many wrong codes for sign-in. Locked — try again in about N min.\"，到期自动解锁，验证成功后清零。","5 wrong codes in this scenario open the \"sign-in locked for 1 hour\" dialog (Got it returns to Sign in); while locked it shows \"Too many wrong codes for sign-in. Locked — try again in about N min.\"; unlock is automatic and the counter resets on success."],["下方灰字「Demo code: 1234」仅原型出现。","The grey \"Demo code: 1234\" is a prototype-only hint."]],"prd":[{"s":"6.1.4","n":"表单字段：验证码；交互说明：错误次数按场景累计，锁 1 小时"},{"s":"6.1.6","n":"表单校验规则：验证码错误提示统一文案"}],"tor":[{"c":"1.1.16","t":["MFA 验证码 5 分钟内过期（PCSO 可调）","MFA code expires within 5 minutes (adjustable by PCSO)"]},{"c":"1.1.15","t":["MFA 可为短信 / 邮箱 OTP","MFA may be an OTP over SMS or email"]}],"tor_note":null},{"k":"b3","n":["Resend 重发按钮","Resend button"],"sel":"#rs","find":"Resend","fn":[["显示倒计时 Resend (59s)，默认 60 秒后可重发；倒计时未结束点击提示 \"Wait for the countdown before resending\"；重发后旧码作废。","Shows a Resend (59s) countdown, resend available after 60 s by default; tapping early shows \"Wait for the countdown before resending\"; the old code is void after a resend."],["同一手机号每个场景每天（UTC+8 自然日）最多 10 条，各场景额度互不占用；达到上限按钮显示 Daily limit reached。","One phone number may receive at most 10 codes per scenario per UTC+8 day, quotas not shared across scenarios; at the cap the button reads Daily limit reached."]],"prd":[{"s":"6.1.4","n":"交互说明：倒计时重发 60 秒；每日 10 条；按场景分别计数"}],"tor":[{"c":"1.2.13","t":["验证超时可重发（次数和冷却由 PCSO 定）","Resend after timeout (count and cooldown set by PCSO)"]}],"tor_note":null},{"k":"b4","n":["Verify & sign in 按钮","Verify & sign in button"],"sel":"button.btn","find":"Verify & sign in","fn":[["验证通过：已通过 eKYC 进首页并提示 Signed in；未认证 / 审核中 / 被拒绝进实名状态页，提示 \"Signed in · only verification status is available until KYC passes\"。","On success: KYC-verified players go to Home with the toast Signed in; unverified, in-review or rejected players go to the KYC status page with \"Signed in · only verification status is available until KYC passes\"."]],"prd":[{"s":"6.1.4","n":"交互说明"},{"s":"6.2.3","n":"实名状态：登录后分流"}],"tor":[{"c":"1.4.1","t":["控制面板仅登录成功后可访问","Dashboard acc lusion list) are the core compliance gate before access."],"who":["正在 eKYC 的新玩家（状态：未认证）。提交后：6/6 通过变为“正常”；有未通过项变为“审核中”，等待管理端身份审核员处理，预计 5 天（自然日）内完成。","New players finishing eKYC (status: Unverified). On submit: 6/6 passed becomes Normal; any failure becomes Under review for the Identity reviewer in Admin, expected within 5 days."]},"blocks":[{"k":"b1","n":["页头与五步进度条","Header and 5-step progress bar"],"sel":"div.fade","find":null,"fn":[["标题 Identity verification 与 “Step 5 of 5”，5 段进度条全部点亮；返回键可回到第 4 步。","Title \"Identity verification\" with \"Step 5 of 5\" and all 5 bar segments lit; Back returns to step 4."]],"prd":[{"s":"6.2.2","n":"eKYC 五步：页面流程 ⑤"}],"tor":[{"c":"2.3.3","t":["新注册玩家先经端到端身份核验才可进入","All newly registered players pass end-to-end identity verification before access"]}],"tor_note":null},{"k":"b2","n":["Review & submit 核对卡","Review & submit card"],"sel":"div.list","find":null,"fn":[["四行只读信息：Name（如 Juan S. Dela Cruz）、Document（如 PhilSys National ID）、Face match（如 98.6%）、Auto checks（如 6/6 passed；有失败时如 5/6 passed · 1 failed）。","Four read-only rows: Name (e.g. Juan S. Dela Cruz), Document (e.g. PhilSys National ID), Face match (e.g. 98.6%) and Auto checks (e.g. 6/6 passed, or 5/6 passed · 1 failed)."],["Auto checks 汇总 7 项：证件真伪、人脸比对、活体检测、证件篡改、年龄校验（≥18，按证件出生日期）、排除名单、注册资料与证件比对；每项返回通过 / 不通过（第 7 项为一致 / 不一致）。","Auto checks sums up 6 items: document authenticity, face match, liveness, document tampering, age (≥18) and exclusion list, each returned by the eKYC provider as pass / fail."],["玩家在此只能查看，不能手动改判；证件号不在这里明文展示。","The player can only read this; nothing can be overridden here, and the ID number is not shown in clear."]],"prd":[{"s":"6.2.2","n":"列表字段说明（7 项自动校验结果展示）"}],"tor":[{"c":"2.3.3","t":["端到端身份核验后才放行","End-to-end identity verification before access is granted"]},{"c":"2.3.6","t":["检测证件篡改、伪造、数字操纵","Detect tampering, forgery or digital manipulation of ID documents"]},{"c":"21.1.1","t":["最低年龄 18 岁，必须做年龄核验","Minimum age 18 with mandatory age verification"]},{"c":"21.1. _play_sys":{"id":"p_play_sys","ti":["投注 · System 复式","Play · System"],"g":["投注","Play"],"prd":"6.3.3","pos":{"what":["System 7–12 复式投注：多选 7–12 个号码，系统自动展开成 C(n,6) 注并按每个组合各出一张独立电子票。","System 7–12 entry: pick 7–12 numbers and the system expands them into C(n,6) lines, issuing one separate e-ticket per combination."],"why":["让想“包号”的玩家一次覆盖所有组合而不用逐注手填；每个组合一张票是为了每张票单独判奖、代扣税、比较 ₱300,000 并单独申领。组合多时金额会触发单笔 / 日限额，需要在下单前给出明确提示。","Lets players cover every combination of a larger pick without filling lines by hand; one ticket per combination keeps prize judging, tax withholding, the ₱300,000 check and claims per ticket. Large systems hit the per-bet or daily limit, so the page must say so before ordering."],"who":["已登录、实名通过且状态为“正常”的玩家；仅乐透类有此玩法，且只显示管理端为该游戏启用的 System 档位。限制投注状态同标准页一样被拦截。","Signed-in, verified players in status Normal; lotto games only, and only the System levels enabled in Admin for that game. Restrictions are blocked at confirm like the Standard page."]},"blocks":[{"k":"b0","n":["页头：返回箭头 · Play · 右侧 ₱x / bet","Header: back arrow · Play · unit price (₱x / bet)"],"sel":".phd","find":null,"fn":[["标题 Play，左侧返回箭头，右侧显示当前游戏单注价格（乐透 ₱25，EZ2 / Swertres ₱10，4D / 6D ₱12），来自游戏配置只读。","Title Play with a back arrow and the unit price of the current game on the right (lotto ₱25, EZ2 / Swertres ₱10, 4D / 6D ₱12), read-only from the game config."]],"prd":[{"s":"6.3.3","n":"玩法与选号规则表：价格列"}],"tor":[{"c":"1.4.4","t":["控制面板提供数字投注单","Dashboard provides a digital play slip"]}],"tor_note":null},{"k":"b1","n":["游戏选择条","Game chips"],"sel":"#gpills","find":null,"fn":[["横向 9 个游戏：Ultra Lotto 6/58、Grand Lotto 6/55、Super Lotto 6/49、Mega Lotto 6/45、Lotto 6/42、EZ2、Swertres、4D、6D；当前游戏高亮，点击切换整页的号码范围、玩法和单价。","Nine games in a row (Ultra 6/58, Grand 6/55, Super 6/49, Mega 6/45, Lotto 6/42, EZ2, Swertres, 4D, 6D); the active one is highlighted and tapping changes number range, play types and price."],["管理端下架 / 暂停的游戏点击提示 “This game is paused”，不能进入选号。","A game paused or delisted in Admin shows \"This game is 提供进行中游戏的实时投注","Real-time betting on ongoing games from the dashboard"]},{"c":"2.4.2.6","t":["玩家端游戏信息显示无开奖日","Player channels show no-draw days in game information"]}],"tor_note":null},{"k":"b3","n":["Play type 玩法选择与规则说明","Play type chips and rule note"],"sel":".ptypes","find":null,"fn":[["按游戏显示已在管理端启用的玩法：乐透为 Standard / Quick Pick / System 7–12 / 5-Roll；EZ2、Swertres 为 Straight / Rambolito；4D、6D 只有 Straight。默认乐透选 Standard，数字类选 Straight。","Shows the play types enabled in Admin for the game: lotto has Standard / Quick Pick / System 7–12 / 5-Roll; EZ2 and Swertres Straight / Rambolito; 4D and 6D Straight only. Default is Standard for lotto, Straight for digit games."],["下方规则说明卡（System note）已固定为 System 自己的文案，例如选 8 个号码时显示 \"Pick 8 numbers from 1–49. Every group of 6 becomes a line: 28 lines. Price = lines × unit price. Each line is judged separately.\"，不再沿用标准玩法的 \"Each line is compared with the 6 drawn numbers…\"；Standard 玩法保持原文。","The rule card (System note) is now fixed to System's own wording, e.g. with 8 numbers it reads \"Pick 8 numbers from 1–49. Every group of 6 becomes a line: 28 lines. Price = lines × unit price. Each line is judged separately.\"; it no longer reuses the Standard sentence \"Each line is compared with the 6 drawn numbers…\". Standard keeps its own text."],["选 System 7–12 后选 7–12 个号码：System 7 = 7 注 ₱175，System 8 = 28 注 ₱700，System 9 = 84 注 ₱2,100，System 10 = 210 注，System 11 = 462 注，System 12 = 924 注 ₱23,100。","Choosing System 7–12 means picking 7–12 numbers: System 7 = 7 lines ₱175, System 8 = 28 lines ₱700, System 9 = 84 lines ₱2,100, System 10 = 210, System 11 = 462, System 12 = 924 lines ₱23,100."]],"prd":[{"s":"6.3.3","n":"表单字段：玩法；玩法与选号规则表"},{"s":"6.3.3","n":"玩法与选号规则表：复式 System 7–12"}],"tor":[{"c":"1.4.5","t":["接受符合所选游戏规则的所有投注","Accept every bet that follows the game rules"]},{"c":"21.2.7","t":["确认前在投注单可见赔率、规则、开奖时间表","Odds, game rules and draw schedule visible on the play slip before confirming"]},{"c":"1.4.9","t":["支持 System Play（5R、System 7–12），自动展开所有组合","Support System Play (5R, System 7–12) generating all valid combinations"]}],"tor_note":null},{"k":"b4","n":["Number board 选号盘（7–12 个）","Number board (pick 7–12)"],"sel":"#board","find":null,"fn":[["标题 “Pick 7 numbers”（随 System 档位变为 7–12）；点击选号，选满提示 “Selection is full”；管理端置灰的号码同样不可选。","\"Pick 7 numbers\" (changes with the System level, 7–12); tap to select, \"Selection is full\" when done; numbers greyed out by Admin cannot be chosen either."]],"prd":[{"s":"6.3.3","n":"复式与 5 号轮转出票；选号盘置灰"},{"s":"6.3.3","n":"玩法与选号规则表"}],"tor":[{"c":"1.4.9","t":["选择多于最少要求的号码，系统自动生成全部组合","Select more numbers than the minimum; the platform generates all combinations"]}],"tor_note":null},{"k":"b5","n":["Your numbers 已选号码","Your numbers tray"],"sel":".tray","find":null,"fn":[["显示已选的 7–12 个号码，Quick Pick 骰子可随机补满当前档位所需个数。","Shows the 7–12 chosen numbers; the Quick Pick dice fills the count needed for the current level at random."]],"prd":[{"s":"6.3.3","n":"机选动效；表单字段：号码组合"}],"tor":[{"c":"1.4.9","t":["选择多于最少要求的号码","Select more numbers than the minimum"]}],"tor_note":null},{"k":"b6","n":["Multiplier 与 Draws","Multiplier and Draws steppers"],"sel":".mdrow","find":null,"fn":[["Multiplier 步进器 1–10（− / +），固定金额奖按倍数相乘；Draws 步进器：乐透最多 12 期，数字类在期次列表勾选，最多 90 期。","Multiplier stepper 1–10 (− / +) multiplies fixed prizes; Draws stepper: up to 12 for lotto, tick draws from the list for digit games, up to 90."],["下方列出所选各期的开奖时间（如 2026-10-11 · 21:00）；未开售的期次标 “Opens at …” 但可选，无开奖日自动跳过且不计入期数。","Below, each selected draw's date-time (e.g. 2026-10-11 · 21:00); not-yet-on-sale draws are marked \"Opens at …\" yet can be picked, and no-draw dates are skipped without counting."],["一次购买一张投注单可跨多期，票按“期 × 组合”拆分，每期一张。","One purchase can span several draws; tickets are split by draw × combination."]],"prd":[{"s":"6.3.3","n":"表单字段：倍数、期数；无开奖日"}],"tor":[{"c":"1.4.6","t":["单次投注可含多期（预购）","Advance / future draws in a single bet"]},{"c":"1.4.8","t":["乐透至少可预购 12 期、数字类 90 期","At least 12 advance draws for lottery and 90 for m bet."]},"blocks":[{"k":"b0","n":["页头：返回箭头 · Play · 右侧 ₱x / bet","Header: back arrow · Play · unit price (₱x / bet)"],"sel":".phd","find":null,"fn":[["标题 Play，左侧返回箭头，右侧显示当前游戏单注价格（乐透 ₱25，EZ2 / Swertres ₱10，4D / 6D ₱12），来自游戏配置只读。","Title Play with a back arrow and the unit price of the current game on the right (lotto ₱25, EZ2 / Swertres ₱10, 4D / 6D ₱12), read-only from the game config."]],"prd":[{"s":"6.3.3","n":"玩法与选号规则表：价格列"}],"tor":[{"c":"1.4.4","t":["控制面板提供数字投注单","Dashboard provides a digital play slip"]}],"tor_note":null},{"k":"b1","n":["游戏选择条","Game chips"],"sel":"#gpills","find":null,"fn":[["横向 9 个游戏：Ultra Lotto 6/58、Grand Lotto 6/55、Super Lotto 6/49、Mega Lotto 6/45、Lotto 6/42、EZ2 2D、Swertres 3D、4D、6D；当前游戏高亮，点击切换整页的号码范围、玩法和单价。","Nine games in a row (Ultra 6/58, Grand 6/55, Super 6/49, Mega 6/45, Lotto 6/42, EZ2 2D, Swertres 3D, 4D, 6D); the active one is highlighted and tapping switches number range, play types and price."],["管理端下架 / 暂停的游戏点击提示 “This game is paused”，不进入选号；首页该游戏卡同样置灰。","A game paused or delisted in Admin shows \"This game is paused\" and cannot be played; its Home card is greyed the same way."],["6D 暂停销售时点击 6D 游戏卡提示 “This game is paused”，不进入选号（演示面板可 Toggle 6D sale 切换）；管理端下架立即生效，无需第二人确认。","When 6D sales are paused, tapping the 6D chip shows \"This game is paused\" and does not open the slip (the demo panel can Toggle 6D sale); an Admin delisting takes effect immediately without a second approver."]],"prd":[{"s":"6.3.3","n":"表单字段：游戏（9 个游戏枚举）"},{"s":"6.7.2","n":"游戏管理：上架 / 下架"}],"tor":[{"c":"1.4.5","t":["数字投注单按所选 PCSO 游戏的规则接受投注","Digital play slip accepts bets per the selected PCSO game's rules"]}],"tor_note":null},{"k":"b2","n":["游戏信息卡","Game card (next draw · cut-off)"],"sel":".ghead","find":null,"fn":[["封面 + 游戏名（6D）、Next 下期开奖时间与开奖日（如 2026-10-11 21:00 · Tue/Sun 9 PM）；数字类没有奖池，不显示 Jackpot。","Cover and game name (6D) plus Next draw date-time with draw days (如 2026-10-11 21:00 · Tue/Sun 9 PM); digit games have no jackpot, so none is shown."],["绿色倒计时 cluding digit games"]}],"tor_note":null},{"k":"b10","n":["Multiplier 倍数","Multiplier stepper"],"sel":".mdrow","find":null,"fn":[["步进器 − / +，范围 1–10，默认 1；固定金额奖按倍数相乘，倍数改变后下方订单汇总实时刷新。","Stepper − / + from 1 to 10, default 1; fixed prizes are multiplied by it and the order summary refreshes live."]],"prd":[{"s":"6.3.3","n":"表单字段：倍数"}],"tor":[{"c":"1.4.5","t":["数字投注单按所选 PCSO 游戏的规则接受投注","Digital play slip accepts bets per the selected PCSO game's rules"]}],"tor_note":null},{"k":"b11","n":["Order summary 订单汇总","Order summary"],"sel":null,"find":"Order summary","fn":[["表格 Play / Lines × Draws / Tickets / Total，如 Straight 1 × 1 = 1 张票 ₱12；改倍数或期次实时刷新，下方 “₱12 per draw (1 × ₱12)” 为每期金额。","Table Play / Lines × Draws / Tickets / Total, e.g. Straight 1 × 1 = 1 ticket ₱12; refreshes live with multiplier and draws, and \"₱12 per draw (1 × ₱12)\" is the per-draw amount."],["每期金额 = 注数 × 该期单注价 × 倍数；扣款顺序固定：先投注余额，不足再奖金余额（Deducted from bet balance first, then prize balance）。","Per-draw amount = lines × that draw's unit price × multiplier; debit order is fixed: bet balance first, then prize balance."],["总额受单笔投注上限和 PlaySafe 每日 / 每周 / 每月限额约束，超出在确认时拦截；单次最多 1,000 张票，超出提示 “You can buy up to 1,000 tickets at a time. Reduce the number of draws or combinations.”。","The total is subject to the single-bet cap and PlaySafe daily / weekly / monthly limits and is blocked at confirmation if exceeded; at most 1,000 tickets per purchase, otherwise \"You can buy up to 1,000 tickets at a time. Reduce the number of draws or combinations.\"."]],"prd":[{"s":"6.3.3","n":"表单字段：注数、应付金额、支付方式"},{"s":"6.2.4","n":"理性购彩（PlaySafe）：单笔与日 / 周 / 月限额"}],"tor":[{"c":"21.3.2","t":["超出玩家设定限额的投注自动拦截","Bets exceeding player-set spending limits are blocked automatically"]},{"c":"1.4.6","t":["单次投注含多期时合计金额","Total shown across multiple advance draws"]}],"tor_note":null},{"k":"b12","n":["Confirm bet 按钮","Confirm bet"],"sel":".stickybet","find":null,"fn":[["选号未完成时置灰；点击先校验：Finish your selection first / This draw is closed — bet on the next one / Betting is disabled during cool-off / Exceeds single-bet limit ₱X；超日限额弹窗 Daily bet limit reached（→ Adjust limits），余额不足弹窗 Insufficient balance（→ Deposit）。","Disabled until the picks are complete; tapping runs the checks: Finish your selection first / This draw is closed — bet on the next one / Betting is disabled during cool-off / Exceeds single-bet limit ₱X; dialogs Daily bet limit reached (→ Adjust limits) and Insufficient balance (→ Deposit)."],["通过后进入 Confirm your bet 确认页：Play type / Numbers / Lines / Tickets issued / Multiplier / Draws / 每期金额 / Total payable (sum of draws)，固定提示 “Once confirmed, your bet cannot be cancelled or refunded.”，另有 Winning odds、Draw schedule 和 Play Responsibly。","Passing opens the Confirm your bet page: Play type / Numbers / Lines / Tickets issued / Multiplier / Draws / amount per draw / Total payable (sum of draws), the fixed \"Once confirmed, your bet cannot be cancelled or refunded.\", plus Winning odds, Draw schedule and Play Responsibly."],["Place bet · ₱X 后进入“处理中，请勿重复提交”，落库成功即出票并弹出 Bet placed 列出票号；失败回滚不扣款。","Place bet · ₱X shows a processing state; tickets are issued once saved and the Bet placed dialog lists the ticket numbers; a failed save rolls back without debit."]],"prd":[{"s":"6.3.3","n":"投注确认页；交互说明；表单字段：支付方式"},{"s":"6.2.4","n":"理性购彩（PlaySafe）：限额与冷静期"}],"tor":[{"c":"1.1.26","t":["下注前显示确认提示：一经确认不可取消","Confirmation before betting stating that a confirmed bet cannot be cancelled"]},{"c":"1.1.25","t":["实时生成电子票并显示在玩家控制面板","E-ticket produced in real time and shown in the player dashboard"]},{"c":"21.2.7","t":["确认前显示赔率、规则、开奖时间表","Odds, rules and draw schedule shown before confirming"]},{"c":"21.1.4","t":["数字确认显示中奖概率、开奖时间表和理性购彩提醒","Digital confirmations show odds, draw schedule and play-responsibly reminders"]},{"c":"21.3.2","t":["超出玩家设定限额的投注自动拦截","Bets exceeding player-set spending limits are blocked automatically"]}],"tor_note":null}],"page_rules":[{"n":["整页规则：Play Responsibly 页脚","Page-wide: Play Responsibly footer"], story or from View history › on the Play page's Latest draw strip, already positioned on that game."]],"prd":[{"s":"6.3.4","n":"功能说明：与首页、Play 页同一数据来源"},{"s":"6.3.3","n":"最近开奖条：View history"}],"tor":[{"c":"1.4.16","t":["展示开奖历史、幸运选号 / 手动选号统计","Display drawing history and Lucky Pick / Manual Pick statistics"]}],"tor_note":null},{"k":"b2","n":["游戏选择条","Game chips"],"sel":"#sc .fade > div.chips:nth-child(2)","find":null,"fn":[["横向 9 个游戏：Ultra Lotto 6/58 … 6D；点选切换，下方三块内容整体换成该游戏的数据。","Nine games in a row, Ultra Lotto 6/58 through 6D; tapping one swaps the three blocks below to that game's data."],["数字类游戏每天有多个场次，历史列表按场次分别列出。","Digit games with several draws a day list each draw separately in Past draws."]],"prd":[{"s":"6.3.4","n":"搜索筛选项：游戏（9 个游戏枚举）；列表字段：期号按场次列出"}],"tor":[{"c":"1.4.16","t":["展示每个游戏的开奖历史","Display the drawing history of each game"]}],"tor_note":null},{"k":"b3","n":["Latest draw 最近一期","Latest draw card"],"sel":"#sc .fade > div.card:nth-child(3)","find":null,"fn":[["显示期号（如 L649-20261009-1，游戏名已在上下文时可省略游戏编码前缀）、开奖时间 2026-10-09 21:00 和号码球；只显示已授权发布的最近一期，延期中的期次不显示。","Shows the draw number (e.g. L649-20261009-1; the game-code prefix may be omitted where the game name is already in context), draw time 2026-10-09 21:00 and the balls; only the latest authorized-published draw appears, postponed draws are hidden."],["乐透类另显示 Jackpot pool（如 ₱57,940,002）和 Jackpot winners；头奖无人中时写 “0 · Rolled over”，奖池滚存到下期。数字类没有奖池。","Lotto games also show Jackpot pool (e.g. ₱57,940,002) and Jackpot winners; with no winner it reads \"0 · Rolled over\" and the pool rolls on. Digit games have no pool."],["该游戏还没有任何已发布结果时显示 “No result yet” 空状态。","A game with no published result shows the \"No result yet\" empty state."]],"prd":[{"s":"6.3.4","n":"列表字段：期号、开奖号码、奖池金额；功能说明：同一数据来源、延期不显示"},{"s":"6.3.3","n":"最近开奖条：无结果显示 No result yet"}],"tor":[{"c":"1.4.16","t":["展示开奖历史、最新头奖和游戏信息","Display drawing history, latest jackpot and game information"]},{"c":"2.4.1.10","t":["每期显示游戏、期号、开奖日期时间和状态","Each draw shows game, draw number, date-time and status"]}],"tor_note":null},{"k":"b4","n":["Prize tiers 奖级表","Prize tiers table"],"sel":"#sc .fade > div.card:nth-child(5)","find":null,"fn":[["列 Tier / Prize，按命中数对照奖金：如 Match 6 numbers 为 Rolling pool, floor ₱25,000,000，Match 5 numbers 为 Pool ₱1,300,000, shared by winning lines，Match 3 numbers 为 ₱50 fixed。","Columns Tier / Prize map matches to prizes: e.g. Match 6 numbers is Rolling pool, floor ₱25,000,000, Match 5 numbers is Pool ₱1,300,000, shared by winning lines, Match 3 numbers is ₱50 fixed."],["三种奖金：固定金额、固定奖池（由 PCSO 按该奖级奖池与全部中奖注数（含线下）计算，系统只展示）、头奖累计奖池（无人中滚存）；数字类全部固定奖金。奖级结构取自游戏配置，玩家端只显示英文命中说明。","Three prize kinds: fixed amount, fixed pool (tier pool ÷ all winning lines, rounded down to the cent) and the rolling jackpot pool; digit games have fixed prizes only. The structure comes from the game config and players see only the English match text."]],"prd":[{"s":"6.3.4","n":"列表字段：中奖等级对照"},{"s":"6.3.3","n":"判奖与奖金：三种奖金方式"}],"tor":[{"c":"21.2.7","t":["投注页与看板须显示游戏规则、赔率及开奖时间","Game rules and odds must be shown on the play slip and dashboard"]},{"c":"1.4.16","t":["展示开奖历史、最新头奖和游戏信息","Display drawing history, latest jackpot and game information"]}],"tor_note":null},{"k":"b5","n":["Past draws 历史开奖","Past draws list"],"sel":"#sc .fade > div.card:nth-child(7)","find":null,"fn":[["按时间倒序列出该游戏更早的期次：期号、开奖日期和号码球，如 L649-20261007-1 · 2026-10-07。","Lists earlier draws of the game newest first: draw number, date and balls, e.g. L649-20261007-1 · 2026-10-07."],["数据来自已授权发布的期次，只读，延期中的期次不显示。","Data comes from authorized-published draws and is read-only; postponed draws are not shown."]],"prd":[{"s":"6.3.4","n":"搜索筛选项：期号 / 日期；列表字段：期号、开奖号码"}],"tor":[{"c":"1.4.16","t":["展示开奖历史","Display drawing history"]}],"tor_note":null}],"page_rules":[{"n":["整页规则：Play Responsibly 页脚","Page-wide: Play Responsibly footer"],"fn":[["底部常驻 “Play Responsibly · For 18 years old and above only · PlaySafe”。","A fixed footer \"Play Responsibly · For 18 years old and above only · PlaySafe\" is always visible."]],"prd":[{"s":"6.3.3","n":"标书依据 21.2.1；投注确认页④理性购彩提醒"}],"tor":[{"c":"21.2.1","t":["始终清晰显示 “Play Responsibly” 和 “18 岁以上”","Always show \"Play Responsibly\" and \"For 18 years old and above only\""]}]}],"vd":["V1.1：游戏无结果时显示 No result yet 空状态；首页卡片、Play 条与本页共用同一份最近一期数据。","V1.1: a game without results shows a \"No result yet\" empty state; the Home card, Play strip and this page share the same latest-draw data."],"nw":false},"p_tickets":{"id":"p_tickets","ti":["我的彩票（列表）","My Tickets (list)"],"g":["我的彩票","Tickets"],"prd":"6.4.2","pos":{"what":["列出玩家的全部电子票：按状态页签筛选（预购、待开奖、未中奖、中奖待申领、已领奖、已作废），同一次投注的多张票折叠成一组，点任意一张票进入票据详情。","Lists all of a player's e-tickets with status tabs (Pre-order, Awaiting draw, Not won, Won · to claim, Won · claimed, Voided); tickets from one order fold into a group and tapping a ticket opens its details."],"why":["玩家买完要随时核对票、开奖结果和奖金，复式和多期投注一次会出几十张票，不折叠就无法阅读；中奖待申领的票在这里只给入口，申领码只在详情里生成，避免码在列表里被截图泄露。标书要求票据保存 30 天、中奖票保存 1 年零 1 天并可在控制面板查看。","After buying, players need to check tickets, results and prizes at any time; a System or multi-draw order produces dozens of tickets that are unreadable unless grouped. Won tickets only point to details here, the claim code is generated there so it cannot leak from the list. The tender requires tickets to be viewable for 30 days, winning ones for 1 year + 1 day."],"who":["已登录且实名通过的玩家，仅能看到自己的票（底部 Ticket 页签）。所有状态都可查看，包括已限制投注和自我排除；未登录或未实名进不到此页。","Signed-in, verified players, who see only their own tickets (bottom Ticket tab). Every status can view it, including restricted and self-excluded players; signed-out or unverified players cannot reach it."]},"blocks":[{"k":"b1","n":["页头：My Tickets 与票数","Header: My Tickets and count"],"sel":"#sc > .fade > div.row.sp:nth-child(1)","find":null,"fn":[["标题 My Tickets，右侧显示未归档的票总数（如 63 tix）；已归档的票不计入。","Title My Tickets with the total of non-archived tickets on the right (e.g. 63 tix); archived tickets are not counted."]],"prd":[{"s":"6.4.2","n":"功能说明：归档后列表不再显示"}],"t
