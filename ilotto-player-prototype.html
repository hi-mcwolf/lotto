 the Draw result; tapping a card opens the ticket details and Back returns to the same list position."],["机选一张票多注仍是一张票。","A Quick Pick ticket with several lines is still one ticket."]],"prd":[{"s":"6.4.2","n":"列表字段说明：票号、游戏、期号、投注组合、投注金额、状态"},{"s":"6.4.2","n":"票据详情页：点击任意一张票进入详情"}],"tor":[{"c":"1.1.25","t":["电子票实时生成并显示在玩家控制面板","E-ticket produced in real time and displayed in the player dashboard"]},{"c":"1.4.7","t":["每个开奖日有各自独立的电子票","Each draw date has its own individual e-ticket"]}],"tor_note":null},{"k":"b4","n":["投注单分组","Order group"],"sel":"#sc > .fade > div.tkc:nth-child(13)","find":null,"fn":[["同一次投注的多张票折叠成一组：组头显示 Order 单号（BO + 19 位数字）、游戏、期号、玩法（如 System 7 / 5-Roll）、“N tickets · 合计金额”，有中奖时加 “N won · 奖金合计”（张数、金额、中奖数、奖金一律按全单计，不随页签变化）；一张投注单跨多期时期号处写 Draws N（首期号）。","Tickets of one order fold into a group: the header shows the Order no. (BO + 19 digits), game, draw, play type (e.g. System 7 / 5-Roll), \"N tickets · total\" and, when any won, \"N won · prize total\" (all counts and amounts cover the whole order and do not change with the tab); an order spanning several draws writes Draws N (first draw number)."],["点组头展开，每行一张票，再点一张进入详情；复式 System 7–12、5 号轮转每个组合一张独立电子票。","Tap the header to expand, one row per ticket, then tap one to open it; System 7–12 and 5-Roll produce one independent e-ticket per combination."]],"prd":[{"s":"6.4.2","n":"列表字段：票号（折叠成一组，组头显示投注单号、张数和合计金额）；功能说明"},{"s":"6.3.3","n":"复式与 5 号轮转出票"}],"tor":[{"c":"1.4.10","t":["复式每个组合各有独立电子票","Each System Play combination has its own e-ticket"]},{"c":"1.4.9","t":["复式 / 5 号轮转作为独立投注类型","System Play (5R, System 7–12) as a distinct bet type"]}],"tor_note":null},{"k":"b5","n":["中奖待申领卡片","Won · to claim card"],"sel":"#sc > .fade > div.tkc:nth-child(9)","find":null,"fn":[["徽标 Won · to claim，显示开奖号码和命中奖级（如 Match 6 numbers）、奖金（如 Prize ₱4,120,000）和提示 “Tap to view details and start your claim”；超过兑奖截止日改为 “Claim deadline passed — open for details”。","Badge Won · to claim, with the draw result and tier (e.g. Match 6 numbers), the prize (e.g. Prize ₱4,120,000) and \"Tap to view details and start your claim\"; past the deadline it reads \"Claim deadline passed — open for details\"."],["列表里不显示申领码，也不能在这里申领；点进详情，大奖（> ₱300,000）才有 Start claim。","The claim code is never shown here and nothing can be claimed from the list; the Start claim button exists only in the details of a prize above ₱300,000."]],"prd":[{"s":"6.4.2","n":"列表字段：中奖金额（“中奖待申领”提示点击查看详情并发起申领）；申领码、发起申领"},{"s":"6.7.5","n":"大奖申领"}],"tor":[{"c":"2.5.6","t":["申领码只在玩家点击申领后生成并仅在登录后的应用内显示","The claim code is generated when the player starts the claim and shown only in the authenticated app"]}],"tor_note":null},{"k":"b6","n":["中奖已领奖卡片","Won · claimed card"],"sel":"#sc > .fade > div.tkc:nth-child(10)","find":null,"fn":[["徽标 Won · claimed，显示命中奖级和兑付方式：≤ ₱300,000 为 “Auto-credited to wallet (prize balance)” 并显示 +₱ 实付金额（已扣税）。","Badge Won · claimed with the tier and payout method: up to ₱300,000 reads \"Auto-credited to wallet (prize balance)\" with the net +₱ amount after tax."],["大奖在 PCSO 线下兑付的票显示 “Claimed at PCSO · paid by cheque offline, not credited to wallet”，不进钱包。","A large prize redeemed at PCSO shows \"Claimed at PCSO · paid by cheque offline, not credited to wallet\" and never reaches the wallet."],["已领奖票保存至开奖日起 1 年零 1 天。","Claimed tickets are kept until 1 year + 1 day after the draw date."]],"prd":[{"s":"6.4.2","n":"列表字段：中奖金额；兑付方式；保存期规则③"},{"s":"4.2","n":"票据状态机"}],"tor":[{"c":"1.4.14","t":["中奖票兑付后标记为已付 / 已领取","A paid winning e-ticket is marked PAID / CLAIMED"]},{"c":"1.4.22","t":["单票奖金 ≤ ₱300,000 自动入玩家钱包","Prizes up to ₱300,000 are credited automatically to the player wallet"]},{"c":"1.4.13","t":["中奖票可查看 1 年零 1 天","Winning e-tickets viewable for 1 year and 1 day"]}],"tor_note":null},{"k":"b7","n":["已作废卡片","Voided card"],"sel":"#sc > .fade > div.tkc:nth-child(12)","find":null,"fn":[["徽标 Voided，卡片下方固定英文说明 “This draw was cancelled because the game was unavailable at draw time. Your payment has been refunded to the balances it was paid from.”（本期作废原因只有游戏下架）。","Badge Voided with the fixed English note \"This draw was cancelled because the game was unavailable at draw time. Your payment has been refunded to the balances it was paid from.\" (delisting is the only void reason in this phase)."],["退款已原路退回投注 / 奖金余额，流水在 Transactions 的 Refund 页签；作废票保存 30 天后归档。","The refund went back to the original balances and appears under Transactions › Refund; voided tickets are archived after 30 days."]],"prd":[{"s":"6.4.2","n":"搜索筛选项：已作废 Tab（作废说明固定英文）；保存期规则②"}],"tor":[{"c":"1.4.13","t":["普通电子票可查看 30 天","Regular e-tickets viewable for 30 days"]}],"tor_note":null},{"k":"b8","n":["保存期提示","Retention note"],"sel":null,"find":"Regular tickets kept 30 days","fn":[["列表底部固定提示 “Regular tickets kept 30 days; winning tickets kept 1 year + 1 day from the draw date”。","A fixed note at the bottom: \"Regular tickets kept 30 days; winning tickets kept 1 year + 1 day from the draw date\"."],["归档后票从列表消失；中奖待申领票过截止日后显示 Expired 再留 30 天，之后归档，从流水点进已归档票提示 “This ticket is past its retention period.”。","Archived tickets leave the list; a won ticket past its claim deadline shows Expired for 30 more days and is then archived, and opening an archived ticket from Transactions shows \"This ticket is past its retention period.\"."]],"prd":[{"s":"6.4.2","n":"功能说明：页面底部固定提示；保存期规则①–⑤"}],"tor":[{"c":"1.4.13","t":["普通票 30 天、中奖票 1 年零 1 天可在控制面板查看","Tickets viewable for 30 days, winning ones for 1 year and 1 day"]}],"tor_note":null}],"page_rules":[{"n":["整页规则：Play Responsibly 页脚","Page-wide: Play Responsibly footer"],"fn":[["底部常驻 “Play Responsibly · For 18 years old and above only · PlaySafe”。","A fixed footer \"Play Responsibly · For 18 years old and above only · PlaySafe\" is always visible."]],"prd":[{"s":"6.4.2","n":"标书依据 21.2.1"}],"tor":[{"c":"21.2.1","t":["始终清晰显示 “Play Responsibly” 和 “18 岁以上”","Always show \"Play Responsibly\" and \"For 18 years old and above only\""]}]}],"vd":["V1.1：同一次投注的多张票折叠成一组（Order 单号、张数、合计）；中奖待申领卡片提示改为 Tap to view details and start your claim。","V1.1: tickets from one order are grouped (order no., ticket count, total); won cards now say \"Tap to view details and start your claim\"."],"nw":false},"p_tk_await":{"id":"p_tk_await","ti":["票据详情 · 待开奖","Ticket details · Awaiting draw"],"g":["我的彩票","Tickets"],"prd":"6.4.2","pos":{"what":["一张未开奖电子票的完整票面：游戏、期号、玩法、注数、倍数、金额、下单时间、适用税、条形码、投注号码、中奖概率、开奖时间表和理性购彩提醒。","The full face of an undrawn e-ticket: game, draw number, play type, lines, multiplier, amount, placed-at time, applicable tax, barcode, numbers, winning odds, draw schedule and play-responsibly reminder."],"why":["电子票是玩家唯一的投注凭证，标书要求票上有序列号、条码、App 标识、交易时间、号码和开奖日期，并显示概率、开奖时间表与理性购彩提醒；没有这页，玩家出了问题没有可核对的依据，PCSO 也无法按票号检索。","The e-ticket is the player's only proof of a bet; the tender requires serial number, bar code, app identification, transaction time, numbers and draw date on it, plus odds, schedule and play-responsibly reminders. Without it players have nothing to check against and PCSO cannot look a ticket up by serial."],"who":["已登录且实名通过的票主玩家；任何状态（含已限制投注、自我排除）都可查看自己的票，其他玩家看不到。","The signed-in, verified owner of the ticket; every status (including Restricted and self-excluded) can view their own tickets, nobody else can."]},"blocks":[{"k":"b1","n":["票头卡：游戏 · 状态 · 票号","Ticket header: game · status · serial"],"sel":"#sc .fade > div.card:nth-child(1)","find":null,"fn":[["顶部卡片：游戏封面、PCSO Logo、右上 “App iLotto” 标记、游戏名（如 Super Lotto 6/49）、状态徽标（Awaiting draw 待开奖）和票号 TKT…；票号是系统生成的唯一序列号。","Top card: game cover, PCSO logo, an \"App iLotto\" tag at the top right, the game name (e.g. Super Lotto 6/49), the status badge (Awaiting draw) and the ticket no. TKT…, the unique system-generated serial."]],"prd":[{"s":"6.4.2","n":"票据详情页：票号、游戏、状态、App 标识、PCSO 与游戏 Logo"}],"tor":[{"c":"1.1.22","t":["电子票记录序列号、条码 / QR、App 标识、交易时间、投注组合、开奖日期","E-ticket records serial number, bar / QR code, app identification, transaction time, bet combination and draw date(s)"]}],"tor_note":null},{"k":"b2","n":["Bet details 投注信息","Bet details"],"sel":"#sc .fade > div.card:nth-child(3)","find":null,"fn":[["只读行：Game、Draw number（期号 + 开奖日期时间，如 L649-20261011-1 · 2026-10-11 21:00，游戏名已在上下文时可省略游戏编码前缀）、Play type、Order、Lines、Multiplier、Bet amount（附算式，如 1 × ₱25 × 2）、Placed at、Applicable tax、App。","Read-only rows: Game, Draw number (number + draw date-time, e.g. L649-20261011-1 · 2026-10-11 21:00; the game-code prefix may be omitted where the game name is in context), Play type, Order, Lines, Multiplier, Bet amount (with the formula, e.g. 1 × ₱25 × 2), Placed at, Applicable tax and App."],["Order 行：单张票显示 “1 ticket”；复式 / 5 号轮转的票显示 “Ticket k of n”（n 按该期同一投注单的组合数计，不随页签变化），下方 Prev / Next 切换同一投注单的其他票，View all 回到列表并展开该组。","Order row: a single ticket shows \"1 ticket\"; System / 5-Roll tickets show \"Ticket k of n\" (n = the combinations of that draw within the same order, independent of the tab) with Prev / Next to move between tickets of the same order and View all to return to the list with the group open."],["Applicable tax 显示该票适用的税规则：单票税前奖金超过 ₱10,000 按全额 20% 预扣；Bet amount = 本票注数 × 单注价 × 倍数。","Applicable tax states the rule for this ticket: a single-ticket gross prize above ₱10,000 is withheld at 20% on the full amount; Bet amount = lines × unit price × multiplier."]],"prd":[{"s":"6.4.2","n":"票据详情页字段：同一投注单、注数、倍数、本票投注金额、下单时间、适用税、App 标识"},{"s":"6.7.1","n":"税率与免税额"}],"tor":[{"c":"1.1.22","t":["电子票记录序列号、条码 / QR、App 标识、交易时间、投注组合、开奖日期","E-ticket records serial number, bar / QR code, app identification, transaction time, bet combination and draw date(s)"]},{"c":"1.4.7","t":["每个开奖日各有独立电子票","Each draw date has its own individual e-ticket"]},{"c":"1.4.10","t":["复式每个组合各有独立电子票","Each System Play combination has its own individual e-ticket"]}],"tor_note":null},{"k":"b3","n":["Barcode 条形码","Barcode"],"sel":"#sc .fade > div.card:nth-child(5)","find":null,"fn":[["Code 128 条形码，内容 = 票号（彩票序列号），每张票一个；PCSO 或财务可扫码检索该票。","A Code 128 barcode whose content is the ticket serial; one per ticket, so PCSO or Finance can scan to retrieve it."],["下方固定说明 “Th s (demo panel: Suspend this ticket)."]],"prd":[{"s":"6.4.2","n":"规则：未开奖的票显示“尚未开奖”和封盘时间"}],"tor":[{"c":"2.4.1.10","t":["每期显示封盘时间和状态","Each draw shows its cut-off time and status"]}],"tor_note":null},{"k":"b6","n":["Winning odds 中奖概率","Winning odds"],"sel":"#sc .fade > div.card:nth-child(10)","find":null,"fn":[["表格 Tier / Odds，按命中数给出各奖级概率（如 Match 6 numbers 1 in 13,983,816）；乐透按规则文档的组合数计算，数字类概率待补。","Table Tier / Odds with the odds of each tier (e.g. Match 6 numbers 1 in 13,983,816); lotto odds come from the rules document's combination counts, digit-game odds are still to be added."]],"prd":[{"s":"6.4.2","n":"票据详情页字段：中奖概率 / 开奖时间表 / 理性购彩提醒"},{"s":"6.3.3","n":"投注确认页②中奖概率"}],"tor":[{"c":"21.1.4","t":["票据须清晰显示中奖概率、开奖时间表和理性购彩提醒","Tickets must clearly display odds of winning, draw schedule and play-responsibly reminders"]},{"c":"21.2.7","t":["投注页与看板须显示赔率、游戏规则和开奖时间表","Odds, game rules and draw schedule must be shown on the slip and dashboard"]}],"tor_note":null},{"k":"b7","n":["Draw schedule 开奖时间表","Draw schedule"],"sel":"#sc .fade > div.card:nth-child(12)","find":null,"fn":[["显示该游戏的开奖日（如 Tue/Thu/Sun 21:00）、Draw 开奖时间和 Cut-off 封盘时间（含提前分钟数，如 20:30 (30 min)）。","Shows the game's draw days (e.g. Tue/Thu/Sun 21:00), the Draw time and the Cut-off time with its lead (e.g. 20:30 (30 min))."]],"prd":[{"s":"6.4.2","n":"票据详情页字段：开奖时间表"},{"s":"6.3.3","n":"封盘与倒计时"}],"tor":[{"c":"21.1.4","t":["票据须清晰显示中奖概率、开奖时间表和理性购彩提醒","Tickets must clearly display odds of winning, draw schedule and play-responsibly reminders"]},{"c":"21.2.7","t":["投注页与看板须显示赔率、游戏规则和开奖时间表","Odds, game rules and draw schedule must be shown on the slip and dashboard"]}],"tor_note":null},{"k":"b8","n":["Play Responsibly 提示卡","Play Responsibly card"],"sel":"#sc .fade > div.card:nth-child(13)","find":null,"fn":[["固定文案 “Only play with money you can afford to lose. Need help? Use PlaySafe or call the Play Smart Help hotline.”；求助热线号码待 PCSO 提供，PlaySafe › 打开限额 / 冷静期设置。","Fixed text \"Only play with money you can afford to lose. Need help? Use PlaySafe or call the Play Smart Help hotline.\"; the hotline number is to be provided by PCSO and PlaySafe › opens limits / cool-off."]],"prd":[{"s":"6.4.2","n":"票据详情页字段：理性购彩提醒、求助热线"},{"s":"6.2.4","n":"理性购彩（PlaySafe）"}],"tor":[{"c":"21.1.4","t":["票据须清晰显示中奖概率、开奖时间表和理性购彩提醒","Tickets must clearly display odds of winning, draw schedule and play-responsibly reminders"]},{"c":"21.2.1","t":["始终清晰显示 “Play Responsibly” 和 “18 岁以上”","Always show \"Play Responsibly\" and \"For 18 years old and above only\""]}],"tor_note":null},{"k":"b9","n":["保存期提示","Retention note"],"sel":null,"find":"Regular tickets kept 30 days","fn":[["页脚固定提示 “Regular tickets kept 30 days; winning tickets 1 year + 1 day from the draw date”。","A fixed footer: \"Regular tickets kept 30 days; winning tickets 1 year + 1 day from the draw date\"."]],"prd":[{"s":"6.4.2","n":"功能说明：页面底部固定提示；保存期规则"}],"tor":[{"c":"1.4.13","t":["普通票 30 天、中奖票 1 年零 1 天可在控制面板查看","Tickets viewable for 30 days, winning ones for 1 year and 1 day"]}],"tor_note":null}],"page_rules":[{"n":["整页规则：我的彩票详情的可见范围","Page-wide: who sees ticket details"],"fn":[["只有票的所有者在登录后能看到本页；返回回到“我的彩票”原列表位置；超过保存期的票显示 “This ticket is past its retention period.”。","Only the ticket owner can see this page after signing in; Back returns to the same position in My Tickets; a ticket past its retention period shows \"This ticket is past its retention period.\"."]],"prd":[{"s":"6.4.2","n":"票据详情页；保存期规则⑤"}],"tor":[{"c":"1.4.13","t":["电子票在控制面板可查看 30 天，中奖票 1 年零 1 天","E-tickets viewable in the dashboard for 30 days, winning ones for 1 year and 1 day"]}]}],"vd":["V1.1：详情新增 Order、条形码（内容为票号）、Applicable tax、App；期号新格式。","V1.1: details add Order, a Barcode (content = ticket serial), Applicable tax and App; new draw number format."],"nw":false},"p_tk_claim":{"id":"p_tk_claim","ti":["票据详情 · 中奖待申领","Ticket details · Won, to claim"],"g":["我的彩票","Tickets"],"prd":"6.4.2","pos":{"what":["一张奖金超过 ₱300,000 的中奖票：显示奖金额和申领说明，玩家点 Start claim 后生成 8 位申领码和二维码，带证件到 PCSO 总部兑奖；码遗失或疑似泄露可重新生成。","A winning ticket above ₱300,000: shows the prize and claim instructions; tapping Start claim generates an 8-character claim code and QR to take with ID to the PCSO Main Office; a lost or leaked code can be regenerated."],"why":["大奖不入钱包，只能到 PCSO 总部领支票，需要一个只属于本人、可核验的凭证。申领码在玩家点击时才生成、只在登录后的详情页显示，不走短信或邮件，降低被盗用的风险；财务复核凭此码核验后登记支票付款。","Large prizes do not go to the wallet; they are paid by cheque at the PCSO Main Office, which needs a verifiable credential tied to the player. The code is generated only when the player taps Start claim and is shown only in the signed-in detail page, never by SMS or email, which limits misuse; Finance review verifies it before registering the cheque."],"who":["已登录且实名通过的票主玩家。Start claim 和重新生成只对状态为“中奖待申领”、金额 > ₱300,000 且未过兑奖截止日的票开放；财务复核在管理端“大奖申领”核验该码，玩家端看不到核验过程。","The signed-in, verified owner. Start claim and Regenerate are available only for a Won · to claim ticket above ₱300,000 and before the claim deadline; Finance review verifies the code in Admin Prize claims, which the player cannot see."]},"blocks":[{"k":"b1","n":["票头卡：游戏 · 状态 · 票号","Ticket header: game · status · serial"],"sel":"#sc .fade > div.card:nth-child(1)","find":null,"fn":[["顶部卡片：游戏封面、PCSO Logo、右上 “App iLotto” 标记、游戏名（如 Super Lotto 6/49）、状态徽标（Won · to claim 中奖待申领）和票号 TKT…；票号是系统生成的唯一序列号。","Top card: game cover, PCSO logo, an \"App iLotto\" tag at the top right, the game name (e.g. Super Lotto 6/49), the status badge (Won · to claim) and the ticket no. TKT…, the unique system-generated serial."]],"prd":[{"s":"6.4.2","n":"票据详情页：票号、游戏、状态、App 标识、PCSO 与游戏 Logo"}],"tor":[{"c":"1.1.22","t":["电子票记录序列号、条码 / QR、App 标识、交易时间、投注组合、开奖日期","E-ticket records serial number, bar / QR code, app identification, transaction time, bet combination and draw date(s)"]}],"tor_note":null},{"k":"b2","n":["申领卡（Start claim 之前）","Claim card (before Start claim)"],"sel":"#sc .fade > div.card:nth-child(2)","find":null,"fn":[["卡片顶部是奖金额（如 ₱4,120,000.00），下方固定说明 “Go to the PCSO Main Office to claim. Tap Start claim to generate your claim code.”。","The top shows the prize (e.g. ₱4,120,000.00) with the fixed text \"Go to the PCSO Main Office to claim. Tap Start claim to generate your claim code.\"."],["底部注明 “Each ticket is claimed on its own. A single ticket above ₱300,000 is paid by cheque offline, not to your wallet.”：逐票申领，大奖以支票线下支付。","A note reads \"Each ticket is claimed on its own. A single ticket above ₱300,000 is paid by cheque offline, not to your wallet.\": claims are per ticket and large prizes are paid offline by cheque."],["开奖结算后系统不会自动生成申领码；已过兑奖截止日的票不再显示本卡，改为 Expired 卡（见“已逾期”页面）。","Settlement does not create a claim code automatically; once the claim deadline has passed this card is replaced by the Expired card (see the Expired page)."]],"prd":[{"s":"6.4.2","n":"票据详情页字段：申领码、发起申领；规则：中奖待申领"},{"s":"6.7.5","n":"玩家先在“我的彩票”详情点 Start claim 发起申领"}],"tor":[{"c":"2.5.4","t":["中奖票的玩家须亲自到 PCSO 总部兑奖","The winning player must claim in person at the PCSO Main Office"]},{"c":"2.5.6","t":["玩家发起申领时才生成一次性申领码，仅登录后在应用内显示","The single-use claim code is generated when the player starts the claim and is shown only in the authenticated app"]}],"tor_note":null},{"k":"b3","n":["Start claim 按钮","Start claim button"],"sel":"#startclaim","find":null,"fn":[["点击后生成唯一一次性的 8 位申领码（大写字母 + 数字，去掉易混字母 I / O），提示 “Claim code generated”，同一位置换成申领码卡。","Tapping generates a unique single-use 8-character code (capital letters + digits, without the easily confused I / O), toasts \"Claim code generated\" and swaps the card for the claim-code card."],["已过兑奖截止日点击提示 “Claim deadline passed — cannot start a claim”；生成事件写审计，玩家以后再看不单独写。","Past the deadline it toasts \"Claim deadline passed — cannot start a claim\"; the generation is audited, later views by the player are not."]],"prd":[{"s":"6.4.2","n":"票据详情页字段：发起申领、申领码（审计）"},{"s":"6.7.5","n":"流程第 5 点：申领码生成写审计"}],"tor":[{"c":"2.5.6","t":["玩家发起申领时才生成一次性申领码，仅登录后在应用内显示","The single-use claim code is generated when the player starts the claim and is shown only in the authenticated app"]}],"tor_note":null},{"k":"b4","n":["申领码卡（Start claim 之后）","Claim code card (after Start claim)"],"sel":null,"find":"Valid until","fn":[["显示 Claim code（如 K7M2X9QD）、二维码（内容即申领码，仅申领时展示，方便 PCSO 扫码）、“Valid until 2027-10-08 (claim deadline)”，有效期 = 开奖日 + 1 年零 1 天。","Shows the Claim code (e.g. K7M2X9QD), a QR (its content is the code, shown only while claiming so PCSO can scan it) and \"Valid until 2027-10-08 (claim deadline)\", the draw date + 1 year + 1 day."],["提示 “Bring valid ID and this code to the PCSO Main Office. Paid by cheque offline, not to your wallet.”；码只在登录后的这页显示，不经短信或邮件发送。","Text \"Bring valid ID and this code to the PCSO Main Office. Paid by cheque offline, not to your wallet.\"; the code appears only on this signed-in page and is never sent by SMS or email."],["财务复核核验通过并登记支票后，票转 Won · claimed，申领码随之失效。","Once Finance review verifies it and registers the cheque the ticket becomes Won · claimed and the code is void."]],"prd":[{"s":"6.4.2","n":"票据详情页字段：申领码（格式、有效期、二维码）"},{"s":"6.7.5","n":"校验结果；登记支票付款"}],"tor":[{"c":"2.5.6","t":["玩家发起申领时才生成一次性申领码，仅登录后在应用内显示","The single-use claim code is generated when the player starts the claim and is shown only in the authenticated app"]},{"c":"2.5.9","t":["申领码在期限届满或核验通过时失效，过期须重新生成","The claim code expires at the prescribed time or on a Verified result; an expired code must be regenerated"]}],"tor_note":null,"state":"A.startClaim(S.p.id)"},{"k":"b5","n":["Regenerate 重新生成","Regenerate the code"],"sel":null,"find":"Lost or leaked? Regenerate the code","fn":[["按钮 “Lost or leaked? Regenerate the code · N left”，每票最多 3 次；成功提示 “New code generated — the old one is void”，旧码立即作废，新码有效期仍到原兑奖截止日。","Button \"Lost or leaked? Regenerate the code · N left\", at most 3 per ticket; success toasts \"New code generated — the old one is void\", the old code is void at once and the new one keeps the same claim deadline."],["用满 3 次提示 “Regenerated 3 times — limit reached”；过了截止日按钮隐藏，改为 “The claim deadline has passed. The prize is forfeited.”。"," , only the label differs); the rest is as usual: game cover, App iLotto tag, game name and serial."]],"prd":[{"s":"6.4.2","n":"规则：中奖待申领票过截止日后仍为“中奖待申领”，标签显示“已逾期”"}],"tor":[{"c":"1.1.22","t":["电子票记录序列号、条码 / QR、App 标识、交易时间、投注组合、开奖日期","E-ticket records serial number, bar / QR code, app identification, transaction time, bet combination and draw date(s)"]}],"tor_note":null,"state":"(()=>{const k=S.tickets.find(x=>x.id===S.p.id);k.draw='2025-10-05';renderKeep()})()"},{"k":"b2","n":["Expired 逾期卡","Expired card"],"sel":"#sc .fade > div.card:nth-child(2)","find":null,"fn":[["红色卡片：Expired 徽标 + “Claim deadline 2026-10-06” + “The claim deadline has passed. The claim code is no longer valid and the prize is treated as forfeited.”。","A red card: the Expired badge, \"Claim deadline 2026-10-06\" and \"The claim deadline has passed. The claim code is no longer valid and the prize is treated as forfeited.\"."],["没有 Start claim 和 Regenerate 按钮，已生成的申领码划线失效；截止日之后 PCSO 再推送“已兑奖”一律拒收；列表卡片提示 “Claim deadline passed — open for details”。","There is no Start claim or Regenerate button and an already generated code is struck through; a redeemed push from PCSO after the deadline is rejected; the list card says \"Claim deadline passed — open for details\"."],["逾期后再保留 30 天，之后归档。","The ticket is kept 30 more days after the deadline and is then archived."]],"prd":[{"s":"6.4.2","n":"规则：逾期标签与隐藏申领按钮；保存期规则④"},{"s":"6.7.5","n":"申领码校验：已过期不通过"}],"tor":[{"c":"2.5.9","t":["申领码在期限届满后自动失效，须重新生成才能继续","The claim code expires automatically after the prescribed period and a new one must be generated"]},{"c":"1.4.13","t":["中奖票在控制面板保留至开奖日起 1 年零 1 天","Winning tickets stay viewable until 1 year and 1 day after the draw"]}],"tor_note":null,"state":"(()=>{const k=S.tickets.find(x=>x.id===S.p.id);k.draw='2025-10-05';renderKeep()})()"},{"k":"b3","n":["Bet details 投注信息","Bet details"],"sel":"#sc .fade > div.card:nth-child(4)","find":null,"fn":[["与其他状态相同的只读投注信息；期号按新格式 YYYYMMDD-N，游戏名已在上下文时可省略游戏编码前缀。","The same read-only bet de 、状态、App 标识、PCSO 与游戏 Logo"}],"tor":[{"c":"1.1.22","t":["电子票记录序列号、条码 / QR、App 标识、交易时间、投注组合、开奖日期","E-ticket records serial number, bar / QR code, app identification, transaction time, bet combination and draw date(s)"]}],"tor_note":null},{"k":"b2","n":["Bet details 投注信息","Bet details"],"sel":"#sc .fade > div.card:nth-child(3)","find":null,"fn":[["只读行：Game、Draw number（期号 + 开奖日期时间，如 L649-20261011-1 · 2026-10-11 21:00，游戏名已在上下文时可省略游戏编码前缀）、Play type、Order、Lines、Multiplier、Bet amount（附算式，如 1 × ₱25 × 2）、Placed at、Applicable tax、App。","Read-only rows: Game, Draw number (number + draw date-time, e.g. L649-20261011-1 · 2026-10-11 21:00; the game-code prefix may be omitted where the game name is in context), Play type, Order, Lines, Multiplier, Bet amount (with the formula, e.g. 1 × ₱25 × 2), Placed at, Applicable tax and App."],["Order 行：单张票显示 “1 ticket”；复式 / 5 号轮转的票显示 “Ticket k of n”（n 按该期同一投注单的组合数计，不随页签变化），下方 Prev / Next 切换同一投注单的其他票，View all 回到列表并展开该组。","Order row: a single ticket shows \"1 ticket\"; System / 5-Roll tickets show \"Ticket k of n\" (n = the combinations of that draw within the same order, independent of the tab) with Prev / Next to move between tickets of the same order and View all to return to the list with the group open."],["Applicable tax 显示该票适用的税规则：单票税前奖金超过 ₱10,000 按全额 20% 预扣；Bet amount = 本票注数 × 单注价 × 倍数。","Applicable tax states the rule for this ticket: a single-ticket gross prize above ₱10,000 is withheld at 20% on the full amount; Bet amount = lines × unit price × multiplier."]],"prd":[{"s":"6.4.2","n":"票据详情页字段：同一投注单、注数、倍数、本票投注金额、下单时间、适用税、App 标识"},{"s":"6.7.1","n":"税率与免税额"}],"tor":[{"c":"1.1.22","t":["电子票记录序列号、条码 / QR、App 标识、交易时间、投注组合、开奖日期","E-ticket records serial number, bar / QR code, app identification, transaction time, bet combination and draw date(s)"]}],"tor_note":null},{"k":"b3","n":["Barcode 条形码","Barcode"],"sel":"#sc .fade > div.card:nth-child(5)","find":null,"fn":[["Code 128 条形码，内容 = 票号（彩票序列号），每张票一个；PCSO 或财务可扫码检索该票。","A Code 128 barcode whos result is being finalized. Please check back later.\", and shows everything once the recalculation finishes (demo panel: Suspend this ticket)."]],"prd":[{"s":"6.4.2","n":"规则：未开奖的票显示“尚未开奖”和封盘时间"}],"tor":[{"c":"2.4.1.10","t":["每期显示封盘时间和状态","Each draw shows its cut-off time and status"]}],"tor_note":null},{"k":"b6","n":["作废说明卡","Void explanation card"],"sel":"#sc .fade > div.card:nth-child(9)","find":null,"fn":[["作废说明按作废原因显示三种固定文案之一（不拼金额）：① 游戏下架：\"This draw was cancelled because the game was unavailable at draw time. Your payment has been refunded to the balances it was paid from.\"；② 无开奖日：\"This draw was cancelled because there is no draw on that day. Your payment has been refunded to the balances it was paid from.\"；③ 运营取消期次：\"This draw was cancelled by PCSO. Your payment has been refunded to the balances it was paid from.\"。","The void note shows one of three fixed texts by reason (no amount): (1) game unavailable: \"This draw was cancelled because the game was unavailable at draw time. Your payment has been refunded to the balances it was paid from.\"; (2) no-draw day: \"This draw was cancelled because there is no draw on that day. Your payment has been refunded to the balances it was paid from.\"; (3) draw cancelled by Operations: \"This draw was cancelled by PCSO. Your payment has been refunded to the balances it was paid from.\""],["退款按原扣款构成原路退回（投注余额 / 奖金余额各退各的）并生成 Refund 流水；作废票保存 30 天后归档。","The refund goes back the way it was paid (bet balance and prize balance each refunded their share) and creates a Refund transaction; voided tickets are archived after 30 days."]],"prd":[{"s":"6.4.2","n":"彩票状态「已作废」：三种原因的说明文案"}],"tor":[{"c":"1.4.13","t":["普通电子票可查看 30 天","Regular e-tickets viewable for 30 days"]}],"tor_note":null},{"k":"b7","n":["Winning odds 中奖概率","Winning odds"],"sel":"#sc .fade > div.card:nth-child(11)","find":null,"fn":[["表格 Tier / Odds，按命中数给出各奖级概率（如 Match 6 numbers 1 in 13,983,816）；乐透按规则文档的组合数计算，数字类概率待补。","Table Tier / Odds with the odds of each tier (e.g. lay Responsibly\" and \"For 18 years old and above only\""]}],"tor_note":null},{"k":"b10","n":["保存期提示","Retention note"],"sel":null,"find":"Regular tickets kept 30 days","fn":[["页脚固定提示 “Regular tickets kept 30 days; winning tickets 1 year + 1 day from the draw date”。","A fixed footer: \"Regular tickets kept 30 days; winning tickets 1 year + 1 day from the draw date\"."]],"prd":[{"s":"6.4.2","n":"功能说明：页面底部固定提示；保存期规则"}],"tor":[{"c":"1.4.13","t":["普通票 30 天、中奖票 1 年零 1 天可在控制面板查看","Tickets viewable for 30 days, winning ones for 1 year and 1 day"]}],"tor_note":null}],"page_rules":[{"n":["整页规则：我的彩票详情的可见范围","Page-wide: who sees ticket details"],"fn":[["只有票的所有者在登录后能看到本页；返回回到“我的彩票”原列表位置；超过保存期的票显示 “This ticket is past its retention period.”。","Only the ticket owner can see this page after signing in; Back returns to the same position in My Tickets; a ticket past its retention period shows \"This ticket is past its retention period.\"."]],"prd":[{"s":"6.4.2","n":"票据详情页；保存期规则⑤"}],"tor":[{"c":"1.4.13","t":["电子票在控制面板可查看 30 天，中奖票 1 年零 1 天","E-tickets viewable in the dashboard for 30 days, winning ones for 1 year and 1 day"]}]}],"vd":null,"nw":false},"p_wallet":{"id":"p_wallet","ti":["钱包","Wallet"],"g":["钱包","Wallet"],"prd":"6.4.3","pos":{"what":["玩家的资金中心：显示总余额，拆成投注余额和奖金余额，提供充值、提现入口，列出已绑定的支付账户，并预览最近 5 条交易流水。","The player's money hub: shows the total balance split into bet balance and prize balance, offers Deposit and Withdraw, lists bound payment accounts and previews the five most recent transactions."],"why":["把“充值进来的钱”和“中奖得来的钱”分开记账，只有奖金余额才能提现，防止把钱包当成转账通道（反洗钱）；余额默认打码，防止旁人偷看。没有这一页，玩家无法自查余额、绑定账户或发起提现。","Top-up money and prize money are kept apart and only prize money can be withdrawn, so the wallet cannot be used as a transfer channel (anti-money-laundering); balances are masked by default against shoulder-surfing. Without it players cannot check balances, bind accounts or start a withdrawal."],"who":["已登录且实名通过的玩家（状态：正常、已限制投注）。未认证或审核中的玩家到不了钱包；自我排除或冷静期内仍可查看余额并提现奖金，但充值按钮点击会被拦截。","Signed-in players with verified identity (Normal, Bet-restricted). Unverified or under-review players cannot reach the wallet; during self-exclusion or cool-off balances and prize withdrawals still work but Deposit is blocked."]},"blocks":[{"k":"b1","n":["总余额卡（Total balance / Bet balance / Prize balance）","Balance card (Total balance / Bet balance / Prize balance)"],"sel":".wtot","find":null,"fn":[["顶部大数字是总余额 = 投注余额 + 奖金余额；下面两个小卡分别是 Bet balance（充值进来的钱）和 Prize balance（中奖入账的钱，带绿色 Withdrawable 标签）。","The large figure is the total = bet balance + prize balance; the two small cards below are Bet balance (top-up money) and Prize balance (prize money, with a green Withdrawable badge)."],["三个金额默认掩码为 ₱***,***.**；右上角眼睛图标一点即显示，显示满 30 秒无操作或离开本页立即重新掩码；每次新登录都回到掩码状态，H5 与 App 一致。","All three amounts are masked as ₱***,***.** by default; the eye icon at top right reveals them, and they re-mask after 30 s of inactivity or when the player leaves the page; every new sign-in starts masked, same on H5 and App."],["掩码与否都不影响充值、提现、投注；只有奖金余额带 Withdrawable 标签，投注余额不能提现。","Masked or not, deposit, withdraw and betting keep working; only the prize balance carries Withdrawable, the bet balance cannot be withdrawn."]],"prd":[{"s":"6.4.3","n":"页面 UI 要点：投注余额、奖金余额分开展示，奖金旁标注“可提现”"},{"s":"6.5.2","n":"姓名与余额掩码规则 ①–⑥"}],"tor":[{"c":"1.1.29","t":["钱包支持充值、提现、下注、奖金入账和余额查询","Player Wallet for deposits, withdrawals, bet placement, prize crediting and balance inquiries"]},{"c":"1.4.23","t":["钱包分开记投注余额（充值资金）和奖金余额，只有奖金余额可提现","Segregated wallet: top-up funds vs prize winnings; only prize winnings are withdrawable"]},{"c":"1.4.42","t":["姓名和钱包余额默认掩码显示（如 ₱***,***.**）","Name and wallet balance masked by default (e.g. ₱***,***.**)"]},{"c":"1.4.43","t":["掩码旁紧邻眼睛图标，一点即显示全文","Eye icon next to the masked value reveals the full text"]},{"c":"1.4.44","t":["显示后无操作最长 30 秒自动重新掩码","Auto re-mask after inactivity of at most 30 seconds"]},{"c":"1.4.45","t":["每次新登录默认掩码，不记忆显示偏好；App 与 Web 行为一致","Masked on every new login, preference never persisted; same on web and app"]},{"c":"1.4.46","t":["掩码不影响投注、充值、提现","Masking never blocks betting, top-up or withdrawal"]}],"tor_note":null},{"k":"b2","n":["Deposit 按钮","Deposit button"],"sel":"button.btn.c","find":null,"fn":[["进入充值页，把钱充进投注余额；不要求已绑定支付账户。","Opens the Deposit page; money goes to the bet balance and no bound payment account is required."],["自我排除、冷静期内点击后在充值页被拦截并提示，详见充值页。","During self-exclusion or cool-off the block is raised on the Deposit page, see that page."]],"prd":[{"s":"6.4.3","n":"表单字段（充值）；演示版充值只选渠道和金额"}],"tor":[{"c":"1.4.20","t":["钱包可通过电子钱包、汇款/付款中心、银行转账充值","Top-up through e-wallet, remittance/payment centres and bank transfer"]}],"tor_note":null},{"k":"b3","n":["Withdraw 按钮","Withdraw button"],"sel":"button.btn.o","find":null,"fn":[["进入提现流程，只能从奖金余额提取；每笔提现都要短信 MFA，没有人工审核。","Starts the withdrawal flow; only the prize balance can be withdrawn, every withdrawal needs SMS MFA and there is no manual review."],["提现被锁定（连续 3 次 MFA 失败）时，点击进入锁定倒计时页，而不是表单。","While withdrawals are locked (3 failed MFA attempts) the button opens the lock countdown page instead of the form."]],"prd":[{"s":"6.4.3","n":"表单字段（提现，强制 MFA 流程）；交互说明（3 次失败锁 30 分钟）"}],"tor":[{"c":"1.4.24","t":["奖金提现到本人名下已验证的电子钱包或银行账户","Prize withdrawals go to verified E-Wallet / bank accounts in the player's own name"]},{"c":"1.4.25","t":["每次提现前必须成功完成 MFA","MFA must be completed before every withdrawal"]}],"tor_note":null},{"k":"b4","n":["可提现提示","Withdrawal info line"],"sel":".winfo","find":null,"fn":[["信息行：Only prize balance can be withdrawn.；Bet balance 卡上另有小字 Used first for bets，表示投注时先扣投注余额。","Info line: Only prize balance can be withdrawn. The Bet balance card also carries the small note Used first for bets, meaning bets debit the bet balance first."],["投注时先扣投注余额，不足部分再扣奖金余额；作废退款时按原扣款比例原路退回两个余额（见退款流水）。","A bet debits the bet balance first and then the prize balance for the rest; a void refund returns each part to the balance it came from (see the Refund tab)."]],"prd":[{"s":"6.4.3","n":"页面 UI 要点；表单字段（提现）：只能从奖金余额扣减"},{"s":"6.4.5","n":"列表字段说明（退款 Tab）：退回投注余额 / 退回奖金余额"}],"tor":[{"c":"1.4.23","t":["钱包分开记投注余额（充值资金）和奖金余额，只有奖金余额可提现","Segregated wallet: top-up funds vs prize winnings; only prize winnings are withdrawable"]}],"tor_note":null},{"k":"b5","n":["Payment accounts 列表与 Manage ›","Payment accounts list and Manage ›"],"sel":null,"find":"Payment accounts","fn":[["列出已绑定的 GCash / Maya / 银行账户卡片，账号只显示后 4 位（如 ••••2347）和大写户名；右侧 Manage › 进入绑定支付账户页。","Lists bound GCash / Maya / bank accounts with only the last 4 digits (e.g. ••••2347) and the holder name in capitals; Manage › opens the Payment accounts page."],["每张卡右侧垃圾桶是解绑：二次确认 + 短信验证码；该账户有处理中的提现时不可解绑，提示 Cannot unlink: this account has a withdrawal pending settlement.","The bin icon on each card unbinds: confirmation plus an SMS code; not allowed while a withdrawal is pending on that account (Cannot unlink: this account has a withdrawal pending settlement.)."],["无已绑定账户时显示 No payment account yet 和 Bind now；提现目的地只能从这里的账户里选。","With none bound the block shows No payment account yet and Bind now; withdrawal destinations can only be picked from these accounts."]],"prd":[{"s":"6.4.3","n":"绑定支付账户板块（钱包页内）"},{"s":"6.4.4","n":"解绑流程"}],"tor":[{"c":"1.3.2","t":["账号掩码显示（仅最后四位可见），采集户名","Account number masked on display (last four digits visible), holder name captured"]},{"c":"1.3.7","t":["增、换、删支付账户须 MFA；有待结算款项时不可移除","Adding, replacing or removing a payment account needs MFA; no removal while a payout is pending settlement"]}],"tor_note":null},{"k":"b6","n":["Bind account 行","Bind account row"],"sel":"button.bindrow","find":null,"fn":[["列表末尾的“＋ Bind account”行，点击进绑定支付账户页新增账户；同一玩家可绑定多个不同账户。","The “＋ Bind account” row at the end of the list opens the Payment accounts page; one player may bind several different accounts."]],"prd":[{"s":"6.4.3","n":"绑定支付账户板块：末尾一张“＋ 绑定新账户”卡"},{"s":"6.4.4","n":"入口说明"}],"tor":[{"c":"1.3.7","t":["玩家可在看板内随时新增支付账户","Players can add payment accounts from the dashboard at any time"]}],"tor_note":null},{"k":"b7","n":["Transactions 预览（五个页签 + 最近 5 条）","Transactions preview (five tabs + last 5 rows)"],"sel":".txcard","find":null,"fn":[["标题 Transactions 带 View all ›（进完整交易流水页）；页签 Deposit / Withdraw / Bet / Prize / Refund 切换，每个页签只预览最近 5 条。","The Transactions header has View all › (full Transactions page); tabs Deposit / Withdraw / Bet / Prize / Refund switch the list, each previewing the last 5 rows."],["每行显示类型、渠道、UTC+8 时间、流水号、带正负号的金额和状态徽标；MFA 失败的提现尝试在 Withdraw 页签显示为 Rejected。","Each row shows type, channel, UTC+8 time, transaction id, signed amount and a status badge; a withdrawal rejected for MFA failure shows as Rejected under Withdraw."]],"prd":[{"s":"6.4.3","n":"交易记录板块（钱包页内）"},{"s":"6.4.5","n":"搜索筛选项（五类 Tab）；列表字段说明"}],"tor":[{"c":"1.4.17","t":["玩家看板展示投注、中奖历史、充值和派彩","Dashboard shows betting and winning history, deposits and payouts"]},{"c":"1.1.29","t":["钱包支持充值、提现、下注、奖金入账和余额查询","Player Wallet for deposits, withdrawals, bet placement, prize crediting and balance inquiries"]}],"tor_note":null}],"page_rules":[{"n":["整页规则：页脚与顶部栏","Page-wide: footer and top bar"],"fn":[["页脚常驻 Play Responsibly · For 18 years old and above only 和 PlaySafe 入口；顶部余额胶囊与本页余额的显示 / 打码状态同步。","The footer always shows Play Responsibly · For 18 years old and above only and a PlaySafe link; the balance pill in the top bar follows the same shown / masked state as this page."]],"prd":[{"s":"6.5.1","n":"全局页面规则（所有玩家界面）：页脚常驻两行文字"}],"tor":[{"c":"21.2.1","t":["全站常驻展示“Play Responsibly”和“For 18 years old and above only”","Show “Play Responsibly” and “For 18 years old and above only” on every screen"]},{"c":"1.1.11","t":["App 与 Web 功能对等","Functional parity between web and mobile app"]}]}],"vd":null,"nw":false},"p_tx":{"id":"p_tx","ti":["交易流水","Transactions"],"g":["钱包","Wallet"],"prd":"6.4.5","pos":{"what":["按类型查看自己钱包的全部资金流水：Deposit、Withdraw、Bet、Prize、Refund 五个页签，每行显示类型、渠道、UTC+8 时间、流水号、金额和状态。","Shows every wallet movement by type in five tabs (Deposit, Withdraw, Bet, Prize, Refund); each row has type, channel, UTC+8 time, transaction id, amount and status."],"why":["余额变化必须能追到来源：玩家看到余额多了或少了，可以在这里找到对应的充值、提现、下单、中奖或退款；同一套流水在管理端用于对账。没有它，玩家争议和监管核对都没有依据。","Every balance change must be traceable: a player who sees the balance move can find the matching deposit, withdrawal, bet, prize or refund here, and the same records feed back-office reconciliation. Without it disputes and audits have nothing to rely on."],"who":["已登录且实名通过的玩家，只能看自己的流水，只读，没有任何修改或删除操作；管理端运营专员、财务复核、合规审计在“交易流水”里看到同样的数据。","Signed-in verified players see only their own records, read-only with no edit or delete; Operations specialist, Finance review and Compliance audit see the same data in Admin › Transactions."]},"blocks":[{"k":"b1","n":["类型页签（Deposit / Withdraw / Bet / Prize / Refund）","Type tabs (Deposit / Withdraw / Bet / Prize / Refund)"],"sel":"div.chips","find":null,"fn":[["五个页签切换列表，默认停在 Deposit；页签过多时横向滑动；某页签没有记录时显示 No records。","Five tabs switch the list and Deposit is shown first; the strip scrolls sideways; a tab without data shows No records."],["状态枚举：Deposit 为 Processing / Success / Failed；Withdraw 为 Processing / Paid / Rejected；Bet 为出票成功 / 出票失败；Refund 为 Refunded。","Status values: Deposit Processing / Success / Failed; Withdraw Processing / Paid / Rejected; Bet ticket issued / failed; Refund Refunded."]],"prd":[{"s":"6.4.5","n":"搜索筛选项（五类 Tab）：状态枚举"}],"tor":[{"c":"1.4.17","t":["玩家看板展示投注、中奖历史、充值和派彩","Dashboard shows betting and winning history, deposits and payouts"]}],"tor_note":null},{"k":"b2","n":["流水列表","Transaction list"],"sel":"div.card","find":null,"fn":[["每行：左侧方向图标（收入绿、支出白），中间“类型 · 渠道”、UTC+8 时间和流水号（如 TXN1071），右侧带正负号的金额和状态徽标。","Each row: a direction icon (green for money in), “type · channel”, UTC+8 time and transaction id (e.g. TXN1071) in the middle, and the signed amount with a status badge on the right."],["Bet 一次投注一条流水：复式、5 号轮转、多期预购按总金额一次扣款，流水注明出票张数；失败后内部自动回滚的不展示给玩家。","Bet has one row per purchase: system bets, 5-number rolling and multi-draw purchases are debited once for the total and the row states the ticket count; internal rollbacks are not shown to the player."],["Prize 只含自动入账钱包的奖金；Withdraw 里 MFA 连续失败的尝试显示为 Rejected。","Prize lists only prizes credited to the wallet automatically; a withdrawal attempt that failed MFA shows as Rejected under Withdraw."]],"prd":[{"s":"6.4.5","n":"列表字段说明；搜索筛选项（下单 / 兑奖 Tab 说明）"},{"s":"6.4.3","n":"交互说明：MFA 失败落一笔“已拒绝”"}],"tor":[{"c":"1.1.29","t":["钱包记录充值、提现、下注、奖金入账","Wallet covers deposits, withdrawals, bet placements and prize crediting"]},{"c":"1.4.17","t":["玩家看板展示投注、中奖历史、充值和派彩","Dashboard shows betting and winning history, deposits and payouts"]},{"c":"1.4.28","t":["每次提现 MFA 的成功与失败都要记录","Every withdrawal MFA attempt, successful or failed, is logged"]}],"tor_note":null},{"k":"b3","n":["页脚说明","Footer note"],"sel":"div.scroll:nth-child(3) > div:nth-child(3)","find":null,"fn":[["固定一句：Times in UTC+8. Only prizes credited to the wallet appear here; prizes above ₱300,000 are paid by cheque offline at PCSO and never touch the wallet.","Fixed line: Times in UTC+8. Only prizes credited to the wallet appear here; prizes above ₱300,000 are paid by cheque offline at PCSO and never touch the wallet."],["单票奖金不超过 ₱300,000 自动入账钱包并出现在 Prize 页签；超过的大奖需玩家在“我的彩票”发起申领，PCSO 线下付支票，不进钱包也不在此列。","A prize of ₱300,000 or less is credited to the wallet automatically and appears under Prize; a larger prize is claimed from My tickets and paid by cheque offline, so it never appears here."]],"prd":[{"s":"6.4.5","n":"搜索筛选项：兑奖 Tab 说明（单票 > ₱300,000 不进钱包）"}],"tor":[{"c":"1.4.22","t":["不超过 ₱300,000 的奖金自动存入玩家钱包","Prizes up to ₱300,000 are credited automatically to the Player Wallet"]}],"tor_note":null}],"page_rules":[{"n":["整页规则：时区与只读","Page-wide: time zone and read-only"],"fn":[["所有时间统一按菲律宾时间 UTC+8 显示；本页不提供任何修改、撤销或导出操作。","All times are shown in Philippine time (UTC+8); the page has no edit, reverse or export action."]],"prd":[{"s":"6.4.5","n":"列表字段说明：发生时间"}],"tor":[{"c":"4.12","t":["时间统一使用 UTC+8","All times use the Philippine time zone (UTC+8)"]}]}],"vd":null,"nw":false},"p_tx_refund":{"id":"p_tx_refund","ti":["交易流水 · 退款","Transactions · Refund"],"g":["钱包","Wallet"],"prd":"6.4.5","pos":{"what":["交易流水的 Refund 页签：每张被作废的彩票一条退款记录，写明原票号、作废原因，以及退回投注余额和退回奖金余额各多少。","The Refund tab of Transactions: one refund row per voided ticket, with the original ticket number, the void reason and how much went back to the bet balance and to the prize balance."],"why":["玩家看到余额突然增加，需要知道钱是哪张票退回的、退到哪个余额；退款原路退回（投注余额退投注余额、奖金余额退奖金余额）才能保持“只有奖金余额可提现”的口径。","When the balance rises unexpectedly the player needs to see which ticket it came from and which balance received it; refunding to the original balances keeps the rule that only prize money is withdrawable."],"who":["已登录且实名通过的玩家，只读；退款由系统在期次作废时自动生成，玩家无法申请或修改。管理端在“交易流水 · 退款”看到同一批记录。","Signed-in verified players, read-only; refunds are created by the system when a draw is voided and cannot be requested or edited. Admin sees the same rows under Transactions › Refunds."]},"blocks":[{"k":"b1","n":["类型页签（停在 Refund）","Type tabs (on Refund)"],"sel":"div.chips","find":null,"fn":[["同一排五个页签，Refund 被选中；其他页签的内容见交易流水页。","The same five tabs with Refund selected; the other tabs are described on the Transactions page."]],"prd":[{"s":"6.4.5","n":"搜索筛选项（五类 Tab）：退款"}],"tor":[{"c":"1.4.17","t":["玩家看板展示投注、中奖历史、充值和派彩","Dashboard shows betting and winning history, deposits and payouts"]}],"tor_note":null},{"k":"b2","n":["退款记录行","Refund rows"],"sel":"div.card","find":null,"fn":[["每行标题 Refund · 游戏名，下面依次是时间、流水号、Ticket 原票号、作废原因，以及 To bet balance ₱X · prize balance ₱Y；右侧绿色 +₱ 退款金额 = 退回投注余额 + 退回奖金余额，状态徽标 Refunded（单一状态）。","Each row reads Refund · game name, then time, transaction id, Ticket number, the void reason and To bet balance ₱X · prize balance ₱Y; the green +₱ amount = refund to bet balance + refund to prize balance, with the single status Refunded."],["作废原因共三种：游戏下架到开奖时间仍未上架、无开奖日、运营取消期次（取消须运营复核批准）；每张作废票一条，不合并。","Three void reasons exist: game delisted and not back by draw time, no-draw day, and a draw cancelled by Operations (cancellation needs Operations reviewer approval); one row per voided ticket, never merged."],["只读，没有按钮；对应的作废票在“我的彩票”显示 Voided，30 天后归档。","Read-only with no buttons; the matching ticket shows Voided in My tickets and is archived after 30 days."]],"prd":[{"s":"6.4.5","n":"列表字段说明（退款 Tab）"},{"s":"6.4.2","n":"作废票说明"}],"tor":[{"c":"1.1.29","t":["钱包记录退款等资金往来，余额可查","Wallet movements such as refunds are recorded and balances can be inquired"]},{"c":"1.4.17","t":["玩家看板展示投注、中奖历史、充值和派彩","Dashboard shows betting and winning history, deposits and payouts"]}],"tor_note":null},{"k":"b3","n":["页脚说明","Footer note"],"sel":"div.scroll:nth-child(3) > div:nth-child(3)","find":null,"fn":[["固定一句：Times in UTC+8. Only prizes credited to the wallet appear here; prizes above ₱300,000 are paid by cheque offline at PCSO and never touch the wallet.","Fixed line: Times in UTC+8. Only prizes credited to the wallet appear here; prizes above ₱300,000 are paid by cheque offline at PCSO and never touch the wallet."],["单票奖金不超过 ₱300,000 自动入账钱包并出现在 Prize 页签；超过的大奖需玩家在“我的彩票”发起申领，PCSO 线下付支票，不进钱包也不在此列。","A prize of ₱300,000 or less is credited to the wallet automatically and appears under Prize; a larger prize is claimed from My tickets and paid by cheque offline, so it never appears here."]],"prd":[{"s":"6.4.5","n":"搜索筛选项：兑奖 Tab 说明（单票 > ₱300,000 不进钱包）"}],"tor":[{"c":"1.4.22","t":["不超过 ₱300,000 的奖金自动存入玩家钱包","Prizes up to ₱300,000 are credited automatically to the Player Wallet"]}],"tor_note":null}],"page_rules":[],"vd":null,"nw":false},"p_bind":{"id":"p_bind","ti":["绑定支付账户","Payment accounts"],"g":["钱包","Wallet"],"prd":"6.4.4","pos":{"what":["绑定和解绑 GCash、Maya 或银行账户：选渠道，填账号和户名，短信验证码通过后生效；下方列出已绑定账户并可解绑。","Bind or unbind a GCash, Maya or bank account: pick a channel, enter the number and holder name, confirm with an SMS code; bound accounts are listed below with an unbind option."],"why":["提现只能打到本人名下已绑定的账户，并且同一账号只能属于一个玩家，避免多人共用一个收款账户，保证资金归属可追溯（反洗钱）；绑定、解绑都要 MFA，防止账号被盗后改收款人。","Withdrawals go only to bound accounts in the player's own name and one account can belong to one player only, so funds stay traceable (anti-money-laundering); binding and unbinding need MFA so a stolen session cannot redirect payouts."],"who":["已登录且实名通过的玩家，可在钱包页或提现流程的 Bind now 进入；充值不需要先绑定。本期不强制激活投注前必须绑定（附录 A 第 73 项）。","Signed-in verified players, reached from Wallet or from Bind now in the withdrawal flow; deposits do not require a bound account. Binding before betting is not enforced in this phase (Appendix A item 73)."]},"blocks":[{"k":"b1","n":["渠道页签（GCash / Maya / Bank）","Channel chips (GCash / Maya / Bank)"],"sel":"div.chips","find":null,"fn":[["三个渠道切换；选 Bank 时多出银行下拉（BDO / BPI / Metrobank / UnionBank），GCash、Maya 不显示。","Three channels; choosing Bank adds a bank selector (BDO / BPI / Metrobank / UnionBank), hidden for GCash and Maya."]],"prd":[{"s":"6.4.4","n":"表单字段：支付渠道、银行"}],"tor":[{"c":"1.3.2","t":["登记须采集账户类型（电子钱包/银行）和机构名","Enrollment captures account type (E-Wallet/Bank) and provider or bank name"]}],"tor_note":null},{"k":"b2","n":["绑定表单（Mobile number / Account number 与 Account holder name）","Binding form (Mobile number / Account number and Account holder name)"],"sel":"div.card:has(#b_no)","find":null,"fn":[["号码栏：GCash、Maya 必须 09 开头共 11 位，否则提示 GCash and Maya numbers must start with 09 and have 11 digits.；银行卡至少 10 位（Enter a valid number (at least 10 digits)）；空值提示 Enter your mobile number / Enter your account number。","Number field: GCash and Maya must start with 09 and have 11 digits, else GCash and Maya numbers must start with 09 and have 11 digits.; bank cards need at least 10 digits (Enter a valid number (at least 10 digits)); empty gives Enter your mobile number / Enter your account number."],["户名默认带入实名（大写），必填，空则提示 Enter the account holder name；要求与实名一致。","Holder name defaults to the verified name in capitals and is required (Enter the account holder name); it must match the verified identity."],["唯一性：同一玩家重复绑定提示 You have already linked this account.；已被其他玩家绑定提示 This account is already linked to another player. Please use a different one.","Uniqueness: binding the same account twice gives You have already linked this account.; an account linked to another player gives This account is already linked to another player. Please use a different one."]],"prd":[{"s":"6.4.4","n":"表单字段；支付账户唯一性规则"}],"tor":[{"c":"1.3.2","t":["采集账号（掩码显示）和与提供方登记一致的户名","Capture the account number (masked on display) and holder name as registered with the provider"]},{"c":"1.3.1","t":["本人名下的电子钱包或银行账户（本期仅部分实现）","Own-name E-Wallet or bank account (only partly implemented in this phase)"]}],"tor_note":null},{"k":"b3","n":["Bind 按钮","Bind button"],"sel":"#bb","find":null,"fn":[["校验通过后弹出短信验证码（Binding a payment account needs an SMS code），验证通过才真正绑定，并写审计日志。","After validation an SMS code is requested (Binding a payment account needs an SMS code); the account is bound only when it passes, and the action is audited."],["绑定时的短信验证码走交易类场景（OTP_TXN）：每天 10 条上限、错 5 次锁 1 小时。","The code uses the transaction scenario (OTP_TXN): 10 codes per day, 5 wrong entries lock it for 1 hour."]],"prd":[{"s":"6.4.4","n":"表单字段：短信验证码；支付账户唯一性规则"},{"s":"6.1.4","n":"交互说明：验证码发送与校验限制按场景分别计数"}],"tor":[{"c":"1.3.7","t":["增、换、删支付账户须 MFA；有待结算款项时不可移除","Adding, replacing or removing a payment account needs MFA; no removal while a payout is pending settlement"]},{"c":"15.3.2","t":["支付账户登记和修改必须强认证","Strong authentication for payment account enrollment and modification"]}],"tor_note":null},{"k":"b4","n":["沙箱说明","Sandbox note"],"sel":null,"find":"aggregator sandbox","fn":[["提示一期对接聚合支付沙箱，正式支付接入在后续阶段；绑定结果在沙箱里不会产生真实资金往来。","States that phase 1 runs against the payment aggregator sandbox and production integration comes later; binding in the sandbox moves no real money."]],"prd":[{"s":"6.4.4","n":"入口说明；表单字段"}],"tor":[{"c":"1.4.31","t":["对接授权支付渠道，所有交易记录可在后台对账","Authorized payment gateways; every transaction logged and reconcilable in the back office"]}],"tor_note":null},{"k":"b5","n":["Bound 已绑定账户列表","Bound accounts list"],"sel":null,"find":"Bound","fn":[["列出已绑定账户：渠道 · ••••后 4 位、大写户名；每行垃圾桶解绑。","Lists bound accounts with channel · •••• last 4 digits and the holder name in capitals; the bin icon on each row unbinds."],["解绑流程：Unbind this account? → Unbind → 短信验证码（Removing a payment account needs an SMS code）→ Account unbound；该账户有处理中的提现时不可解绑，提示 Cannot unlink: this account has a withdrawal pending settlement.","Unbind flow: Unbind this account? → Unbind → SMS code (Removing a payment account needs an SMS code) → Account unbound; blocked while a withdrawal on it is processing (Cannot unlink: this account has a withdrawal pending settlement.)."]],"prd":[{"s":"6.4.4","n":"解绑流程"}],"tor":[{"c":"1.3.7","t":["增、换、删支付账户须 MFA；有待结算款项时不可移除","Adding, replacing or removing a payment account needs MFA; no removal while a payout is pending settlement"]},{"c":"1.3.2","t":["账号掩码显示，仅最后四位可见","Account number masked, last four digits visible"]}],"tor_note":null}],"page_rules":[],"vd":["V1.1：绑定和解绑都要短信验证码；GCash / Maya 做 09 + 11 位校验。","V1.1: binding and unbinding both need an SMS code; GCash / Maya get the 09 + 11-digit check."],"nw":false},"p_deposit":{"id":"p_deposit","ti":["充值","Deposit"],"g":["钱包","Wallet"],"prd":"6.4.3","pos":{"what":["玩家给投注余额充值：输入整数金额（可点快捷金额），选支付渠道 GCash / Maya / Bank card，点 Confirm deposit 下单，到账后进入投注余额。","Players top up the bet balance: enter a whole-peso amount (or tap a quick amount), choose GCash / Maya / Bank card and tap Confirm deposit; the money lands in the bet balance."],"why":["充值是唯一资金入口，必须受玩家自设的日 / 周 / 月充值限额约束（负理性购彩），并在自我排除、冷静期内拦住；金额口径固定（₱20–₱99,999，整数）才能与支付渠道的对账单一一对上。","Deposit is the only money entry, so it must respect the player's own daily / weekly / monthly limit (play responsibly) and be blocked during self-exclusion or cool-off; fixed amount rules (₱20–₱99,999, whole pesos) keep it reconcilable with the channel statements."],"who":["已登录且实名通过的玩家（状态：正常、已限制投注）。自我排除、冷静期内不可充值；未认证或审核中的玩家进不来。不要求已绑定支付账户。","Signed-in verified players (Normal, Bet-restricted). Not available during self-exclusion or cool-off; on，冷静期提示 Deposits are disabled during cool-off；金额校验和限额校验通过后才下单。","During self-exclusion it shows Deposits are disabled during self-exclusion, during cool-off Deposits are disabled during cool-off; the order is placed only after amount and limit checks pass."],["成功弹窗 Deposit successful · Credited to bet balance，按钮 Done / Play now；失败的充值不发限额预警，成功到账后才按使用率发预警。","Success dialog Deposit successful · Credited to bet balance with Done / Play now; a failed deposit raises no limit alert, the usage alert is raised only after crediting."]],"prd":[{"s":"6.4.3","n":"表单字段（充值）；自我排除 / 冷静期不可充值"},{"s":"6.2.4","n":"冷静期与自我排除"}],"tor":[{"c":"21.3.1","t":["超限额的充值须被系统自动拦截","The system must automatically block top-ups that exceed the limit"]}],"tor_note":null}],"page_rules":[{"n":["整页规则：金额口径与记录","Page-wide: amount rules and records"],"fn":[["每笔充值在交易流水 Deposit 页签留下 Processing / Success / Failed 记录，并在管理端可与支付渠道对账。","Every deposit leaves a Processing / Success / Failed row under Transactions › Deposit and can be reconciled with the payment channel in Admin."]],"prd":[{"s":"6.4.5","n":"搜索筛选项：充值 Tab 状态枚举"}],"tor":[{"c":"1.4.31","t":["对接授权支付渠道，所有交易记录可在后台对账","Authorized payment gateways; every transaction logged and reconcilable in the back office"]}]}],"vd":["V1.1：最低充值 ₱20、上限 ₱99,999，只能整数；限额预警在到账后发出。渠道可用性按支付中心实时结果：不可用渠道置灰不可选（默认渠道不可用时自动改选第一个可用渠道，全部不可用时确认充值按钮置灰）；下单瞬间渠道不可用（PAY-0007）不建单并提示 This deposit channel is currently unavailable. Please choose another channel.；渠道列表查询失败（PAY-0008）提示 Unable to load payment channels. Please try again later. 并禁用提交。","V1.1: minimum ₱20, maximum ₱99,999, whole pesos only; the limit alert is raised after crediting. Channel availability follows the payment center: unavailable channels are greyed out and cannot be selected (a default that is unavailable moves to the first available one; none available disables Confirm deposit); if the channel turns unavailable at order time (PAY-0007) the order is not created and the player sees \"This deposit channel is currently unavailable. Please choose another channel.\"; if the channel list fails to load (PAY-0008) the page shows \"Unable to load payment channels. Please try again later.\" and submit is disabled."],"nw":false},"p_wd1":{"id":"p_wd1","ti":["提现 · 填写金额与去向","Withdraw · amount & destination"],"g":["钱包","Wallet"],"prd":"6.4.3","pos":{"what":["提现第 1 步：显示可提现的奖金余额，玩家输入金额（或点 Withdraw all），选一个已绑定的账户作为去向，点 Next 进入短信验证。","Withdrawal step 1: shows the withdrawable prize balance; the player enters an amount (or taps Withdraw all), picks a bound destination and taps Next to go to SMS verification."],"why":["提现是资金流出口，必须只来自奖金余额、只去本人已绑定账户，并且最低额等规则在入口就拦住；没有这一步，投注余额会被当成转账通道，违反反洗钱要求。","Withdrawal is the money exit: it must come from the prize balance only and go to the player's own bound account, with the minimum enforced up front; otherwise the bet balance becomes a transfer channel, which breaks the anti-money-laundering rule."],"who":["已登录且实名通过、钱包里有奖金余额的玩家；自我排除期间仍可提现。提现被锁定时进入的是锁定倒计时页。没有人工审核环节。","Signed-in verified players with a prize balance; withdrawing stays possible during self-exclusion. While withdrawals are locked the countdown page is shown instead. There is no manual review step."]},"blocks":[{"k":"b1","n":["提现步骤条","Withdrawal step bar"],"sel":".steps","find":null,"fn":[["顶部 4 段进度条：① 金额与去向 → ② 短信 MFA → ③ 确认 → ④ 已提交；当前第 1 段点亮。","Four-segment bar: ① amount and destination → ② SMS MFA → ③ confirm → ④ submitted; segment 1 is lit."]],"prd":[{"s":"6.4.3","n":"表单字段（提现，强制 MFA 流程）"}],"tor":[{"c":"1.4.25","t":["每次提现前必须成功完成 MFA","MFA must be completed before every withdrawal"]}],"tor_note":null},{"k":"b2","n":["Withdrawable 金额卡","Withdrawable amount card"],"sel":"div.card:has(#w_amt)","find":null,"fn":[["顶部显示 Withdrawable (prize balance) 和奖金余额数字；₱ 前缀数字框输入提现金额，下方 Withdraw all 一键填入整数余额。","Shows Withdrawable (prize balance) and its amount; a ₱-prefixed field takes the withdrawal amount and Withdraw all fills the whole-peso balance."],["校验：空 → Enter an amount；低于 ₱100 → Minimum withdrawal is ₱100；超过奖金余额 → Exceeds your prize balance. Only prize balance can be withdrawn.","Validation: empty → Enter an amount; below ₱100 → Minimum withdrawal is ₱100; above the prize balance → Exceeds your prize balance. Only prize balance can be withdrawn."],["只从奖金余额扣减，投注余额不受影响；默认保留两位小数。演示面板 Whole-number withdrawal 设为 On（配置开关，默认 Off，正式上线前由产品与支付团队决定何时打开）后只允许整数比索，带小数提示 “Withdrawal amount must be a whole number.”，零头留在奖金余额，最低 ₱100 不变（附录 A 第 49 项）。","Debits the prize balance only and never the bet balance; two decimals are kept by default. With Whole-number withdrawal set to On in the demo panel (a configuration switch, Off by default; Product and Payments decide when to turn it on before launch) only whole pesos are accepted, a decimal shows “Withdrawal amount must be a whole number.”, the cents stay in the prize balance and the ₱100 minimum is unchanged (Appendix A item 49)."]],"prd":[{"s":"6.4.3","n":"表单字段（提现）：提现金额"},{"s":"6.4.3","n":"附录 A 第 49 项：提现金额是否只能为整数比索"}],"tor":[{"c":"1.4.23","t":["钱包分开记投注余额（充值资金）和奖金余额，只有奖金余额可提现","Segregated wallet: top-up funds vs prize winnings; only prize winnings are withdrawable"]},{"c":"1.4.23","t":["只有入账钱包的奖金才可提现","Only prize winnings credited to the wallet are withdrawable"]}],"tor_note":null},{"k":"b3","n":["Destination 账户选择","Destination account picker"],"sel":null,"find":"Destination","fn":[["列出已绑定的 GCash / Maya / 银行账户（渠道 ••••后 4 位 + 户名），单选，默认选第一个；只能选已绑定账户。","Lists bound GCash / Maya / bank accounts (channel ••••last 4 digits + holder name), single choice with the first preselected; only bound accounts can be chosen."],["没有已绑定账户时显示 Bind a destination first 和 Bind now，进入绑定支付账户页。","With no bound account it shows Bind a destination first and Bind now, which opens Payment accounts."]],"prd":[{"s":"6.4.3","n":"表单字段（提现）：目的地；绑定支付账户板块"},{"s":"6.4.4","n":"入口说明：也可从提现流程“去绑定”进入"}],"tor":[{"c":"1.4.24","t":["提现只到本人名下已验证的电子钱包或银行账户","Withdrawals only to verified E-Wallet / bank accounts in the player's own name"]}],"tor_note":null},{"k":"b4","n":["MFA 提示","MFA notice"],"sel":null,"find":"Every withdrawal requires SMS MFA","fn":[["H5 提示「Every withdrawal requires SMS MFA. Biometrics are available on the App only.」：H5 每笔提现都要短信验证，不分金额；App 形态显示「Every withdrawal requires Face ID (SMS code as fallback). Trusted devices are not exempt.」","H5 states \"Every withdrawal requires SMS MFA. Biometrics are available on the App only.\"; every H5 withdrawal is verified by SMS regardless of amount. The App terminal shows \"Every withdrawal requires Face ID (SMS code as fallback). Trusted devices are not exempt.\""]],"prd":[{"s":"6.4.3","n":"表单字段（提现）：MFA 验证码；每次强制验证"}],"tor":[{"c":"1.4.26","t":["每笔提现都要 MFA，不分金额，不因可信设备豁免","MFA on every withdrawal regardless of amount, no Trusted Device exemption"]}],"tor_note":null},{"k":"b5","n":["Next 按钮","Next button"],"sel":"button.btn","find":null,"fn":[["金额与去向校验通过后进入第 2 步短信验证；不通过时在金额栏下显示红字提示，不发验证码。","When amount and destination are valid it goes to step 2 (SMS verification); otherwise a red message appears under the amount and no code is sent."]],"prd":[{"s":"6.4.3","n":"表单字段（提现，强制 MFA 流程）"}],"tor":[{"c":"1.4.25","t":["提现确认前须完成 MFA","MFA before the withdrawal is confirmed"]}],"tor_note":null}],"page_rules":[{"n":["App 专属：可信设备与生物识别","App only: trusted device and biometrics"],"fn":[["可信设备（仅 App）：玩家在 App 上选择“信任此设备”后，该设备后续登录仍先输入密码，之后用设备原生生物识别（Face ID / 指纹）代替短信验证码这一步；只对这一台设备生效，列表可在“登录与安全”查看、移除。改密码、找回密码重置、换绑手机号、玩家自助停用、管理端停用或重置密码都会使全部信任设备失效，之后一律密码 + 短信验证码登录，可重新信任。本期信任设备不设有效期、不限数量，靠手动移除和上述自动失效控制。","Trusted device (App only): after the player chooses “Trust this device” in the App, later sign-ins on that device still ask for the password first, then use native biometrics (Face ID / fingerprint) in place of the SMS code step only; it applies to that one device only and the list can be viewed and removed under Login & security. Changing or resetting the password, changing the mobile number, self-deactivation, and an admin deactivating the account or resetting the password all invalidate every trusted device; the next sign-in is password + SMS and the device can be trusted again. This phase has no expiry and no device limit; control is by manual removal and the automatic invalidation above."],["提现 MFA（仅 App）：App 上用设备原生生物识别作为提现二次验证；H5 仍用短信验证码。","Withdrawal MFA (App only): on the App the withdrawal second step uses the device’s native biometrics; H5 keeps the SMS code."],["回退：手机本地生物识别比对失败、取消或设备不支持时只回退到短信验证码（登录时仍已输入密码），不计失败次数、不落“已拒绝”流水、不推进锁定。只有服务端能校验到的失败才计数：设备签名校验不通过、短信验证码错误——提现连续 3 次锁 30 分钟并各落一笔“已拒绝”，登录按错误验证码计入登录场景次数；管理端登录不用生物识别，仍为密码 + 4 位短信 OTP。","Fallback: if the local biometric check fails, is cancelled or is unsupported, it only falls back to the SMS code (the password was already entered at sign-in), with no failure count, no Rejected transaction and no lock progress. Only failures the server can verify count: an invalid device signature or a wrong SMS code — in withdrawal 3 in a row lock withdrawals for 30 minutes and each records a Rejected transaction; in sign-in they count like a wrong code in the sign-in scenario. Admin sign-in does not use biometrics and stays password plus 4-digit SMS OTP."],["App 专属，演示原型用「Terminal」开关模拟：右侧演示面板 Terminal 选 App（iPhone 15 · iLotto App 1.0.3）即进入 App 形态，登录页、提现验证和“账号安全”才出现可信设备与生物识别；默认 H5 形态下这些入口全部不出现。生物识别由页面内模拟的原生弹窗代替（Authenticate / Cancel），面板「Biometric: local check fails」开关模拟本地比对失败（不计数），「Biometric: device signature invalid」开关模拟服务端签名校验失败（计数）。","App only. The demo simulates it with the Terminal switch: in the demo panel pick App (iPhone 15 · iLotto App 1.0.3) and the sign-in, withdrawal verification and Account security screens show trusted-device and biometric features; the default H5 terminal shows none of them. Native biometrics are replaced by an in-page simulated sheet (Authenticate / Cancel), and the panel toggle “Biometric: local check fails” simulates a local failure (not counted) and “Biometric: device signature invalid” simulates a server-side signature failure (counted)."]],"prd":[{"s":"6.1.3","n":"登录：App 可信设备与生物识别，H5 不支持"},{"s":"6.1.4","n":"第二因子：可信设备以生物识别代替短信验证码，失败回退短信"},{"s":"6.4.3","n":"提现 MFA：App 生物识别，H5 短信"},{"s":"6.8.3","n":"登录记录与玩家档案：终端 H5/App、设备型号，可信设备列表只读"}],"tor":[{"c":"1.1.15","t":["可信设备须成功登记原生生物识别，之后该设备登录以生物识别代替 OTP；设备端生物识别被关闭则信任自动撤销","A device is tagged Trusted only after native biometric enrolment; later logins use biometrics in lieu of OTP; trust is revoked if device biometrics are disabled"]},{"c":"1.4.29","t":["有生物识别能力的移动设备上，每笔提现的 MFA 用设备原生生物识别，短信或邮件 OTP 仅作回退","On biometric-capable mobile devices, withdrawal MFA uses native biometrics, with SMS/email OTP only as fallback"]},{"c":"1.1.42","t":["自动化风险分超阈值时要求证明有真人，可信设备上为生物识别验证","When the automation risk score exceeds the threshold, proof of a person is required; on a Trusted Device it is biometric verification"]},{"c":"1.3.9","t":["登记或更换电子钱包 / 银行账户前必须完成 MFA，即使在已认证会话或有可信设备","Enrolling or changing an e-wallet or bank account requires MFA, even in an authenticated session or on a Trusted Device"]},{"c":"1.4.25","t":["每笔提现确认前必须完成 MFA，即使已认证会话或有可信设备","Every withdrawal requires MFA right before confirmation, even in an authenticated session or on a Trusted Device"]},{"c":"8.7.8","t":["安全剧本可撤销玩家的可信设备状态","Security playbooks can revoke a player’s Trusted Device status"]},{"c":"8.7.9.1","t":["安全告警上下文含已登记设备 ID 与可信设备状态","Security alert context includes registered device IDs and Trusted Device status"]}]}],"vd":["V1.1：提现渠道可用性按支付中心实时结果：不可用渠道对应的到账账户置灰不可选（默认账户不可用时自动改选第一个可用账户，全部不可用时 Next 置灰）；页面显示支付中心提示语（可用 1 条、不可用 2 条，无提示语时显示 This channel is temporarily unavailable. Please try again later.）；确认提现瞬间渠道不可用（PAY-0107）不建单、不扣款并提示 This withdrawal channel is currently unavailable. Please choose another channel.；渠道列表查询失败（PAY-0008）按不可用处理，显示 Unable to load payment channels. Please try again later. 并禁用提交。","V1.1: withdrawal channel availability follows the payment center: destinations on an unavailable channel are greyed out and cannot be selected (an unavailable default moves to the first available one; none available disables Next); the page shows the payment-center tips (1 when available, 2 when unavailable; with no tips it shows This channel is temporarily unavailable. Please try again later.); if the channel turns unavailable at confirmation (PAY-0107) no order is created, no money is deducted and the player sees This withdrawal channel is currently unavailable. Please choose another channel.; if the channel list fails to load (PAY-0008) it is treated as unavailable: the page shows Unable to load payment channels. Please try again later. and submit is disabled."],"nw":false},"p_wd2":{"id":"p_wd2","ti":["提现 · MFA 验证","Withdraw · MFA"],"g":["钱包","Wallet"],"prd":"6.4.3","pos":{"what":["提现第 2 步：向玩家手机发送 4 位短信验证码，玩家输入后点 Verify；通过后进入确认页（金额、去向、到账时间、手续费）并提交提现。","Withdrawal step 2: a 4-digit SMS code is sent to the player's phone; entering it and tapping Verify leads to the confirm page (amount, destination, ETA, fee) and then submits the withdrawal."],"why":["防止账号被盗后被人把奖金提走：每笔提现都要现场验证，即使在已登录、常用设备上、金额很小；连续输错 3 次锁定提现 30 分钟，每次尝试（成功或失败）都留审计记录。","Stops a stolen session from draining prizes: every withdrawal is verified on the spot, even when signed in on a usual device and for small amounts; 3 consecutive wrong codes lock withdrawals for 30 minutes and every attempt, successful or not, is logged."],"who":["已完成第 1 步的玩家。验证码用交易类场景（OTP_TXN），与登录的“5 次错锁 1 小时”是两套独立规则；管理端无人工审核环节，只在审计日志里看到 MFA 记录。","Players who completed step 1. The code uses the transaction scenario (OTP_TXN), separate from the login rule of 5 errors / 1 hour; Admin has no manual review and only sees the MFA records in the audit log."]},"blocks":[{"k":"b1","n":["提现步骤条","Withdrawal step bar"],"sel":".steps","find":null,"fn":[["进度条第 2 段点亮，表示正在短信 MFA 步骤；返回键回到第 1 步，金额和去向保留。","Segment 2 is lit for the SMS MFA step; Back returns to step 1 and keeps the amount and destination."]],"prd":[{"s":"6.4.3","n":"表单字段（提现，强制 MFA 流程）"}],"tor":[{"c":"1.4.25","t":["每次提现前必须成功完成 MFA","MFA must be completed before every withdrawal"]}],"tor_note":null},{"k":"b2","n":["SMS MFA verification 提示","SMS MFA verification heading"],"sel":"h3:nth-child(2)","find":null,"fn":[["标题 SMS MFA verification，下面一句 Enter the code to withdraw ₱X，X 为第 1 步输入的金额。","Heading SMS MFA verification followed by Enter the code to withdraw ₱X, where X is the amount from step 1."]],"prd":[{"s":"6.4.3","n":"表单字段（提现）：MFA 验证码"}],"tor":[{"c":"1.4.25","t":["提现前须成功完成 MFA，即使已登录或使用可信设备","MFA before the withdrawal even when signed in or on a trusted device"]}],"tor_note":null},{"k":"b3","n":["4 位验证码输入框","4-digit code boxes"],"sel":"#w_codew","find":null,"fn":[["4 个数字框，不足 4 位点 Verify 提示 Enter the 4-digit code；下方 Demo code: 1234 仅原型显示，正式版不显示。","Four digit boxes; fewer than 4 digits gives Enter the 4-digit code on Verify; the Demo code: 1234 line exists in the prototype only."],["每笔提现都验证，不看金额大小，不因可信设备豁免；H5 用短信验证码，App 用生物识别（见页面规则；本地比对失败只回退短信、不计失败）；验证码发送和错误次数按交易类场景单独计数。","Verified on every withdrawal with no amount threshold and no Trusted Device exemption; H5 uses the SMS code, the App uses biometrics (see page rule; a local check failure only falls back to SMS and is not counted); code sending and wrong attempts are counted in the transaction scenario on their own."]],"prd":[{"s":"6.4.3","n":"表单字段（提现）：MFA 验证码；每次强制验证"},{"s":"6.1.4","n":"交互说明：验证码按场景分别计数"}],"tor":[{"c":"1.4.26","t":["每笔提现都要 MFA，不分金额，不因可信设备豁免","MFA on every withdrawal regardless of amount, no Trusted Device exemption"]},{"c":"15.3.2","t":["敏感操作须强认证","Strong authentication for sensitive functions"]}],"tor_note":null},{"k":"b4","n":["Verify 按钮与后续确认","Verify button and confirm step"],"sel":"button.btn","find":null,"fn":[["输入错误（短信验证码错误，服务端可校验，计入失败次数）：提示 Wrong code — N attempt(s) left，输入框抖动，并在交易流水记一条 Rejected 的提现；连续第 3 次错误提示 3 failures — withdrawals locked for 30 minutes 并进入锁定页。","Wrong code (server-verifiable, counted): Wrong code — N attempt(s) left, the boxes shake and a Rejected withdrawal row is written to Transactions; the 3rd consecutive failure shows 3 failures — withdrawals locked for 30 minutes and opens the lock page."],["验证成功（演示码 1234）进入 Confirm withdrawal：Amount / To / ETA Within 5 minutes / Fee ₱0，点 Confirm 提示 Withdrawal submitted · Processing — expected within 5 minutes，状态 Processing，并从奖金余额扣款。","On success (demo code 1234) Confirm withdrawal shows Amount / To / ETA Within 5 minutes / Fee ₱0; Confirm gives Withdrawal submitted · Processing — expected within 5 minutes with status Processing and debits the prize balance."],["提现单状态只有 Processing / Paid / Rejected 三种，没有人工审核；“锁定”不是提现单状态。","Withdrawal status is only Processing / Paid / Rejected with no manual review; “locked” is not a withdrawal status."],["App 形态下第 2 步先显示 Face ID 验证页并自动弹出生物识别弹窗；本地比对失败或 Cancel 只回退到本页的短信验证码步骤（S.wd.sms=true），不计失败、不落“已拒绝”；设备签名校验不通过（面板 “Biometric: device signature invalid”）计一次 MFA 失败并落一笔“已拒绝”流水，再回退短信。设备签名失败与短信验证码错误合并累计，连续 3 次提现锁定 30 分钟。","On the App terminal step 2 first shows a Face ID verification page and opens the biometric sheet automatically; a local check failure or Cancel only falls back to the SMS code step on this page (S.wd.sms=true) with no failure count and no Rejected row; an invalid device signature (panel toggle “Biometric: device signature invalid”) counts as one MFA failure and records a Rejected transaction, then falls back to SMS. Invalid signatures and wrong SMS codes accumulate together; 3 in a row lock withdrawals for 30 minutes."]],"prd":[{"s":"6.4.3","n":"交互说明：连续失败 3 次锁 30 分钟；失败落一笔“已拒绝”"},{"s":"6.4.5","n":"搜索筛选项：提现 Tab 状态枚举"}],"tor":[{"c":"1.4.27","t":["MFA 失败则拒绝提现，连续 3 次失败自动锁定提现","A failed MFA denies the withdrawal; 3 consecutive failures lock withdrawals automatically"]},{"c":"1.4.28","t":["每次提现 MFA 尝试（成败）都写审计记录","Every withdrawal MFA attempt, successful or failed, is audit-logged"]}],"tor_note":null},{"k":"b5","n":["Face ID 验证页（App）","Face ID verification page (App)"],"sel":"#wd_bio","find":"Use Face ID","fn":[["App 形态第 2 步：说明可信设备也不豁免，说明本地失败或取消只回退短信、不算失败次数；按钮 Use Face ID（#wd_bio）重新唤起生物识别弹窗，Use SMS code instead（#wd_sms）直接改用短信验证码。H5 无此页，直接是短信验证码页。","App terminal step 2: explains trusted devices are not exempt and that a local failure or cancel is not a failed attempt; Use Face ID (#wd_bio) reopens the biometric sheet and Use SMS code instead (#wd_sms) switches to the SMS code. H5 has no such page and goes straight to the SMS code page."]],"prd":[{"s":"6.4.3","n":"提现 MFA：App 生物识别，H5 短信"}],"tor":[{"c":"1.4.29","t":["有生物识别能力的移动设备上提现 MFA 用原生生物识别，短信仅作回退","On biometric-capable mobile devices withdrawal MFA uses native biometrics, SMS only as fallback"]}],"tor_note":null,"state":"A.term('app');S.logged=true;S.kyc='approved';S.wd={fail:0,lock:0,step:2,amt:200,dest:0,sms:false,bioAsked:1};A.reset('withdraw')"},{"k":"b6","n":["提现生物识别弹窗（App）","Withdrawal biometric sheet (App)"],"sel":"#bio-sheet","find":"Use Face ID to continue","fn":[["模拟原生弹窗「Use Face ID to continue」，文案「Confirm this withdrawal with Face ID.」，Authenticate 成功进入确认页；“Biometric: local check fails” 打开时提示 \"Biometric check failed on this device. Use the SMS code instead.\" 并回退短信验证码，不计失败、不落“已拒绝”；“Biometric: device signature invalid” 打开时提示 \"Device signature could not be verified.\"，计一次失败并落“已拒绝”后回退短信；Cancel 回退短信且不计失败。状态 S.bioCtx='wd'。","Simulated native sheet “Use Face ID to continue” with “Confirm this withdrawal with Face ID.”; Authenticate success goes to the confirm page; with “Biometric: local check fails” on it shows \"Biometric check failed on this device. Use the SMS code instead.\" and falls back to the SMS code with no count and no Rejected row; with “Biometric: device signature invalid” on it shows \"Device signature could not be verified.\", counts one failure, records a Rejected row and falls back to SMS; Cancel falls back to SMS without counting. State S.bioCtx='wd'."]],"prd":[{"s":"6.4.3","n":"交互说明：生物识别失败回退短信，3 次失败锁提现 30 分钟"}],"tor":[{"c":"1.4.29","t":["有生物识别能力的移动设备上提现 MFA 用原生生物识别，短信仅作回退","On biometric-capable mobile devices withdrawal MFA uses native biometrics, SMS only as fallback"]}],"tor_note":null,"state":"A.term('app');S.logged=true;S.kyc='approved';S.wd={fail:0,lock:0,step:2,amt:200,dest:0,sms:false,bioAsked:1};A.reset('withdraw');A.bioStart('wd')"}],"page_rules":[{"n":["App 专属：可信设备与生物识别","App only: trusted device and biometrics"],"fn":[["可信设备（仅 App）：玩家在 App 上选择“信任此设备”后，该设备后续登录仍先输入密码，之后用设备原生生物识别（Face ID / 指纹）代替短信验证码这一步；只对这一台设备生效，列表可在“登录与安全”查看、移除。改密码、找回密码重置、换绑手机号、玩家自助停用、管理端停用或重置密码都会使全部信任设备失效，之后一律密码 + 短信验证码登录，可重新信任。本期信任设备不设有效期、不限数量，靠手动移除和上述自动失效控制。","Trusted device (App only): after the player chooses “Trust this device” in the App, later sign-ins on that device still ask for the password first, then use native biometrics (Face ID / fingerprint) in place of the SMS code step only; it applies to that one device only and the list can be viewed and removed under Login & security. Changing or resetting the password, changing the mobile number, self-deactivation, and an admin deactivating the account or resetting the password all invalidate every trusted device; the next sign-in is password + SMS and the device can be trusted again. This phase has no expiry and no device limit; control is by manual removal and the automatic invalidation above."],["提现 MFA（仅 App）：App 上用设备原生生物识别作为提现二次验证；H5 仍用短信验证码。","Withdrawal MFA (App only): on the App the withdrawal second step uses the device’s native biometrics; H5 keeps the SMS code."],["回退：手机本地生物识别比对失败、取消或设备不支持时只回退到短信验证码（登录时仍已输入密码），不计失败次数、不落“已拒绝”流水、不推进锁定。只有服务端能校验到的失败才计数：设备签名校验不通过、短信验证码错误——提现连续 3 次锁 30 分钟并各落一笔“已拒绝”，登录按错误验证码计入登录场景次数；管理端登录不用生物识别，仍为密码 + 4 位短信 OTP。","Fallback: if the local biometric check fails, is cancelled or is unsupported, it only falls back to the SMS code (the password was already entered at sign-in), with no failure count, no Rejected transaction and no lock progress. Only failures the server can verify count: an invalid device signature or a wrong SMS code — in withdrawal 3 in a row lock withdrawals for 30 minutes and each records a Rejected transaction; in sign-in they count like a wrong code in the sign-in scenario. Admin sign-in does not use biometrics and stays password plus 4-digit SMS OTP."],["App 专属，演示原型用「Terminal」开关模拟：右侧演示面板 Terminal 选 App（iPhone 15 · iLotto App 1.0.3）即进入 App 形态，登录页、提现验证和“账号安全”才出现可信设备与生物识别；默认 H5 形态下这些入口全部不出现。生物识别由页面内模拟的原生弹窗代替（Authenticate / Cancel），面板「Biometric: local check fails」开关模拟本地比对失败（不计数），「Biometric: device signature invalid」开关模拟服务端签名校验失败（计数）。","App only. The demo simulates it with the Terminal switch: in the demo panel pick App (iPhone 15 · iLotto App 1.0.3) and the sign-in, withdrawal verification and Account security screens show trusted-device and biometric features; the default H5 terminal shows none of them. Native biometrics are replaced by an in-page simulated sheet (Authenticate / Cancel), and the panel toggle “Biometric: local check fails” simulates a local failure (not counted) and “Biometric: device signature invalid” simulates a server-side signature failure (counted)."]],"prd":[{"s":"6.1.3","n":"登录：App 可信设备与生物识别，H5 不支持"},{"s":"6.1.4","n":"第二因子：可信设备以生物识别代替短信验证码，失败回退短信"},{"s":"6.4.3","n":"提现 MFA：App 生物识别，H5 短信"},{"s":"6.8.3","n":"登录记录与玩家档案：终端 H5/App、设备型号，可信设备列表只读"}],"tor":[{"c":"1.1.15","t":["可信设备须成功登记原生生物识别，之后该设备登录以生物识别代替 OTP；设备端生物识别被关闭则信任自动撤销","A device is tagged Trusted only after native biometric enrolment; later logins use biometrics in lieu of OTP; trust is revoked if device biometrics are disabled"]},{"c":"1.4.29","t":["有生物识别能力的移动设备上，每笔提现的 MFA 用设备原生生物识别，短信或邮件 OTP 仅作回退","On biometric-capable mobile devices, withdrawal MFA uses native biometrics, with SMS/email OTP only as fallback"]},{"c":"1.1.42","t":["自动化风险分超阈值时要求证明有真人，可信设备上为生物识别验证","When the automation risk score exceeds the threshold, proof of a person is required; on a Trusted Device it is biometric verification"]},{"c":"1.3.9","t":["登记或更换电子钱包 / 银行账户前必须完成 MFA，即使在已认证会话或有可信设备","Enrolling or changing an e-wallet or bank account requires MFA, even in an authenticated session or on a Trusted Device"]},{"c":"1.4.25","t":["每笔提现确认前必须完成 MFA，即使已认证会话或有可信设备","Every withdrawal requires MFA right before confirmation, even in an authenticated session or on a Trusted Device"]},{"c":"8.7.8","t":["安全剧本可撤销玩家的可信设备状态","Security playbooks can revoke a player’s Trusted Device status"]},{"c":"8.7.9.1","t":["安全告警上下文含已登记设备 ID 与可信设备状态","Security alert context includes registered device IDs and Trusted Device status"]}]}],"vd":null,"nw":false},"p_wd_lock":{"id":"p_wd_lock","ti":["提现 · 锁定中","Withdraw · locked"],"g":["钱包","Wallet"],"prd":"6.4.3","pos":{"what":["提现因连续 3 次 MFA 失败被锁定时显示的页面：盾牌图、Withdrawals locked 徽标和 30 分钟倒计时，到零自动解锁。","The page shown while withdrawals are locked after 3 consecutive MFA failures: a shield illustration, the Withdrawals locked badge and a 30-minute countdown that unlocks automatically."],"why":["挡住别人对被盗账号反复猜验证码；把锁定限定在“提现”这一个功能上，玩家的余额查看和投注不受影响，不必找客服解锁。","Stops repeated code guessing on a compromised account; the lock covers withdrawals only, so balance viewing and betting continue and nobody has to call support to unlock."],"who":["触发锁定的玩家本人。锁定到点自动解除，无需人工处理，管理端也没有手动解锁入口（它不是玩家状态）；MFA 失败的记录在审计日志里可查。","The player who triggered the lock. It lifts by itself at zero with no manual action, and Admin has no manual unlock (it is not a player status); the failed MFA attempts are in the audit log."]},"blocks":[{"k":"b1","n":["锁定卡片","Lock card"],"sel":"div.card","find":null,"fn":[["卡片中间是盾牌图、🔒 Withdrawals locked 红色徽标、大号 mm:ss 倒计时和说明 Three failed MFA attempts locked withdrawals for 30 minutes. They unlock automatically.","The card shows a shield illustration, a red 🔒 Withdrawals locked badge, a large mm:ss countdown and the text Three failed MFA attempts locked withdrawals for 30 minutes. They unlock automatically."],["锁定期间仍可看余额、投注、查看交易流水；只有提现被拦。","During the lock the player can still view balances, bet and read transactions; only withdrawing is blocked."]],"prd":[{"s":"6.4.3","n":"交互说明：连续失败 3 次锁定 30 分钟（倒计时展示）"}],"tor":[{"c":"1.4.27","t":["连续 3 次 MFA 失败自动锁定该玩家的提现功能","Three consecutive failed MFA attempts automatically lock the player's withdrawal function"]}],"tor_note":null},{"k":"b2","n":["Withdrawals locked 徽标","Withdrawals locked badge"],"sel":"span.badge","find":null,"fn":[["红色徽标写明被锁定的是“提现”，不是账号；这个锁只在提现场景生效，与登录的 5 次 / 1 小时是两套规则。","The red badge says the lock is on withdrawals, not on the account; it applies to this scenario only and is separate from the sign-in rule of 5 errors / 1 hour."]],"prd":[{"s":"6.4.3","n":"交互说明：MFA 连续失败 3 次提现锁 30 分钟"}],"tor":[{"c":"1.4.27","t":["提现功能锁定 30 分钟（标书条款）","Withdrawal function locked for a period after three failed attempts"]}],"tor_note":null},{"k":"b3","n":["倒计时 mm:ss","Countdown mm:ss"],"sel":"#lk","find":null,"fn":[["从 30:00 开始每秒递减；归零后页面自动回到提现表单，不需要刷新或人工解锁。","Counts down from 30:00 every second; at zero the page returns to the withdrawal form by itself with no refresh or manual unlock."]],"prd":[{"s":"6.4.3","n":"交互说明：到点自动解锁不需人工干预"}],"tor":[{"c":"1.4.27","t":["锁定到期后自动恢复","The lock ends automatically after the specified period"]}],"tor_note":null}],"page_rules":[],"vd":null,"nw":false},"p_account":{"id":"p_account","ti":["我的账户","Account"],"g":["我的账户","Account"],"prd":"6.5.2","pos":{"what":["账户枢纽页：头图和头像、昵称和打码的姓名、实名认证状态卡、钱包和交易记录两个入口、PlaySafe / Help / Account security 三条列表入口，以及 Log out。","The account hub: cover and avatar, nickname and masked name, the identity verification card, Wallet and Records tiles, list entries for PlaySafe / Help / Account security, and Log out."],"why":["把分散在各处的个人功能集中到一个入口，玩家随时能看实名状态、进钱包、改资料、设限额；姓名默认打码、页脚常驻负理性购彩文案，满足标书对隐私和合规展示的要求。","Gathers the personal features in one place so players can see verification status, open the wallet, edit the profile and set limits; the masked name and the permanent play-responsibly footer satisfy the tender's privacy and compliance display rules."],"who":["已登录玩家：已实名（正常、已限制投注）可用全部入口；未认证、审核中、被拒绝的玩家仍可看到本页的实名状态卡并重新提交，但钱包和投注不可用。","Signed-in players: verified ones (Normal, Bet-restricted) reach every entry; unverified, under-review or rejected players still see the verification card and can resubmit, but wallet and betting stay unavailable."]},"blocks":[{"k":"b1","n":["头图、头像与 Edit 按钮","Cover, avatar a
