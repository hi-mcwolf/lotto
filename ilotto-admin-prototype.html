<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>iLotto管理端</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg-base:#070b14;--bg-canvas:#0b1220;--bg-surface:#111827;--bg-surface-2:#0f172a;--bg-elevated:#161f36;--bg-sidebar:#0a0f1c;
  --border-subtle:#1f2937;--border-glow:rgba(34,211,238,.3);
  --accent-cyan:#22d3ee;--accent-cyan-grad:linear-gradient(135deg,#22d3ee 0%,#3b82f6 100%);
  --accent-amber:#f59e0b;--accent-rose:#fb7184;--accent-emerald:#34d399;
  --text-primary:#e2e8f0;--text-secondary:#94a3b8;--text-muted:#64748b;
  --bg:var(--bg-canvas);--card:var(--bg-surface);--card2:var(--bg-surface-2);--line:var(--border-subtle);
  --cyan:var(--accent-cyan);--amber:var(--accent-amber);--rose:var(--accent-rose);--ok:var(--accent-emerald);
  --text:var(--text-primary);--muted:var(--text-secondary);--dim:var(--text-muted);--ink:#04232a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",Outfit,system-ui,sans-serif;
  color:var(--text-primary);background:var(--bg-base);letter-spacing:0;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
#app{min-height:100%}
.devlang .specs{color:inherit;text-decoration:none;font-size:12px;padding:4px 10px;border-right:1px solid #444;white-space:nowrap}.devlang .specs:hover{text-decoration:underline}
.devlang{position:fixed;top:10px;right:14px;z-index:70;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.devtag{font-size:10px;font-weight:800;letter-spacing:.8px;color:var(--amber);padding:0 6px 0 8px}
.lang{display:flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:rgba(15,23,42,.8);gap:2px}
.lang button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
.lang button.on{background:var(--cyan);color:var(--ink)}
.login{
  min-height:100vh;display:grid;grid-template-columns:1.15fr .85fr;position:relative;
}
.login-hero{
  padding:28px 48px 48px;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg-sidebar);
}
.brand{font-weight:700;font-size:22px;color:#fff;display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:50%;flex:none;display:block}
.panel-logo{display:block;width:88px;height:88px;margin:0 auto 14px;border-radius:50%;filter:drop-shadow(0 8px 24px rgba(34,211,238,.3))}
.brand em{font-style:normal;color:var(--accent-cyan)}
.login-hero h1{margin:auto 0 12px;font-size:40px;line-height:1.15;color:#fff;max-width:560px;font-weight:700}
.lede{max-width:460px;color:#cbd5e1;font-size:16px;line-height:1.55;margin:0 0 28px}
.hero-metrics{display:flex;gap:12px;flex-wrap:wrap;position:relative}
.hero-metrics div{
  min-width:160px;padding:14px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.08);
  background:rgba(15,23,42,.55);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.hero-metrics b{display:block;color:#fff;font-size:18px;margin-top:4px}
.hero-metrics span{color:var(--text-muted);font-size:12px;font-weight:500}
.login-panel{display:flex;align-items:center;justify-content:center;padding:28px}
.panel{
  width:min(420px,100%);
  background:linear-gradient(180deg, rgba(255,255,255,.03) 0%, rgba(255,255,255,0) 100%), var(--bg-surface);
  border:1px solid var(--border-subtle);border-radius:14px;padding:28px;position:relative;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 6px 20px rgba(0,0,0,.3);
}
.panel h2{margin:0 0 6px;color:#fff;font-size:20px}
.sub{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 16px}
label.f{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;font-weight:600}
input,select,textarea{
  width:100%;background:#0b1220;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:14px;outline:none;
}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.16)}
.pw{position:relative}
.pw input{padding-right:64px}
.pw .link{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.btn{
  border:1px solid var(--border-subtle);background:var(--bg-surface-2);color:var(--text-primary);border-radius:10px;
  padding:10px 14px;font-size:13px;font-weight:600;transition:border-color .15s ease, background .15s ease, filter .15s ease;
}
.btn:hover{border-color:#334155}
.btn-primary{
  width:100%;margin-top:16px;border:0;color:#04232a;font-weight:700;border-radius:10px;padding:12px 16px;
  background:var(--accent-cyan-grad);
}
.btn-primary:hover{filter:brightness(1.05);color:var(--ink)}
.btn-ghost{background:transparent;color:#fff}
.btn-rose{border:0;color:#fff;background:var(--accent-rose);font-weight:700}
.btn-ok{border:0;color:#042218;background:var(--accent-emerald);font-weight:700}
.btn-sm{padding:7px 10px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.link{background:none;border:0;color:var(--cyan);font-weight:700;font-size:12px;padding:0}
.err{color:var(--rose);font-size:12px;min-height:18px;margin-top:8px}
.otp{display:flex;gap:8px;margin-top:8px}
.otp input{text-align:center;font-size:22px;font-weight:700;padding:12px 0;max-width:64px}
.note{
  margin-top:14px;padding:10px 12px;border-radius:12px;background:rgba(251,113,132,.08);
  border:1px solid rgba(251,113,132,.28);color:#fecdd3;font-size:12px;line-height:1.5;
}
.shell{min-height:100vh;display:grid;grid-template-columns:232px 1fr}
.side{
  position:sticky;top:0;height:100vh;padding:16px 12px 24px;overflow:auto;
  background:var(--bg-sidebar);border-right:1px solid var(--border-subtle);
}
.side-brand{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 16px}
.side-brand .brand{font-size:20px}
.side-brand small{display:block;color:var(--text-muted);font-size:12px;font-weight:500;margin-top:2px}
.nav-btn{
  position:relative;width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;
  color:var(--text-secondary);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;margin:2px 0;
  transition:background .2s ease, color .2s ease;
}
.nav-btn svg{width:16px;height:16px;flex:none;opacity:.75}
.nav-btn:hover{background:rgba(255,255,255,.04);color:var(--text-primary)}
.nav-btn.on{background:rgba(34,211,238,.1);color:var(--accent-cyan)}
.nav-btn.on svg{opacity:1}
.nav-btn.on::before{
  content:"";position:absolute;left:-12px;top:10%;bottom:10%;width:3px;border-radius:0 4px 4px 0;
  background:var(--accent-cyan-grad);box-shadow:0 0 8px rgba(34,211,238,.6);
}
.main{min-width:0;display:flex;flex-direction:column;background:var(--bg-canvas)}
.top{
  padding-right:150px !important;
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px 32px;
  background:rgba(11,18,32,.92);border-bottom:1px solid var(--border-subtle);
}
.top h2{margin:0;font-size:16px;color:#fff;white-space:nowrap}
.top .crumb{color:var(--dim);font-size:12px;white-space:nowrap}
.top > div:first-child{flex:none}
.clock{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.view{padding:24px 32px 48px;animation:rise .18s ease}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-h h3{margin:0;color:#fff;font-size:20px;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--border-subtle);background:transparent;color:var(--text-secondary);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13px;transition:background .15s ease, color .15s ease, border-color .15s ease}
.tabs button.on{background:rgba(34,211,238,.1);color:var(--accent-cyan);border-color:rgba(34,211,238,.35)}
.role-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#a5f3fc;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.28);border-radius:999px;padding:4px 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kpis.k5{grid-template-columns:repeat(5,1fr)}
.kpis.k6{grid-template-columns:repeat(6,1fr)}
.kpi,.card{
  background:linear-gradient(180deg, rgba(255,255,255,.03) 0%, rgba(255,255,255,0) 100%), var(--bg-surface);
  border:1px solid var(--border-subtle);border-radius:14px;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 6px 20px rgba(0,0,0,.3);
  transition:border-color .2s ease, box-shadow .2s ease;
}
.kpi:hover,.card:hover{border-color:var(--border-glow);box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 8px 24px rgba(0,0,0,.35)}
.kpi{padding:16px 16px 14px;position:relative;overflow:hidden}
.kpi .lbl{color:var(--text-secondary);font-size:12px;font-weight:500}
.kpi .num{color:var(--text-primary);font-size:28px;font-weight:700;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.kpi.hero .num{
  background:var(--accent-cyan-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.kpi .subl{color:var(--text-muted);font-size:12px;line-height:1.45}
.delta{font-weight:600;font-size:12px}
.delta.up{color:var(--accent-emerald)}
.delta.down{color:var(--accent-rose)}
.card{padding:16px;margin-bottom:20px}
.card h4{margin:0 0 10px;color:#fff;font-size:15px;font-weight:600}
.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.split{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}
.muted{color:var(--muted);font-size:12.5px;line-height:1.55}
.tiny{color:var(--dim);font-size:11.5px;line-height:1.5}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;border:0;white-space:nowrap}
.tag-ok{color:var(--accent-emerald);background:rgba(52,211,153,.12)}
.tag-warn{color:var(--accent-amber);background:rgba(245,158,11,.12)}
.tag-rose{color:var(--accent-rose);background:rgba(251,113,132,.12);box-shadow:0 0 8px rgba(251,113,132,.25)}
.tag-cyan{color:var(--accent-cyan);background:rgba(34,211,238,.12)}
.tag-muted{color:var(--text-secondary);background:rgba(255,255,255,.04)}
.banner{
  display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;margin-bottom:14px;
  background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.22);color:#cffafe;font-size:13px;line-height:1.5;
}
.banner.rose{background:rgba(251,113,132,.08);border-color:rgba(251,113,132,.3);color:#ffe4e6}
.banner.amber{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.28);color:#fef3c7}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.filters.f3{grid-template-columns:repeat(3,1fr)}
.fcard{
  text-align:left;border:1px solid var(--border-subtle);
  background:linear-gradient(180deg, rgba(255,255,255,.03) 0%, rgba(255,255,255,0) 100%), var(--bg-surface);
  border-radius:14px;padding:14px;color:inherit;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 6px 20px rgba(0,0,0,.3);
  transition:border-color .15s ease, box-shadow .15s ease;
}
.fcard:hover{border-color:#334155}
.fcard.on{border-color:var(--accent-cyan);box-shadow:0 0 0 1px rgba(34,211,238,.35)}
.fcard b{display:block;color:#fff;font-size:24px;margin:6px 0 2px}
.fcard span{color:var(--muted);font-size:12px;font-weight:700}
.table-wrap{overflow:auto;border:1px solid var(--border-subtle);border-radius:14px;background:var(--bg-surface-2)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
th{text-align:left;font-size:12px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--text-muted);padding:10px 16px;background:transparent;border-bottom:1px solid var(--border-subtle);position:sticky;top:0}
td{padding:12px 16px;border-bottom:1px solid rgba(31,41,55,.5);vertical-align:middle;font-variant-numeric:tabular-nums}
tbody tr{transition:background .15s ease}
tbody tr:hover td{background:rgba(255,255,255,.025)}
tr.click td{cursor:pointer}
td.amt{text-align:right;font-family:"JetBrains Mono",ui-monospace,monospace}
tr.alert td{background:rgba(251,113,132,.08)}
tr.alert td:first-child{box-shadow:inset 3px 0 0 var(--rose)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gcard{padding:16px;position:relative}
.gcard.off{opacity:.72}
.gtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.gcard h4{margin:0;color:#fff;font-size:16px}
.switch{width:40px;height:22px;border-radius:999px;border:0;background:var(--border-subtle);position:relative;padding:0;flex:none;transition:background .2s ease, box-shadow .2s ease}
.switch i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s ease}
.switch.on{background:var(--accent-cyan-grad);box-shadow:0 0 8px rgba(34,211,238,.4)}
.switch.on i{transform:translateX(18px)}
.bill{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bill div{background:#0b1220;border:1px solid var(--line);border-radius:14px;padding:12px}
.bill b{display:block;color:#fff;font-size:16px;margin:4px 0}
.modal-back{position:fixed;inset:0;background:rgba(2,6,16,.72);z-index:40;display:grid;place-items:center;padding:24px;animation:fade .15s ease}
.modal{
  width:min(860px,100%);max-height:min(86vh,900px);overflow:auto;
  background:linear-gradient(180deg, rgba(255,255,255,.03) 0%, rgba(255,255,255,0) 100%), var(--bg-elevated);
  border:1px solid var(--border-subtle);border-radius:14px;padding:22px;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 16px 40px rgba(0,0,0,.45);
  animation:pop .15s ease;
}
.modal h3{margin:0 0 6px;color:#fff}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;
  background:#04232a;color:#cffafe;border:1px solid rgba(34,211,238,.4);padding:12px 16px;border-radius:999px;
  font-weight:700;font-size:13px;z-index:60;transition:.2s;box-shadow:0 12px 30px rgba(0,0,0,.35);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.checks{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.check{background:#0b1220;border:1px solid var(--line);border-radius:12px;padding:8px;font-size:11px}
.check b{display:block;color:#fff;font-size:12px;margin-top:4px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:110px 1fr 92px;gap:8px;align-items:center;font-size:12px}
.bar-row b{justify-self:end;font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:99px;background:#0b1220;overflow:hidden;border:1px solid var(--line)}
.track span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg, rgba(34,211,238,.85), rgba(59,130,246,.55))}
.track.amber span{background:linear-gradient(90deg,#fbbf24,#f59e0b);box-shadow:0 0 8px rgba(245,158,11,.35)}
.track.rose span{background:linear-gradient(90deg,#fda4af,#fb7184);box-shadow:0 0 8px rgba(251,113,132,.4)}
.stepper{display:flex;gap:0;list-style:none;margin:0 0 18px;padding:0;counter-reset:s}
.stepper li{flex:1;position:relative;padding:10px 12px 10px 44px;border:1px solid #243044;border-left:0;background:#0f1726;color:#8b98ad;font-size:13px;counter-increment:s;min-height:48px;display:flex;flex-direction:column;justify-content:center}
.stepper li:first-child{border-left:1px solid #243044;border-radius:12px 0 0 12px}.stepper li:last-child{border-radius:0 12px 12px 0}
.stepper li::before{content:counter(s);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#1b2536;color:#8b98ad;font-weight:700;font-size:12px}
.stepper li small{font-size:11px;color:#6b7a90}
.stepper li.done{color:#d5dbe6}.stepper li.done::before{content:"✓";background:var(--accent-emerald);color:#042218}
.stepper li.cur{color:#fff;background:#13233a;border-color:var(--accent-cyan)}.stepper li.cur::before{background:var(--accent-cyan);color:#021018}
.padwrap{display:grid;gap:14px}
.slots{display:flex;gap:10px;flex-wrap:wrap}
.slot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;border:1px dashed #33425a;color:#55657c;font-variant-numeric:tabular-nums}
.slot.f{border:0;color:#021018;background:radial-gradient(circle at 32% 28%,#7ee8fb,#22d3ee 40%,#2563eb);box-shadow:0 0 14px rgba(34,211,238,.45)}
.pad{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px;max-width:620px}
.pad button{height:42px;border-radius:50%;border:1px solid #2a384e;background:radial-gradient(circle at 32% 28%,#2a3447,#151d2b);color:#dbe3ee;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.pad button.on{border:0;color:#021018;background:radial-gradient(circle at 32% 28%,#7ee8fb,#22d3ee 40%,#2563eb);box-shadow:0 0 12px rgba(34,211,238,.5)}
.crumb{font-size:13px;color:#8b98ad;margin-bottom:10px}.crumb a{color:var(--accent-cyan);cursor:pointer}
.flow{display:flex;flex-direction:column;gap:0}
.flow .step{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:12px 0;border-top:1px dashed #243044}
.flow .step:first-child{border-top:0}
.flow .step b{color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.tools .f{margin:0}
.tools input,.tools select{width:auto;min-width:140px}
.rte{min-height:120px;background:#0b1220;border:1px solid var(--line);border-radius:12px;padding:12px;line-height:1.55}
.rte:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.16);outline:none}
.userchip{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-cyan);color:var(--ink);font-size:11px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);display:inline-block}
.dot.warn{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.dot.bad{background:var(--rose);box-shadow:0 0 10px var(--rose)}
.st-cell{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.table-wrap.fit table{min-width:0}
.sale-bars .bar-row{grid-template-columns:minmax(128px,168px) 1fr 88px}
.sale-bars .bar-row span:first-child{white-space:nowrap}
.todo{display:flex;flex-direction:column}
.todo-item{
  display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;
  padding:12px 8px;border:0;border-bottom:1px solid rgba(31,41,55,.5);border-radius:10px;
  background:transparent;color:inherit;text-align:left;cursor:pointer;
  transition:background .15s ease;
}
.todo-item:last-child{border-bottom:0}
.todo-item:hover{background:rgba(255,255,255,.025)}
.todo-item b{display:block;color:var(--text-primary);font-size:13px;font-weight:700}
.todo-item .tiny{margin-top:2px}
.matrix td,.matrix th{text-align:center}
.table-wrap td .row-actions{flex-wrap:nowrap}
.table-wrap td:last-child{white-space:nowrap}
.kv{width:100%;min-width:0}.kv td{padding:9px 0;border-bottom:1px solid rgba(31,41,55,.5)}
.idimg{width:230px;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;display:block}
.face{width:84px;height:98px;border-radius:12px;display:block}
.actbar{position:sticky;bottom:0;z-index:15;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;margin-top:8px;background:rgba(11,18,32,.96);border:1px solid var(--border-subtle);border-radius:14px;backdrop-filter:blur(8px)}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.cell-rw{color:var(--cyan);font-weight:800}
.cell-ro{color:var(--muted)}
.cell-hide{color:var(--rose);opacity:.8}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@media (max-width:1100px){
  .kpis,.kpis.k5,.kpis.k6,.games,.bill,.checks,.filters,.filters.f3{grid-template-columns:1fr 1fr}
  .grid2,.split,.login{grid-template-columns:1fr}
  .login-hero h1{font-size:40px;margin-top:48px}
  .kpis.k5,.kpis.k6{grid-template-columns:1fr 1fr}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;display:flex;gap:4px;overflow:auto;z-index:25;padding:8px}
  .side-brand{display:none}
  .nav-btn{width:auto;white-space:nowrap;margin:0}
  .nav-btn.on::before{left:10px;top:auto;bottom:4px;width:16px;height:2px}
  .view{padding:16px}
  .top{padding:12px 16px;overflow:auto}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

function icon(d) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
}
function tag(kind, text) { return `<span class="tag tag-${kind}">${text}</span>`; }
function roleChip(zh, en) { return `<span class="role-chip">${esc(t(zh, en))}</span>`; }
function delta(n) { return `<span class="delta ${n >= 0 ? "up" : "down"}">${n >= 0 ? "↑" : "↓"} ${t("较上月", "vs last month")} ${pct(n)}</span>`; }
function pctDash(n) {
  const body = Number.isInteger(n) ? String(Math.abs(n)) : Math.abs(n).toFixed(1);
  return (n > 0 ? "+" : n < 0 ? "−" : "") + body + "%";
}
function dashCmp(n, zh, en) {
  return `<span class="delta ${n >= 0 ? "up" : "down"}">${n >= 0 ? "↑" : "↓"} ${t(zh, en)} ${pctDash(n)}</span>`;
}
function dashGameLabel(id) {

}
function clockStr() {
  return new Intl.DateTimeFormat("sv-SE", { timeZone: "Asia/Manila", hour12: false, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" }).format(new Date()) + " UTC+8";
}
function taxOf(gross) {
  const row = (S.tax && S.tax.rows ? S.tax.rows : []).filter((r) => r.on && gross > Number(r.th)).sort((x, y) => Number(y.th) - Number(x.th))[0];
  const tax = row ? Math.round(gross * Number(row.rate)) / 100 : 0;
  return { tax, net: Math.round((gross - tax) * 100) / 100 };
}

function playRulesRaw(g) {

  if (g.kind === "lotto") return [
    ["标准 Standard", "Standard", `手动选 6 个号码（1–${N}，不重复）。1 注 = 1 个单注价格（${p}）。`, `Pick 6 numbers by hand (1–${N}, no repeats). One line costs ${p}.`, "每注独立判奖，按命中个数定奖级。", "Each line is judged on its own; the tier depends on how many numbers match."],
    ["机选 Quick Pick", "Quick Pick", "系统随机生成号码，一次 1–10 注。", "The system picks random numbers, 1–10 lines at a time.", "每注独立判奖。", "Each line is judged on its own."],
    ["复式 System 7–12", "System 7–12", "选 7–12 个号码，展开成 C(n,6) 注（7 个号码 = 7 注，8 个 = 28 注，以此类推）；金额 = 注数 × 单注价格。", "Pick 7–12 numbers; they expand into C(n,6) lines (7 numbers = 7 lines, 8 = 28, and so on). Amount = lines × price per line.", "展开后的每一注独立判奖。", "Every expanded line is judged on its own."],
    ["5 号轮转 5-Roll", "5-Roll", `选 5 个固定号码，再和其余每个号码各组成一注，共 ${N - 5} 注；金额 = ${N - 5} × 单注价格。`, `Pick 5 fixed numbers; each of the other numbers completes one line, ${N - 5} lines in all. Amount = ${N - 5} × price per line.`, "每注独立判奖。", "Each line is judged on its own."]
  ];
  if (g.id === "ez2") return [
    ["直选 Straight", "Straight", "选 2 个号码（1–31，可重复），顺序要和开奖号码一致。", "Pick 2 numbers (1–31, repeats allowed). The order must match the draw.", "顺序全对才中奖。", "Wins only when both numbers match in order."],
    ["Rambolito", "Rambolito", "选 2 个号码，顺序不限。两个号码相同时不能选 Rambolito，只能直选。", "Pick 2 numbers in any order. If both numbers are the same, Rambolito is not available; use Straight.", "两个号码都对即中奖，不看顺序。", "Wins when both numbers match, in any order."]
  ];
  if (g.id === "sw3") return [
    ["直选 Straight", "Straight", "选 3 位数字（0–9），顺序要和开奖号码一致。", "Pick 3 digits (0–9). The order must match the draw.", "顺序全对才中奖。", "Wins only when all three digits match in order."],
    ["Rambolito", "Rambolito", "选 3 位数字，顺序不限。三位全相同（如 1-1-1）时不能选 Rambolito，只能直选。", "Pick 3 digits in any order. If all three are the same (e.g. 1-1-1), Rambolito is not available.", "三个数字都对即中奖，不看顺序；三个都不同和有一对相同，奖金不同。", "Wins when the digits match in any order; the prize differs for three different digits and for a pair."]
  ];
  if (g.kind === "digit" && !["d4", "d6"].includes(g.id)) return [
    ["直选 Straight", "Straight", "按位置依次选择数字，顺序要和开奖号码一致。", "Pick digits position by position; the order must match the draw.", "顺序全对才中奖。", "Wins only when all digits match in order."],
    ["Rambolito", "Rambolito", "顺序不限；所有数字相同时不能选 Rambolito。", "Any order; not available when all digits are the same.", "数字都对即中奖，不看顺序。", "Wins when the digits match in any order."]
  ];
  const n = { d4: 4, d6: 6 }[g.id];
  return [["直选 Straight（尾部匹配）", "Straight (tail match)", `选 ${n} 位数字（0–9），按位置依次选。`, `Pick ${n} digits (0–9), position by position.`, `从尾部往前数，连续对上几位就按几位判奖，只取最高奖级，不叠加。`, "Count matches from the last digit backwards; the prize follows the number of matching tail digits, and only the highest tier is paid, not added up."]];
}

function myRole() {
  const u = (S.login.user || "mina.cruz").trim().toLowerCase(); const s = S.staff.find((x) => x.acct === u);

}
function roleName(k) { const r = ROLES.find((x) => x[0] === k); return r ? t(r[1], r[2]) : k; }
function menuHidden(page) {
  if (myRole() === "ops") return false; /* review session: Operations (default account) keeps every page reachable */
  if (page === "sys" && myRole() !== "kyc" && myRole() !== "opsrev") return false; /* limited System group (Global parameters, Pending changes) stays for Operations / Finance / Compliance / Admin */
  const i = MENUS.findIndex((m) => m[0] === page); return i >= 0 && MATRIX[myRole()][i] === "hide";

function actor() {

function sumAt(rows, i) { return rows.reduce((s, r) => s + r[i], 0); }

er, cut-off; prize tiers are edited in View rules"],["玩法是开关：已内置玩法逐个开 / 关，至少保留一个；关闭的玩法不能选号，已出票照常判奖","Plays are switches: built-in plays are turned on or off one by one, at least one must stay on; a play that is off cannot be picked but issued tickets are judged as usual"],["游戏编码和类型固定；没有「新增游戏」，游戏固定 9 个","Game code and type are fixed; there is no Add game, the 9 games are fixed"],["保存校验：价格大于 0、预购 1–90、储备 0–100、Change note 必填","On save: price above 0, pre-order 1–90, reserve 0–100, Change note required"],["改动只影响之后生成的期次；每期生成时记下当时的奖级结构和参数版本，开售后固定","Changes apply only to draws generated afterwards; each draw snapshots the prize structure and parameter version when generated and is fixed once on sale"]],"ix":[["Save -> 生成变更申请「Change request submitted for approval」，须填 Change note；价格、奖池储备百分比由财务复核批准，名称、开奖日程、封盘、开售间隔、玩法开关、排序号由运营复核批准","Save -> creates a change request (\"Change request submitted for approval\") with a required Change note; price and reserve % need Finance review, name, draw schedule, cut-off, selling interval, play switches and sort order need Ops reviewer"],["封盘提前 10–1440 分钟、开售间隔为 ≥ 0 的整数秒，按开奖场次逐行填写；详见 a_games_cfg_slots","Cut-off lead 10–1440 min and selling interval whole seconds ≥ 0, one row per draw slot; see a_games_cfg_slots"],["默认号码限额：整数金额或留空；否则「Default number limit must be a whole amount, or empty for no limit.」；直接保存，写 Change 日志，不走审批","Default number limit: whole amount or empty; otherwise \"Default number limit must be a whole amount, or empty for no limit.\"; saves directly, logged as Change, no approval"],["至少保留一个玩法开启，否则「Keep at least one play on.」；同一参数已有待批申请时提示「A change request for this parameter is already pending.」","Keep at least one play on or \"Keep at least one play on.\"; if a request for the parameter is pending: \"A change request for this parameter is already pending.\""],["只有运营专员能提交，页面底部提示批准人分档；全部写审计日志","Only Operations can submit; a note at the bottom explains the approver tiers; everything is audited"]],"vd":["V1.1：保存改为提交变更申请（金额类财务复核、非金额类 ；新增行 / 启停 / 删除","Tax rate table: threshold, rate, status; Add row / toggle / delete"],["「提交」「放弃」草稿按钮；已有待批准申请时锁定编辑","Submit and Discard draft buttons; editing is locked while a request is pending"],["期次创建时记下整张税率表","The whole tax table is snapshotted when a draw is created"]],"ix":[["「交易单元价值」只读显示当前生效值；点修改 → 新值须为最多 2 位小数的正数，否则「Enter a positive amount with up to 2 decimals.」；与当前值相同「The new value must differ from the current value.」","Transaction unit value shows the live value; edit -> positive amount with up to 2 decimals or \"Enter a positive amount with up to 2 decimals.\"; same value: \"The new value must differ from the current value.\""],["税率表可「新增行」「启停」「删除」，每行一个阈值和税率；默认 > ₱10,000 取 20% 全额","The tax table supports Add row, enable / disable and delete; each row has a threshold and a rate; default > ₱10,000 at 20% on the full amount"],["提交校验：「Enter a threshold greater than 0 with up to 2 decimals.」「Thresholds in the table must be unique.」「Tax rate must be between 0 and 100 with up to 2 decimals.」「At least one row must stay enabled.」「Nothing has changed in the table.」","Submit validation: \"Enter a threshold greater than 0 with up to 2 decimals.\" / \"Thresholds in the table must be unique.\" / \"Tax rate must be between 0 and 100 with up to 2 decimals.\" / \"At least one row must stay enabled.\" / \"Nothing has changed in the table.\""],["确认弹窗填生效时间（须晚于现在：「Effective time must be later than the current time.」）和原因（「Enter a change reason (1–200 characters).」）→ 「Change request submitted. Waiting for Finance review.」并跳到 Pending changes","Confirm dialog: effective time (must be later than now: \"Effective time must be later than the current time.\") and reason (\"Enter a change reason (1–200 characters).\"); then \"Change request submitted. Waiting for Finance review.\" and it jumps to Pending changes"]],"vd":["V1.1 新增页面（交易单元价值 + 多档税率表）。","New in V1.1 (transaction unit value + multi-row tax rate table)."],"nw":true},"a_sys_chg":{"ti":["系统管理 · 待批准变更","System · Pending changes"],"g":["系统管理","System"],"prd":"6.13","pu":["批准关键参数和游戏配置变更；提交人与批准人必须是两个人，按金额类 / 非金额类分档。","Approve key parameter and game config changes; submitter and approver must be different people, tiered by money / non-money items."],"el":[["列：Request、Parameter、Before、After、Change note、Approver、Submitted、Status","Columns: Request, Parameter, Before, After, Change note, Approver, Submitted, Status"],["按钮 Approve / Reject；已批准、待生效的行有 Demo: reach effective time 演示按钮","Buttons: Approve / Reject; approved rows have a Demo: reach effective time button"],["适用范围：单注价格、奖池储备、奖级结构、税率表、交易单元价值、开奖日程、封面、上架、无开奖日等","Applies to: price, reserve %, prize tiers, tax table, unit value, draw schedule, cover, relist, no-draw dates and more"],["运营复核只能批准非金额类，不可见其他系统管理页面","Ops reviewer can only decide non-money items and sees no other System pages"]],"ix":[["列表显示 Request、Parameter、Before、After、Change note、Approver 档位、Submitted、状态（Pending / Approved / Rejected）","The list shows Request, Parameter, Before, After, Change note, the approver tier tag, Submitted and status (Pending / Approved / Rejected)"],["批准档位：金额类和全局参数（单注价格、奖池储备百分比、奖级、税率表、交易单元价值等）→ 财务复核；非金额类（开奖日程、封盘、开售间隔、玩法开关、封面、名称、排序号、上架、无开奖日）→ 运营复核","Approver tiers: money items and global parameters (price, reserve %, prize tiers, tax table, unit value) -> Finance review; non-money items (draw schedule, cut-off, selling interval, play switches, cover, name, sort order, relist, no-draw dates) -> Ops reviewer"],["Approve / Reject → 弹窗；驳回须填原因「Enter a reason for rejecting.」","Approve / Reject -> dialog; rejection needs a reason: \"Enter a reason for rejecting.\""],["不是对应档位的角色，按钮禁用并提示「Only Ops reviewer can decide this request.」/「Only Finance review can decide this request.」；提交人批准自己的申请提示「You cannot approve a change you submitted.」","Buttons are disabled for the wrong role: \"Only Ops reviewer can decide this request.\" / \"Only Finance review can decide this request.\"; approving your own request: \"You cannot approve a change you submitted.\""],["批准 →「Approved. The change is now live.」或「Approved. It takes effect automatically at the effective time.」；奖级变更批准后写入 Prize tier history；默认号码限额和号码锁定不在此批准","Approve -> \"Approved. The change is now live.\" or \"Approved. It takes effect automatically at the effective time.\"; approved prize tier changes are written to Prize tier history; default number limit and number locks are not approved here"]],"vd":["V1.1：待批准变更按金额类（财务复核）/ 非金额类（运营复核）分档，列表加 Change note 与 Before / After。","V1.1: pending changes are tiered by money (Finance review) / non-money (Ops reviewer) items; the list shows Change note with Before / After."],"nw":true},"a_games_cfg_slots":{"ti":["游戏配置 · 按场次封盘与开售","Game configuration · Per-slot cut-off and selling"],"g":["游戏与开奖","Games & draws"],"prd":"6.7.2","pu":["为每个开奖场次分别设置封盘提前时间和开售间隔。","Set cut-off lead and selling interval separately for each draw slot."],"el":[["每场次一行：封盘提前（分钟）、开售间隔（秒）","One row per slot: cut-off lead (minutes), selling interval (seconds)"],["默认值：乐透 / 4D / 6D 30 分钟、3600 秒；EZ2 / Swertres 15 / 15 / 30 分钟、3600 / 300 / 300 秒","Defaults: lotto / 4D / 6D 30 min, 3600 s; EZ2 / Swertres 15 / 15 / 30 min, 3600 / 300 / 300 s"],["改动属关键参数，须填变更说明并走审批","Edits are key parameters: change note required and approval applies"]],"ix":[["配置对话框中按开奖场次逐行显示「封盘提前时间（分钟）」和「开售间隔（秒）」；EZ2 / Swertres 有 3 场","The config dialog has one row per draw slot for cut-off lead (minutes) and selling interval (seconds); EZ2 / Swertres have 3 slots"],["封盘提前须为 10–1440 的整数，否则「Cut-off lead time is 10–1440 minutes.」；开售间隔为 ≥ 0 的整数，否则「Selling interval must be a whole number of seconds, 0 or more.」","Cut-off lead must be an integer 10–1440: \"Cut-off lead time is 10–1440 minutes.\"; selling interval an integer ≥ 0: \"Selling interval must be a whole number of seconds, 0 or more.\""],["改任一场次的值属关键参数：须填变更说明，否则「Enter a change note for the key parameter change.」；保存 →「Change request submitted for approval」","Changing any slot value is a key parameter: a change note is required (\"Enter a change note for the k "V1.1：奖级可在管理端编辑（财务复核批准，按起始生效期次生效）；奖级变更历史改为系统自动生成，含提交人和批准人。","V1.1: prize tiers are editable in the admin (Finance review approves, effective from a chosen draw); Prize tier history is system-generated with submitter and approver."],"nw":true},"a_draw_entry_fetch":{"ti":["开奖结果录入 · 开奖机抓号","Draw result entry · Draw machine fetch"],"g":["游戏与开奖","Games & draws"],"prd":"6.7.4","pu":["第一次录入时可从开奖机抓取号码，人工复核后提交，失败改手工。","On the first entry, fetch numbers from the draw machine, check them manually, then submit; on failure fall back to manual entry."],"el":[["Fetch from draw machine 按钮（仅第一次录入）","Fetch from draw machine button (first entry only)"],["抓取后来源显示为 machine，须人工复核","After fetching the source shows as machine and a manual check is required"],["失败时出现提示，转手工录入，并在仪表盘加待办","On failure a message appears, entry turns manual and a dashboard to-do is added"],["五步条和 Operation trace 显示在同一页面","The five-step bar and Operation trace show on the same page"]],"ix":[["第一步点「Fetch from draw machine」→ 号码填入号码盘「Numbers fetched from the draw machine. Check them manually.」；来源标记为 machine","On step 1, click Fetch from draw machine -> numbers fill the pad: \"Numbers fetched from the draw machine. Check them manually.\"; the source is marked as machine"],["提交前须勾选人工复核确认；号码仍可修改","A manual check confirmation must be ticked before submitting; numbers can still be edited"],["抓取失败 →「Draw machine fetch failed. Enter manually.」，转手工录入，仪表盘新增待办「Draw machine fetch failed」并写审计（原型有「Demo only: simulate fetch failure」开关）","Fetch fails -> \"Draw machine fetch failed. Enter manually.\"; switches to manual entry, adds the dashboard to-do and writes an audit entry (the prototype has a \"Demo only: simulate fetch failure\" switch)"],["第二次独立录入仍由财务复核手工完成，看不到第一次内容；奖金录入不涉及开奖机","The second independent entry is still done manually by Finance review, first entry hidden; prize entry does not involve the draw machine"]],"vd":["V1.1 新增页面。","New in V1.1."],"nw":true},"a_audit_types":{"ti":["审计日志 · 六类日志类型","Audit log · Six log types" 增一行；关键参数变更、玩家永久删除须第二位授权人员批准；一个员工账号只能持有一个角色，不能管理自己的账号；用户管理（新增、编辑、启用、禁用）；审计日志分六类，导出 CSV、JSON、XML；全局参数税率改为税率表（多行：条件+税率），期次创建时记下整张表；玩家详情增\"累计统计\"\"登录记录\"\"操作记录\"页签，搜索支持多条件；交易流水新增\"票据\"页签，支持扫码查询；公告增展示位置、平台、起止日期、图片、跳转链接，正文可插入图片，增\"图片库\"页签；⑦ 报表：新增\"交易监控\"页签（含下钻到投注单：分页、导出、权限）；销售报表与开奖销售合并为\"销售\"页签（按时间 / 按期次两个视图），交易当量只在交易监控；新增头奖报告、没收/逾期未领奖金报告、最终税报告；注册玩家报表为数量汇总（总数、新增、分布）+ 导出名单；销售和派奖增\"按地区\"维度，日期快捷项"];
function specHtml(d,log){
  const e=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const li=a=>a.map(x=>'<li>'+e(t(x[0],x[1]))+'</li>').join('');
  let h='';
  if(!d){h='<div class="sp-none">'+e(t('此页面暂无说明。','No spec for this page yet.'))+'</div>'}
  else{
    h='<div class="sp-crumb">'+e(t(d.g[0],d.g[1]))+'</div><div class="sp-title">'+e(t(d.ti[0],d.ti[1]))+(d.nw?' <span class="sp-b n">NEW</span>':d.vd?' <span class="sp-b c">V1.1</span>':'')+'</div><span class="sp-prd">PRD '+e(d.prd)+'</span>'+
    '<h5>'+e(t('页面作用','Purpose'))+'</h5><p>'+e(t(d.pu[0],d.pu[1]))+'</p>'+
    '<h5>'+e(t('元素与规则','Elements & rules'))+'</h5><ul>'+li(d.el)+'</ul>'+
    (d.ix.length?'<h5>'+e(t('交互','Interactions'))+'</h5><ul>'+li(d.ix)+'</ul>':'')+
    '<h5>'+e(t('V1.0 / V1.1 差异','V1.0 vs V1.1'))+'</h5>'+
    (d.nw?'<div class="sp-vd n"><b>NEW in V1.1</b> — '+e(t('V1.0 没有此页面','This page does not exist in V1.0'))+'</div>':
      d.vd?'<div class="sp-vd c"><b>CHANGED in V1.1</b> — '+e(t(d.vd[0],d.vd[1]))+'</div>':'<div class="sp-vd">'+e(t('与 V1.0 一致','Same as V1.0'))+'</div>');
  }
  return h;
}
const SPEC_CSS=`.sp-crumb{font-size:11px;opacity:.6}.sp-title{font-size:18px;font-weight:700;margin:2px 0 6px}.sp-prd{display:inline-block;font-size:11px;color:#33c6ff;border:1px solid #1f4a5c;border-radius:999px;padding:1px 10px}
.sp-b{font-size:10px;border-radius:999px;padding:1px 7px;vertical-align:middle}.sp-b.n{background:#12391f;color:#5fe08a;border:1px solid #1f6b3a}.sp-b.c{background:#3a2d0c;color:#ffc857;border:1px solid #6b5316}
.sp-pane h5{margin:16px 0 4px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;opacity:.6;font-weight:600}.sp-pane p{margin:0;font-size:13px;line-height:1.55}.sp-pane ul,.sp-pane ol{margin:0;padding-left:18px}.sp-pane li{font-size:12.5px;line-height:1.5;margin:4px 0}
.sp-vd{border:1px solid #2d333c;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.5}.sp-vd.n{border-color:#1f6b3a;background:#0e1f15}.sp-vd.c{border-color:#6b5316;background:#1f1a0b}
.sp-log{margin-top:16px}.sp-log summary{cursor:pointer;color:#33c6ff;font-size:12px}.sp-none{opacity:.6;font-size:13px}`;
function specId(){
  try{
  if(!S.authed)return S.step==='creds'?'a_login':'a_login_otp';
  const m=S.modal&&S.modal.type;
  const mm={cfg:'a_cfg',rules:'a_rules_history',cover:'a_cover',cut:'a_cut',drawgen:'a_draw_gen'};
  if(m&&mm[m])return mm[m];
  const p=S.page,T=S.tab;
  if(p==='dash')return 'a_dash';
  if(p==='games')return {list:'a_games',limits:'a_games_limits',nodraw:'a_games_nodraw'}[T.games]||'a_games';
  if(p==='draws')return S.sub&&S.sub.type==='entry'?'a_draw_entry':'a_draws';
  if(p==='kyc')return S.kycId?'a_kyc_detail':'a_kyc';
  if(p==='players'){if(!S.playerId)return 'a_players';return {stats:'a_player_stats',login:'a_player_login',ops:'a_player_ops'}[T.pl]||'a_player_detail'}
  if(p==='rg')return 'a_rg';
  if(p==='claims')return 'a_claim_flow';
  if(p==='txn')return {dep:'a_txn_dep',wd:'a_txn_wd',order:'a_txn_order',refund:'a_txn_refund',ticket:'a_txn_ticket'}[T.txn]||'a_txn_dep';
  if(p==='reports')return {sales:'a_rep_sales',share:'a_rep_share',prize:'a_rep_prize',tm:'a_rep_tm',ds:'a_rep_ds',jp:'a_rep_jp',fo:'a_rep_fo',tax:'a_rep_tax',rp:'a_rep_rp'}[T.report]||'a_rep_sales';
  if(p==='audit')return 'a_audit';
  if(p==='sys'){if(T.sys==='sms'&&S.smsEdit)return 'a_sms_edit';return {sms:'a_sys_sms',ann:'a_sys_ann',inbox:'a_sys_inbox',roles:'a_sys_roles',alert:'a_sys_alert',params:'a_sys_params',chg:'a_sys_chg'}[T.sys]||'a_sys_sms'}
  }catch(_){}
  return null;
}
(function(){
  const st=document.createElement('style');
  st.textContent=SPEC_CSS+`#spec-drawer{position:fixed;top:0;right:0;bottom:0;width:400px;background:#0e1115;border-left:1px solid #23272e;padding:18px 18px 40px;overflow:auto;z-index:50;color:#e8eaed;display:none}body.spec-open #spec-drawer{display:block}body.spec-open{padding-right:400px}#spec-drawer .sp-x{position:absolute;top:10px;right:12px;background:none;border:0;color:#8b93a0;font-size:20px;cursor:pointer}.devlang .specbtn{background:#1b1f26;border:1px solid #2d333c;color:#e8eaed;border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;margin-right:6px}.devlang .specbtn.on{background:#fff;color:#000}`;

  };
  document.addEventListener('click',e=>{const b=e.target.closest('[data-spec-toggle],[data-spx]');if(!b)return;e.preventDefault();S.specOpen=!S.specOpen;updSpec();document.querySelectorAll('.specbtn').forEach(x=>x.classList.toggle('on',!!S.specOpen))},true);
  const r0=render;render=function(){r0.apply(this,arguments);updSpec()};
})();
