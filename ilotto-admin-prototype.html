<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>iLotto管理中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg-base:#070b14;--bg-canvas:#0b1220;--bg-surface:#111827;--bg-surface-2:#0f172a;--bg-elevated:#161f36;--bg-sidebar:#0a0f1c;
  --border-subtle:#1f2937;--border-glow:rgba(34,211,238,.3);
  --accent-cyan:#22d3ee;--accent-cyan-grad:linear-gradient(135deg,#22d3ee 0%,#3b82f6 100%);
  --accent-amber:#f59e0b;--accent-rose:#fb7184;--accent-emerald:#34d399;
  --text-primary:#e2e8f0;--text-secondary:#94a3b8;--text-muted:#64748b;
  --bg:var(--bg-canvas);--card:var(--bg-surface);--card2:var(--bg-surface-2);--line:var(--border-subtle);
  --cyan:var(--accent-cyan);--amber:var(--accent-amber);--rose:var(--accent-rose);--ok:var(--accent-emerald);
  --text:var(--text-primary);--muted:var(--text-secondary);--dim:var(--text-muted);--ink:#04232a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",Outfit,system-ui,sans-serif;
  color:var(--text-primary);background:var(--bg-base);letter-spacing:0;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
#app{min-height:100%}
.lang{display:flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:rgba(15,23,42,.8);gap:2px}
.lang button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
.lang button.on{background:var(--cyan);color:var(--ink)}
.login{
  min-height:100vh;display:grid;grid-template-columns:1.15fr .85fr;position:relative;
}
.login-hero{
  padding:28px 48px 48px;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg-sidebar);
}
.brand{font-weight:700;font-size:22px;color:#fff}
.brand em{font-style:normal;color:var(--accent-cyan)}
.login-hero h1{margin:auto 0 12px;font-size:40px;line-height:1.15;color:#fff;max-width:560px;font-weight:700}
.lede{max-width:460px;color:#cbd5e1;font-size:16px;line-height:1.55;margin:0 0 28px}
.hero-metrics{display:flex;gap:12px;flex-wrap:wrap;position:relative}
.hero-metrics div{
  min-width:160px;padding:14px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.08);
  background:rgba(15,23,42,.55);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.hero-metrics b{display:block;color:#fff;font-size:18px;margin-top:4px}
.hero-metrics span{color:var(--text-muted);font-size:12px;font-weight:500}
.login-panel{display:flex;align-items:center;justify-content:center;padding:28px}
.panel{
  width:min(420px,100%);
  background:linear-gradient(180deg, rgba(255,255,255,.03) 0%, rgba(255,255,255,0) 100%), var(--bg-surface);
  border:1px solid var(--border-subtle);border-radius:14px;padding:28px;position:relative;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 6px 20px rgba(0,0,0,.3);
}
.panel h2{margin:0 0 6px;color:#fff;font-size:20px}
.sub{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 16px}
label.f{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;font-weight:600}
input,select,textarea{
  width:100%;background:#0b1220;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:14px;outline:none;
}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.16)}
.pw{position:relative}
.pw input{padding-right:64px}
.pw .link{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.btn{
  border:1px solid var(--border-subtle);background:var(--bg-surface-2);color:var(--text-primary);border-radius:10px;
  padding:10px 14px;font-size:13px;font-weight:600;transition:border-color .15s ease, background .15s ease, filter .15s ease;
}
.btn:hover{border-color:#334155}
.btn-primary{
  width:100%;margin-top:16px;border:0;color:#04232a;font-weight:700;border-radius:10px;padding:12px 16px;
  background:var(--accent-cyan-grad);
}
.btn-primary:hover{filter:brightness(1.05);color:var(--ink)}
.btn-ghost{background:transparent;color:#fff}
.btn-rose{border:0;color:#fff;background:var(--accent-rose);font-weight:700}
.btn-ok{border:0;color:#042218;background:var(--accent-emerald);font-weight:700}
.btn-sm{padding:7px 10px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.link{background:none;border:0;color:var(--cyan);font-weight:700;font-size:12px;padding:0}
.err{color:var(--rose);font-size:12px;min-height:18px;margin-top:8px}
.otp{display:flex;gap:8px;margin-top:8px}
.otp input{text-align:center;font-size:22px;font-weight:700;padding:12px 0}
.note{
  margin-top:14px;padding:10px 12px;border-radius:12px;background:rgba(251,113,132,.08);
  border:1px solid rgba(251,113,132,.28);color:#fecdd3;font-size:12px;line-height:1.5;
}
.shell{min-height:100vh;display:grid;grid-template-columns:232px 1fr}
.side{
  position:sticky;top:0;height:100vh;padding:16px 12px 24px;overflow:auto;
  background:var(--bg-sidebar);border-right:1px solid var(--border-subtle);
}
.side-brand{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 16px}
.side-brand .brand{font-size:20px}
.side-brand small{display:block;color:var(--text-muted);font-size:12px;font-weight:500;margin-top:2px}
.nav-btn{
  position:relative;width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;
  color:var(--text-secondary);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;margin:2px 0;
  transition:background .2s ease, color .2s ease;
}
.nav-btn svg{width:16px;height:16px;flex:none;opacity:.75}
.nav-btn:hover{background:rgba(255,255,255,.04);color:var(--text-primary)}
.nav-btn.on{background:rgba(34,211,238,.1);color:var(--accent-cyan)}
.nav-btn.on svg{opacity:1}
.nav-btn.on::before{
  content:"";position:absolute;left:-12px;top:10%;bottom:10%;width:3px;border-radius:0 4px 4px 0;
  background:var(--accent-cyan-grad);box-shadow:0 0 8px rgba(34,211,238,.6);
}
.main{min-width:0;display:flex;flex-direction:column;background:var(--bg-canvas)}
.top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px 32px;
  background:rgba(11,18,32,.92);border-bottom:1px solid var(--border-subtle);
}
.top h2{margin:0;font-size:16px;color:#fff;white-space:nowrap}
.top .crumb{color:var(--dim);font-size:12px;white-space:nowrap}
.top > div:first-child{flex:none}
.clock{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.view{padding:24px 32px 48px;animation:rise .18s ease}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-h h3{margin:0;color:#fff;font-size:20px;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--border-subtle);background:transparent;color:var(--text-secondary);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13px;transition:background .15s ease, color .15s ease, border-color .15s ease}
.tabs button.on{background:rgba(34,211,238,.1);color:var(--accent-cyan);border-color:rgba(34,211,238,.35)}
.role-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#a5f3fc;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.28);border-radius:999px;padding:4px 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kpis.k5{grid-template-columns:repeat(5,1fr)}
.kpis.k6{grid-template-columns:repeat(6,1fr)}
.kpi,.card{
  background:linear-gradient(180deg, rgba(255,255,255,.03) 0%, rgba(255,255,255,0) 100%), var(--bg-surface);
  border:1px solid var(--border-subtle);border-radius:14px;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 6px 20px rgba(0,0,0,.3);
  transition:border-color .2s ease, box-shadow .2s ease;
}
.kpi:hover,.card:hover{border-color:var(--border-glow);box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 8px 24px rgba(0,0,0,.35)}
.kpi{padding:16px 16px 14px;position:relative;overflow:hidden}
.kpi .lbl{color:var(--text-secondary);font-size:12px;font-weight:500}
.kpi .num{color:var(--text-primary);font-size:28px;font-weight:700;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.kpi.hero .num{
  background:var(--accent-cyan-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.kpi .subl{color:var(--text-muted);font-size:12px;line-height:1.45}
.delta{font-weight:600;font-size:12px}
.delta.up{color:var(--accent-emerald)}
.delta.down{color:var(--accent-rose)}
.card{padding:16px;margin-bottom:20px}
.card h4{margin:0 0 10px;color:#fff;font-size:15px;font-weight:600}
.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.split{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}
.muted{color:var(--muted);font-size:12.5px;line-height:1.55}
.tiny{color:var(--dim);font-size:11.5px;line-height:1.5}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;border:0;white-space:nowrap}
.tag-ok{color:var(--accent-emerald);background:rgba(52,211,153,.12)}
.tag-warn{color:var(--accent-amber);background:rgba(245,158,11,.12)}
.tag-rose{color:var(--accent-rose);background:rgba(251,113,132,.12);box-shadow:0 0 8px rgba(251,113,132,.25)}
.tag-cyan{color:var(--accent-cyan);background:rgba(34,211,238,.12)}
.tag-muted{color:var(--text-secondary);background:rgba(255,255,255,.04)}
.banner{
  display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;margin-bottom:14px;
  background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.22);color:#cffafe;font-size:13px;line-height:1.5;
}
.banner.rose{background:rgba(251,113,132,.08);border-color:rgba(251,113,132,.3);color:#ffe4e6}
.banner.amber{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.28);color:#fef3c7}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.filters.f3{grid-template-columns:repeat(3,1fr)}
.fcard{
  text-align:left;border:1px solid var(--border-subtle);
  background:linear-gradient(180deg, rgba(255,255,255,.03) 0%, rgba(255,255,255,0) 100%), var(--bg-surface);
  border-radius:14px;padding:14px;color:inherit;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 6px 20px rgba(0,0,0,.3);
  transition:border-color .15s ease, box-shadow .15s ease;
}
.fcard:hover{border-color:#334155}
.fcard.on{border-color:var(--accent-cyan);box-shadow:0 0 0 1px rgba(34,211,238,.35)}
.fcard b{display:block;color:#fff;font-size:24px;margin:6px 0 2px}
.fcard span{color:var(--muted);font-size:12px;font-weight:700}
.table-wrap{overflow:auto;border:1px solid var(--border-subtle);border-radius:14px;background:var(--bg-surface-2)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
th{text-align:left;font-size:12px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--text-muted);padding:10px 16px;background:transparent;border-bottom:1px solid var(--border-subtle);position:sticky;top:0}
td{padding:12px 16px;border-bottom:1px solid rgba(31,41,55,.5);vertical-align:middle;font-variant-numeric:tabular-nums}
tbody tr{transition:background .15s ease}
tbody tr:hover td{background:rgba(255,255,255,.025)}
tr.click td{cursor:pointer}
td.amt{text-align:right;font-family:"JetBrains Mono",ui-monospace,monospace}
tr.alert td{background:rgba(251,113,132,.08)}
tr.alert td:first-child{box-shadow:inset 3px 0 0 var(--rose)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gcard{padding:16px;position:relative}
.gcard.off{opacity:.72}
.gtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.gcard h4{margin:0;color:#fff;font-size:16px}
.switch{width:40px;height:22px;border-radius:999px;border:0;background:var(--border-subtle);position:relative;padding:0;flex:none;transition:background .2s ease, box-shadow .2s ease}
.switch i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s ease}
.switch.on{background:var(--accent-cyan-grad);box-shadow:0 0 8px rgba(34,211,238,.4)}
.switch.on i{transform:translateX(18px)}
.bill{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bill div{background:#0b1220;border:1px solid var(--line);border-radius:14px;padding:12px}
.bill b{display:block;color:#fff;font-size:16px;margin:4px 0}
.modal-back{position:fixed;inset:0;background:rgba(2,6,16,.72);z-index:40;display:grid;place-items:center;padding:24px;animation:fade .15s ease}
.modal{
  width:min(860px,100%);max-height:min(86vh,900px);overflow:auto;
  background:linear-gradient(180deg, rgba(255,255,255,.03) 0%, rgba(255,255,255,0) 100%), var(--bg-elevated);
  border:1px solid var(--border-subtle);border-radius:14px;padding:22px;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 16px 40px rgba(0,0,0,.45);
  animation:pop .15s ease;
}
.modal h3{margin:0 0 6px;color:#fff}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;
  background:#04232a;color:#cffafe;border:1px solid rgba(34,211,238,.4);padding:12px 16px;border-radius:999px;
  font-weight:700;font-size:13px;z-index:60;transition:.2s;box-shadow:0 12px 30px rgba(0,0,0,.35);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.checks{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.check{background:#0b1220;border:1px solid var(--line);border-radius:12px;padding:8px;font-size:11px}
.check b{display:block;color:#fff;font-size:12px;margin-top:4px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:110px 1fr 92px;gap:8px;align-items:center;font-size:12px}
.bar-row b{justify-self:end;font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:99px;background:#0b1220;overflow:hidden;border:1px solid var(--line)}
.track span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg, rgba(34,211,238,.85), rgba(59,130,246,.55))}
.track.amber span{background:linear-gradient(90deg,#fbbf24,#f59e0b);box-shadow:0 0 8px rgba(245,158,11,.35)}
.track.rose span{background:linear-gradient(90deg,#fda4af,#fb7184);box-shadow:0 0 8px rgba(251,113,132,.4)}
.flow{display:flex;flex-direction:column;gap:0}
.flow .step{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:12px 0;border-top:1px dashed #243044}
.flow .step:first-child{border-top:0}
.flow .step b{color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.tools .f{margin:0}
.tools input,.tools select{width:auto;min-width:140px}
.rte{min-height:120px;background:#0b1220;border:1px solid var(--line);border-radius:12px;padding:12px;line-height:1.55}
.rte:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.16);outline:none}
.userchip{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-cyan);color:var(--ink);font-size:11px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);display:inline-block}
.dot.warn{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.dot.bad{background:var(--rose);box-shadow:0 0 10px var(--rose)}
.st-cell{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.table-wrap.fit table{min-width:0}
.sale-bars .bar-row{grid-template-columns:minmax(128px,168px) 1fr 88px}
.sale-bars .bar-row span:first-child{white-space:nowrap}
.todo{display:flex;flex-direction:column}
.todo-item{
  display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;
  padding:12px 8px;border:0;border-bottom:1px solid rgba(31,41,55,.5);border-radius:10px;
  background:transparent;color:inherit;text-align:left;cursor:pointer;
  transition:background .15s ease;
}
.todo-item:last-child{border-bottom:0}
.todo-item:hover{background:rgba(255,255,255,.025)}
.todo-item b{display:block;color:var(--text-primary);font-size:13px;font-weight:700}
.todo-item .tiny{margin-top:2px}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.cell-rw{color:var(--cyan);font-weight:800}
.cell-ro{color:var(--muted)}
.cell-hide{color:var(--rose);opacity:.8}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@media (max-width:1100px){
  .kpis,.kpis.k5,.kpis.k6,.games,.bill,.checks,.filters,.filters.f3{grid-template-columns:1fr 1fr}
  .grid2,.split,.login{grid-template-columns:1fr}
  .login-hero h1{font-size:40px;margin-top:48px}
  .kpis.k5,.kpis.k6{grid-template-columns:1fr 1fr}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;display:flex;gap:4px;overflow:auto;z-index:25;padding:8px}
  .side-brand{display:none}
  .nav-btn{width:auto;white-space:nowrap;margin:0}
  .nav-btn.on::before{left:10px;top:auto;bottom:4px;width:16px;height:2px}
  .view{padding:16px}
  .top{padding:12px 16px;overflow:auto}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status"></div>
<script>
const BILL = { dst: 0.2, wht: 0.2, exempt: 10000, autoCap: 300000, prize: 0.55, charity: 0.3, ops: 0.15, unit: 25 };
const t = (zh, en) => (S.lang === "en" ? en : zh);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const peso = (n) => "₱" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
const peso2 = (n) => "₱" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pesoM = (n) => "₱" + (n / 1e6).toFixed(2) + "M";
const pct = (n) => (n > 0 ? "+" : "") + n.toFixed(1) + "%";
const $ = (id) => document.getElementById(id);

const NAV = [
  ["dash", "仪表盘", "Dashboard", "M3 13h8M3 6h18M3 20h12"],
  ["games", "游戏管理", "Games", "M4 7h16v10H4zM8 7V5h8v2"],
  ["draws", "开奖记录", "Draw results", "M12 8v5l3 2M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18z"],
  ["kyc", "身份审核", "Identity review", "M12 12a4 4 0 1 0-4-4M4 20c1.5-3 3.8-4.5 8-4.5s6.5 1.5 8 4.5"],

}
function fmtLeft(ms) {

}

function lineChart(values, labels) {
  const w = 680, h = 200, pad = 28;
  const max = Math.max(...values) * 1.08;
  const min = Math.min(...values) * 0.82;
  const pts = values.map((v, i) => {
    const x = pad + (i * (w - pad * 2)) / (values.length - 1);
    const y = h - pad - ((v - min) / (max - min)) * (h - pad * 2);
    return [x, y];
  });
  const d = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const fill = `${d} L${pts[pts.length - 1][0].toFixed(1)},${h - pad} L${pts[0][0].toFixed(1)},${h - pad} Z`;
  const dots = pts.map((p) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#22d3ee"/>`).join("");
  const labs = labels.map((lb, i) => `<text x="${pts[i][0].toFixed(1)}" y="${h - 8}" text-anchor="middle" fill="#64748b" font-size="10">${esc(lb)}</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="200" role="img"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient><linearGradient id="cl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs><path d="${fill}" fill="url(#cg)"/><path d="${d}" fill="none" stroke="url(#cl)" stroke-width="2"/>${dots}${labs}</svg>`;
}
function colChart(values) {
  const w = 680, h = 200, pad = 24;
  const max = 70;
  const bw = (w - pad * 2) / values.length;
  const y55 = h - pad - (55 / max) * (h - pad * 2);
  const bars = values.map((v, i) => {
    const bh = (v / max) * (h - pad * 2);
    const x = pad + i * bw + 6;
    const y = h - pad - bh;
    const c = v > 62 || v < 49 ? "url(#barBad)" : (v > 58 || v < 52 ? "url(#barWarn)" : "url(#barOk)");
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw - 12).toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${c}"/>`;
  }).join("");
  const labs = values.map((_, i) => `<text x="${(pad + i * bw + bw / 2).toFixed(1)}" y="${h - 6}" text-anchor="middle" fill="#64748b" font-size="10">${esc(S.lang === "en" ? PRIZE_MONTHS_EN[i] : PRIZE_MONTHS[i])}</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="200"><defs><linearGradient id="barOk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67e8f9" stop-opacity=".8"/><stop offset="1" stop-color="#3b82f6" stop-opacity=".45"/></linearGradient><linearGradient id="barWarn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient><linearGradient id="barBad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fda4af"/><stop offset="1" stop-color="#e11d48"/></linearGradient></defs><line x1="${pad}" y1="${y55.toFixed(1)}" x2="${w - pad}" y2="${y55.toFixed(1)}" stroke="#34d399" stroke-dasharray="4 4"/>${bars}${labs}</svg>`;
}

function focusField(sel) {
  const el = document.querySelector(sel);
  if (!el) return;
  el.focus();
  const n = el.value.length;
  if (el.setSelectionRange) el.setSelectionRange(n, n);
}
function captureAnn() {

function auditExport(fmt) {
  if (fmt === "json") download("ilotto-audit.json", JSON.stringify(S.audits, null, 2), "application/json");
  else if (fmt === "xml") {
    const xml = `<?xml version="1.0" encoding="UTF-8"?>\n<audit>${S.audits.map((a) => `<event time="${esc(a.time)}" operator="${esc(a.who)}" role="${esc(a.role)}" module="${esc(a.mod)}" name="${esc(a.evt)}" object="${esc(a.obj)}" result="${esc(a.res)}"><before>${esc(a.before)}</before><after>${esc(a.after)}</after></event>`).join("")}</audit>`;
    download("ilotto-audit.xml", xml, "application/xml");
  } else {
    const lines = [["time", "operator", "role", "module", "event", "object", "result", "before", "after"]].concat(S.audits.map((a) => [a.time, a.who, a.role, a.mod, a.evt, a.obj, a.res, a.before, a.after]));
    download("ilotto-audit.csv", lines.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n"), "text/csv");
  }
}
function onClick(e) {
  const actEl = e.target.closest("[data-act]");
  if (!actEl) return;
  if (actEl.classList.contains("modal-back") && e.target.closest(".modal")) return;
  captureAnn();
  const act = actEl.dataset.act;
  const arg = actEl.dataset.arg;
  const id = actEl.dataset.id;
  if (act === "lang") { S.lang = arg; render(); return; }
  if (act === "toggle-pw") { S.showPw = !S.showPw; render(); return; }
  if (act === "next") {
    if (!S.login.user.trim() || !S.login.pass) { S.login.err = t("请填写账号和密码。", "Enter the account and password."); render(); return; }
    S.login.err = "";
    S.step = "otp";
    render();
    const first = document.querySelector("[data-otp='0']");
    if (first) first.focus();
    return;
  }
  if (act === "back-creds") { S.step = "creds"; S.login.err = ""; render(); return; }
  if (act === "resend") { toast(t("验证码已重新发送。", "A new code was sent.")); return; }
  if (act === "verify") {
    if (S.login.otp.join("").length < 6) { S.login.err = t("请输入 6 位短信验证码。", "Enter the 6-digit SMS code."); render(); return; }
    S.authed = true;
    S.page = "dash";
    S.tab.dash = "biz";
    S.login.err = "";
    logAudit({ who: S.login.user, role: actor().role, mod: t("系统管理", "System"), evt: t("登录", "Sign in"), obj: S.login.user, before: "—", after: "OTP" });
    render();
    return;
  }
  if (act === "logout") {
    S.authed = false;
    S.step = "creds";
    S.login.otp = ["", "", "", "", "", ""];
    S.login.pass = "";
    S.modal = null;
    render();
    return;
  }
  if (act === "nav") { S.page = arg; S.playerId = null; S.modal = null; render(); return; }
  if (act === "tab") { S.tab[actEl.dataset.group] = arg; render(); return; }
  if (act === "close") { S.modal = null; render(); return; }
  if (act === "game-toggle") {
    const g = gameBy(id);
    g.on = !g.on;
    logAudit({ who: actor().who, role: actor().role, mod: t("游戏管理", "Games"), evt: g.on ? t("上架游戏", "List game") : t("下架游戏", "Delist game"), obj: g.zh, before: g.on ? t("已下架", "Delisted") : t("在售", "On sale"), after: g.on ? t("在售", "On sale") : t("已下架", "Delisted") });
    toast(gname(g) + (g.on ? t(" 已上架", " is on sale") : t(" 已下架", " is delisted")));
    render();
    return;
  }
  if (act === "rules") { S.modal = { type: "rules", id }; render(); return; }
  if (act === "kyc-filter") { S.kycFilter = arg; render(); return; }
  if (act === "kyc-pass" || act === "kyc-reject") {
    const k = S.kyc.find((x) => x.id === id);
    k.status = act === "kyc-pass" ? "pass" : "reject";
    logAudit({ who: actor().who, role: actor().role, mod: t("身份审核", "Identity review"), evt: act === "kyc-pass" ? t("通过开户", "Approve account") : t("拒绝开户", "Decline account"), obj: k.id, before: t("待审", "Waiting"), after: k.status });
    toast(act === "kyc-pass" ? t("已通过开户。", "Account approved.") : t("已拒绝开户。", "Account declined."));
    render();
    return;
  }
  if (act === "open-player") { S.page = "players"; S.playerId = id; S.modal = null; render(); return; }
  if (act === "player-back") { S.playerId = null; render(); return; }
  if (act === "reset-pw") {
    const p = S.players.find((x) => x.id === id);
    const temp = "IL-" + Math.random().toString(36).slice(2, 6).toUpperCase() + "-19";
    S.modal = { type: "reset", id, temp };
    logAudit({ who: actor().who, role: actor().role, mod: t("玩家档案", "Players"), evt: t("重置密码", "Reset password"), obj: p.id, before: "—", after: "OTP_RESET" });
    render();
    return;
  }
  if (act === "freeze-open") { S.freezeReason = ""; S.modal = { type: "freeze", id }; render(); return; }
  if (act === "freeze-confirm") {
    if (!S.freezeReason.trim()) { toast(t("请填写冻结原因。", "Enter a reason.")); return; }
    const p = S.players.find((x) => x.id === id);
    const before = p.status;
    p.status = "frozen";
    p.reason = S.freezeReason.trim();
    S.modal = null;
    logAudit({ who: actor().who, role: actor().role, mod: t("玩家档案", "Players"), evt: t("冻结账号", "Freeze account"), obj: p.id, before, after: p.reason });
    toast(t("账号已冻结。", "Account frozen."));
    render();
    return;
  }
  if (act === "limit-open") { S.modal = { type: "limit", id }; render(); return; }
  if (act === "limit-confirm") {
    const p = S.players.find((x) => x.id === id);
    const before = p.status;
    p.status = "limited";
    p.reason = t("限制投注，保留登录", "Betting limited, sign-in kept");
    S.modal = null;
    logAudit({ who: actor().who, role: actor().role, mod: t("玩家档案", "Players"), evt: t("限制投注", "Limit betting"), obj: p.id, before, after: p.reason });
    toast(t("已限制投注。", "Betting is now limited."));
    render();
    return;
  }
  if (act === "rg-filter") { S.rgFilter = S.rgFilter === arg ? "all" : arg; render(); return; }
  if (act === "tier-add") {
    const input = $(arg === "cool" ? "cool-new" : "excl-new");
    const val = (input && input.value || "").trim();
    if (!val) return;
    (arg === "cool" ? S.coolTiers : S.exclTiers).push(val);
    logAudit({ who: actor().who, role: actor().role, mod: t("责任博彩", "Responsible gaming"), evt: t("新增档位", "Add tier"), obj: val, before: "—", after: val });
    render();
    return;
  }
  if (act === "tier-del") {
    const list = actEl.dataset.list === "cool" ? S.coolTiers : S.exclTiers;
    const removed = list.splice(Number(actEl.dataset.i), 1)[0];
    logAudit({ who: actor().who, role: actor().role, mod: t("责任博彩", "Responsible gaming"), evt: t("删除档位", "Remove tier"), obj: removed, before: removed, after: "—" });
    render();
    return;
  }
  if (act === "rg-approve" || act === "rg-reject") {
    const r = S.restores.find((x) => x.id === id);
    r.st = act === "rg-approve" ? "pass" : "reject";
    logAudit({ who: actor().who, role: actor().role, mod: t("责任博彩", "Responsible gaming"), evt: act === "rg-approve" ? t("通过恢复", "Approve restoration") : t("驳回恢复", "Reject restoration"), obj: r.id, before: t("待审批", "Waiting"), after: r.st });
    toast(act === "rg-approve" ? t("已通过恢复申请。", "Restoration approved.") : t("已驳回恢复申请。", "Restoration rejected."));
    render();
    return;
  }
  if (act === "chip") { S.txnQ[actEl.dataset.group] = arg; render(); return; }
  if (act === "grain") { S.salesGrain = arg; render(); return; }
  if (act === "dash-range") { S.dashRange = arg; render(); return; }
  if (act === "export-dash") {
    const d = DASH_BIZ[S.dashRange] || DASH_BIZ.today;
    const lines = [["metric", "value"], ["range", S.dashRange], ["sales", d.sales], ["tickets", d.tickets], ["players", d.players], ["uptime_30d", "99.995%"]].concat(d.games.map(([gid, amt]) => ["game:" + gid, amt]));
    download("ilotto-ops-dashboard.csv", lines.map((r) => r.join(",")).join("\n"), "text/csv");
    return;
  }
  if (act === "goto-rg") { S.page = "rg"; S.rgFilter = "restore"; render(); return; }
  if (act === "goto-claim") { S.page = "txn"; S.tab.txn = "claim"; render(); return; }
  if (act === "goto-draws") { S.page = "draws"; S.drawQ.game = arg || "all"; render(); return; }
  if (act === "goto-sales") { S.page = "reports"; S.tab.report = "sales"; render(); return; }
  if (act === "goto-orders") { S.page = "txn"; S.tab.txn = "order"; render(); return; }
  if (act === "goto-unclaimed") { S.page = "reports"; S.tab.report = "share"; render(); return; }
  if (act === "export-sales") {
    const lines = [["game", "sales"]].concat(GAME_SALES.map((r) => [gameBy(r.id).zh, r.sales]));
    download("ilotto-sales.csv", lines.map((r) => r.join(",")).join("\n"), "text/csv");
    return;
  }
  if (act === "export-share" || act === "export-prize") { download(act === "export-share" ? "ilotto-share.csv" : "ilotto-prize.csv", "report,period\nshare," + S.period, "text/csv"); return; }
  if (act === "audit-open") { S.auditOpen = S.auditOpen === Number(actEl.dataset.i) ? null : Number(actEl.dataset.i); render(); return; }
  if (act === "export-audit") { auditExport(actEl.dataset.fmt); return; }
  if (act === "rte") { document.execCommand(actEl.dataset.cmd, false, null); return; }
  if (act === "ann-scope") { S.ann.scope = arg; render(); return; }
  if (act === "ann-pub") {
    if (!S.ann.title.trim()) { toast(t("请填写公告标题。", "Enter a title.")); return; }
    S.anns.unshift({ id: "AN-" + (1100 + S.anns.length), titleZh: S.ann.title, titleEn: S.ann.title, scope: S.ann.scope, start: (S.ann.start || "").replace("T", " "), end: (S.ann.end || "").replace("T", " "), st: "live", bodyZh: S.ann.html, bodyEn: S.ann.html });
    logAudit({ who: actor().who, role: actor().role, mod: t("系统管理", "System"), evt: t("发布公告", "Publish notice"), obj: S.ann.title, before: t("草稿", "Draft"), after: scopeLabel(S.ann.scope) });
    S.ann.title = "";
    S.ann.html = "";
    toast(t("公告已发布。", "Notice published."));
    render();
    return;
  }
  if (act === "ann-off") {
    const a = S.anns.find((x) => x.id === id);
    a.st = "off";
    logAudit({ who: actor().who, role: actor().role, mod: t("系统管理", "System"), evt: t("下线公告", "Take notice offline"), obj: a.titleZh, before: t("生效中", "Live"), after: t("已下线", "Offline") });
    render();
    return;
  }
  if (act === "tpl-edit") { S.tplEdit = S.tplEdit === id ? null : id; render(); return; }
  if (act === "tpl-save") {
    const tp = S.tpls.find((x) => x.id === id);
    const val = S.tplDraft || "";
    if (!val.trim()) { toast(t("文案不能为空。", "Copy cannot be empty.")); return; }
    const before = tp.bodyZh;
    tp.bodyZh = val;
    tp.bodyEn = val;
    S.tplEdit = null;
    logAudit({ who: actor().who, role: actor().role, mod: t("系统管理", "System"), evt: t("编辑站内信模板", "Edit message template"), obj: tp.id, before, after: val });
    toast(t("模板已保存。", "Template saved."));
    render();
    return;
  }
  if (act === "role") {
    const s = S.staff.find((x) => x.id === id);
    const role = actEl.dataset.role;
    const has = s.roles.includes(role);
    if (has) s.roles = s.roles.filter((r) => r !== role);
    else if (role === "admin" || s.roles.includes("admin")) { toast(t("系统管理员不能兼任任何业务角色。", "System admin cannot hold a business role.")); return; }
    else if ((role === "counter" && s.roles.includes("finance")) || (role === "finance" && s.roles.includes("counter"))) { toast(t("兑奖柜台与财务复核不能由同一人担任。", "Prize counter and finance review cannot be the same person.")); return; }
    else s.roles.push(role);
    logAudit({ who: actor().who, role: actor().role, mod: t("系统管理", "System"), evt: t("调整角色", "Change roles"), obj: s.name, before: "—", after: s.roles.join(",") || t("无角色", "No role") });
    render();
  }
}
document.body.addEventListener("click", onClick);
document.body.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.field === "user") S.login.user = el.value;
  if (el.dataset.field === "pass") S.login.pass = el.value;
  if (el.dataset.field === "freezeReason") S.freezeReason = el.value;
  if (el.dataset.field === "annTitle") S.ann.title = el.value;
  if (el.dataset.field === "playerQ") { S.playerQ = el.value; render(); focusField("[data-field=playerQ]"); }
  if (el.dataset.field === "drawIssue") { S.drawQ.issue = el.value; render(); focusField("[data-field=drawIssue]"); }
  if (el.dataset.field === "inboxPlayer") { S.inboxQ.player = el.value; render(); focusField("[data-field=inboxPlayer]"); }
  if (el.dataset.otp != null) {
    const i = Number(el.dataset.otp);
    const v = el.value.replace(/\D/g, "").slice(-1);
    el.value = v;
    S.login.otp[i] = v;
    if (v && el.nextElementSibling) el.nextElementSibling.focus();
  }
  if (el.id === "ann-body") S.ann.html = el.innerHTML;
  if (el.dataset.field === "tplBody") S.tplDraft = el.value;
});
document.body.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.field === "drawGame") { S.drawQ.game = el.value; render(); }
  if (el.dataset.field === "period") { S.period = el.value; render(); }
  if (el.dataset.field === "kind") { S.kind = el.value; render(); }
  if (el.dataset.field === "prizeMonth") { S.prizeMonth = el.value; render(); }
  if (el.dataset.field === "inboxTpl") { S.inboxQ.tpl = el.value; render(); }
  if (el.dataset.field === "annStart") S.ann.start = el.value;
  if (el.dataset.field === "annEnd") S.ann.end = el.value;
  if (el.dataset.limit) {
    const before = S.limits[el.dataset.limit];
    S.limits[el.dataset.limit] = Number(el.value);
    logAudit({ who: actor().who, role: actor().role, mod: t("责任博彩", "Responsible gaming"), evt: t("调整限额参数", "Change limit"), obj: el.dataset.limit, before: String(before), after: el.value });
    toast(t("已保存为后台参数。", "Saved as an admin parameter."));
  }
});
document.body.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || S.authed) return;
  if (e.target.dataset && e.target.dataset.otp != null) return;
  onClick({ target: { closest: (sel) => document.querySelector(S.step === "otp" ? "[data-act=verify]" : "[data-act=next]") } });
});
setInterval(() => {
  document.querySelectorAll("[data-clock]").forEach((el) => { el.textContent = clockStr(); });
  let expired = false;
  S.players.forEach((p) => {
    if (p.lockUntil && lockLeft(p) === 0) {
      p.lockUntil = 0;
      expired = true;
      logAudit({ who: t("系统", "System"), role: "—", mod: t("玩家档案", "Players"), evt: t("提现自动解锁", "Withdrawal auto-unlock"), obj: p.id, before: t("锁定", "Locked"), after: t("已解锁", "Unlocked") });
    }
  });
  document.querySelectorAll("[data-countdown]").forEach((el) => {
    const p = S.players.find((x) => x.id === el.dataset.countdown);
    if (p) el.textContent = fmtLeft(lockLeft(p));
  });
  if (expired) { toast(t("提现锁定已到点，自动解锁。", "The withdrawal lock expired and unlocked.")); render(); }
}, 1000);
render();
</script>
</body>
</html>
